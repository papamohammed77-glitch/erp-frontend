<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10243a"><title>المخزن الشامل | الروائع ERP</title><link rel="manifest" href="../manifest.json"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../core.js"></script><style>
:root{--n:#10243a;--t:#087f8c;--line:#e5edf2;--bg:#f4f7fa;--muted:#718096}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Tahoma,sans-serif;color:#1b2e40}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#0d1d30,#163c54 65%,#087f8c)}.loginbox{background:#fff;border-radius:26px;padding:28px;width:min(420px,100%);box-shadow:0 25px 70px #0003}.logo{margin:0 auto 14px;width:70px;height:70px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,var(--t),var(--n));color:white;font-size:26px;outline:2px solid #d6a84f;outline-offset:4px}.login h1{text-align:center;color:var(--n);font-size:23px;font-weight:900}.login p{text-align:center;color:var(--muted);font-size:12px}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;margin:6px 0;background:#f8fafc}.primary{width:100%;padding:13px;border:0;border-radius:13px;background:var(--t);color:#fff;font-weight:900}.err{color:#b93849;font-size:12px;min-height:18px;text-align:center;margin-top:8px}.bar{background:linear-gradient(105deg,#0f2338,#173c55 70%,#087f8c);color:white;padding:14px clamp(14px,3vw,32px);display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:12px;align-items:center}.brandicon{width:44px;height:44px;border:1px solid #d6a84f;border-radius:14px;display:grid;place-items:center;color:#f3d28d}.brand h2{font-size:16px;margin:0;font-weight:900}.brand small{font-size:10px;color:#c4d8e1}.user{text-align:left;font-size:11px;font-weight:800}.actions{display:flex;gap:7px}.actions button{border:1px solid #ffffff33;border-radius:11px;background:#ffffff18;color:white;padding:9px 12px}.main{max-width:1400px;margin:auto;padding:22px clamp(14px,3vw,32px)}.welcome{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:18px}.welcome h1{font-size:26px;color:var(--n);margin:4px 0;font-weight:900}.welcome p{font-size:11px;color:var(--muted);margin:0}.eyebrow{font-size:10px;color:var(--t);font-weight:900}.tabs{display:flex;gap:6px;background:#eaf0f4;padding:6px;border-radius:15px;width:max-content;max-width:100%;overflow:auto;margin-bottom:18px}.tab{border:0;background:transparent;border-radius:11px;padding:10px 16px;font-size:12px;font-weight:900;color:#637789;white-space:nowrap}.tab.active{background:#fff;color:var(--n);box-shadow:0 3px 12px #10243a16}.head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 11px}.head h3{font-size:14px;margin:0;color:var(--n);font-weight:900}.head span{font-size:10px;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.metric,.card,.account{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 5px 17px #10243a09}.metric label{font-size:10px;color:var(--muted);font-weight:900}.metric strong{display:block;font-size:27px;color:var(--n);margin-top:8px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{display:flex;gap:12px;text-decoration:none;color:inherit;min-height:105px;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#b6dadd}.ico{width:43px;height:43px;flex-shrink:0;border-radius:14px;display:grid;place-items:center;background:#087f8c18;color:var(--t);font-size:18px}.cardbody{flex:1;min-width:0}.cardtitle{font-size:13px;font-weight:900;color:var(--n)}.desc{display:block;font-size:10px;color:var(--muted);line-height:1.8;margin-top:3px}.foot{display:block;color:var(--t);font-size:10px;font-weight:900;margin-top:8px}.locked{opacity:.5;cursor:not-allowed;background:#fafcfd}.strip{margin-top:14px;padding:12px;border:1px solid #d7eded;background:#edf7f7;color:#28636b;border-radius:14px;font-size:11px;font-weight:800}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{background:white;border:1px solid var(--line);border-radius:50px;padding:6px 10px;font-size:10px;font-weight:800}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.account label{display:block;font-size:10px;color:var(--muted);font-weight:800}.account strong{font-size:13px;color:var(--n);overflow-wrap:anywhere}.empty{padding:30px;text-align:center;background:#fff;border:1px dashed #cfdae2;border-radius:16px;color:var(--muted);font-size:12px}.footer{text-align:center;padding:14px;color:#9aa9b5;font-size:9px}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.cards,.grid2{grid-template-columns:1fr}.welcome{align-items:start;flex-direction:column}.tabs{width:100%;justify-content:space-between}.tab{padding:9px 10px;flex:1}.metrics{gap:7px}.metric{padding:11px}.metric strong{font-size:23px}.brand h2{font-size:14px}.user{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}</style></head><body>
<section id="loginScreen" class="login"><div class="loginbox"><div class="logo"><i class="fa-solid fa-warehouse"></i></div><h1>المخزن الشامل</h1><p>مركز التشغيل الموحد — نظام الروائع ERP</p><input id="loginEmail" class="field" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="loginPass" class="field" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="primary" onclick="App.doLogin()">دخول النظام</button><div id="loginMsg" class="err"></div></div></section>
<div id="mainApp" class="hidden"><header class="bar"><div class="brand"><div class="brandicon"><i class="fa-solid fa-warehouse"></i></div><div><h2>المخزن الشامل</h2><small>مركز العمليات المخزنية الموحد</small></div></div><div class="actions"><div class="user"><div id="headerUserName"></div><small id="headerUserRole"></small></div><button onclick="App.refresh()" title="تحديث"><i class="fa-solid fa-rotate"></i></button><button onclick="App.logout()" title="خروج"><i class="fa-solid fa-arrow-right-from-bracket"></i></button></div></header>
<main class="main"><div class="welcome"><div><div class="eyebrow">RAWAEA • WAREHOUSE OPERATIONS</div><h1>مركز تشغيل المخزن</h1><p id="welcomeSub">كل عملياتك المخزنية من نقطة واحدة</p></div></div><nav class="tabs"><button class="tab active" data-tab="today">اليوم</button><button class="tab" data-tab="operations">العمليات</button><button class="tab" data-tab="vouchers">الأذونات</button><button class="tab" data-tab="account">حسابي</button></nav><section id="tabContent"><div class="empty">جاري تحميل مؤشرات التشغيل...</div></section></main><footer class="footer">كل الحركات الفعلية تتم عبر التطبيقات الأصلية ومحركاتها المركزية</footer></div>
<script>
var App={user:null,snapshot:null,activeTab:'today',loading:false,esc:function(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')},roleName:function(r){var m={'استلام':'مسؤول الاستلام','تحضير':'مسؤول التحضير','تحميل':'مسؤول التحميل','مرتجعات':'مسؤول المرتجعات','تفريغ':'مسؤول التفريغ','جرد':'مسؤول الجرد','أذونات':'مسؤول الأذونات','مخزن شامل':'مسؤول المخزن الشامل','احتياطي':'احتياطي'};return m[r]||'غير محدد'},allowed:function(r){var u=this.snapshot&&this.snapshot.user;return !!u&&(u.is_owner||u.active_warehouse_role==='مخزن شامل'||u.active_warehouse_role===r)},msg:function(v){document.getElementById('loginMsg').textContent=v||''},doLogin:function(){var s=this,e=document.getElementById('loginEmail').value.trim(),p=document.getElementById('loginPass').value;this.msg('جاري التحقق...');RW_Auth.doLogin(e,p,function(u,err){if(err||!u){s.msg(err&&err.message||err||'تعذر الدخول');return}s.user=u;s.load()})},logout:function(){var s=this;RW_Auth.doLogout(function(){s.user=null;s.snapshot=null;s.showLogin('')})},showLogin:function(m){document.getElementById('mainApp').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');this.msg(m)},init:function(){var s=this;RW_Auth.init(function(u,e){if(u){s.user=u;s.load()}else s.showLogin(e&&e!=='NO_SESSION'?(e.message||e):'')})},refresh:function(){if(!this.loading)this.load()},load:function(){var s=this;if(this.loading)return;if(!window.supabase||!window.supabase.rpc){this.showLogin('تعذر الاتصال بخدمة البيانات');return}this.loading=true;document.getElementById('loginScreen').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');document.getElementById('tabContent').innerHTML='<div class="empty">جاري تحديث المؤشرات...</div>';window.supabase.rpc('get_warehouse_hub_snapshot').then(function(r){s.loading=false;if(r.error||!r.data||!r.data.success){document.getElementById('tabContent').innerHTML='<div class="empty">تعذر فتح مركز المخزن: '+s.esc(r.error&&r.error.message||'استجابة غير صالحة')+'</div>';return}s.snapshot=r.data;s.user=RW_Auth.getUser();document.getElementById('headerUserName').textContent=s.user&&s.user.name||'مستخدم المخزن';document.getElementById('headerUserRole').textContent=s.roleName(r.data.user.active_warehouse_role);document.getElementById('welcomeSub').textContent='نطاق العمل: '+(r.data.branch_scope||[]).map(function(b){return b.name||b.code}).join('، ');s.render()}).catch(function(e){s.loading=false;document.getElementById('tabContent').innerHTML='<div class="empty">تعذر تحديث البيانات: '+s.esc(e.message||e)+'</div>'})},tab:function(t){this.activeTab=t;var bs=document.querySelectorAll('.tab');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('active',bs[i].getAttribute('data-tab')===t);this.render()},metric:function(t,v){return '<div class="metric"><label>'+t+'</label><strong>'+Number(v||0).toLocaleString('ar-EG')+'</strong></div>'},card:function(t,ico,path,d,role){var ok=this.allowed(role);return '<a class="card '+(ok?'':'locked')+'" '+(ok?'href="'+path+'"':'aria-disabled="true" tabindex="-1')+'><span class="ico"><i class="fa-solid '+ico+'"></i></span><span class="cardbody"><span class="cardtitle">'+t+'</span><span class="desc">'+d+'</span><span class="foot">'+(ok?'فتح التطبيق':'يتطلب دور '+role)+'</span></span></a>'},today:function(){var m=this.snapshot.metrics||{},b=this.snapshot.branch_scope||[],h='<div class="head"><h3>مؤشرات التشغيل</h3><span>قراءة فقط • لا يوجد ترحيل</span></div><div class="metrics">';h+=this.metric('أوامر شراء جاهزة للاستلام',m.pending_purchase_orders)+this.metric('رانشيتات نشطة',m.active_runsheets)+this.metric('تحميل جارٍ',m.loading_runsheets)+this.metric('سيارات محملة',m.loaded_runsheets)+this.metric('مرتجعات قيد المعالجة',m.returning_runsheets)+this.metric('أذونات معلقة',m.pending_vouchers)+this.metric('جلسات جرد مفتوحة',m.open_counts)+'</div><div class="strip">المؤشرات للمتابعة فقط ولا تنشئ حجزًا أو صرفًا أو استلامًا أو قيدًا ماليًا.</div><div class="head"><h3>نطاق الفروع</h3><span>'+b.length+' فرع</span></div><div class="chips">'+b.map(function(x){return '<span class="chip">'+App.esc(x.name||x.code)+'</span>'}).join('')+'</div>';if(!this.snapshot.main_branch_access)h+='<div class="strip">لا توجد صلاحية على المخزن الرئيسي؛ مؤشرات الرانشيتات مخفية.</div>';h+='<div class="head"><h3>انتقال سريع</h3><span>التطبيقات الأصلية</span></div><div class="cards">'+this.card('الاستلام','fa-box-open','receiver.html','استلام أوامر الشراء','استلام')+this.card('التحضير','fa-list-check','picker.html','تجهيز الكميات','تحضير')+this.card('التحميل','fa-truck-ramp-box','loader.html','تحميل السيارة','تحميل')+'</div>';return h},operations:function(){return '<div class="head"><h3>العمليات المخزنية</h3><span>التطبيقات الأصلية دون تكرار محركاتها</span></div><div class="cards">'+this.card('الاستلام','fa-box-open','receiver.html','استلام فواتير الموردين وأوامر الشراء','استلام')+this.card('التحضير','fa-list-check','picker.html','تجهيز الأصناف وحجز الكميات','تحضير')+this.card('التحميل','fa-truck-ramp-box','loader.html','تحميل الكميات على السيارة','تحميل')+this.card('المرتجعات','fa-rotate-left','returns.html','استلام مرتجعات المبيعات','مرتجعات')+this.card('التفريغ','fa-boxes-packing','unloader.html','إعادة الكميات من السيارة للمخزن','تفريغ')+this.card('الجرد','fa-clipboard-check','counter.html','جرد المخزن أو السيارة','جرد')+'</div><div class="strip">كل عملية تفتح التطبيق الأصلي؛ لا تنفذ الحركات من شاشة التجميع.</div>'},vouchers:function(){var ok=this.allowed('أذونات'),items=[['تحويل مخزني','fa-right-left','إصدار تحويل بين المخازن والفروع'],['استلام تحويل من فرع','fa-boxes-stacked','استلام التحويل وفق المستلم المعين'],['صرف سيارة بيع مباشر','fa-truck-fast','صرف البضاعة للسيارة'],['استلام مرتجع سيارة بيع مباشر','fa-rotate-left','استلام المرتجع بمستند السيارة'],['مرتجع مورد','fa-arrow-rotate-left','إرجاع البضاعة وفق عقد المورد']],h='<div class="head"><h3>الأذونات المخزنية اليدوية</h3><span>تطبيق الأذونات الأصلي</span></div><div class="cards">';for(var i=0;i<items.length;i++){var x=items[i];h+='<a class="card '+(ok?'':'locked')+'" '+(ok?'href="vouchers.html"':'aria-disabled="true" tabindex="-1')+'><span class="ico"><i class="fa-solid '+x[1]+'"></i></span><span class="cardbody"><span class="cardtitle">'+x[0]+'</span><span class="desc">'+x[2]+'</span><span class="foot">'+(ok?'فتح الأذونات':'يتطلب دور الأذونات أو مخزن شامل')+'</span></span></a>'}return h+'</div><div class="strip">استلام التحويل مرتبط بالمستلم المعين، ومرتجع المورد يمر عبر عقده المركزي.</div>'},account:function(){var u=this.snapshot.user||{},b=this.snapshot.branch_scope||[],h='<div class="head"><h3>ملف المستخدم</h3><span>جلسة موثقة</span></div><div class="grid2">';h+='<div class="account"><label>اسم المستخدم</label><strong>'+this.esc(this.user&&this.user.name||'—')+'</strong></div><div class="account"><label>البريد الإلكتروني</label><strong>'+this.esc(this.user&&this.user.email||'—')+'</strong></div><div class="account"><label>الدور الوظيفي</label><strong>'+this.esc(u.role||'—')+'</strong></div><div class="account"><label>الدور المخزني النشط</label><strong>'+this.esc(this.roleName(u.active_warehouse_role))+'</strong></div><div class="account"><label>الشركة</label><strong>'+this.esc(u.company_id||'—')+'</strong></div><div class="account"><label>صلاحية المخزن الرئيسي</label><strong>'+(this.snapshot.main_branch_access?'متاحة':'غير متاحة')+'</strong></div></div><div class="head"><h3>الفروع المصرح بها</h3><span>'+b.length+' فرع</span></div><div class="chips">'+b.map(function(x){return '<span class="chip">'+App.esc(x.name||x.code)+'</span>'}).join('')+'</div>';return h},render:function(){if(!this.snapshot)return;var c=document.getElementById('tabContent');c.innerHTML=this.activeTab==='operations'?this.operations():this.activeTab==='vouchers'?this.vouchers():this.activeTab==='account'?this.account():this.today()}};
window.App=App;document.addEventListener('click',function(e){var b=e.target.closest?e.target.closest('[data-tab]'):null;if(b)App.tab(b.getAttribute('data-tab'))});document.addEventListener('DOMContentLoaded',function(){App.init()});
</script><script src="../register-sw.js"></script></body></html>
