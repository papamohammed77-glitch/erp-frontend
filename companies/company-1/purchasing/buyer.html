<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مسؤول المشتريات | الروائع ERP</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#9333ea">
    <link rel="stylesheet" href="buyer.tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <!-- Supabase client is provided by the shared core.js. -->
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f1f5f9}
        .auth-container{background:linear-gradient(135deg,#4c1d95 0%,#7e22ce 40%,#9333ea 100%)}
        .input-field:focus{border-color:#9333ea;box-shadow:0 0 0 3px rgba(147,51,234,0.1)}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
        .btn-primary{background:#9333ea;color:#fff;padding:0.75rem 1.5rem;border-radius:12px;font-weight:700;border:none;cursor:pointer;width:100%}
        .btn-primary:active{background:#7e22ce}

        /* Buyer cash custody — clear, currency-safe summary */
        .buyer-custody-overview{background:linear-gradient(135deg,#27124f 0%,#4c1d95 55%,#6d28d9 100%);color:#fff;border-radius:24px;padding:20px;margin-bottom:18px;box-shadow:0 14px 32px rgba(76,29,149,.16)}
        .buyer-custody-overview h3{font-size:15px;font-weight:900}
        .buyer-custody-overview .buyer-custody-muted{color:rgba(255,255,255,.72)}
        .buyer-custody-currency-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
        .buyer-custody-currency-card{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);border-radius:17px;padding:14px}
        .buyer-custody-available{font-size:clamp(25px,4vw,36px);font-weight:900;line-height:1.15;letter-spacing:-.5px}
        .buyer-custody-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
        .buyer-custody-metric{background:rgba(255,255,255,.09);border-radius:12px;padding:9px;min-width:0}
        .buyer-custody-metric small{display:block;font-size:10px;color:rgba(255,255,255,.72);margin-bottom:4px}
        .buyer-custody-metric b{display:block;font-size:13px;overflow-wrap:anywhere}
        .buyer-custody-section-title{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 10px}
        .buyer-custody-record{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 16px rgba(15,23,42,.045)}
        .buyer-custody-record-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px}
        .buyer-custody-record-hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding:14px;border-radius:16px;background:#f5f3ff;border:1px solid #ddd6fe}
        .buyer-custody-record-hero.is-negative{background:#fff1f2;border-color:#fecdd3}
        .buyer-custody-record-hero strong{display:block;font-size:clamp(22px,3vw,29px);font-weight:900;color:#4c1d95;line-height:1.2}
        .buyer-custody-record-hero.is-negative strong{color:#be123c}
        .buyer-custody-record-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
        .buyer-custody-record-stat{padding:10px;border:1px solid #e2e8f0;border-radius:13px;background:#f8fafc;min-width:0}
        .buyer-custody-record-stat small{display:block;font-size:10px;color:#64748b;margin-bottom:4px}
        .buyer-custody-record-stat b{display:block;font-size:14px;color:#0f172a;overflow-wrap:anywhere}
        .buyer-custody-details{border:1px solid #e2e8f0;border-radius:14px;margin-top:10px;background:#fff;overflow:hidden}
        .buyer-custody-details>summary{cursor:pointer;list-style:none;padding:12px 14px;font-size:12px;font-weight:800;color:#334155;display:flex;justify-content:space-between;gap:10px}
        .buyer-custody-details>summary::-webkit-details-marker{display:none}
        .buyer-custody-details[open]>summary{border-bottom:1px solid #e2e8f0;background:#f8fafc}
        .buyer-custody-details-body{padding:10px 12px}
        .buyer-custody-expense{padding:12px;border:1px solid #e2e8f0;border-radius:13px;margin-bottom:8px;background:#fff}
        .buyer-custody-expense:last-child{margin-bottom:0}
        .buyer-custody-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
        .buyer-custody-empty{border:1px dashed #cbd5e1;border-radius:18px;padding:26px;text-align:center;background:#fff;color:#64748b}
        .buyer-custody-staff{border:1px solid #ddd6fe;background:#faf5ff;border-radius:18px;margin-top:18px;overflow:hidden}
        .buyer-custody-staff>summary{cursor:pointer;padding:14px;font-weight:900;color:#4c1d95;list-style:none}
        .buyer-custody-staff>summary::-webkit-details-marker{display:none}
        @media(min-width:768px){.buyer-custody-record-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.buyer-custody-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md">
        <div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-purple-600 to-purple-800 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4"><i class="fa-solid fa-cart-shopping text-white text-3xl"></i></div><h1 class="font-black text-2xl text-gray-800">الروائع</h1><p class="text-xs text-gray-400">مسؤول المشتريات</p></div>
        <h2 class="text-lg font-bold text-gray-700 text-center mb-4">تسجيل الدخول</h2>
        <div class="space-y-3"><div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-purple-600 outline-none font-bold text-sm"></div><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-purple-600 outline-none font-bold text-sm pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div>
        <button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-purple-600 to-purple-700 text-white py-3.5 rounded-xl font-black text-sm shadow-lg mt-4">تسجيل الدخول</button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<div id="mainApp" class="hidden flex flex-col h-full">
    <header class="bg-purple-700 text-white p-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0">
        <span class="font-black text-sm">📦 مسؤول المشتريات</span>
        <span id="buyerRealtimeStatus" class="text-[10px] font-bold rounded-lg px-2 py-1 bg-white/10">جارٍ الاتصال المباشر...</span>
        <div class="flex items-center gap-2"><span class="text-xs font-bold" id="headerUserName"></span><button onclick="App.doLogout()" class="bg-white/10 w-8 h-8 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div>
    </header>
    <div class="grid grid-cols-3 md:grid-cols-9 gap-1 p-2 bg-white border-b flex-shrink-0">
        <button onclick="App.switchTab('today')" class="px-2 py-3 rounded-xl font-bold text-xs bg-purple-600 text-white" id="tab-today">🏠 اليوم</button>
        <button onclick="App.switchTab('suppliers')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-suppliers">🏭 الموردون</button>
        <button onclick="App.switchTab('requests')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-requests">📥 طلبات PR</button>
        <button onclick="App.switchTab('quotations')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-quotations">💰 عروض أسعار</button>
        <button onclick="App.switchTab('orders')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-orders">📋 أوامر PO</button>
        <button onclick="App.switchTab('invoices')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-invoices">🧾 فواتيري</button>
        <button onclick="App.switchTab('custody')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-custody">💳 عهدتي</button>
        <button onclick="App.switchTab('vehicle')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-vehicle">📦 عهدة بضاعتي</button>
        <button onclick="App.switchTab('account')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-account">👤 حسابي</button>
    </div>
    <main id="mainContent" class="flex-1 overflow-y-auto p-4"></main>
</div>

<script>
var db = new Dexie('RW_Buyer');
db.version(1).stores({ orders: 'po_code', suppliers: 'supplier_code', items: 'item_code', cart: '++id', meta: 'key' });

function buyerEsc(value){
    return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function buyerMoney(value,currency){
    var activeCurrency=currency||(typeof App!=='undefined'&&App.currency)||'EGP';
    return RW_UI.formatCurrency(Number(value||0),activeCurrency);
}
function buyerDate(value){
    if(!value)return '—';
    try{return new Date(value).toLocaleDateString('ar-EG');}catch(e){return buyerEsc(value);}
}
function buyerLocalDate(value){
    var d=value||new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function buyerOperationId(){
    return 'buyer-'+Date.now()+'-'+Math.random().toString(36).slice(2);
}
function buyerStatus(value){
    var map={Draft:'مسودة',PendingApproval:'بانتظار الاعتماد',Submitted:'مرسل للاعتماد',Approved:'معتمد',Rejected:'مرفوض',Cancelled:'ملغي',Sent:'مرسل للمورد',PartiallyReceived:'مستلم جزئياً','Partially Received':'مستلم جزئياً',Received:'مستلم',Closed:'مغلق',Posted:'مرحل',Paid:'مدفوع',PartiallyPaid:'مدفوع جزئياً',Accepted:'مقبول',Issued:'عهدة مسلّمة',UnderReview:'قيد مراجعة المالية',Settled:'تمت التسوية'};
    return map[value]||buyerEsc(value||'غير محدد');
}

function buyerScanBarcode(items,onMatch){
    if(!window.BarcodeDetector||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        Swal.fire({icon:'info',title:'المسح بالكاميرا غير متاح',text:'استخدم قارئ باركود USB أو اكتب رقم الصنف/الباركود في حقل البحث.'});
        return;
    }
    var stream=null,timer=null,detector=null,video=null,detecting=false,closed=false;
    var cleanup=function(){
        closed=true;
        if(timer){clearInterval(timer);timer=null;}
        if(stream){stream.getTracks().forEach(function(track){track.stop();});stream=null;}
        if(video){try{video.pause();video.srcObject=null;}catch(e){}}
    };
    var formats=['ean_13','ean_8','code_128','code_39','upc_a','upc_e','qr_code'];
    Swal.fire({
        title:'مسح باركود الصنف',
        html:'<div class="text-right"><video id="buyer-barcode-video" autoplay muted playsinline class="w-full rounded-xl bg-black" style="max-height:55vh;object-fit:cover"></video><p id="buyer-barcode-status" class="text-xs text-slate-500 mt-3">وجّه الكاميرا الخلفية نحو الباركود وثبّت الصورة للحظة.</p></div>',
        width:560,showCancelButton:true,showConfirmButton:false,cancelButtonText:'إغلاق',
        didOpen:function(){
            video=document.getElementById('buyer-barcode-video');
            var status=document.getElementById('buyer-barcode-status');
            (async function(){
                try{
                    var supported=typeof window.BarcodeDetector.getSupportedFormats==='function'?await window.BarcodeDetector.getSupportedFormats():formats;
                    var usableFormats=formats.filter(function(format){return supported.indexOf(format)!==-1;});
                    if(!usableFormats.length){if(status)status.textContent='لا توجد صيغ باركود مدعومة؛ استخدم البحث اليدوي أو قارئ USB.';return;}
                    detector=new window.BarcodeDetector({formats:usableFormats});
                    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
                    if(closed){stream.getTracks().forEach(function(track){track.stop();});return;}
                    video.srcObject=stream;
                    await video.play();
                    timer=setInterval(async function(){
                        if(closed||detecting||!video||video.readyState<2)return;
                        detecting=true;
                        try{
                            var codes=await detector.detect(video);
                            if(codes&&codes.length){
                                var value=String(codes[0].rawValue||'').trim();
                                var matches=(items||[]).filter(function(item){
                                    return String(item.barcode||'').trim().toLowerCase()===value.toLowerCase()||
                                           String(item.item_code||'').trim().toLowerCase()===value.toLowerCase();
                                });
                                if(matches.length===1){
                                    cleanup();Swal.close();onMatch(matches[0],value);
                                }else if(matches.length>1){
                                    if(status)status.textContent='هذا الرمز مرتبط بأكثر من صنف؛ استخدم البحث اليدوي لاختيار الصنف الصحيح.';
                                }else if(status){
                                    status.textContent='لم نعثر على الصنف '+value+' في دليل الأصناف المحمّل. جرّب البحث اليدوي أو قارئ USB.';
                                }
                            }
                        }catch(e){if(status)status.textContent='تعذرت قراءة الصورة؛ أبقِ الباركود داخل الإطار وحاول مرة أخرى.';}
                        finally{detecting=false;}
                    },350);
                }catch(e){
                    cleanup();
                    if(status)status.textContent='تعذر فتح الكاميرا. تحقق من إذن الكاميرا أو استخدم البحث اليدوي/قارئ USB.';
                }
            })();
        },
        willClose:cleanup
    });
}

var App = {
    currentUser:null,
    currentTab:'today',
    realtimeKey:null,
    needsLiveRefresh:false,
    liveRefreshObserver:null,
    custodySnapshot:null,
    invoiceFilters:{query:'',from:'',to:'',status:'',branchId:'',createdBy:'',receipt:''},
    invoiceFiltersInitialized:false,
    poFilters:{query:'',from:'',to:'',status:'',branchId:'',createdBy:'',overdue:''},
    quotationFilters:{query:'',status:''},
    search:'',
    cache:{},
    cacheAt:{},
    quickCart:[],
    currency:'EGP',

    togglePass:function(){
        var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');
        if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}
        else{p.type='password';i.className='fa-solid fa-eye';}
    },
    doLogin:function(){
        var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim(),s=this;
        if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return;}
        RW_UI.byId('loginMsg').classList.add('hidden');
        RW_UI.showLoader('جاري تسجيل الدخول...');
        RW_Auth.doLogin(e,p,function(user,err){
            RW_UI.hideLoader();
            if(err){RW_UI.byId('loginMsg').innerText=err;RW_UI.byId('loginMsg').classList.remove('hidden');}
            else{s.currentUser=user;s.enterApp();}
        });
    },
    init:function(){
        var s=this;
        RW_Auth.init(function(user,err){
            if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة: '+(err||''));return;}
            var perms=Array.isArray(user.permissions)?user.permissions:[];
            if(!(user.isOwner||perms.indexOf('purchases')!==-1||perms.indexOf('finance')!==-1||perms.indexOf('finance_manager')!==-1)){
                RW_UI.showError('غير مصرح: يلزم صلاحية المشتريات أو المالية');RW_Auth.doLogout();return;
            }
            s.currentUser=user;s.enterApp();
        });
    },
    enterApp:function(){
        RW_UI.byId('loginScreen').classList.add('hidden');
        RW_UI.byId('mainApp').classList.remove('hidden');
        RW_UI.safeText(RW_UI.byId('headerUserName'),this.currentUser.name||this.currentUser.email||'');
        this.switchTab('today');
        this.startRealtime();
    },
    api:function(operation,payload){
        return new Promise(function(resolve,reject){
            var request={operation:operation,payload:payload||{}};
            if(payload&&payload.operation_id)request.operation_id=payload.operation_id;
            RW_API.call('save-purchase-order',request,function(json,error){
                if(error||!json){reject(new Error(error||'تعذر الاتصال بمحرك المشتريات'));return;}
                if(json.success===false){reject(new Error(json.msg||'تعذر تنفيذ العملية'));return;}
                resolve(json);
            });
        });
    },
    data:function(table,force){
        var self=this,now=Date.now();
        if(!force&&this.cache[table]&&this.cacheAt[table]&&now-this.cacheAt[table]<20000){
            return Promise.resolve(this.cache[table]);
        }
        return this.api('GET_DATA',{table:table,limit:500}).then(function(r){
            self.cache[table]=Array.isArray(r.items)?r.items:[];
            self.cacheAt[table]=Date.now();
            return self.cache[table];
        });
    },
    invalidate:function(){
        this.cache={};this.cacheAt={};
    },
    loadSystemCurrency:async function(){
        var result=await this.api('GET_SETTINGS',{});
        var currency=String(result&&result.currency||'').trim().toUpperCase();
        if(!/^[A-Z]{3}$/.test(currency))throw new Error('تعذر قراءة العملة المعتمدة من إعدادات النظام الأم');
        this.currency=currency;
        return currency;
    },
    notifyError:function(error){
        RW_UI.toast(error&&error.message?error.message:'حدث خطأ غير متوقع','error');
    },
    startRealtime:function(){
        var self=this;
        if(!this.currentUser||!this.currentUser.company_id||typeof RW_Realtime==='undefined')return;
        this.ensureLiveRefreshObserver();
        if(this.realtimeKey)RW_Realtime.stop(this.realtimeKey);
        this.realtimeKey=RW_Realtime.start({
            appId:'buyer',
            companyId:this.currentUser.company_id,
            tables:[
                'purchase_requests',
                {name:'purchase_request_details',companyColumn:false},
                'purchase_rfqs',
                {name:'purchase_rfq_details',companyColumn:false},
                {name:'purchase_rfq_suppliers',companyColumn:false},
                'purchase_quotations',
                {name:'purchase_quotation_details',companyColumn:false},
                'purchase_orders',
                {name:'purchase_order_details',companyColumn:false},
                'purchase_invoices',
                {name:'purchase_invoice_details',companyColumn:false},
                'purchase_payments',
                'purchase_payment_allocations',
                'purchase_returns',
                {name:'purchase_return_details',companyColumn:false},
                'purchase_status_history',
                'purchase_attachments',
                'purchase_document_links',
                'purchase_settings',
                'buyer_custodies',
                'buyer_custody_advances',
                'buyer_custody_expenses',
                'buyer_custody_payments',
                'buyer_custody_settlements',
                'buyer_goods_custody_events',
                'suppliers',
                'items',
                'branches',
                {name:'stock_branches',companyColumn:false}
            ],
            debounceMs:400,
            reconcileMs:15000,
            onEvent:function(event){
                self.invalidate();
                var targets={
                    suppliers:['suppliers','purchase_invoices','purchase_invoice_details','purchase_payments','purchase_payment_allocations','purchase_returns','purchase_return_details','purchase_status_history'],
                    requests:['purchase_requests','purchase_request_details','purchase_rfqs','purchase_rfq_details','purchase_rfq_suppliers','purchase_quotations','purchase_quotation_details','purchase_status_history'],
                    orders:['suppliers','purchase_quotations','purchase_quotation_details','purchase_orders','purchase_order_details','purchase_status_history','purchase_attachments','purchase_document_links'],
                    account:['purchase_invoices','purchase_invoice_details','purchase_payments','purchase_payment_allocations','purchase_returns','purchase_return_details','purchase_status_history','purchase_attachments','purchase_document_links','purchase_settings','suppliers'],
                    custody:['buyer_custodies','buyer_custody_advances','buyer_custody_expenses','buyer_custody_payments','buyer_custody_settlements','purchase_orders','purchase_invoices','purchase_invoice_details','receiving','receiving_details'],
                    quotations:['purchase_quotations','purchase_quotation_details','purchase_status_history'],
                    invoices:['purchase_invoices','purchase_invoice_details','purchase_status_history','purchase_attachments','purchase_document_links','purchase_payments','purchase_payment_allocations','buyer_goods_custody_events'],
                    vehicle:['buyer_goods_custody_events','purchase_invoices','purchase_invoice_details']
                };
                var relevant=self.currentTab==='today'||
                    (targets[self.currentTab]||[]).indexOf(event.table)!==-1;
                if(!relevant)return;
                if(typeof Swal!=='undefined'&&Swal.isVisible()){
                    self.needsLiveRefresh=true;
                    return;
                }
                self.needsLiveRefresh=false;
                self.renderCurrent();
            },
            onReconcile:function(){
                self.invalidate();
                if(typeof Swal!=='undefined'&&Swal.isVisible()){
                    self.needsLiveRefresh=true;
                    return;
                }
                self.needsLiveRefresh=false;

        '<p class="text-xs text-amber-700 mt-3">الإدارة أو القسم غير محفوظ كحقل مستقل في purchase_requests، وكميات الاستلام لا تُخمن من بيانات PR.</p></div>';

    renderInvoices:async function(){
        await this.loadSystemCurrency();this.pageLoading('تحميل فواتيري');
        var results=await Promise.all([
            this.data('purchase_invoices'),this.data('suppliers'),this.data('branches'),
            this.data('purchase_orders'),this.data('purchase_invoice_details')
        ]);
        var invoices=results[0],suppliers=results[1],branches=results[2],pos=results[3],details=results[4],
            filters=this.invoiceFilters||{query:'',from:'',to:'',status:'',branchId:'',createdBy:'',receipt:''},
            supplierIndex={},branchIndex={},poIndex={},detailsIndex={},creators={};
        if(!this.invoiceFiltersInitialized){
            filters.createdBy=(this.currentUser||{}).email||'';
            this.invoiceFiltersInitialized=true;
        }
        if(!this.canFinanceCustody()&&!filters.createdBy)filters.createdBy=(this.currentUser||{}).email||'';
        this.invoiceFilters=filters;

        branches.forEach(function(x){branchIndex[x.id]=x;});

        invoices.forEach(function(x){if(x.created_by)creators[x.created_by]=true;});

            if(invoice.is_received||invoice.received_date||(qty>0&&received>=qty))return 'received';
            if(received>0)return 'partial';
            return 'pending';

        function receiptLabel(state){return state==='received'?'مستلم بالكامل':state==='partial'?'استلام جزئي':'بانتظار الاستلام';}
        var q=String(filters.query||'').toLowerCase();

            var supplier=supplierIndex[x.supplier_id]||{},po=poIndex[x.purchase_order_id]||{},
                branch=branchIndex[x.branch_id]||{},date=String(x.invoice_date||x.created_at||'').slice(0,10),
                hay=[x.invoice_code,x.supplier_invoice_no,supplier.name,supplier.supplier_code,po.po_code,branch.name,x.created_by,x.status].join(' ').toLowerCase(),
                receipt=receiptState(x);
            return (!q||hay.indexOf(q)!==-1)&&(!filters.from||date>=filters.from)&&(!filters.to||date<=filters.to)&&
                (!filters.status||x.status===filters.status)&&(!filters.branchId||x.branch_id===filters.branchId)&&
                (!filters.createdBy||x.created_by===filters.createdBy)&&(!filters.receipt||receipt===filters.receipt);
        }).sort(function(a,b){return String(b.invoice_date||b.created_at||'').localeCompare(String(a.invoice_date||a.created_at||''));});
        var totalsByCurrency={},outstandingByCurrency={};

        var currencySummary=Object.keys(totalsByCurrency).sort().map(function(cur){
            return '<span class="inline-flex items-center gap-2 rounded-lg bg-slate-50 px-3 py-2 text-xs"><b>'+buyerEsc(cur)+'</b><span>إجمالي '+buyerMoney(totalsByCurrency[cur],cur)+'</span><span class="text-amber-700">متبقي '+buyerMoney(outstandingByCurrency[cur]||0,cur)+'</span></span>';
        }).join('')||'<span class="text-xs text-slate-400">لا توجد مبالغ ضمن التصفية</span>';
        var html='<div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h2 class="text-xl font-black">فواتيري</h2><p class="text-xs text-slate-500">تبدأ القائمة بفواتير المستخدم الحالي؛ العرض الشامل متاح للمالية المخولة فقط</p></div><div class="flex flex-wrap gap-2"><button type="button" onclick="App.createPurchaseInvoice()" class="px-4 py-3 rounded-xl bg-slate-800 text-white font-black">+ فاتورة PO</button><button type="button" onclick="App.quickPurchase()" class="px-4 py-3 rounded-xl bg-purple-700 text-white font-black">+ شراء سوق سريع</button></div></div>';
        html+='<div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3"><div class="card"><small class="text-slate-500">الفواتير المطابقة</small><b class="block text-xl">'+rows.length+'</b></div><div class="card"><small class="text-slate-500">مسودات</small><b class="block text-xl">'+rows.filter(function(x){return x.status==='Draft';}).length+'</b></div><div class="card"><small class="text-slate-500">العملة المركزية للمستندات الجديدة</small><b class="block text-xl">'+buyerEsc(this.currency)+'</b></div></div>';
        html+='<div class="card mb-3"><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2"><input id="bi-query" value="'+buyerEsc(filters.query||'')+'" class="border rounded-xl p-3 text-sm" placeholder="رقم النظام / المورد / PO / المنشئ"><label class="text-xs font-bold">من تاريخ<input id="bi-from" type="date" value="'+buyerEsc(filters.from||'')+'" class="block w-full border rounded-xl p-3 mt-1"></label><label class="text-xs font-bold">إلى تاريخ<input id="bi-to" type="date" value="'+buyerEsc(filters.to||'')+'" class="block w-full border rounded-xl p-3 mt-1"></label><select id="bi-status" class="border rounded-xl p-3 text-sm"><option value="">كل الحالات</option>'+['Draft','Posted','PartiallyPaid','Paid','Cancelled'].map(function(st){return '<option value="'+st+'" '+(filters.status===st?'selected':'')+'>'+buyerStatus(st)+'</option>';}).join('')+'</select>';
        html+='<select id="bi-branch" class="border rounded-xl p-3 text-sm"><option value="">كل الفروع</option>'+branches.map(function(x){return '<option value="'+buyerEsc(x.id)+'" '+(filters.branchId===x.id?'selected':'')+'>'+buyerEsc(x.name)+'</option>';}).join('')+'</select><select id="bi-creator" class="border rounded-xl p-3 text-sm"><option value="">'+(this.canFinanceCustody()?'كل المنشئين':'فواتيري فقط')+'</option>'+Object.keys(creators).sort().map(function(email){return '<option value="'+buyerEsc(email)+'" '+(filters.createdBy===email?'selected':'')+'>'+buyerEsc(email)+'</option>';}).join('')+'</select><select id="bi-receipt" class="border rounded-xl p-3 text-sm"><option value="">كل حالات الاستلام</option><option value="pending" '+(filters.receipt==='pending'?'selected':'')+'>بانتظار الاستلام</option><option value="partial" '+(filters.receipt==='partial'?'selected':'')+'>استلام جزئي</option><option value="received" '+(filters.receipt==='received'?'selected':'')+'>مستلم بالكامل</option></select></div><div class="flex gap-2 mt-3"><button type="button" onclick="App.applyInvoiceFilters()" class="px-4 py-2 rounded-lg bg-slate-800 text-white text-sm font-bold">بحث وتصفية</button><button type="button" onclick="App.clearInvoiceFilters()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-bold">مسح</button></div></div>';
        html+='<div class="card mb-3"><div class="text-xs font-bold mb-2">ملخص القيم — مفصول حسب عملة كل مستند حتى لا تختلط العملات</div><div class="flex flex-wrap gap-2">'+currencySummary+'</div></div>';
        html+='<div class="overflow-x-auto bg-white rounded-2xl"><table class="w-full text-sm min-w-[1500px]"><thead class="bg-slate-50"><tr><th class="p-3 text-right">رقم النظام</th><th class="p-3 text-right">رقم فاتورة المورد</th><th class="p-3">التاريخ</th><th class="p-3 text-right">المورد</th><th class="p-3">PO المرتبط</th><th class="p-3">الفرع</th><th class="p-3">المنشئ</th><th class="p-3">الاستحقاق</th><th class="p-3">الاستلام</th><th class="p-3">الحالة</th><th class="p-3">الإجمالي</th><th class="p-3">العملة</th><th class="p-3">المدفوع</th><th class="p-3">المتبقي</th><th class="p-3">تفاصيل</th></tr></thead><tbody>';
        html+=rows.map(function(x){

    openInvoice:async function(id){

            this.data('purchase_invoices'),this.data('purchase_invoice_details'),this.data('purchase_status_history'),
            this.data('suppliers'),this.data('purchase_orders'),this.data('branches'),this.data('purchase_attachments')

        var lines=results[1].filter(function(x){return x.invoice_id===id;}),history=results[2].filter(function(x){return x.document_id===id;}).sort(function(a,b){return String(a.created_at||'').localeCompare(String(b.created_at||''));});
        var invoiceAttachments=(results[6]||[]).filter(function(x){return x.document_type==='PurchaseInvoice'&&x.document_id===id&&!!x.storage_path;});
        var supplier=results[3].find(function(x){return x.id===invoice.supplier_id;})||{},po=results[4].find(function(x){return x.id===invoice.purchase_order_id;})||{},branch=results[5].find(function(x){return x.id===invoice.branch_id;})||{};

        var hasHandover=!!(handover&&(handover.events||[]).length);
        var currentEmail=String((this.currentUser||{}).email||'').toLowerCase(),isOwner=(this.currentUser||{}).isOwner===true;
        var invoiceOwner=invoice.purchase_source==='PURCHASE_ORDER'||invoice.purchase_source==='QUICK_MARKET'
            ?invoice.purchaser_user_id===(this.currentUser||{}).id
            :(String(invoice.created_by||'').toLowerCase()===currentEmail||isOwner);
        var canEdit=invoice.status==='Draft'&&!invoice.is_received&&!invoice.received_date&&Number(invoice.paid_amount||0)===0&&lines.every(function(x){return Number(x.received_qty||0)===0;})&&invoiceOwner&&(!isQuickMarket||!hasHandover);
        var canDelete=canEdit||(isOwner&&invoice.status==='Draft'&&!invoice.is_received&&!invoice.received_date&&Number(invoice.paid_amount||0)===0&&!isQuickMarket);
        var editable=canEdit,currency=invoice.currency||this.currency||'EGP',paid=Number(invoice.paid_amount||0),remaining=Math.max(0,Number(invoice.total_amount||0)-paid);
        var html='<div class="text-right space-y-3"><div class="grid grid-cols-2 md:grid-cols-4 gap-2"><div class="p-3 bg-slate-50 rounded-xl"><small>المورد</small><b class="block">'+buyerEsc(supplier.name||'—')+'</b></div><div class="p-3 bg-slate-50 rounded-xl"><small>الحالة</small><b class="block">'+buyerStatus(invoice.status)+'</b></div><div class="p-3 bg-slate-50 rounded-xl"><small>التاريخ</small><b class="block">'+buyerDate(invoice.invoice_date)+'</b></div><div class="p-3 bg-slate-50 rounded-xl"><small>رقم فاتورة المورد</small><b class="block">'+buyerEsc(invoice.supplier_invoice_no||'—')+'</b></div></div>';
        html+='<div class="grid grid-cols-2 md:grid-cols-3 gap-2 text-sm"><p><b>رقم النظام:</b> '+buyerEsc(invoice.invoice_code)+'</p><p><b>الفرع:</b> '+buyerEsc(branch.name||'—')+'</p><p><b>المنشئ:</b> '+buyerEsc(invoice.created_by||'—')+'</p><p><b>الاستحقاق:</b> '+buyerDate(invoice.due_date)+'</p><p><b>أمر الشراء:</b> '+buyerEsc(po.po_code||'بدون PO')+'</p><p><b>العملة:</b> '+buyerEsc(currency)+'</p><p><b>الإجمالي:</b> '+buyerMoney(invoice.total_amount,currency)+'</p><p><b>المسدد:</b> '+buyerMoney(paid,currency)+'</p><p><b>المتبقي:</b> '+buyerMoney(remaining,currency)+'</p></div>';
        if(invoiceAttachments.length){
            html+='<div class="rounded-xl border border-blue-100 bg-blue-50 p-3"><b class="text-sm">مستندات فاتورة المورد</b><div class="mt-2 flex flex-wrap gap-2">'+invoiceAttachments.map(function(a){return '<button type="button" onclick="App.viewPurchaseAttachment(\''+buyerEsc(a.storage_path)+'\')" class="rounded-lg bg-white border px-3 py-2 text-xs font-bold text-blue-700">'+buyerEsc(a.file_name||'فتح المرفق')+'</button>';}).join('')+'</div></div>';
        }else if(isQuickMarket){

    renderOrders:async function(){

        ]);
        var orders=results[0],quotes=results[1],branches=results[2],details=results[3],
            filters=this.poFilters||{query:'',from:'',to:'',status:'',branchId:'',createdBy:'',overdue:''},
            branchIndex={},detailsIndex={},creators={},today=buyerLocalDate();

        orders.forEach(function(x){if(x.created_by)creators[x.created_by]=true;});
        function progress(po){
            var lines=detailsIndex[po.id]||[],ordered=0,received=0;
            lines.forEach(function(line){ordered+=Number(line.qty_ordered||0);received+=Number(line.qty_received||0);});
            return {ordered:ordered,received:received,remaining:Math.max(0,ordered-received),percent:ordered>0?Math.min(100,received/ordered*100):0};
        }

                hay=[o.po_code,o.po_date,o.supplier_name,o.status,o.created_by,branch.name,o.expected_delivery_date].join(' ').toLowerCase();

    loadInvoiceItems:async function(){
        // Use the central, permission-aware Buyer data gateway rather than a direct
        // items SELECT: Buyer admits Finance users too, while items RLS is purchases-only.
        var rows=await this.data('items',true);
        if(!Array.isArray(rows))throw new Error('تعذر تحميل دليل الأصناف من محرك المشتريات المركزي');
        return rows.filter(function(item){return item&&item.is_active===true;});
    },
    invoiceNormalizeSearch:function(value){
        return String(value==null?'':value).normalize('NFKC').toLowerCase()
            .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
            .replace(/[أإآٱ]/g,'ا')
            .replace(/[ىی]/g,'ي')
            .replace(/ک/g,'ك')
            .replace(/\s+/g,' ').trim();
    },
    invoiceSearchTokens:function(value){
        return this.invoiceNormalizeSearch(value).replace(/[,|()]/g,' ').split(/\s+/).filter(Boolean).slice(0,4);
    },
    searchInvoiceItems:async function(query,catalog){
        var tokens=this.invoiceSearchTokens(query);
        if(!tokens.length)return [];
        var rows=Array.isArray(catalog)?catalog:await this.loadInvoiceItems();
        var self=this,normalizedQuery=this.invoiceNormalizeSearch(query);
        return rows.filter(function(item){
            var fields=self.invoiceNormalizeSearch([
                item.item_code,item.name,item.barcode,item.search_label
            ].filter(Boolean).join(' '));
            return tokens.every(function(token){return fields.indexOf(token)!==-1;});
        }).sort(function(a,b){
            function score(item){
                var code=self.invoiceNormalizeSearch(item.item_code);
                var barcode=self.invoiceNormalizeSearch(item.barcode);
                var name=self.invoiceNormalizeSearch(item.name);
                return (code===normalizedQuery?1200:0)+(barcode===normalizedQuery?1100:0)+
                    (code.indexOf(normalizedQuery)===0?700:0)+(barcode.indexOf(normalizedQuery)===0?650:0)+
                    (name.indexOf(normalizedQuery)===0?400:0);
            }
            return score(b)-score(a);
        }).slice(0,25);
    },

    recordQuickMarketHandover:async function(invoiceId){

                '<label class="block text-xs font-bold">المركبة (اختياري)<select id="bhg-vehicle" class="swal2-select w-full"><option value="">بدون مركبة / حيازة مباشرة</option>'+vehicles.map(function(v){return '<option value="'+buyerEsc(v.id)+'">'+buyerEsc(v.plate_number||v.vehicle_code||v.name||v.id)+'</option>';}).join('')+'</select></label>'+
                '<div class="border rounded-xl p-3"><b class="text-sm">الكميات</b>'+fields+'</div>'+
                '<label class="block text-xs font-bold">إثبات التسليم من المورد (PDF / صورة)<input id="bhg-file" type="file" accept="application/pdf,image/*" class="swal2-file"></label>'+
                '<label class="block text-xs font-bold">ملاحظات<textarea id="bhg-notes" class="swal2-textarea"></textarea></label></div>';
            var result=await Swal.fire({title:'إثبات استلام المورد إلى عهدتك',html:html,width:700,showCancelButton:true,confirmButtonText:'تسجيل الحيازة',cancelButtonText:'إلغاء',preConfirm:async function(){
                var selected=Array.from(document.querySelectorAll('[data-bhg-qty]')).map(function(el){
                    return {item_code:el.getAttribute('data-bhg-code'),qty:Number(el.value||0)};
                }).filter(function(x){return x.qty>0;});
                if(!selected.length||selected.some(function(x){var line=lines.find(function(y){return y.item_code===x.item_code;});return !Number.isFinite(x.qty)||!line||x.qty>Number(line.remaining_qty)+0.0001;})){
                    Swal.showValidationMessage('أدخل كمية موجبة لا تتجاوز المتبقي لكل صنف');return false;

                        committed=(verify.events||[]).some(function(x){return x.operation_id===operationId;});

    renderQuickSearch:function(items,q){
        var box=RW_UI.byId('bq-results');if(!box)return;
        var tokens=this.invoiceSearchTokens(q);
        if(!tokens.length){RW_UI.safeHTML(box,'');box.classList.add('hidden');return;}
        var self=this;
        var matches=items.filter(function(it){
            var fields=self.invoiceNormalizeSearch([it.name,it.item_code,it.barcode,it.search_label].filter(Boolean).join(' '));
            return tokens.every(function(token){return fields.indexOf(token)!==-1;});
        }).slice(0,25);
        RW_UI.safeHTML(box,matches.map(function(it){
            var idx=items.indexOf(it);
            return '<button type="button" data-bqm-item="'+idx+'" class="w-full text-right p-3 border-b hover:bg-blue-50"><b>'+buyerEsc(it.name)+'</b><small class="block text-slate-500 mt-1">'+buyerEsc(it.item_code)+' · '+buyerEsc(it.barcode||'—')+' · '+buyerEsc(it.unit||'')+'</small></button>';
        }).join('')||'<div class="p-3 text-xs text-slate-400">لا توجد نتائج مطابقة في دليل الأصناف</div>');
        box.classList.remove('hidden');
        Array.from(box.querySelectorAll('[data-bqm-item]')).forEach(function(button){
            button.addEventListener('click',function(){
                var index=Number(button.getAttribute('data-bqm-item'));
                if(!Number.isInteger(index)||index<0||index>=items.length)return;
                self.quickSelectItem(items[index]);
            });
        });
    },
    quickSelectItem:function(item){
        if(!item||!item.item_code)return;

        var search=RW_UI.byId('bqm-search'),box=RW_UI.byId('bq-results');
        if(search)search.value=item.item_code+' — '+item.name;
        if(box)box.classList.add('hidden');

    quickAddItem:function(){
        var item=this.quickSelectedItem;

        var qtyRaw=String((RW_UI.byId('bqm-qty')||{}).value||'').trim(),
            priceRaw=String((RW_UI.byId('bqm-price')||{}).value||'').trim(),
            qty=Number(qtyRaw),price=Number(priceRaw);
        if(!qtyRaw||!priceRaw||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<=0){
            RW_UI.toast('أدخل كمية موجبة وسعر الشراء الفعلي قبل إضافة البند','error');return;
        }
        if(this.quickCart.some(function(x){return x.item_code===item.item_code;})){
            RW_UI.toast('الصنف مضاف بالفعل؛ عدّل كميته وسعره من سطره','info');return;
        }
        this.quickCart.push({item_code:item.item_code,name:item.name,unit:item.unit,qty:qty,unit_price:price,discount_percent:0,tax_rate:0});
        this.quickSelectedItem=null;
        var search=RW_UI.byId('bqm-search'),qtyInput=RW_UI.byId('bqm-qty'),priceInput=RW_UI.byId('bqm-price');
        if(search)search.value='';

        if(priceInput)priceInput.value='';
        this.renderQuickCart();
    },

    renderCustody:async function(){
        this.pageLoading('تحميل دفتر عهدتي');

        var data=loaded[0]||{},invoices=loaded[1]||[],suppliers=loaded[2]||[];
        this.custodySnapshot=data;this.invoiceSnapshot=invoices;
        var custodies=Array.isArray(data.custodies)?data.custodies:[],
            expenses=Array.isArray(data.expenses)?data.expenses:[],
            advances=Array.isArray(data.advances)?data.advances:[],
            payments=Array.isArray(data.payments)?data.payments:[],
            settlements=Array.isArray(data.settlements)?data.settlements:[],
            returns=Array.isArray(data.returns)?data.returns:[],
            finance=!!data.is_finance,
            currentEmployeeId=(this.currentUser||{}).id,
            self=this;

        var isOpen=function(c){return c.status!=='Settled'&&c.status!=='Closed';};
        var byDate=function(a,b){return String(b.expense_date||b.created_at||'').localeCompare(String(a.expense_date||a.created_at||''));};
        var moneySum=function(rows){return (rows||[]).reduce(function(n,x){return n+Number(x.amount||0);},0);};
        var getMetrics=function(c){
            var lines=expenses.filter(function(e){return e.custody_id===c.id;});
            var custodyAdvances=advances.filter(function(a){return a.custody_id===c.id;});
            var custodyReturns=returns.filter(function(x){return x.custody_id===c.id;});
            var settlement=settlements.find(function(x){return x.custody_id===c.id;});
            var acknowledgedRows=custodyAdvances.filter(function(a){return !!a.acknowledged_at&&!!a.cash_box_id&&!!a.journal_entry_id;});
            var acknowledged=moneySum(acknowledgedRows);
            var approvedRows=lines.filter(function(e){return e.status==='Approved';});
            var pendingRows=lines.filter(function(e){return e.status==='Submitted';});
            var approved=moneySum(approvedRows);
            var pending=moneySum(pendingRows);
            var returned=custodyReturns.length?moneySum(custodyReturns):Number(c.returned_amount||0);
            if(!custodyReturns.length&&settlement)returned=Math.max(returned,Number(settlement.cash_returned||0));
            var committed=approved+pending;
            var reserved=self.quickMarketCashReservation(invoices,expenses,c.id,null);
            var rawAvailable=acknowledged-committed-reserved-returned;
            var qmpInvoices=invoices.filter(function(i){
                return i.cash_custody_id===c.id&&i.purchase_source==='QUICK_MARKET'&&i.settlement_source==='EMPLOYEE_CUSTODY'&&
                    ['Draft','Posted','PartiallyPaid'].indexOf(i.status)!==-1&&
                    ['UNSETTLED','PENDING_FINANCE','AP_OPEN','PARTIALLY_SETTLED'].indexOf(i.settlement_status)!==-1;
            }).map(function(i){
                var linked=lines.filter(function(e){return e.purchase_invoice_id===i.id&&e.status==='Submitted';})
                    .reduce(function(n,e){return n+Number(e.amount||0);},0);
                return {invoice:i,remaining:Math.max(0,Number(i.total_amount||0)-Number(i.paid_amount||0)-linked),
                    supplier:suppliers.find(function(x){return x.id===i.supplier_id;})||{}};
            });
            var unacknowledged=custodyAdvances.filter(function(a){return !a.acknowledged_at||!a.cash_box_id||!a.journal_entry_id;}).length;
            var mismatch=Math.abs(Number(c.paid_amount||0)-acknowledged)>0.005;
            return {
                lines:lines.sort(byDate),advances:custodyAdvances,returns:custodyReturns,settlement:settlement,
                acknowledged:acknowledged,approved:approved,pending:pending,committed:committed,
                returned:returned,reserved:reserved,available:rawAvailable,
                approvedRows:approvedRows.sort(byDate),pendingRows:pendingRows.sort(byDate),
                rejectedRows:lines.filter(function(e){return e.status==='Rejected';}).sort(byDate),
                qmpInvoices:qmpInvoices,unacknowledged:unacknowledged,mismatch:mismatch,
                pendingCount:pendingRows.length,openQmpCount:qmpInvoices.length
            };

        var staffCustodies=finance?custodies.filter(function(c){return c.employee_id!==currentEmployeeId;}):[];

        var closedPersonal=personalCustodies.filter(function(c){return !isOpen(c);}).sort(function(a,b){return String(b.issued_date||'').localeCompare(String(a.issued_date||''));});
        var activeStaff=staffCustodies.filter(isOpen).sort(function(a,b){return String(b.issued_date||'').localeCompare(String(a.issued_date||''));});

    submitCustodyExpense:async function(custodyId){
        var uploadedPaths=[],unknownOutcome=false,operationId=buyerOperationId();
        try{
            var custody=(this.custodySnapshot&&this.custodySnapshot.custodies||[]).find(function(c){return c.id===custodyId;});
            if(!custody)throw new Error('العهدة غير موجودة');
            if(custody.employee_id!==(this.currentUser||{}).id)throw new Error('لا يمكنك تقديم مصروف على عهدة موظف آخر');
            if(custody.status==='Settled'||custody.status==='Closed'||!custody.acknowledged_at)throw new Error('لا يمكن تقديم فاتورة قبل تأكيد استلام العهدة أو بعد إغلاقها');
            var loaded=await Promise.all([
                this.data('purchase_invoices'),this.data('purchase_orders'),this.data('receiving'),
                this.data('suppliers'),this.data('purchase_invoice_details'),this.data('receiving_details')
            ]);
            var allInvoices=loaded[0]||[],orders=loaded[1]||[],
                receipts=(loaded[2]||[]).filter(function(r){return ['مكتمل','Completed'].indexOf(r.status)!==-1;}),
                suppliers=loaded[3]||[],invoiceDetails=loaded[4]||[],receiptDetails=loaded[5]||[];
            var invoices=allInvoices.filter(function(i){
                var poInvoice=!!i.purchase_order_id&&!!i.supplier_id&&i.status==='Draft';
                var qmpInvoice=i.purchase_source==='QUICK_MARKET'&&i.settlement_source==='EMPLOYEE_CUSTODY'&&
                    i.cash_custody_id===custodyId&&i.purchaser_user_id===(this.currentUser||{}).id&&
                    ['Draft','PartiallyPaid'].indexOf(i.status)!==-1;
                return (poInvoice||qmpInvoice)&&String(i.currency||'').toUpperCase()===String(custody.currency).toUpperCase();
            },this);
            if(!invoices.length||!receipts.length)throw new Error('لا توجد فاتورة مؤهلة مرتبطة باستلام مخزني مكتمل على هذه العهدة.');
            function receiptValue(invoice,receiptId){
                var rows=receiptDetails.filter(function(r){return r.operation_id===receiptId;});
                var total=0,valid=0;

                '<label class="block text-xs font-bold">إذن استلام المخزن<select id="bce-receipt" class="swal2-select w-full"><option value="">اختر إذن الاستلام المرتبط بالفاتورة</option></select></label>'+

                '<div class="grid grid-cols-2 gap-2"><label class="text-xs font-bold">قيمة الجزء المقبول ('+buyerEsc(custody.currency)+')<input id="bce-amount" type="number" class="swal2-input" readonly></label><label class="text-xs font-bold">تاريخ المصروف<input id="bce-date" type="date" class="swal2-input" value="'+buyerLocalDate()+'"></label></div>'+
                '<label class="block text-xs font-bold">وصف المصروف / المشتريات<input id="bce-description" class="swal2-input" placeholder="الغرض من الشراء"></label>'+
                '<label class="block text-xs font-bold">صورة فاتورة المورد (PDF / صورة)<input id="bce-file" type="file" accept="application/pdf,image/*" class="swal2-file"></label>'+
                '<label class="block text-xs font-bold">صورة إذن استلام المخزن (PDF / صورة)<input id="bce-receipt-file" type="file" accept="application/pdf,image/*" class="swal2-file"></label>'+
                '<p class="text-xs text-amber-700">لفواتير السوق السريع: يُحسب مبلغ التسوية من الكميات المقبولة في إذن الاستلام المحدد فقط، ويمكن تسوية الاستلامات الجزئية تباعًا. عند اعتماد المالية يُثبت مخزون مقابل عهدة الموظف، دون مديونية أو دفعة مورد ثانية. الحد الأقصى لكل ملف 10 ميجابايت.</p></div>';

            }
            var result=await Swal.fire({title:'تقديم فاتورة وإذن استلام للتسوية',html:html,width:750,showCancelButton:true,confirmButtonText:'إرسال للمالية',cancelButtonText:'إلغاء',didOpen:function(){

    settleCustody:async function(custodyId){
        var snapshot=this.custodySnapshot||{};
        var custody=(snapshot.custodies||[]).find(function(c){return c.id===custodyId;});
        if(!custody)return;
        var advances=(snapshot.advances||[]).filter(function(a){return a.custody_id===custodyId;});
        var paidAdvances=advances.filter(function(a){return !!a.acknowledged_at&&!!a.cash_box_id&&!!a.journal_entry_id;});
        var paid=paidAdvances.reduce(function(n,a){return n+Number(a.amount||0);},0);
        var lines=(snapshot.expenses||[]).filter(function(x){return x.custody_id===custodyId;});
        var approved=lines.filter(function(x){return x.status==='Approved';}).reduce(function(n,x){return n+Number(x.amount||0);},0);
        var pending=lines.filter(function(x){return x.status==='Submitted';}).length;
        var unacknowledged=advances.filter(function(a){return !a.acknowledged_at||!a.cash_box_id||!a.journal_entry_id;}).length;
        var returns=(snapshot.returns||[]).filter(function(x){return x.custody_id===custodyId;});
        var settlement=(snapshot.settlements||[]).find(function(x){return x.custody_id===custodyId;});
        var returned=returns.length?returns.reduce(function(n,x){return n+Number(x.amount||0);},0):Number(custody.returned_amount||0);
        if(!returns.length&&settlement)returned=Math.max(returned,Number(settlement.cash_returned||0));
        if(Math.abs(Number(custody.paid_amount||0)-paid)>0.005){
            this.notifyError(new Error('عدم تطابق بين رصيد المدفوع فعليًا ودفتر إقرارات الاستلام. أوقفنا التسوية لحين المراجعة.'));
            return;
        }
        if(pending||unacknowledged){
            this.notifyError(new Error('لا يمكن رد النقد قبل مراجعة جميع المستندات وتأكيد استلام كل دفعات العهدة.'));
            return;
        }
        var invoices=await this.data('purchase_invoices');
        var openQmp=(invoices||[]).filter(function(i){
            return i.cash_custody_id===custodyId&&i.purchase_source==='QUICK_MARKET'&&i.settlement_source==='EMPLOYEE_CUSTODY'&&
                ['Draft','Posted','PartiallyPaid'].indexOf(i.status)!==-1&&
                ['UNSETTLED','PENDING_FINANCE','AP_OPEN','PARTIALLY_SETTLED'].indexOf(i.settlement_status)!==-1;
        }).length;
        if(openQmp){
            this.notifyError(new Error('توجد فواتير سوق سريع مفتوحة لم تكتمل تسويتها؛ لا يمكن رد النقد قبل إغلاق حجوزاتها.'));
            return;
        }
        if(approved>paid+0.005){
            this.notifyError(new Error('المصروفات المعتمدة تتجاوز الأموال التي صُرفت فعليًا؛ يلزم التحقيق قبل التسوية.'));
            return;
        }
        var remaining=Math.max(0,paid-approved-returned);
        if(remaining<=0.005){
            if(returns.length||returned>0.005){
                this.notifyError(new Error('وصلت التسوية إلى الصفر بعد سندات قبض سابقة؛ راجع حالة العهدة وسجل التسويات قبل أي إجراء إضافي.'));
                return;
            }
            var closeResult=await Swal.fire({
                title:'إغلاق العهدة دون رد نقدي',
                html:'<div class="text-right text-sm">النقد المصروف فعليًا: <b>'+buyerMoney(paid,custody.currency)+'</b><br>المصروفات المعتمدة: <b>'+buyerMoney(approved,custody.currency)+'</b><br>المردود سابقًا: <b>'+buyerMoney(returned,custody.currency)+'</b><p class="mt-2 text-emerald-700">لا يوجد رصيد نقدي متبقٍ للرد. سيتم إغلاق سجل التسوية دون إنشاء سند قبض نقدي.</p><label class="block text-xs font-bold mt-3">مرجع التسوية<input id="bcs-reference" class="swal2-input"></label><label class="block text-xs font-bold">ملاحظات<textarea id="bcs-notes" class="swal2-textarea"></textarea></label></div>',
                width:620,showCancelButton:true,confirmButtonText:'تأكيد الإغلاق',cancelButtonText:'إلغاء',
                preConfirm:function(){return {reference:RW_UI.byId('bcs-reference').value.trim()||null,notes:RW_UI.byId('bcs-notes').value.trim()||null};}
            });
            if(!closeResult.isConfirmed)return;
            try{
                await this.api('SETTLE_CUSTODY',{custody_id:custodyId,treasury_id:null,cash_returned:0,finance_reference:closeResult.value.reference,notes:closeResult.value.notes});
                this.invalidate();await this.renderCustody();
                RW_UI.toast('أُغلقت العهدة دون حركة قبض؛ لا يوجد نقد متبقٍ','success');
            }catch(e){
                this.invalidate();await this.renderCustody();
                var closed=(this.custodySnapshot&&this.custodySnapshot.settlements||[]).some(function(x){return x.custody_id===custodyId;});
                if(closed)RW_UI.toast('تم إغلاق العهدة بالفعل','success');else this.notifyError(e);
            }
            return;
        }
        var treasuries=this.custodyCashTreasuries(await this.data('treasury'),custody.branch_id);
        if(!treasuries.length){this.notifyError(new Error('لا توجد خزينة Cash نشطة تابعة لفرع العهدة لاستلام النقد المرتجع'));return;}
        var treasuryOptions=treasuries.map(function(t){return '<option value="'+buyerEsc(t.id)+'">'+buyerEsc(t.account_name)+' · رصيد '+buyerMoney(t.current_balance,custody.currency)+'</option>';}).join('');
        var localDate=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
        var html='<div class="text-right text-sm mb-3">'+
            '<div>النقد المصروف فعليًا: <b>'+buyerMoney(paid,custody.currency)+'</b></div>'+
            '<div>المصروفات المعتمدة: <b>'+buyerMoney(approved,custody.currency)+'</b></div>'+
            '<div>المردود سابقًا: <b>'+buyerMoney(returned,custody.currency)+'</b></div>'+
            '<div class="mt-2 text-amber-700">المتبقي القابل للرد: <b>'+buyerMoney(remaining,custody.currency)+'</b></div></div>'+
            '<label class="block text-xs font-bold text-right">خزينة استلام النقد المرتجع<select id="bcs-treasury" class="swal2-select w-full"><option value="">اختر الخزينة</option>'+treasuryOptions+'</select></label>'+
            '<label class="block text-xs font-bold text-right">مبلغ الرد الحالي<input id="bcs-return" type="number" min="0.01" max="'+remaining.toFixed(2)+'" step="0.01" class="swal2-input" value="'+remaining.toFixed(2)+'"></label>'+
            '<label class="block text-xs font-bold text-right">تاريخ القبض<input id="bcs-date" type="date" class="swal2-input" value="'+localDate+'"></label>'+
            '<label class="block text-xs font-bold text-right">مرجع سند القبض<input id="bcs-reference" maxlength="120" class="swal2-input"></label>'+
            '<label class="block text-xs font-bold text-right">ملاحظات<textarea id="bcs-notes" class="swal2-textarea"></textarea></label>'+
            '<p class="text-xs text-slate-500 mt-2">كل رد ينشئ سند قبض مستقلًا في Receipts ويرتبط بالعهدة والموظف. يمكن تسجيل عدة ردود جزئية؛ وتُغلق العهدة تلقائيًا عند وصول المتبقي إلى صفر بعد اعتماد المستندات.</p>';
        var result=await Swal.fire({title:'سند قبض — رد نقدية العهدة',html:html,width:650,showCancelButton:true,confirmButtonText:'ترحيل سند القبض',cancelButtonText:'إلغاء',preConfirm:function(){
            var amount=Number(RW_UI.byId('bcs-return').value||0),treasury=RW_UI.byId('bcs-treasury').value,date=RW_UI.byId('bcs-date').value;
            if(!treasury||!date||!Number.isFinite(amount)||amount<=0||amount>remaining+0.005){Swal.showValidationMessage('اختر خزينة وتاريخًا وأدخل مبلغًا موجبًا لا يتجاوز الرصيد المتبقي');return false;}
            return {amount:Math.round(amount*100)/100,treasury_id:treasury,return_date:date,reference:RW_UI.byId('bcs-reference').value.trim()||null,notes:RW_UI.byId('bcs-notes').value.trim()||null};
        }});
        if(!result.isConfirmed)return;
        var operationId=window.crypto&&crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(ch){var v=Math.random()*16|0;return (ch==='x'?v:(v&3|8)).toString(16);});
        try{
            var posted=await this.api('RETURN_CUSTODY_CASH',{
                custody_id:custodyId,treasury_id:result.value.treasury_id,amount:result.value.amount,
                return_date:result.value.return_date,reference:result.value.reference,notes:result.value.notes,operation_id:operationId
            });
            this.invalidate();await this.renderCustody();
            RW_UI.toast(posted.status==='Settled'?'تم رد كامل المتبقي وإغلاق العهدة':'تم تسجيل سند قبض جزئي · المتبقي '+buyerMoney(posted.remaining_balance,custody.currency),'success');
        }catch(e){this.notifyError(e);}
    },
    renderAccount:async function(){
        await this.loadSystemCurrency();
        this.pageLoading('تحميل ملف المشتري');
        var settings=await this.data('purchase_settings');
        var p=this.currentUser||{},perms=Array.isArray(p.permissions)?p.permissions:[];
        var html='<div class="mb-4"><h2 class="text-xl font-black">حسابي</h2><p class="text-xs text-slate-500">الملف والصلاحيات والتقارير وإعدادات دورة المشتريات</p></div><div class="card mb-3"><h3 class="font-black mb-2">'+buyerEsc(p.name||'المستخدم')+'</h3><p class="text-sm">'+buyerEsc(p.email||'')+'</p><p class="text-xs text-slate-500 mt-1">'+buyerEsc(p.role||'')+'</p><p class="text-xs text-slate-500 mt-2">الصلاحيات الفعالة: '+buyerEsc(perms.join('، ')||'—')+'</p></div><div class="grid md:grid-cols-2 gap-3"><button onclick="App.showReports()" class="card text-right font-bold">📊 تقارير المشتريات</button><button onclick="App.purchaseSettings()" class="card text-right font-bold">⚙️ إعدادات دورة المشتريات</button><button onclick="App.doLogout()" class="card text-right font-bold text-red-600">تسجيل الخروج</button></div>';
        html+='<p class="text-xs text-slate-500 mt-3">تُعرض تسويات العهدة وسندات الخزينة والمدفوعات للموردين في دفتر عهدتي حسب الصلاحيات.</p>';
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
    },
    showReports:async function(){
        try{
            var r=await this.api('GET_REPORTS',{as_of_date:new Date().toISOString().slice(0,10)});
            var html='<div class="text-right space-y-2"><p>طلبات مفتوحة: <b>'+buyerEsc(r.requests&&r.requests.open||0)+'</b></p><p>طلبات اعتماد: <b>'+buyerEsc(r.requests&&r.requests.pending_approval||0)+'</b></p><p>أوامر مفتوحة: <b>'+buyerEsc(r.orders&&r.orders.open||0)+'</b></p><p>قيمة الأوامر: <b>'+buyerMoney(r.orders&&r.orders.value||0,this.currency)+'</b></p><p>فواتير مستحقة: <b>'+buyerMoney(r.invoices&&r.invoices.outstanding||0,this.currency)+'</b></p><p>قيمة مردودات مرحلة: <b>'+buyerMoney(r.returns&&r.returns.posted_value||0,this.currency)+'</b></p></div>';
            await Swal.fire({title:'تقارير المشتريات',html:html,width:650,showCloseButton:true,showConfirmButton:false});
        }catch(e){this.notifyError(e);}
    },
    purchaseSettings:async function(){
        try{
            var rows=await this.data('purchase_settings'),s=rows[0]||{};
            var html='<div class="text-right space-y-3">'+
                '<label class="flex justify-between items-center gap-2">اشتراط اعتماد طلب الشراء<input id="ps-approval" type="checkbox" '+(s.require_request_approval?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">اشتراط الاستلام قبل الفاتورة<input id="ps-receive" type="checkbox" '+(s.require_receiving_before_invoice?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">اشتراط الفاتورة قبل السداد<input id="ps-invoice" type="checkbox" '+(s.require_invoice_before_payment?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">ترحيل المخزون عند ترحيل الفاتورة<input id="ps-stock" type="checkbox" '+(s.require_inventory_on_invoice?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">اشتراط إذن مخزني عند المرتجع<input id="ps-return" type="checkbox" '+(s.require_inventory_voucher_on_return?'checked':'')+'></label>'+
                '<div class="p-3 rounded-xl bg-slate-50 text-sm">عملة النظام المعتمدة: <b>'+buyerEsc(this.currency||'EGP')+'</b><p class="text-xs text-slate-500 mt-1">تُقرأ من تبويب إعدادات النظام في النظام الأم، ولا تُغيّر من إعدادات المشتريات.</p></div></div>';
            var self=this;
            var result=await Swal.fire({title:'إعدادات المشتريات',html:html,width:650,showCancelButton:true,confirmButtonText:'حفظ الإعدادات',cancelButtonText:'إلغاء',preConfirm:async function(){
                try{return await self.api('SAVE_SETTINGS',{require_request_approval:RW_UI.byId('ps-approval').checked,require_receiving_before_invoice:RW_UI.byId('ps-receive').checked,require_invoice_before_payment:RW_UI.byId('ps-invoice').checked,require_inventory_on_invoice:RW_UI.byId('ps-stock').checked,require_inventory_voucher_on_return:RW_UI.byId('ps-return').checked});}
                catch(e){Swal.showValidationMessage(e.message);return false;}
            }});
            if(result.isConfirmed){this.invalidate();RW_UI.toast('تم حفظ إعدادات المشتريات','success');}
        }catch(e){this.notifyError(e);}
    }
};
RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded',function(){App.init();});
</script>
<script src="../register-sw.js"></script>
</body>
</html>
