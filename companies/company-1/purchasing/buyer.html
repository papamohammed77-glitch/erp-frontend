<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مسؤول المشتريات | الروائع ERP</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#9333ea">
    <link rel="stylesheet" href="buyer.tailwind.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <!-- Supabase client is provided by the shared core.js. -->
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f1f5f9}
        .auth-container{background:linear-gradient(135deg,#4c1d95 0%,#7e22ce 40%,#9333ea 100%)}
        .input-field:focus{border-color:#9333ea;box-shadow:0 0 0 3px rgba(147,51,234,0.1)}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
        .btn-primary{background:#9333ea;color:#fff;padding:0.75rem 1.5rem;border-radius:12px;font-weight:700;border:none;cursor:pointer;width:100%}
        .btn-primary:active{background:#7e22ce}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md">
        <div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-purple-600 to-purple-800 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4"><i class="fa-solid fa-cart-shopping text-white text-3xl"></i></div><h1 class="font-black text-2xl text-gray-800">الروائع</h1><p class="text-xs text-gray-400">مسؤول المشتريات</p></div>
        <h2 class="text-lg font-bold text-gray-700 text-center mb-4">تسجيل الدخول</h2>
        <div class="space-y-3"><div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-purple-600 outline-none font-bold text-sm"></div><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-purple-600 outline-none font-bold text-sm pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div>
        <button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-purple-600 to-purple-700 text-white py-3.5 rounded-xl font-black text-sm shadow-lg mt-4">تسجيل الدخول</button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<div id="mainApp" class="hidden flex flex-col h-full">
    <header class="bg-purple-700 text-white p-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0">
        <span class="font-black text-sm">📦 مسؤول المشتريات</span>
        <span id="buyerRealtimeStatus" class="text-[10px] font-bold rounded-lg px-2 py-1 bg-white/10">جارٍ الاتصال المباشر...</span>
        <div class="flex items-center gap-2"><span class="text-xs font-bold" id="headerUserName"></span><button onclick="App.doLogout()" class="bg-white/10 w-8 h-8 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div>
    </header>
    <div class="grid grid-cols-3 md:grid-cols-9 gap-1 p-2 bg-white border-b flex-shrink-0">
        <button onclick="App.switchTab('today')" class="px-2 py-3 rounded-xl font-bold text-xs bg-purple-600 text-white" id="tab-today">🏠 اليوم</button>
        <button onclick="App.switchTab('suppliers')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-suppliers">🏭 الموردون</button>
        <button onclick="App.switchTab('requests')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-requests">📥 طلبات PR</button>
        <button onclick="App.switchTab('quotations')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-quotations">💰 عروض أسعار</button>
        <button onclick="App.switchTab('orders')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-orders">📋 أوامر PO</button>
        <button onclick="App.switchTab('invoices')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-invoices">🧾 فواتيري</button>
        <button onclick="App.switchTab('custody')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-custody">💳 عهدتي</button>
        <button onclick="App.switchTab('vehicle')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-vehicle">🚚 رصيد السيارة</button>
        <button onclick="App.switchTab('account')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-account">👤 حسابي</button>
    </div>
    <main id="mainContent" class="flex-1 overflow-y-auto p-4"></main>
</div>

<script>
var db = new Dexie('RW_Buyer');
db.version(1).stores({ orders: 'po_code', suppliers: 'supplier_code', items: 'item_code', cart: '++id', meta: 'key' });

function buyerEsc(value){
    return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function buyerMoney(value,currency){
    var activeCurrency=currency||(typeof App!=='undefined'&&App.currency)||'EGP';
    return RW_UI.formatCurrency(Number(value||0),activeCurrency);
}
function buyerDate(value){
    if(!value)return '—';
    try{return new Date(value).toLocaleDateString('ar-EG');}catch(e){return buyerEsc(value);}
}
function buyerLocalDate(value){
    var d=value||new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function buyerOperationId(){
    return 'buyer-'+Date.now()+'-'+Math.random().toString(36).slice(2);
}
function buyerStatus(value){
    var map={Draft:'مسودة',PendingApproval:'بانتظار الاعتماد',Submitted:'مرسل للاعتماد',Approved:'معتمد',Rejected:'مرفوض',Cancelled:'ملغي',Sent:'مرسل للمورد',PartiallyReceived:'مستلم جزئياً','Partially Received':'مستلم جزئياً',Received:'مستلم',Closed:'مغلق',Posted:'مرحل',Paid:'مدفوع',PartiallyPaid:'مدفوع جزئياً',Accepted:'مقبول',Issued:'عهدة مسلّمة',UnderReview:'قيد مراجعة المالية',Settled:'تمت التسوية'};
    return map[value]||buyerEsc(value||'غير محدد');
}

var App = {
    currentUser:null,
    currentTab:'today',
    realtimeKey:null,
    needsLiveRefresh:false,
    liveRefreshObserver:null,
    custodySnapshot:null,
    invoiceFilters:{query:'',from:'',to:'',status:''},
    quotationFilters:{query:'',status:''},
    search:'',
    cache:{},
    cacheAt:{},
    quickCart:[],
    currency:'EGP',

    togglePass:function(){
        var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');
        if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}
        else{p.type='password';i.className='fa-solid fa-eye';}
    },
    doLogin:function(){
        var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim(),s=this;
        if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return;}
        RW_UI.byId('loginMsg').classList.add('hidden');
        RW_UI.showLoader('جاري تسجيل الدخول...');
        RW_Auth.doLogin(e,p,function(user,err){
            RW_UI.hideLoader();
            if(err){RW_UI.byId('loginMsg').innerText=err;RW_UI.byId('loginMsg').classList.remove('hidden');}
            else{s.currentUser=user;s.enterApp();}
        });
    },
    init:function(){
        var s=this;
        RW_Auth.init(function(user,err){
            if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة: '+(err||''));return;}
            var perms=Array.isArray(user.permissions)?user.permissions:[];
            if(!(user.isOwner||perms.indexOf('purchases')!==-1||perms.indexOf('finance')!==-1||perms.indexOf('finance_manager')!==-1)){
                RW_UI.showError('غير مصرح: يلزم صلاحية المشتريات أو المالية');RW_Auth.doLogout();return;
            }
            s.currentUser=user;s.enterApp();
        });
    },
    enterApp:function(){
        RW_UI.byId('loginScreen').classList.add('hidden');
        RW_UI.byId('mainApp').classList.remove('hidden');
        RW_UI.safeText(RW_UI.byId('headerUserName'),this.currentUser.name||this.currentUser.email||'');
        this.switchTab('today');
        this.startRealtime();
    },
    api:function(operation,payload){
        return new Promise(function(resolve,reject){
            var request={operation:operation,payload:payload||{}};
            if(payload&&payload.operation_id)request.operation_id=payload.operation_id;
            RW_API.call('save-purchase-order',request,function(json,error){
                if(error||!json){reject(new Error(error||'تعذر الاتصال بمحرك المشتريات'));return;}
                if(json.success===false){reject(new Error(json.msg||'تعذر تنفيذ العملية'));return;}
                resolve(json);
            });
        });
    },
    data:function(table,force){
        var self=this,now=Date.now();
        if(!force&&this.cache[table]&&this.cacheAt[table]&&now-this.cacheAt[table]<20000){
            return Promise.resolve(this.cache[table]);
        }
        return this.api('GET_DATA',{table:table,limit:500}).then(function(r){
            self.cache[table]=Array.isArray(r.items)?r.items:[];
            self.cacheAt[table]=Date.now();
            return self.cache[table];
        });
    },
    invalidate:function(){
        this.cache={};this.cacheAt={};
    },
    loadSystemCurrency:async function(){
        var result=await this.api('GET_SETTINGS',{});
        var currency=String(result&&result.currency||'').trim().toUpperCase();
        if(!/^[A-Z]{3}$/.test(currency))throw new Error('تعذر قراءة العملة المعتمدة من إعدادات النظام الأم');
        this.currency=currency;
        return currency;
    },
    notifyError:function(error){
        RW_UI.toast(error&&error.message?error.message:'حدث خطأ غير متوقع','error');
    },
    startRealtime:function(){
        var self=this;
        if(!this.currentUser||!this.currentUser.company_id||typeof RW_Realtime==='undefined')return;
        this.ensureLiveRefreshObserver();
        if(this.realtimeKey)RW_Realtime.stop(this.realtimeKey);
        this.realtimeKey=RW_Realtime.start({
            appId:'buyer',
            companyId:this.currentUser.company_id,
            tables:[
                'purchase_requests',
                {name:'purchase_request_details',companyColumn:false},
                'purchase_rfqs',
                {name:'purchase_rfq_details',companyColumn:false},
                {name:'purchase_rfq_suppliers',companyColumn:false},
                'purchase_quotations',
                {name:'purchase_quotation_details',companyColumn:false},
                'purchase_orders',
                {name:'purchase_order_details',companyColumn:false},
                'purchase_invoices',
                {name:'purchase_invoice_details',companyColumn:false},
                'purchase_payments',
                'purchase_payment_allocations',
                'purchase_returns',
                {name:'purchase_return_details',companyColumn:false},
                'purchase_status_history',
                'purchase_attachments',
                'purchase_document_links',
                'purchase_settings',
                'buyer_custodies',
                'buyer_custody_advances',
                'buyer_custody_expenses',
                'buyer_custody_payments',
                'buyer_custody_settlements',
                'suppliers',
                'items',
                'branches',
                {name:'stock_branches',companyColumn:false}
            ],
            debounceMs:400,
            reconcileMs:15000,
            onEvent:function(event){
                self.invalidate();
                var targets={
                    suppliers:['suppliers','purchase_invoices','purchase_invoice_details','purchase_payments','purchase_payment_allocations','purchase_returns','purchase_return_details','purchase_status_history'],
                    requests:['purchase_requests','purchase_request_details','purchase_rfqs','purchase_rfq_details','purchase_rfq_suppliers','purchase_quotations','purchase_quotation_details','purchase_status_history'],
                    orders:['suppliers','purchase_quotations','purchase_quotation_details','purchase_orders','purchase_order_details','purchase_status_history','purchase_attachments','purchase_document_links'],
                    account:['purchase_invoices','purchase_invoice_details','purchase_payments','purchase_payment_allocations','purchase_returns','purchase_return_details','purchase_status_history','purchase_attachments','purchase_document_links','purchase_settings','suppliers'],
                    custody:['buyer_custodies','buyer_custody_advances','buyer_custody_expenses','buyer_custody_payments','buyer_custody_settlements'],
                    quotations:['purchase_quotations','purchase_quotation_details','purchase_status_history'],
                    invoices:['purchase_invoices','purchase_invoice_details','purchase_status_history','purchase_attachments','purchase_document_links','purchase_payments','purchase_payment_allocations']
                };
                var relevant=self.currentTab==='today'||
                    (targets[self.currentTab]||[]).indexOf(event.table)!==-1;
                if(!relevant)return;
                if(typeof Swal!=='undefined'&&Swal.isVisible()){
                    self.needsLiveRefresh=true;
                    return;
                }
                self.needsLiveRefresh=false;
                self.renderCurrent();
            },
            onReconcile:function(){
                self.invalidate();
                if(typeof Swal!=='undefined'&&Swal.isVisible()){
                    self.needsLiveRefresh=true;
                    return;
                }
                self.needsLiveRefresh=false;
                self.renderCurrent();
            },
            onStatus:function(status){
                var el=RW_UI.byId('buyerRealtimeStatus');
                var connected=status.status==='SUBSCRIBED';
                if(el){
                    el.textContent=connected?'قناة المزامنة متصلة':'المزامنة عبر إعادة التحقق';
                    el.className='text-[10px] font-bold rounded-lg px-2 py-1 '+(connected?'bg-emerald-500/25 text-white':'bg-amber-400/25 text-white');
                }
                if(!connected)console.warn('[Buyer] Realtime status:',status.status,status.error||'');
                else console.log('[Buyer] Realtime connected.');
            }
        });
        if(!this.realtimeKey)console.error('[Buyer] Realtime refused: verified company scope unavailable.');
    },
    stopRealtime:function(){
        if(this.realtimeKey&&typeof RW_Realtime!=='undefined'){RW_Realtime.stop(this.realtimeKey);this.realtimeKey=null;}
        if(this.liveRefreshObserver){this.liveRefreshObserver.disconnect();this.liveRefreshObserver=null;}
        this.needsLiveRefresh=false;
    },
    doLogout:function(){
        this.stopRealtime();
        RW_Auth.doLogout(function(){
            RW_UI.byId('mainApp').classList.add('hidden');
            RW_UI.byId('loginScreen').classList.remove('hidden');
        });
    },
    switchTab:function(tab){
        this.currentTab=tab;this.search='';
        ['today','suppliers','requests','quotations','orders','invoices','custody','vehicle','account'].forEach(function(name){
            var b=RW_UI.byId('tab-'+name);
            if(!b)return;
            b.classList.remove('bg-purple-600','text-white');b.classList.add('text-gray-500');
        });
        var active=RW_UI.byId('tab-'+tab);
        if(active){active.classList.add('bg-purple-600','text-white');active.classList.remove('text-gray-500');}
        this.renderCurrent();
    },
    renderCurrent:function(){
        var self=this;
        var map={today:'renderToday',suppliers:'renderSuppliers',requests:'renderRequests',quotations:'renderQuotations',orders:'renderOrders',invoices:'renderInvoices',custody:'renderCustody',vehicle:'renderVehicleBalance',account:'renderAccount'};
        var fn=this[map[this.currentTab]];
        if(typeof fn!=='function')return;
        Promise.resolve().then(function(){return fn.call(self);}).catch(function(error){self.showPageError(error);});
    },
    showPageError:function(error){
        var message=error&&error.message?error.message:'تعذر تحميل بيانات الصفحة';
        RW_UI.safeHTML(RW_UI.byId('mainContent'),
            '<div class="card border border-red-200"><div class="flex items-center gap-2 text-red-700 font-black"><i class="fa-solid fa-triangle-exclamation"></i> تعذر تحميل بيانات المشتريات</div>'+
            '<p class="text-sm text-slate-600 mt-2">'+buyerEsc(message)+'</p>'+
            '<button type="button" onclick="App.retryCurrent()" class="mt-4 px-4 py-2 rounded-xl bg-purple-700 text-white font-bold">إعادة المحاولة</button></div>');
    },
    retryCurrent:function(){this.invalidate();this.renderCurrent();},
    ensureLiveRefreshObserver:function(){
        if(this.liveRefreshObserver||typeof MutationObserver==='undefined'||!document.body)return;
        var self=this;
        this.liveRefreshObserver=new MutationObserver(function(){
            if(!self.needsLiveRefresh||(typeof Swal!=='undefined'&&Swal.isVisible()))return;
            self.needsLiveRefresh=false;
            self.invalidate();
            self.renderCurrent();
        });
        this.liveRefreshObserver.observe(document.body,{childList:true,subtree:true});
    },
    pageLoading:function(title){
        RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-12 text-purple-700"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-3 font-bold">'+buyerEsc(title||'جاري التحميل')+'</p></div>');
    },
    card:function(title,value,sub,action,icon){
        return '<button type="button" onclick="'+buyerEsc(action)+'" class="card text-right w-full border border-slate-100 hover:border-purple-200 hover:shadow-md transition"><div class="flex justify-between items-start"><div><p class="text-xs text-slate-500 font-bold">'+buyerEsc(title)+'</p><div class="text-2xl font-black text-slate-800 mt-2">'+buyerEsc(value)+'</div><p class="text-[11px] text-slate-400 mt-2">'+buyerEsc(sub||'')+'</p></div><span class="w-10 h-10 rounded-xl bg-purple-50 text-purple-700 flex items-center justify-center"><i class="fa-solid '+buyerEsc(icon||'fa-chart-line')+'"></i></span></div></button>';
    },
    renderToday:async function(){
        this.pageLoading('تحميل لوحة المشتريات');
        var results=await Promise.all([
            this.api('GET_SUMMARY',{}),
            this.data('purchase_requests'),
            this.data('purchase_orders'),
            this.data('purchase_invoices'),
            this.data('suppliers'),
            this.data('items'),
            this.data('stock_branches'),
            this.data('branches'),
            this.data('purchase_settings'),
            this.api('GET_SETTINGS',{}),
            this.api('GET_CUSTODY',{})
        ]);
        this.currency=(results[9]&&results[9].currency)||'EGP';
        var summary=results[0]||{},requests=results[1],orders=results[2],invoices=results[3],suppliers=results[4],items=results[5],stock=results[6],branches=results[7],custodyData=results[10]||{};
        var itemIndex={},critical=0;
        items.forEach(function(it){itemIndex[it.id]=it;});
        stock.forEach(function(st){
            var it=itemIndex[st.item_id];
            if(it&&Number(it.reorder_point||0)>0&&Number(st.available_qty==null?st.qty:st.available_qty)<=Number(it.reorder_point))critical++;
        });
        var openOrders=orders.filter(function(o){return ['Received','Cancelled','Closed'].indexOf(o.status)===-1;}).length;
        var today=buyerLocalDate();
        var overdueOrders=orders.filter(function(o){return ['Received','Cancelled','Closed'].indexOf(o.status)===-1&&o.expected_delivery_date&&String(o.expected_delivery_date).slice(0,10)<today;});
        var ordersWithoutDueDate=orders.filter(function(o){return ['Received','Cancelled','Closed'].indexOf(o.status)===-1&&!o.expected_delivery_date;}).length;
        var pending=requests.filter(function(r){return ['PendingApproval','Submitted'].indexOf(r.status)!==-1;}).length;
        var outstanding=invoices.filter(function(i){return ['Posted','PartiallyPaid','Approved'].indexOf(i.status)!==-1;}).reduce(function(sum,i){return sum+Math.max(0,Number(i.total_amount||0)-Number(i.paid_amount||0));},0);
        var myCustodies=(custodyData.custodies||[]).filter(function(c){return c.employee_id===(this.currentUser||{}).id&&c.status!=='Settled'&&c.status!=='Closed';},this);
        var myCustodyIds=myCustodies.map(function(c){return c.id;});
        var acknowledgedCustody=(custodyData.advances||[]).filter(function(a){return myCustodyIds.indexOf(a.custody_id)!==-1&&!!a.acknowledged_at;}).reduce(function(n,a){return n+Number(a.amount||0);},0);
        var committedCustody=(custodyData.expenses||[]).filter(function(e){return myCustodyIds.indexOf(e.custody_id)!==-1&&(e.status==='Submitted'||e.status==='Approved');}).reduce(function(n,e){return n+Number(e.amount||0);},0);
        var custodyAvailable=Math.max(0,acknowledgedCustody-committedCustody);
        var html='<div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h2 class="text-xl font-black">مركز عمل المشتريات</h2><p class="text-xs text-slate-500 mt-1">ملخص من عقود المشتريات الحالية في قاعدة البيانات</p></div><button onclick="App.createPurchaseInvoice()" class="px-4 py-3 rounded-xl bg-purple-700 text-white font-black text-sm"><i class="fa-solid fa-bolt ml-2"></i>شراء عاجل / فاتورة مسودة</button></div>';
        html+='<div class="grid grid-cols-2 xl:grid-cols-4 gap-3">';
        html+=this.card('نواقص حرجة',critical,'حسب reorder_point والمخزون المتاح',"App.openCriticalShortages()",'fa-triangle-exclamation');
        html+=this.card('أوامر متأخرة',overdueOrders.length,'وفق موعد التسليم المتوقع المسجل في PO',"App.switchTab('orders')",'fa-truck-ramp-box');
        html+=this.card('زيارات اليوم','غير متاح','سجل الزيارات والتقييمات غير موجود في قاعدة البيانات الحالية',"App.switchTab('suppliers')",'fa-location-dot');
        html+=this.card('رصيد عهدتي',buyerMoney(custodyAvailable,this.currency),'النقد المؤكد استلامه ناقص المصروفات المقدمة والمعتمدة',"App.switchTab('custody')",'fa-wallet');
        html+='</div>';
        html+='<div class="grid md:grid-cols-2 gap-3 mt-4">';
        html+='<div class="card"><h3 class="font-black mb-3">تنبيهات يجب عدم إخفائها</h3><div class="space-y-3 text-sm">';

    openCriticalShortages:async function(){

            var orders=loaded[1],receipts=loaded[2].filter(function(r){return ['مكتمل','Completed'].indexOf(r.status)!==-1;}),suppliers=loaded[3];
            if(!invoices.length||!receipts.length)throw new Error('لا توجد فاتورة شراء مرتبطة بأمر PO وإذن استلام مخزني مكتمل. أنشئ PO، ثم سجّل الاستلام بالمخزن، ثم أنشئ فاتورة مرتبطة بالـ PO.');
            var html='<div class="text-right space-y-3"><label class="block text-xs font-bold">فاتورة الشراء المسجلة في النظام<select id="bce-invoice" class="swal2-select w-full"><option value="">اختر فاتورة مرتبطة بأمر شراء</option>'+invoices.map(function(i){return '<option value="'+buyerEsc(i.id)+'">'+buyerEsc(i.invoice_code)+' · '+buyerEsc(i.supplier_invoice_no||'بدون رقم مورد')+' · '+buyerMoney(i.total_amount,i.currency)+'</option>';}).join('')+'</select></label>'+
                '<label class="block text-xs font-bold">إذن استلام المخزن<select id="bce-receipt" class="swal2-select w-full"><option value="">اختر إذن الاستلام المرتبط بأمر الشراء</option></select></label>'+
                '<div class="grid grid-cols-2 gap-2"><label class="text-xs font-bold">المورد<input id="bce-supplier-name" class="swal2-input" readonly></label><label class="text-xs font-bold">رقم فاتورة المورد<input id="bce-invoice-no" class="swal2-input" readonly></label></div>'+
                '<div class="grid grid-cols-2 gap-2"><label class="text-xs font-bold">قيمة الفاتورة ('+buyerEsc(custody.currency)+')<input id="bce-amount" type="number" class="swal2-input" readonly></label><label class="text-xs font-bold">تاريخ المصروف<input id="bce-date" type="date" class="swal2-input" value="'+buyerLocalDate()+'"></label></div>'+
                '<label class="block text-xs font-bold">وصف المصروف / المشتريات<input id="bce-description" class="swal2-input" placeholder="الغرض من الشراء"></label>'+
                '<label class="block text-xs font-bold">صورة فاتورة المورد (PDF / صورة)<input id="bce-file" type="file" accept="application/pdf,image/*" class="swal2-file"></label>'+
                '<label class="block text-xs font-bold">صورة إذن استلام المخزن (PDF / صورة)<input id="bce-receipt-file" type="file" accept="application/pdf,image/*" class="swal2-file"></label>'+
                '<p class="text-xs text-amber-700">لن يُقبل المستند للتسوية إلا إذا ارتبطت فاتورة المورد بأمر الشراء نفسه، وكان إذن الاستلام مكتملًا ويغطي أصناف الفاتورة وكمياتها. الحد الأقصى لكل ملف 10 ميجابايت.</p></div>';
            var self=this;
            var result=await Swal.fire({title:'تقديم فاتورة وإذن استلام للتسوية',html:html,width:750,showCancelButton:true,confirmButtonText:'إرسال للمالية',cancelButtonText:'إلغاء',didOpen:function(){
                RW_UI.byId('bce-invoice').addEventListener('change',function(){
                    var inv=invoices.find(function(x){return x.id===this.value;},this),supplier=inv&&suppliers.find(function(x){return x.id===inv.supplier_id;});
                    RW_UI.byId('bce-supplier-name').value=supplier?supplier.name:'';
                    RW_UI.byId('bce-invoice-no').value=inv?inv.supplier_invoice_no||'':'';
                    RW_UI.byId('bce-amount').value=inv?Number(inv.total_amount||0).toFixed(2):'';
                    var po=inv&&orders.find(function(x){return x.id===inv.purchase_order_id;});
                    var options=receipts.filter(function(r){return po&&r.po_number===po.po_code;});
                    RW_UI.byId('bce-receipt').innerHTML='<option value="">اختر إذن الاستلام</option>'+options.map(function(r){return '<option value="'+buyerEsc(r.operation_id)+'">'+buyerEsc(r.po_number)+' · '+buyerDate(r.date)+' · '+buyerEsc(r.responsible||'')+'</option>';}).join('');
                });
            },preConfirm:async function(){
                var invoiceId=RW_UI.byId('bce-invoice').value,receiptId=RW_UI.byId('bce-receipt').value;
                var invoice=invoices.find(function(x){return x.id===invoiceId;}),supplier=invoice&&suppliers.find(function(x){return x.id===invoice.supplier_id;});
                var invoiceFile=RW_UI.byId('bce-file').files[0],receiptFile=RW_UI.byId('bce-receipt-file').files[0],amount=Number(RW_UI.byId('bce-amount').value||0),description=RW_UI.byId('bce-description').value.trim();
                if(!invoice||!receiptId||!invoiceFile||!receiptFile||!description||amount<=0){Swal.showValidationMessage('اختر الفاتورة وإذن الاستلام وأرفق الملفين وأدخل وصف المصروف');return false;}
                var files=[invoiceFile,receiptFile];for(var i=0;i<files.length;i++){if(files[i].size>10*1024*1024||!(files[i].type==='application/pdf'||files[i].type.indexOf('image/')===0)){Swal.showValidationMessage('يسمح بملفات PDF أو صور لا تتجاوز 10 ميجابايت لكل ملف');return false;}}
                var prefix=self.currentUser.company_id+'/'+self.currentUser.id+'/buyer-custody/'+custodyId+'/';
                var stamp=Date.now(),safe=function(n){return n.replace(/[^A-Za-z0-9._-]/g,'_').slice(-80)||'document';};
                var invoicePath=prefix+stamp+'_invoice_'+safe(invoiceFile.name),receiptPath=prefix+stamp+'_receipt_'+safe(receiptFile.name);
                var up1=await supabase.storage.from('employee-documents').upload(invoicePath,invoiceFile,{cacheControl:'3600',upsert:false,contentType:invoiceFile.type});
                if(up1.error){Swal.showValidationMessage('تعذر رفع فاتورة المورد: '+up1.error.message);return false;}
                var up2=await supabase.storage.from('employee-documents').upload(receiptPath,receiptFile,{cacheControl:'3600',upsert:false,contentType:receiptFile.type});
                if(up2.error){await supabase.storage.from('employee-documents').remove([invoicePath]);Swal.showValidationMessage('تعذر رفع إذن الاستلام: '+up2.error.message);return false;}
                try{
                    return await self.api('SUBMIT_CUSTODY_EXPENSE',{custody_id:custodyId,expense_date:RW_UI.byId('bce-date').value||buyerLocalDate(),
                        supplier_id:invoice.supplier_id,supplier_name:supplier?supplier.name:null,invoice_number:invoice.supplier_invoice_no||null,
                        purchase_invoice_id:invoice.id,receiving_operation_id:receiptId,description:description,amount:amount,currency:custody.currency,
                        document_name:invoiceFile.name,document_path:invoicePath,mime_type:invoiceFile.type,
                        receipt_document_name:receiptFile.name,receipt_document_path:receiptPath,receipt_mime_type:receiptFile.type});
                }catch(e){await supabase.storage.from('employee-documents').remove([invoicePath,receiptPath]);Swal.showValidationMessage(e.message);return false;}
            }});
            if(result.isConfirmed){this.invalidate();await this.renderCustody();RW_UI.toast('تم إرسال فاتورة المورد وإذن الاستلام للمالية','success');}
        }catch(e){this.notifyError(e);}
    },
    viewCustodyDocument:async function(path){
        var preview=window.open('about:blank','_blank');
        try{
            var result=await supabase.storage.from('employee-documents').createSignedUrl(path,300);
            if(result.error)throw result.error;
            if(preview){preview.opener=null;preview.location.href=result.data.signedUrl;}
            else{window.location.assign(result.data.signedUrl);}
        }catch(e){
            if(preview&&!preview.closed)preview.close();
            this.notifyError(e);
        }
    },
    reviewCustodyExpense:async function(expenseId,decision){
        var decisionText=decision==='Approved'?'اعتماد المستند':'رفض المستند';
        var result=await Swal.fire({title:decisionText,input:'textarea',inputLabel:'ملاحظة المراجعة',inputPlaceholder:'سبب الاعتماد أو الرفض (اختياري)',showCancelButton:true,confirmButtonText:'تأكيد',cancelButtonText:'إلغاء'});
        if(!result.isConfirmed)return;
        try{await this.api('REVIEW_CUSTODY_EXPENSE',{expense_id:expenseId,decision:decision,review_note:result.value||null});this.invalidate();await this.renderCustody();RW_UI.toast('تم تحديث مراجعة المستند','success');}
        catch(e){this.notifyError(e);}
    },
    settleCustody:async function(custodyId){
        var custody=(this.custodySnapshot&&this.custodySnapshot.custodies||[]).find(function(c){return c.id===custodyId;});
        var lines=(this.custodySnapshot&&this.custodySnapshot.expenses||[]).filter(function(e){return e.custody_id===custodyId&&e.status==='Approved';});
        var approved=lines.reduce(function(n,e){return n+Number(e.amount||0);},0);
        if(!custody)return;
        var maxReturn=Math.max(0,Number(custody.issued_amount||0)-approved),treasuries=[];
        if(maxReturn>0){treasuries=(await this.data('treasury')).filter(function(t){return t.is_active!==false;});if(!treasuries.length){this.notifyError(new Error('لا توجد خزائن نشطة لاستلام النقد المرتجع'));return;}}
        var treasuryOptions=treasuries.map(function(t){return '<option value="'+buyerEsc(t.id)+'">'+buyerEsc(t.account_name)+' · رصيد '+buyerMoney(t.current_balance,custody.currency)+'</option>';}).join('');
        var html='<div class="text-right text-sm mb-3">المبلغ المسلّم: <b>'+buyerMoney(custody.issued_amount,custody.currency)+'</b><br>المصروفات المعتمدة والمسدد بها الموردون: <b>'+buyerMoney(approved,custody.currency)+'</b><br>النقد المطلوب استلامه لإغلاق العهدة: <b>'+buyerMoney(maxReturn,custody.currency)+'</b></div>'+
            (maxReturn>0?'<label class="block text-xs font-bold text-right">الخزينة المستلمة للنقد المرتجع<select id="bcs-treasury" class="swal2-select w-full"><option value="">اختر الخزينة</option>'+treasuryOptions+'</select></label>':'')+
            '<label class="block text-xs font-bold text-right">النقد المرتجع فعليًا<input id="bcs-return" type="number" min="0" max="'+maxReturn+'" step="0.01" class="swal2-input" value="'+maxReturn.toFixed(2)+'" readonly></label>'+
            '<label class="block text-xs font-bold text-right">مرجع استلام النقد المرتجع<input id="bcs-reference" class="swal2-input"></label><label class="block text-xs font-bold text-right">ملاحظات<textarea id="bcs-notes" class="swal2-textarea"></textarea></label>';
        var result=await Swal.fire({title:'تسوية العهدة '+buyerEsc(custody.custody_code),html:html,width:650,showCancelButton:true,confirmButtonText:'تسجيل التسوية',cancelButtonText:'إلغاء',preConfirm:function(){
            var returned=Number(RW_UI.byId('bcs-return').value||0),treasury=maxReturn>0?RW_UI.byId('bcs-treasury').value:null;
            if(Math.abs(returned-maxReturn)>0.005){Swal.showValidationMessage('قيمة النقد المرتجع يجب أن تطابق الرصيد النقدي غير المصروف');return false;}
            if(maxReturn>0&&!treasury){Swal.showValidationMessage('اختر الخزينة التي استلمت النقد المرتجع');return false;}
            return {cash_returned:returned,treasury_id:treasury,finance_reference:RW_UI.byId('bcs-reference').value.trim()||null,notes:RW_UI.byId('bcs-notes').value.trim()||null};
        }});
        if(!result.isConfirmed)return;
        try{
            var settled=await this.api('SETTLE_CUSTODY',{custody_id:custodyId,treasury_id:result.value.treasury_id,cash_returned:result.value.cash_returned,finance_reference:result.value.finance_reference,notes:result.value.notes});
            this.invalidate();await this.renderCustody();
            RW_UI.toast('تمت التسوية · مستحق الموظف: '+buyerMoney(settled.amount_due_employee,custody.currency)+' · المتبقي للشركة: '+buyerMoney(settled.balance_due_company,custody.currency),'success');
        }catch(e){this.notifyError(e);}
    },
    renderAccount:async function(){
        await this.loadSystemCurrency();
        this.pageLoading('تحميل ملف المشتري');
        var settings=await this.data('purchase_settings');
        var p=this.currentUser||{},perms=Array.isArray(p.permissions)?p.permissions:[];
        var html='<div class="mb-4"><h2 class="text-xl font-black">حسابي</h2><p class="text-xs text-slate-500">الملف والصلاحيات والتقارير وإعدادات دورة المشتريات</p></div><div class="card mb-3"><h3 class="font-black mb-2">'+buyerEsc(p.name||'المستخدم')+'</h3><p class="text-sm">'+buyerEsc(p.email||'')+'</p><p class="text-xs text-slate-500 mt-1">'+buyerEsc(p.role||'')+'</p><p class="text-xs text-slate-500 mt-2">الصلاحيات الفعالة: '+buyerEsc(perms.join('، ')||'—')+'</p></div><div class="grid md:grid-cols-2 gap-3"><button onclick="App.showReports()" class="card text-right font-bold">📊 تقارير المشتريات</button><button onclick="App.purchaseSettings()" class="card text-right font-bold">⚙️ إعدادات دورة المشتريات</button><button onclick="App.doLogout()" class="card text-right font-bold text-red-600">تسجيل الخروج</button></div>';
        html+='<p class="text-xs text-slate-500 mt-3">تُعرض تسويات العهدة وسندات الخزينة والمدفوعات للموردين في دفتر عهدتي حسب الصلاحيات.</p>';
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
    },
    showReports:async function(){
        try{
            var r=await this.api('GET_REPORTS',{as_of_date:new Date().toISOString().slice(0,10)});
            var html='<div class="text-right space-y-2"><p>طلبات مفتوحة: <b>'+buyerEsc(r.requests&&r.requests.open||0)+'</b></p><p>طلبات اعتماد: <b>'+buyerEsc(r.requests&&r.requests.pending_approval||0)+'</b></p><p>أوامر مفتوحة: <b>'+buyerEsc(r.orders&&r.orders.open||0)+'</b></p><p>قيمة الأوامر: <b>'+buyerMoney(r.orders&&r.orders.value||0,this.currency)+'</b></p><p>فواتير مستحقة: <b>'+buyerMoney(r.invoices&&r.invoices.outstanding||0,this.currency)+'</b></p><p>قيمة مردودات مرحلة: <b>'+buyerMoney(r.returns&&r.returns.posted_value||0,this.currency)+'</b></p></div>';
            await Swal.fire({title:'تقارير المشتريات',html:html,width:650,showCloseButton:true,showConfirmButton:false});
        }catch(e){this.notifyError(e);}
    },
    purchaseSettings:async function(){
        try{
            var rows=await this.data('purchase_settings'),s=rows[0]||{};
            var html='<div class="text-right space-y-3">'+
                '<label class="flex justify-between items-center gap-2">اشتراط اعتماد طلب الشراء<input id="ps-approval" type="checkbox" '+(s.require_request_approval?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">اشتراط الاستلام قبل الفاتورة<input id="ps-receive" type="checkbox" '+(s.require_receiving_before_invoice?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">اشتراط الفاتورة قبل السداد<input id="ps-invoice" type="checkbox" '+(s.require_invoice_before_payment?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">ترحيل المخزون عند ترحيل الفاتورة<input id="ps-stock" type="checkbox" '+(s.require_inventory_on_invoice?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">اشتراط إذن مخزني عند المرتجع<input id="ps-return" type="checkbox" '+(s.require_inventory_voucher_on_return?'checked':'')+'></label>'+
                '<div class="p-3 rounded-xl bg-slate-50 text-sm">عملة النظام المعتمدة: <b>'+buyerEsc(this.currency||'EGP')+'</b><p class="text-xs text-slate-500 mt-1">تُقرأ من تبويب إعدادات النظام في النظام الأم، ولا تُغيّر من إعدادات المشتريات.</p></div></div>';
            var self=this;
            var result=await Swal.fire({title:'إعدادات المشتريات',html:html,width:650,showCancelButton:true,confirmButtonText:'حفظ الإعدادات',cancelButtonText:'إلغاء',preConfirm:async function(){
                try{return await self.api('SAVE_SETTINGS',{require_request_approval:RW_UI.byId('ps-approval').checked,require_receiving_before_invoice:RW_UI.byId('ps-receive').checked,require_invoice_before_payment:RW_UI.byId('ps-invoice').checked,require_inventory_on_invoice:RW_UI.byId('ps-stock').checked,require_inventory_voucher_on_return:RW_UI.byId('ps-return').checked});}
                catch(e){Swal.showValidationMessage(e.message);return false;}
            }});
            if(result.isConfirmed){this.invalidate();RW_UI.toast('تم حفظ إعدادات المشتريات','success');}
        }catch(e){this.notifyError(e);}
    }
};
RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded',function(){App.init();});
</script>
