<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مسؤول المشتريات | الروائع ERP</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#9333ea">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <!-- Supabase client is provided by the shared core.js. -->
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f1f5f9}
        .auth-container{background:linear-gradient(135deg,#4c1d95 0%,#7e22ce 40%,#9333ea 100%)}
        .input-field:focus{border-color:#9333ea;box-shadow:0 0 0 3px rgba(147,51,234,0.1)}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
        .btn-primary{background:#9333ea;color:#fff;padding:0.75rem 1.5rem;border-radius:12px;font-weight:700;border:none;cursor:pointer;width:100%}
        .btn-primary:active{background:#7e22ce}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md">
        <div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-purple-600 to-purple-800 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4"><i class="fa-solid fa-cart-shopping text-white text-3xl"></i></div><h1 class="font-black text-2xl text-gray-800">الروائع</h1><p class="text-xs text-gray-400">مسؤول المشتريات</p></div>
        <h2 class="text-lg font-bold text-gray-700 text-center mb-4">تسجيل الدخول</h2>
        <div class="space-y-3"><div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-purple-600 outline-none font-bold text-sm"></div><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-purple-600 outline-none font-bold text-sm pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div>
        <button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-purple-600 to-purple-700 text-white py-3.5 rounded-xl font-black text-sm shadow-lg mt-4">تسجيل الدخول</button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<div id="mainApp" class="hidden flex flex-col h-full">
    <header class="bg-purple-700 text-white p-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0">
        <span class="font-black text-sm">📦 مسؤول المشتريات</span>
        <span id="buyerRealtimeStatus" class="text-[10px] font-bold rounded-lg px-2 py-1 bg-white/10">جارٍ الاتصال المباشر...</span>
        <div class="flex items-center gap-2"><span class="text-xs font-bold" id="headerUserName"></span><button onclick="App.doLogout()" class="bg-white/10 w-8 h-8 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div>
    </header>
    <div class="grid grid-cols-3 md:grid-cols-6 gap-1 p-2 bg-white border-b flex-shrink-0">
        <button onclick="App.switchTab('today')" class="px-2 py-3 rounded-xl font-bold text-xs bg-purple-600 text-white" id="tab-today">🏠 اليوم</button>
        <button onclick="App.switchTab('suppliers')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-suppliers">🏭 الموردون</button>
        <button onclick="App.switchTab('requests')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-requests">📥 طلبات PR</button>
        <button onclick="App.switchTab('orders')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-orders">📋 أوامر PO</button>
        <button onclick="App.switchTab('custody')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-custody">💳 عهدتي</button>
        <button onclick="App.switchTab('account')" class="px-2 py-3 rounded-xl font-bold text-xs text-gray-500" id="tab-account">👤 حسابي</button>
    </div>
    <main id="mainContent" class="flex-1 overflow-y-auto p-4"></main>
</div>

<script>
var db = new Dexie('RW_Buyer');
db.version(1).stores({ orders: 'po_code', suppliers: 'supplier_code', items: 'item_code', cart: '++id', meta: 'key' });

function buyerEsc(value){
    return String(value == null ? '' : value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function buyerMoney(value,currency){
    return RW_UI.formatCurrency(Number(value||0),currency||'SAR');
}
function buyerDate(value){
    if(!value)return '—';
    try{return new Date(value).toLocaleDateString('ar-EG');}catch(e){return buyerEsc(value);}
}
function buyerStatus(value){
    var map={Draft:'مسودة',PendingApproval:'بانتظار الاعتماد',Submitted:'مرسل للاعتماد',Approved:'معتمد',Rejected:'مرفوض',Cancelled:'ملغي',Sent:'مرسل للمورد',PartiallyReceived:'مستلم جزئياً','Partially Received':'مستلم جزئياً',Received:'مستلم',Closed:'مغلق',Posted:'مرحل',Paid:'مدفوع',PartiallyPaid:'مدفوع جزئياً',Accepted:'مقبول',Submitted:'مرسل للاعتماد'};
    return map[value]||buyerEsc(value||'غير محدد');
}

var App = {
    currentUser:null,
    currentTab:'today',
    realtimeKey:null,
    needsLiveRefresh:false,
    liveRefreshObserver:null,
    custodySnapshot:null,
    search:'',
    cache:{},
    cacheAt:{},
    quickCart:[],
    currency:'SAR',

    togglePass:function(){
        var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');
        if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}
        else{p.type='password';i.className='fa-solid fa-eye';}
    },
    doLogin:function(){
        var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim(),s=this;
        if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return;}
        RW_UI.byId('loginMsg').classList.add('hidden');
        RW_UI.showLoader('جاري تسجيل الدخول...');
        RW_Auth.doLogin(e,p,function(user,err){
            RW_UI.hideLoader();
            if(err){RW_UI.byId('loginMsg').innerText=err;RW_UI.byId('loginMsg').classList.remove('hidden');}
            else{s.currentUser=user;s.enterApp();}
        });
    },
    init:function(){
        var s=this;
        RW_Auth.init(function(user,err){
            if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة: '+(err||''));return;}
            var perms=Array.isArray(user.permissions)?user.permissions:[];
            if(!(user.isOwner||perms.indexOf('purchases')!==-1||perms.indexOf('finance')!==-1||perms.indexOf('finance_manager')!==-1)){
                RW_UI.showError('غير مصرح: يلزم صلاحية المشتريات أو المالية');RW_Auth.doLogout();return;
            }
            s.currentUser=user;s.enterApp();
        });
    },
    enterApp:function(){
        RW_UI.byId('loginScreen').classList.add('hidden');
        RW_UI.byId('mainApp').classList.remove('hidden');
        RW_UI.safeText(RW_UI.byId('headerUserName'),this.currentUser.name||this.currentUser.email||'');
        this.switchTab('today');
        this.startRealtime();
    },
    api:function(operation,payload){
        return new Promise(function(resolve,reject){
            RW_API.call('save-purchase-order',{operation:operation,payload:payload||{}},function(json,error){
                if(error||!json){reject(new Error(error||'تعذر الاتصال بمحرك المشتريات'));return;}
                if(json.success===false){reject(new Error(json.msg||'تعذر تنفيذ العملية'));return;}
                resolve(json);
            });
        });
    },
    data:function(table,force){
        var self=this,now=Date.now();
        if(!force&&this.cache[table]&&this.cacheAt[table]&&now-this.cacheAt[table]<20000){
            return Promise.resolve(this.cache[table]);
        }
        return this.api('GET_DATA',{table:table,limit:500}).then(function(r){
            self.cache[table]=Array.isArray(r.items)?r.items:[];
            self.cacheAt[table]=Date.now();
            return self.cache[table];
        });
    },
    invalidate:function(){
        this.cache={};this.cacheAt={};
    },
    notifyError:function(error){
        RW_UI.toast(error&&error.message?error.message:'حدث خطأ غير متوقع','error');
    },
    startRealtime:function(){
        var self=this;
        if(!this.currentUser||!this.currentUser.company_id||typeof RW_Realtime==='undefined')return;
        this.ensureLiveRefreshObserver();
        if(this.realtimeKey)RW_Realtime.stop(this.realtimeKey);
        this.realtimeKey=RW_Realtime.start({
            appId:'buyer',
            companyId:this.currentUser.company_id,
            tables:[
                'purchase_requests',
                {name:'purchase_request_details',companyColumn:false},
                'purchase_rfqs',
                {name:'purchase_rfq_details',companyColumn:false},
                {name:'purchase_rfq_suppliers',companyColumn:false},
                'purchase_quotations',
                {name:'purchase_quotation_details',companyColumn:false},
                'purchase_orders',
                {name:'purchase_order_details',companyColumn:false},
                'purchase_invoices',
                {name:'purchase_invoice_details',companyColumn:false},
                'purchase_payments',
                'purchase_payment_allocations',
                'purchase_returns',
                {name:'purchase_return_details',companyColumn:false},
                'purchase_status_history',
                'purchase_attachments',
                'purchase_document_links',
                'purchase_settings',
                'buyer_custodies',
                'buyer_custody_expenses',
                'buyer_custody_settlements',
                'suppliers',
                'items',
                'branches',
                {name:'stock_branches',companyColumn:false}
            ],
            debounceMs:400,
            reconcileMs:15000,
            onEvent:function(event){
                self.invalidate();
                var targets={
                    suppliers:['suppliers','purchase_invoices','purchase_invoice_details','purchase_payments','purchase_payment_allocations','purchase_returns','purchase_return_details'],
                    requests:['purchase_requests','purchase_request_details','purchase_rfqs','purchase_rfq_details','purchase_rfq_suppliers','purchase_quotations','purchase_quotation_details','purchase_status_history'],
                    orders:['purchase_quotations','purchase_quotation_details','purchase_orders','purchase_order_details','purchase_status_history','purchase_attachments','purchase_document_links'],
                    account:['purchase_invoices','purchase_invoice_details','purchase_payments','purchase_payment_allocations','purchase_returns','purchase_return_details','suppliers'],
                    custody:['buyer_custodies','buyer_custody_expenses','buyer_custody_settlements']
                };
                var relevant=self.currentTab==='today'||
                    (targets[self.currentTab]||[]).indexOf(event.table)!==-1;
                if(!relevant)return;
                if(typeof Swal!=='undefined'&&Swal.isVisible()){
                    self.needsLiveRefresh=true;
                    return;
                }
                self.needsLiveRefresh=false;
                self.renderCurrent();
            },
            onReconcile:function(){
                self.invalidate();
                if(typeof Swal!=='undefined'&&Swal.isVisible()){
                    self.needsLiveRefresh=true;
                    return;
                }
                self.needsLiveRefresh=false;
                self.renderCurrent();
            },
            onStatus:function(status){
                var el=RW_UI.byId('buyerRealtimeStatus');
                var connected=status.status==='SUBSCRIBED';
                if(el){
                    el.textContent=connected?'قناة المزامنة متصلة':'المزامنة عبر إعادة التحقق';
                    el.className='text-[10px] font-bold rounded-lg px-2 py-1 '+(connected?'bg-emerald-500/25 text-white':'bg-amber-400/25 text-white');
                }
                if(!connected)console.warn('[Buyer] Realtime status:',status.status,status.error||'');
                else console.log('[Buyer] Realtime connected.');
            }
        });
        if(!this.realtimeKey)console.error('[Buyer] Realtime refused: verified company scope unavailable.');
    },
    stopRealtime:function(){
        if(this.realtimeKey&&typeof RW_Realtime!=='undefined'){RW_Realtime.stop(this.realtimeKey);this.realtimeKey=null;}
        if(this.liveRefreshObserver){this.liveRefreshObserver.disconnect();this.liveRefreshObserver=null;}
        this.needsLiveRefresh=false;
    },
    doLogout:function(){
        this.stopRealtime();
        RW_Auth.doLogout(function(){
            RW_UI.byId('mainApp').classList.add('hidden');
            RW_UI.byId('loginScreen').classList.remove('hidden');
        });
    },
    switchTab:function(tab){
        this.currentTab=tab;this.search='';
        ['today','suppliers','requests','orders','custody','account'].forEach(function(name){
            var b=RW_UI.byId('tab-'+name);
            if(!b)return;
            b.classList.remove('bg-purple-600','text-white');b.classList.add('text-gray-500');
        });
        var active=RW_UI.byId('tab-'+tab);
        if(active){active.classList.add('bg-purple-600','text-white');active.classList.remove('text-gray-500');}
        this.renderCurrent();
    },
    renderCurrent:function(){
        var self=this;
        var map={today:'renderToday',suppliers:'renderSuppliers',requests:'renderRequests',orders:'renderOrders',custody:'renderCustody',account:'renderAccount'};
        var fn=this[map[this.currentTab]];
        if(typeof fn!=='function')return;
        Promise.resolve().then(function(){return fn.call(self);}).catch(function(error){self.showPageError(error);});
    },
    showPageError:function(error){
        var message=error&&error.message?error.message:'تعذر تحميل بيانات الصفحة';
        RW_UI.safeHTML(RW_UI.byId('mainContent'),
            '<div class="card border border-red-200"><div class="flex items-center gap-2 text-red-700 font-black"><i class="fa-solid fa-triangle-exclamation"></i> تعذر تحميل بيانات المشتريات</div>'+
            '<p class="text-sm text-slate-600 mt-2">'+buyerEsc(message)+'</p>'+
            '<button type="button" onclick="App.retryCurrent()" class="mt-4 px-4 py-2 rounded-xl bg-purple-700 text-white font-bold">إعادة المحاولة</button></div>');
    },
    retryCurrent:function(){this.invalidate();this.renderCurrent();},
    ensureLiveRefreshObserver:function(){
        if(this.liveRefreshObserver||typeof MutationObserver==='undefined'||!document.body)return;
        var self=this;
        this.liveRefreshObserver=new MutationObserver(function(){
            if(!self.needsLiveRefresh||(typeof Swal!=='undefined'&&Swal.isVisible()))return;
            self.needsLiveRefresh=false;
            self.invalidate();
            self.renderCurrent();
        });
        this.liveRefreshObserver.observe(document.body,{childList:true,subtree:true});
    },
    pageLoading:function(title){
        RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-12 text-purple-700"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-3 font-bold">'+buyerEsc(title||'جاري التحميل')+'</p></div>');
    },
    card:function(title,value,sub,action,icon){
        return '<button type="button" onclick="'+buyerEsc(action)+'" class="card text-right w-full border border-slate-100 hover:border-purple-200 hover:shadow-md transition"><div class="flex justify-between items-start"><div><p class="text-xs text-slate-500 font-bold">'+buyerEsc(title)+'</p><div class="text-2xl font-black text-slate-800 mt-2">'+buyerEsc(value)+'</div><p class="text-[11px] text-slate-400 mt-2">'+buyerEsc(sub||'')+'</p></div><span class="w-10 h-10 rounded-xl bg-purple-50 text-purple-700 flex items-center justify-center"><i class="fa-solid '+buyerEsc(icon||'fa-chart-line')+'"></i></span></div></button>';
    },
    renderToday:async function(){
        this.pageLoading('تحميل لوحة المشتريات');
        var results=await Promise.all([
            this.api('GET_SUMMARY',{}),
            this.data('purchase_requests'),
            this.data('purchase_orders'),
            this.data('purchase_invoices'),
            this.data('suppliers'),
            this.data('items'),
            this.data('stock_branches'),
            this.data('branches'),
            this.data('purchase_settings')
        ]);
        this.currency=(results[8][0]&&results[8][0].default_currency)||this.currency||'SAR';
        var summary=results[0]||{},requests=results[1],orders=results[2],invoices=results[3],suppliers=results[4],items=results[5],stock=results[6],branches=results[7];
        var itemIndex={},critical=0;
        items.forEach(function(it){itemIndex[it.id]=it;});
        stock.forEach(function(st){
            var it=itemIndex[st.item_id];
            if(it&&Number(it.reorder_point||0)>0&&Number(st.available_qty==null?st.qty:st.available_qty)<=Number(it.reorder_point))critical++;
        });
        var openOrders=orders.filter(function(o){return ['Received','Cancelled','Closed'].indexOf(o.status)===-1;}).length;
        var pending=requests.filter(function(r){return ['PendingApproval','Submitted'].indexOf(r.status)!==-1;}).length;
        var outstanding=invoices.filter(function(i){return ['Posted','PartiallyPaid','Approved'].indexOf(i.status)!==-1;}).reduce(function(sum,i){return sum+Math.max(0,Number(i.total_amount||0)-Number(i.paid_amount||0));},0);
        var html='<div class="flex flex-wrap justify-between items-center gap-3 mb-4"><div><h2 class="text-xl font-black">مركز عمل المشتريات</h2><p class="text-xs text-slate-500 mt-1">ملخص من عقود المشتريات الحالية في قاعدة البيانات</p></div><button onclick="App.quickPurchase()" class="px-4 py-3 rounded-xl bg-purple-700 text-white font-black text-sm"><i class="fa-solid fa-bolt ml-2"></i>شراء عاجل / فاتورة مسودة</button></div>';
        html+='<div class="grid grid-cols-2 xl:grid-cols-4 gap-3">';
        html+=this.card('نواقص حرجة',critical,'حسب reorder_point والمخزون المتاح',"App.openCriticalShortages()",'fa-triangle-exclamation');
        html+=this.card('أوامر متأخرة','غير محسوب','موعد التسليم المتوقع غير مخزن في PO',"App.switchTab('orders')",'fa-truck-ramp-box');
        html+=this.card('زيارات اليوم','غير متاح','لا يوجد سجل زيارات موردين مرتبط بالمحرك',"App.switchTab('suppliers')",'fa-location-dot');
        html+=this.card('رصيد عهدتي','غير متاح','لا يوجد دفتر عهدة مشتريات مستقل',"App.switchTab('custody')",'fa-wallet');
        html+='</div>';
        html+='<div class="grid md:grid-cols-2 gap-3 mt-4">';
        html+='<div class="card"><h3 class="font-black mb-3">تنبيهات يجب عدم إخفائها</h3><div class="space-y-3 text-sm">';
        html+='<p class="p-3 rounded-xl bg-amber-50 text-amber-800">• موعد التوريد المتوقع غير موجود في purchase_orders؛ لذلك لا يمكن احتساب الأوامر المتأخرة بدقة.</p>';
        html+='<p class="p-3 rounded-xl bg-amber-50 text-amber-800">• لا يوجد عقد زيارات موردين/تقييمات في نموذج البيانات الحالي.</p>';
        html+='<p class="p-3 rounded-xl bg-amber-50 text-amber-800">• لا يوجد دفتر عهدة موظف مشتريات مستقل؛ لا تُسجل العهدة داخل خزينة الشركة كبديل.</p>';
        html+='<p class="p-3 rounded-xl bg-slate-50 text-slate-600">• الشراء العاجل ينشئ فاتورة Draft فقط؛ الترحيل المخزني والمحاسبي منفصل ويتطلب صلاحية المالية.</p>';
        html+='</div></div>';
        html+='<div class="card"><h3 class="font-black mb-3">مؤشرات التشغيل</h3><div class="space-y-3 text-sm">';
        html+='<div class="flex justify-between"><span>الموردون النشطون</span><b>'+suppliers.filter(function(x){return x.is_active!==false;}).length+'</b></div>';
        html+='<div class="flex justify-between"><span>أوامر الشراء</span><b>'+orders.length+'</b></div>';
        html+='<div class="flex justify-between"><span>فواتير الشراء</span><b>'+invoices.length+'</b></div>';
        html+='<div class="flex justify-between"><span>الفروع</span><b>'+branches.length+'</b></div>';
        html+='<div class="flex justify-between"><span>أصناف متاحة للتحليل</span><b>'+items.length+'</b></div>';
        html+='<p class="text-[11px] text-slate-400 border-t pt-3">الأرقام من قراءة مقيدة بالشركة وليست بيانات تجريبية. حد القراءة الحالي 500 سجل لكل كيان؛ لذلك لا تمثل حصرًا نهائيًا إذا تجاوز حجم البيانات هذا الحد.</p></div></div></div>';
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
    },
    openCriticalShortages:async function(){
        try{
            var results=await Promise.all([this.data('items'),this.data('stock_branches'),this.data('branches')]);
            var itemIndex={},branchIndex={},rows=[];
            results[0].forEach(function(it){itemIndex[it.id]=it;});
            results[2].forEach(function(b){branchIndex[b.id]=b;});
            results[1].forEach(function(st){
                var it=itemIndex[st.item_id],available=Number(st.available_qty==null?st.qty:st.available_qty);
                if(it&&Number(it.reorder_point||0)>0&&available<=Number(it.reorder_point)){
                    rows.push({item:it,branch:branchIndex[st.branch_id],available:available,shortage:Math.max(0,Number(it.reorder_point)-available)});
                }
            });
            rows.sort(function(a,b){return b.shortage-a.shortage;});

                var amount=Number(RW_UI.byId('bc-amount').value||0),purpose=RW_UI.byId('bc-purpose').value.trim();
                if(!purpose||amount<=0){Swal.showValidationMessage('أدخل الغرض ومبلغًا أكبر من صفر');return false;}
                try{return await self.api('ISSUE_CUSTODY',{employee_id:RW_UI.byId('bc-employee').value,branch_id:RW_UI.byId('bc-branch').value||null,purpose:purpose,amount:amount,currency:RW_UI.byId('bc-currency').value.trim()||'SAR',received_reference:RW_UI.byId('bc-reference').value.trim()||null,notes:RW_UI.byId('bc-notes').value.trim()||null});}
                catch(e){Swal.showValidationMessage(e.message);return false;}
            }});
            if(result.isConfirmed){this.invalidate();await this.renderCustody();RW_UI.toast('تم تسجيل العهدة يدويًا','success');}
        }catch(e){this.notifyError(e);}
    },
    acknowledgeCustody:async function(id){
        try{await this.api('ACKNOWLEDGE_CUSTODY',{custody_id:id});this.invalidate();await this.renderCustody();RW_UI.toast('تم تأكيد استلام العهدة','success');}
        catch(e){this.notifyError(e);}
    },
    submitCustodyExpense:async function(custodyId){
        var html='<div class="text-right space-y-2"><label class="block text-xs font-bold">وصف المصروف<input id="bce-description" class="swal2-input" placeholder="سبب الصرف أو نوع المشتريات"></label>'+
            '<div class="grid grid-cols-2 gap-2"><label class="text-xs font-bold">المبلغ<input id="bce-amount" type="number" min="0.01" step="0.01" class="swal2-input"></label><label class="text-xs font-bold">التاريخ<input id="bce-date" type="date" class="swal2-input" value="'+new Date().toISOString().slice(0,10)+'"></label></div>'+
            '<label class="block text-xs font-bold">المورد<input id="bce-supplier" class="swal2-input"></label><label class="block text-xs font-bold">رقم الفاتورة<input id="bce-invoice" class="swal2-input"></label>'+
            '<label class="block text-xs font-bold">صورة الفاتورة أو المستند (PDF / صورة)<input id="bce-file" type="file" accept="application/pdf,image/*" class="swal2-file"></label><p class="text-xs text-slate-400">الحد الأقصى 10 ميجابايت. يتم حفظ الملف في مساحة المستندات الخاصة بالشركة.</p></div>';
        var self=this;
        var result=await Swal.fire({title:'تقديم مستند للتسوية',html:html,width:650,showCancelButton:true,confirmButtonText:'إرسال للمالية',cancelButtonText:'إلغاء',preConfirm:async function(){
            var file=RW_UI.byId('bce-file').files[0],amount=Number(RW_UI.byId('bce-amount').value||0),description=RW_UI.byId('bce-description').value.trim();
            if(!file||!description||amount<=0){Swal.showValidationMessage('أدخل الوصف والمبلغ وارفق المستند');return false;}
            if(file.size>10*1024*1024||!(file.type==='application/pdf'||file.type.indexOf('image/')===0)){Swal.showValidationMessage('يسمح بملف PDF أو صورة لا تتجاوز 10 ميجابايت');return false;}
            var safeName=file.name.replace(/[^A-Za-z0-9._-]/g,'_').slice(-80)||'document';
            var path=self.currentUser.company_id+'/'+self.currentUser.id+'/buyer-custody/'+custodyId+'/'+Date.now()+'_'+safeName;
            var uploaded=await supabase.storage.from('employee-documents').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});
            if(uploaded.error){Swal.showValidationMessage('تعذر رفع المستند: '+uploaded.error.message);return false;}
            try{
                return await self.api('SUBMIT_CUSTODY_EXPENSE',{custody_id:custodyId,expense_date:RW_UI.byId('bce-date').value||null,supplier_name:RW_UI.byId('bce-supplier').value.trim()||null,invoice_number:RW_UI.byId('bce-invoice').value.trim()||null,description:description,amount:amount,currency:self.currency||'SAR',document_name:file.name,document_path:path,mime_type:file.type});
            }catch(e){
                await supabase.storage.from('employee-documents').remove([path]);
                Swal.showValidationMessage(e.message);return false;
            }
        }});
        if(result.isConfirmed){this.invalidate();await this.renderCustody();RW_UI.toast('تم إرسال المستند إلى الإدارة المالية','success');}
    },
    viewCustodyDocument:async function(path){
        try{
            var result=await supabase.storage.from('employee-documents').createSignedUrl(path,300);
            if(result.error)throw result.error;
            window.open(result.data.signedUrl,'_blank','noopener');
        }catch(e){this.notifyError(e);}
    },
    reviewCustodyExpense:async function(expenseId,decision){
        var decisionText=decision==='Approved'?'اعتماد المستند':'رفض المستند';
        var result=await Swal.fire({title:decisionText,input:'textarea',inputLabel:'ملاحظة المراجعة',inputPlaceholder:'سبب الاعتماد أو الرفض (اختياري)',showCancelButton:true,confirmButtonText:'تأكيد',cancelButtonText:'إلغاء'});
        if(!result.isConfirmed)return;
        try{await this.api('REVIEW_CUSTODY_EXPENSE',{expense_id:expenseId,decision:decision,review_note:result.value||null});this.invalidate();await this.renderCustody();RW_UI.toast('تم تحديث مراجعة المستند','success');}
        catch(e){this.notifyError(e);}
    },
    settleCustody:async function(custodyId){
        var custody=(this.custodySnapshot&&this.custodySnapshot.custodies||[]).find(function(c){return c.id===custodyId;});
        var lines=(this.custodySnapshot&&this.custodySnapshot.expenses||[]).filter(function(e){return e.custody_id===custodyId&&e.status==='Approved';});
        var approved=lines.reduce(function(n,e){return n+Number(e.amount||0);},0);
        if(!custody)return;
        var maxReturn=Math.max(0,Number(custody.issued_amount||0)-approved);
        var result=await Swal.fire({title:'تسوية العهدة '+buyerEsc(custody.custody_code),html:'<div class="text-right text-sm mb-3">المبلغ المسلّم: <b>'+buyerMoney(custody.issued_amount,custody.currency)+'</b><br>المصروفات المعتمدة: <b>'+buyerMoney(approved,custody.currency)+'</b><br>الحد الأقصى للنقد المرتجع: <b>'+buyerMoney(maxReturn,custody.currency)+'</b></div><label class="block text-xs font-bold text-right">النقد المرتجع فعليًا<input id="bcs-return" type="number" min="0" max="'+maxReturn+'" step="0.01" class="swal2-input" value="0"></label><label class="block text-xs font-bold text-right">مرجع استلام النقد المرتجع<input id="bcs-reference" class="swal2-input"></label><label class="block text-xs font-bold text-right">ملاحظات<textarea id="bcs-notes" class="swal2-textarea"></textarea></label>',showCancelButton:true,confirmButtonText:'تسجيل التسوية',cancelButtonText:'إلغاء',preConfirm:function(){
            var returned=Number(RW_UI.byId('bcs-return').value||0);
            if(returned<0||returned>maxReturn){Swal.showValidationMessage('قيمة النقد المرتجع خارج الحد المسموح');return false;}
            return {cash_returned:returned,finance_reference:RW_UI.byId('bcs-reference').value.trim()||null,notes:RW_UI.byId('bcs-notes').value.trim()||null};
        }});
        if(!result.isConfirmed)return;
        try{
            var settled=await this.api('SETTLE_CUSTODY',{custody_id:custodyId,cash_returned:result.value.cash_returned,finance_reference:result.value.finance_reference,notes:result.value.notes});
            this.invalidate();await this.renderCustody();
            RW_UI.toast('تمت التسوية · مستحق الموظف: '+buyerMoney(settled.amount_due_employee,custody.currency)+' · المتبقي للشركة: '+buyerMoney(settled.balance_due_company,custody.currency),'success');
        }catch(e){this.notifyError(e);}
    },
    renderAccount:async function(){
        this.pageLoading('تحميل ملف المشتري');
        var settings=await this.data('purchase_settings');
        var p=this.currentUser||{},perms=Array.isArray(p.permissions)?p.permissions:[];
        var html='<div class="mb-4"><h2 class="text-xl font-black">حسابي</h2><p class="text-xs text-slate-500">الملف والصلاحيات والتقارير وإعدادات دورة المشتريات</p></div><div class="card mb-3"><h3 class="font-black mb-2">'+buyerEsc(p.name||'المستخدم')+'</h3><p class="text-sm">'+buyerEsc(p.email||'')+'</p><p class="text-xs text-slate-500 mt-1">'+buyerEsc(p.role||'')+'</p><p class="text-xs text-slate-500 mt-2">الصلاحيات الفعالة: '+buyerEsc(perms.join('، ')||'—')+'</p></div><div class="grid md:grid-cols-2 gap-3"><button onclick="App.showReports()" class="card text-right font-bold">📊 تقارير المشتريات</button><button onclick="App.purchaseSettings()" class="card text-right font-bold">⚙️ إعدادات دورة المشتريات</button><button onclick="App.doLogout()" class="card text-right font-bold text-red-600">تسجيل الخروج</button></div>';
        html+='<p class="text-xs text-amber-700 mt-3">الموافقات تظهر ضمن طلبات PR. التسويات الشخصية لا تتوفر قبل بناء عقد العهدة.</p>';
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
    },
    showReports:async function(){
        try{
            var r=await this.api('GET_REPORTS',{as_of_date:new Date().toISOString().slice(0,10)});
            var html='<div class="text-right space-y-2"><p>طلبات مفتوحة: <b>'+buyerEsc(r.requests&&r.requests.open||0)+'</b></p><p>طلبات اعتماد: <b>'+buyerEsc(r.requests&&r.requests.pending_approval||0)+'</b></p><p>أوامر مفتوحة: <b>'+buyerEsc(r.orders&&r.orders.open||0)+'</b></p><p>قيمة الأوامر: <b>'+buyerMoney(r.orders&&r.orders.value||0,this.currency)+'</b></p><p>فواتير مستحقة: <b>'+buyerMoney(r.invoices&&r.invoices.outstanding||0,this.currency)+'</b></p><p>قيمة مردودات مرحلة: <b>'+buyerMoney(r.returns&&r.returns.posted_value||0,this.currency)+'</b></p></div>';
            await Swal.fire({title:'تقارير المشتريات',html:html,width:650,showCloseButton:true,showConfirmButton:false});
        }catch(e){this.notifyError(e);}
    },
    purchaseSettings:async function(){
        try{
            var rows=await this.data('purchase_settings'),s=rows[0]||{};
            var html='<div class="text-right space-y-3">'+
                '<label class="flex justify-between items-center gap-2">اشتراط اعتماد طلب الشراء<input id="ps-approval" type="checkbox" '+(s.require_request_approval?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">اشتراط الاستلام قبل الفاتورة<input id="ps-receive" type="checkbox" '+(s.require_receiving_before_invoice?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">اشتراط الفاتورة قبل السداد<input id="ps-invoice" type="checkbox" '+(s.require_invoice_before_payment?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">ترحيل المخزون عند ترحيل الفاتورة<input id="ps-stock" type="checkbox" '+(s.require_inventory_on_invoice?'checked':'')+'></label>'+
                '<label class="flex justify-between items-center gap-2">اشتراط إذن مخزني عند المرتجع<input id="ps-return" type="checkbox" '+(s.require_inventory_voucher_on_return?'checked':'')+'></label>'+
                '<label class="block text-xs">العملة الافتراضية<input id="ps-currency" class="swal2-input" value="'+buyerEsc(s.default_currency||'SAR')+'"></label></div>';
            var self=this;
            var result=await Swal.fire({title:'إعدادات المشتريات',html:html,width:650,showCancelButton:true,confirmButtonText:'حفظ الإعدادات',cancelButtonText:'إلغاء',preConfirm:async function(){
                try{return await self.api('SAVE_SETTINGS',{require_request_approval:RW_UI.byId('ps-approval').checked,require_receiving_before_invoice:RW_UI.byId('ps-receive').checked,require_invoice_before_payment:RW_UI.byId('ps-invoice').checked,require_inventory_on_invoice:RW_UI.byId('ps-stock').checked,require_inventory_voucher_on_return:RW_UI.byId('ps-return').checked,default_currency:RW_UI.byId('ps-currency').value.trim()||'SAR'});}
                catch(e){Swal.showValidationMessage(e.message);return false;}
            }});
            if(result.isConfirmed){this.invalidate();RW_UI.toast('تم حفظ إعدادات المشتريات','success');}
        }catch(e){this.notifyError(e);}
    }
};
RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded',function(){App.init();});
</script>
