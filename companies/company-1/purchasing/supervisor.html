function RW_PurchSupervisorEsc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(ch) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
}
function RW_PurchSupervisorStatus(s) {
    var labels = {
        Draft:'مسودة',
        Approved:'تم الاعتماد',
        Sent:'مرسل للمورد',
        'Partially Received':'استلام جزئي',
        Received:'مكتمل الاستلام',
        Submitted:'مقدم للمراجعة',
        PendingApproval:'بانتظار الاعتماد',
        Rejected:'مرفوض',
        Converted:'تم التحويل',
        PartiallyQuoted:'وردت عروض جزئية',
        Quoted:'تم تلقي العروض',
        Accepted:'مقبول',
        Expired:'منتهي الصلاحية',
        Posted:'مرحل',
        PartiallyPaid:'مدفوع جزئياً',
        Paid:'مدفوع',
        Voided:'معكوس / ملغى',
        Closed:'مغلق',
        Cancelled:'ملغي'
    };
    return labels[s] || s || '—';
}

function RW_PurchSupervisorNum(v) {
    var n = Number(v);
    if (!isFinite(n)) return '—';
    return n.toLocaleString('en-US', {maximumFractionDigits:2});
}
function RW_PurchSupervisorValue(v, type, record, supplierMap) {
    if (v === null || v === undefined || v === '') return '—';
    if (type === 'date' || type === 'dateTime') {
        var d = new Date(v);
        return isNaN(d.getTime()) ? RW_PurchSupervisorEsc(v) : d.toLocaleString('ar-EG', type === 'date' ? {year:'numeric',month:'2-digit',day:'2-digit'} : {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    }
    if (type === 'status') return RW_PurchSupervisorEsc(RW_PurchSupervisorStatus(v));
    if (type === 'code') return RW_PurchSupervisorCode(v);
    if (type === 'supplier') return RW_PurchSupervisorEsc(supplierMap && supplierMap[v] ? supplierMap[v] : 'مورد غير متاح ضمن صلاحية الحساب');
    if (type === 'money') return RW_PurchSupervisorNum(v) + ' ' + RW_PurchSupervisorEsc(record && record.currency || 'العملة غير مثبتة بالسجل');
    if (type === 'number') return RW_PurchSupervisorNum(v);
    if (type === 'bool') return v === true ? 'نعم' : 'لا';
    if (type === 'reference') return 'مرتبط بمستند';
    return RW_PurchSupervisorEsc(v);
}
function RW_PurchSupervisorCode(v) {
    var labels = {
        PURCHASE_ORDER:'أمر شراء',
        QUICK_MARKET:'شراء سوق سريع',
        LEGACY_UNCLASSIFIED:'مصدر قديم غير مصنف',
        UNSET:'غير محدد',
        SUPPLIER_CREDIT:'ذمة مورد',
        EMPLOYEE_CUSTODY:'عهدة موظف',
        LEGACY_UNVERIFIED:'حالة قديمة غير مؤكدة',
        NOT_RECEIVED:'لم يتم الاستلام',
        PARTIALLY_RECEIVED:'استلام جزئي',
        RECEIVED:'تم الاستلام',
        UNSETTLED:'غير مسوى',
        PENDING_FINANCE:'بانتظار المالية',
        AP_OPEN:'ذمة مورد مفتوحة',
        PARTIALLY_SETTLED:'مسوى جزئياً',
        SETTLED:'مسوى'
    };
    return RW_PurchSupervisorEsc(labels[v] || v || '—');
}
function RW_PurchSupervisorLocalDate(d) {
    d = d || new Date();
    var local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0,10);
}

var App = {
    currentUser: null,
    currentOrders: [],
    currentRows: {},
    supplierMap: null,
    currentTab: 'dashboard',
    realtimeKey: null,
    togglePass: function(){var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}else{p.type='password';i.className='fa-solid fa-eye';}},
    doLogin: function(){var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim();if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return;}RW_UI.byId('loginMsg').classList.add('hidden');var s=this;RW_UI.showLoader('جاري تسجيل الدخول...');RW_Auth.doLogin(e,p,function(user,err){RW_UI.hideLoader();if(err){RW_UI.byId('loginMsg').innerText=err;RW_UI.byId('loginMsg').classList.remove('hidden');}else{s.init();}});},
    init: function(){var s=this;RW_Auth.init(function(user,err){if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة');return;}var isO=user.isOwner===true,perms=Array.isArray(user.permissions)?user.permissions:[],has=isO||perms.indexOf('*')!==-1||perms.indexOf('purchases_supervisor')!==-1;if(!has){RW_UI.showError('غير مصرح');RW_Auth.doLogout();return;}RW_UI.safeText(RW_UI.byId('headerUserName'),user.name);s.currentUser=user;s.enterApp();});},
    enterApp: function(){RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.remove('hidden');this.switchTab('dashboard');this.startRealtime();},
    startRealtime: function(){
        var self = this;
        if (!this.currentUser || !this.currentUser.company_id || typeof RW_Realtime === 'undefined') return;
        if (this.realtimeKey) RW_Realtime.stop(this.realtimeKey);
        this.realtimeKey = RW_Realtime.start({
            appId: 'purchasing-supervisor',
            companyId: this.currentUser.company_id,
            tables: ['purchase_requests','purchase_rfqs','purchase_quotations','purchase_orders','purchase_invoices','purchase_returns','purchase_payments','purchase_settings','suppliers'],
            debounceMs: 700,
            reconcileMs: 60000,
            onEvent: function(event){
                if (event && event.table) self.refreshCurrentTab();
            },
            onReconcile: function(){ self.refreshCurrentTab(); },
            onStatus: function(status){ console.log('[Purchasing Supervisor] Realtime:', status.status); }
        });
        if (!this.realtimeKey) console.error('[Purchasing Supervisor] Realtime rejected: verified company scope unavailable.');
    },
    stopRealtime: function(){
        if (this.realtimeKey && typeof RW_Realtime !== 'undefined') { RW_Realtime.stop(this.realtimeKey); this.realtimeKey = null; }
    },
    doLogout: function(){this.stopRealtime();var s=this;RW_Auth.doLogout(function(){RW_UI.byId('mainApp').classList.add('hidden');RW_UI.byId('loginScreen').classList.remove('hidden');});},
    switchTab: function(t){
        var allowed = ['dashboard','today','notifications','suppliers','requests','rfq','quotations','orders','invoices','returns','payments','reports','settings'];
        if (allowed.indexOf(t) === -1) return;
        this.currentTab = t;
        allowed.forEach(function(x){
            var b = RW_UI.byId('tab-' + x);
            if (!b) return;
            b.classList.remove('bg-fuchsia-700','text-white','shadow-sm');
            b.classList.add('text-slate-600');
        });
        var active = RW_UI.byId('tab-' + t);
        if (active) {
            active.classList.add('bg-fuchsia-700','text-white','shadow-sm');
            active.classList.remove('text-slate-600');
        }
        this.refreshCurrentTab();
    },
    refreshCurrentTab: function(){
        var renderers = {
            dashboard:'renderDashboard', today:'renderToday', notifications:'renderNotifications',
            requests:'renderRequests', rfq:'renderRFQs',
            quotations:'renderQuotations', orders:'renderOrders', invoices:'renderInvoices',
            returns:'renderReturns', payments:'renderPayments', reports:'renderReports',
            settings:'renderSettings', suppliers:'renderSuppliers'
        };
        var method = renderers[this.currentTab];
        if (method && typeof this[method] === 'function') this[method]();
    },
    readCompanyRows: async function(table, columns){
        var companyId = this.currentUser && this.currentUser.company_id;
        if (!companyId) throw new Error('سياق الشركة غير متاح');
        var all = [], offset = 0, pageSize = 200;
        while (true) {
            var page = await supabase.from(table).select(columns)
                .eq('company_id', companyId)
                .order('created_at', {ascending:false})
                .order('id', {ascending:false})
                .range(offset, offset + pageSize - 1);
            if (page.error) throw page.error;
            var batch = page.data || [];
            all = all.concat(batch);
            if (batch.length < pageSize) break;
            offset += pageSize;
        }
        return all;
    },
    readChildRows: async function(table, foreignKey, parentId, columns, sortKey){
        if (!parentId) return [];
        var all = [], offset = 0, pageSize = 200;
        while (true) {
            var q = supabase.from(table).select(columns).eq(foreignKey, parentId);
            if (sortKey) q = q.order(sortKey, {ascending:true});
            q = q.order('id', {ascending:true}).range(offset, offset + pageSize - 1);
            var page = await q;
            if (page.error) throw page.error;
            var batch = page.data || [];
            all = all.concat(batch);
            if (batch.length < pageSize) break;
            offset += pageSize;
        }
        return all;
    },
    readSuppliers: async function(){
        var companyId = this.currentUser && this.currentUser.company_id;
        if (!companyId) throw new Error('سياق الشركة غير متاح');
        var all = [], offset = 0, pageSize = 200;
        while (true) {
            var page = await supabase.from('suppliers')
                .select('id,company_id,supplier_code,name,phone,area,accounts_payable,is_active')
                .eq('company_id', companyId)
                .order('name', {ascending:true})
                .order('id', {ascending:true})
                .range(offset, offset + pageSize - 1);
            if (page.error) throw page.error;
            var batch = page.data || [];
            all = all.concat(batch);
            if (batch.length < pageSize) break;
            offset += pageSize;
        }
        this.supplierMap = {};
        all.forEach(function(s){ this.supplierMap[s.id] = s.name || s.supplier_code || 'مورد'; }, this);
        return all;
    },

    renderOrders: async function(){

            RW_UI.showError('سياق الشركة غير متاح');
            return;
        }

        RW_UI.showSkeleton('mainContent', 3, 'card');

        try {
            var all = [];
            var offset = 0;
            var pageSize = 200;

            while (true) {
                var page = await supabase.from('purchase_orders')
                    .select('id,company_id,po_code,po_date,supplier_name,branch_id,created_by,expected_delivery_date,total_amount,currency,status,notes,created_at')
                    .eq('company_id', companyId)
                    .order('po_date', {ascending:false})
                    .order('created_at', {ascending:false})
                    .order('id', {ascending:false})
                    .range(offset, offset + pageSize - 1);

                if (batch.length < pageSize) break;
                offset += pageSize;
            }

            var branchResult = await supabase.from('branches')
                .select('id,name')

                  '<div><h2 class="text-lg font-black">جميع أوامر الشراء</h2>' +
                  '<p class="text-xs text-gray-500">كل أوامر الشركة لجميع مسؤولي المشتريات — إجمالي ' + all.length + ' أمر</p></div>' +

                    '<select id="pws-po-status" class="w-full p-3 border rounded-xl">' +
                      '<option value="">كل الحالات</option>' +
                      '<option value="Draft">مسودة</option>' +
                      '<option value="Approved">تم الاعتماد</option>' +

                      '<option value="Received">مكتمل الاستلام</option>' +
                      '<option value="Cancelled">ملغي</option>' +
                    '</select>' +
                  '</div>' +
                '</div>' +
                '<div class="bg-white rounded-2xl border overflow-auto">' +
                  '<table class="w-full min-w-[1050px] text-sm"><thead class="bg-slate-50"><tr>' +
                    '<th class="p-3">رقم PO</th><th class="p-3">التاريخ</th><th class="p-3">مسؤول المشتريات</th>' +
                    '<th class="p-3">المورد</th><th class="p-3">الفرع</th><th class="p-3">موعد التوريد</th>' +
                    '<th class="p-3">الحالة</th><th class="p-3">القيمة</th><th class="p-3">إجراء</th>' +
                  '</tr></thead><tbody id="pws-po-rows"></tbody></table>' +
                '</div>'
            );

            var body = RW_UI.byId('pws-po-rows');
            var search = RW_UI.byId('pws-po-search');
            var statusSelect = RW_UI.byId('pws-po-status');

            function drawRows() {
                var q = String(search.value || '').trim().toLowerCase();
                var status = statusSelect.value || '';
                var rows = self.currentOrders.filter(function(o) {
                    var haystack = [o.po_code,o.supplier_name,o.created_by,branchMap[o.branch_id]]
                        .join(' ').toLowerCase();
                    return (!q || haystack.indexOf(q) !== -1) &&
                           (!status || o.status === status);
                });

                if (!rows.length) {
                    RW_UI.safeHTML(body, '<tr><td colspan="9" class="text-center p-8 text-slate-400">لا توجد أوامر مطابقة.</td></tr>');
                    return;
                }

                var html = '';
                rows.forEach(function(o) {
                    html += '<tr class="border-t">' +
                      '<td class="p-3 font-black">' + RW_PurchSupervisorEsc(o.po_code) + '</td>' +
                      '<td class="p-3">' + RW_PurchSupervisorEsc(o.po_date || '—') + '</td>' +
                      '<td class="p-3 text-xs">' + RW_PurchSupervisorEsc(o.created_by || '—') + '</td>' +
                      '<td class="p-3">' + RW_PurchSupervisorEsc(o.supplier_name || '—') + '</td>' +
                      '<td class="p-3">' + RW_PurchSupervisorEsc(branchMap[o.branch_id] || (o.branch_id && branchLookupUnavailable ? 'غير متاح بصلاحية الحساب' : '—')) + '</td>' +
                      '<td class="p-3">' + RW_PurchSupervisorEsc(o.expected_delivery_date || '—') + '</td>' +
                      '<td class="p-3 font-bold">' + RW_PurchSupervisorEsc(RW_PurchSupervisorStatus(o.status)) + '</td>' +
                      '<td class="p-3 font-black">' + Number(o.total_amount || 0).toLocaleString() + ' ' + RW_PurchSupervisorEsc(o.currency || 'EGP') + '</td>' +
                      '<td class="p-3"><button type="button" data-pws-po-id="' + RW_PurchSupervisorEsc(o.id) + '" class="px-3 py-2 rounded-lg bg-fuchsia-50 text-fuchsia-700 font-black">عرض</button></td>' +
                    '</tr>';
                });

                RW_UI.safeHTML(body, html);

                Array.from(body.querySelectorAll('[data-pws-po-id]')).forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        self.openPO(btn.getAttribute('data-pws-po-id'));

        } catch(e) {
            RW_UI.safeHTML(RW_UI.byId('mainContent'),
                '<div class="p-5 rounded-2xl bg-red-50 text-red-700 font-bold">' +
                RW_PurchSupervisorEsc(e.message || 'تعذر تحميل جميع أوامر الشراء') +
                '</div>'
            );
        }

    openPO: async function(poId) {
        var self = this;
        var po = this.currentOrders.find(function(x){ return String(x.id) === String(poId); });
        if (!po) {
            RW_UI.showError('أمر الشراء غير موجود في القائمة الحالية');
            return;
        }

        RW_UI.showLoader('جاري تحميل تفاصيل أمر الشراء...');
        try {
            var details = await supabase.from('purchase_order_details')
                .select('item_code,item_name,unit,qty_ordered,qty_received,unit_price,created_at')
                .eq('po_id', po.id)
                .order('created_at', {ascending:true});

            if (details.error) throw details.error;

            var lines = details.data || [];
            var html = '<div class="text-right space-y-3">' +
              '<div class="grid grid-cols-2 gap-2">' +
                '<div class="p-3 bg-slate-50 rounded-xl"><small>المورد</small><div class="font-black">' + RW_PurchSupervisorEsc(po.supplier_name || '—') + '</div></div>' +
                '<div class="p-3 bg-slate-50 rounded-xl"><small>مسؤول المشتريات</small><div class="font-black">' + RW_PurchSupervisorEsc(po.created_by || '—') + '</div></div>' +
                '<div class="p-3 bg-slate-50 rounded-xl"><small>الحالة</small><div class="font-black">' + RW_PurchSupervisorEsc(RW_PurchSupervisorStatus(po.status)) + '</div></div>' +
                '<div class="p-3 bg-slate-50 rounded-xl"><small>موعد التوريد</small><div class="font-black">' + RW_PurchSupervisorEsc(po.expected_delivery_date || '—') + '</div></div>' +
              '</div>' +
              '<div class="overflow-auto border rounded-xl"><table class="w-full text-sm"><thead class="bg-slate-50"><tr>' +
                '<th class="p-2">الصنف</th><th class="p-2">المطلوب</th><th class="p-2">المستلم</th><th class="p-2">المتبقي</th><th class="p-2">السعر</th>' +
              '</tr></thead><tbody>';

            if (!lines.length) {
                html += '<tr><td colspan="5" class="p-4 text-center text-slate-400">لا توجد بنود مسجلة في أمر الشراء.</td></tr>';
            } else {
                lines.forEach(function(x) {
                    var ordered = Number(x.qty_ordered || 0);
                    var received = Number(x.qty_received || 0);
                    html += '<tr class="border-t">' +
                      '<td class="p-2"><b>' + RW_PurchSupervisorEsc(x.item_name || x.item_code) + '</b><div class="text-xs text-slate-400">' + RW_PurchSupervisorEsc(x.item_code) + '</div></td>' +
                      '<td class="p-2 text-center">' + ordered + ' ' + RW_PurchSupervisorEsc(x.unit || '') + '</td>' +
                      '<td class="p-2 text-center">' + received + '</td>' +
                      '<td class="p-2 text-center font-black">' + Math.max(0, ordered - received) + '</td>' +
                      '<td class="p-2 text-center">' + Number(x.unit_price || 0).toLocaleString() + '</td>' +
                    '</tr>';
                });
            }

            html += '</tbody></table></div>' +
              '<div class="font-black text-lg">الإجمالي: ' + Number(po.total_amount || 0).toLocaleString() + ' ' + RW_PurchSupervisorEsc(po.currency || 'EGP') + '</div>' +
              '<p class="text-xs text-slate-500">الاعتماد يصرح بالتوريد والاستلام فقط، ولا يثبت استلامًا أو حركة مخزون أو قيدًا ماليًا.</p>' +
            '</div>';

            RW_UI.hideLoader();

            var canApprove = po.status === 'Draft' && lines.some(function(x){ return Number(x.qty_ordered || 0) > 0; });
            var result = await Swal.fire({
                title: 'أمر الشراء ' + RW_PurchSupervisorEsc(po.po_code),
                html: html,
                width: '1000px',
                showCloseButton: true,
                showCancelButton: canApprove,
                showConfirmButton: canApprove,
                confirmButtonText: 'اعتماد أمر الشراء',
                cancelButtonText: 'إغلاق',
                confirmButtonColor: '#059669'
            });

            if (canApprove && result.isConfirmed) {
                self.approvePO(po.id);
            }
        } catch(e) {
            RW_UI.hideLoader();
            RW_UI.showError(e.message || 'تعذر تحميل تفاصيل أمر الشراء');
        }
    },

    approvePO: function(poId) {
        var self = this;
        if (!poId || !this.currentUser) {
            RW_UI.showError('بيانات الاعتماد غير مكتملة');
            return;
        }

        var perms = Array.isArray(this.currentUser.permissions) ? this.currentUser.permissions : [];
        if (!(this.currentUser.isOwner === true || perms.indexOf('*') !== -1 || perms.indexOf('purchases_supervisor') !== -1)) {
            RW_UI.showError('اعتماد PO يتطلب صلاحية مشرف المشتريات');
            return;
        }

        var operationId = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : 'PO-APPROVE-' + String(poId) + '-' + String(Date.now());

        RW_UI.showLoader('جاري اعتماد أمر الشراء...');
        RW_API.call('save-purchase-order', {
            operation: 'APPROVE_PO',
            payload: { id: poId },
            operation_id: operationId
        }, function(json, err) {
            RW_UI.hideLoader();

            if (err || !json || json.success !== true) {
                RW_UI.showError((json && json.msg) || err || 'فشل اعتماد أمر الشراء');
                return;
            }

            Swal.fire({
                icon: 'success',
                title: 'تم اعتماد أمر الشراء',
                text: 'أصبح الأمر مصرحًا بتوريده والاستلام به في المخزن.'
            }).then(function() {
                self.renderOrders();
            });
        });
    },

    renderToday: async function(){
        var companyId = this.currentUser && this.currentUser.company_id;
        if (!companyId) { RW_UI.showError('سياق الشركة غير متاح'); return; }
        var today = RW_PurchSupervisorLocalDate();
        RW_UI.showSkeleton('mainContent',4,'card');
        try {
            var specs = [
                {table:'purchase_requests',date:'request_date',code:'request_code',title:'طلب شراء',cols:'id,company_id,request_code,request_date,status,created_at'},
                {table:'purchase_rfqs',date:'rfq_date',code:'rfq_code',title:'طلب عرض سعر',cols:'id,company_id,rfq_code,rfq_date,status,created_at'},
                {table:'purchase_quotations',date:'quotation_date',code:'quotation_code',title:'عرض مورد',cols:'id,company_id,quotation_code,quotation_date,status,currency,total_amount,created_at'},
                {table:'purchase_orders',date:'po_date',code:'po_code',title:'أمر شراء',cols:'id,company_id,po_code,po_date,status,currency,total_amount,expected_delivery_date,created_at'},
                {table:'purchase_invoices',date:'invoice_date',code:'invoice_code',title:'فاتورة شراء',cols:'id,company_id,invoice_code,invoice_date,status,currency,total_amount,created_at'},
                {table:'purchase_returns',date:'return_date',code:'return_code',title:'مرتجع شراء',cols:'id,company_id,return_code,return_date,status,total_amount,created_at'},
                {table:'purchase_payments',date:'payment_date',code:'payment_code',title:'دفعة مورد',cols:'id,company_id,payment_code,payment_date,status,amount,created_at'}
            ];
            var loaded = await Promise.all(specs.map(async function(spec){
                var all = [], offset = 0, pageSize = 200;
                while (true) {
                    var page = await supabase.from(spec.table).select(spec.cols)
                        .eq('company_id',companyId).eq(spec.date,today)
                        .order(spec.date,{ascending:false}).order('id',{ascending:false})
                        .range(offset,offset + pageSize - 1);
                    if (page.error) throw page.error;
                    var batch = page.data || [];
                    all = all.concat(batch);
                    if (batch.length < pageSize) break;
                    offset += pageSize;
                }
                return all.map(function(row){
                    return {date:row[spec.date],code:row[spec.code],title:spec.title,status:row.status,

                .eq('company_id',companyId).eq('expected_delivery_date',today)
                .order('po_code',{ascending:true}).limit(200);

            var documents = [].concat.apply([],loaded);
            documents.sort(function(a,b){ return String(b.date || '').localeCompare(String(a.date || '')); });

            html += '<div class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-7 gap-2">';
            counts.forEach(function(x){ html += '<div class="stat-card border border-slate-100"><div class="text-xs text-slate-500">' + RW_PurchSupervisorEsc(x.title) + '</div><div class="text-2xl font-black mt-1">' + x.count.toLocaleString('en-US') + '</div></div>'; });
            html += '</div><section class="card"><h3 class="font-black mb-3">المستندات المسجلة اليوم</h3>';
            if (!documents.length) html += '<p class="text-sm text-slate-400 py-4 text-center">لا توجد مستندات مشتريات مؤرخة اليوم.</p>';
            documents.forEach(function(x){
                html += '<div class="flex flex-wrap items-center justify-between gap-2 py-3 border-b last:border-0"><div><b class="text-sm">' + RW_PurchSupervisorEsc(x.code || '—') + '</b><div class="text-xs text-slate-500">' + RW_PurchSupervisorEsc(x.title) + ' • ' + RW_PurchSupervisorEsc(x.date || '—') + '</div></div><div class="text-left"><div class="text-xs font-bold">' + RW_PurchSupervisorEsc(RW_PurchSupervisorStatus(x.status)) + '</div>' + (x.amount != null ? '<div class="text-xs text-slate-500">' + RW_PurchSupervisorNum(x.amount) + ' ' + RW_PurchSupervisorEsc(x.currency) + '</div>' : '') + '</div></div>';
            });
            html += '</section><section class="card"><h3 class="font-black mb-2">أوامر التوريد المستحقة اليوم</h3>';
            var dueRows = (due.data || []).filter(function(x){ return x.status !== 'Received' && x.status !== 'Cancelled'; });
            if (!dueRows.length) html += '<p class="text-sm text-slate-400 py-3">لا توجد أوامر توريد مفتوحة مستحقة اليوم.</p>';
            dueRows.forEach(function(x){
                html += '<div class="flex flex-wrap items-center justify-between gap-2 py-2 border-b last:border-0"><div><b>' + RW_PurchSupervisorEsc(x.po_code || '—') + '</b><div class="text-xs text-slate-500">' + RW_PurchSupervisorEsc(x.supplier_name || '—') + '</div></div><span class="text-xs font-bold">' + RW_PurchSupervisorEsc(RW_PurchSupervisorStatus(x.status)) + '</span></div>';
            });
            html += '</section><p class="text-xs text-slate-400">هذه شاشة متابعة وقراءة فقط؛ لا تنشئ استلامًا أو حركة مخزون أو قيدًا ماليًا.</p></div>';
            RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
        } catch(e) {
            RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="p-5 rounded-2xl bg-red-50 text-red-700 font-bold">' + RW_PurchSupervisorEsc(e.message || 'تعذر تحميل متابعة اليوم') + '</div>');
        }
    },
    renderNotifications: async function(){
        var email = String(this.currentUser && this.currentUser.email || '').trim();
        if (!email) {
            RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="card text-center text-amber-700">تعذر التحقق من بريد المستخدم؛ تم إيقاف قراءة الإشعارات حمايةً للخصوصية.</div>');
            return;
        }
        RW_UI.showSkeleton('mainContent',3,'card');
        try {
            var result = await supabase.from('notifications')
                .select('id,user_email,title,body,type,reference_table,reference_id,is_read,created_at')
                .eq('user_email',email)
                .order('created_at',{ascending:false})
                .limit(100);
            if (result.error) throw result.error;
            var rows = result.data || [];
            var unread = rows.filter(function(x){ return x.is_read !== true; }).length;
            var html = '<div class="space-y-4"><div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-2"><div><div class="text-xs font-bold text-fuchsia-700">تنبيهات الحساب</div><h2 class="text-2xl font-black text-slate-900">الإشعارات</h2><p class="text-xs text-slate-500 mt-1">إشعارات الحساب الحالي فقط • آخر ' + rows.length.toLocaleString('en-US') + ' إشعار</p></div><button type="button" onclick="App.refreshCurrentTab()" class="px-4 py-2 rounded-xl bg-fuchsia-50 text-fuchsia-700 font-bold">تحديث</button></div>';
            html += '<div class="grid grid-cols-2 gap-2"><div class="stat-card"><div class="text-xs text-slate-500">غير مقروء</div><div class="text-2xl font-black text-fuchsia-700">' + unread.toLocaleString('en-US') + '</div></div><div class="stat-card"><div class="text-xs text-slate-500">إجمالي المعروض</div><div class="text-2xl font-black">' + rows.length.toLocaleString('en-US') + '</div></div></div>';
            if (!rows.length) html += '<div class="card text-center text-slate-400 py-8">لا توجد إشعارات لهذا الحساب.</div>';
            rows.forEach(function(x){
                html += '<article class="card border ' + (x.is_read === true ? 'border-slate-100' : 'border-fuchsia-200') + '"><div class="flex items-start justify-between gap-3"><div class="min-w-0"><div class="font-black text-slate-900">' + RW_PurchSupervisorEsc(x.title || 'إشعار') + '</div><p class="text-sm text-slate-600 mt-1 whitespace-pre-wrap">' + RW_PurchSupervisorEsc(x.body || '') + '</p><div class="text-[11px] text-slate-400 mt-2">' + RW_PurchSupervisorEsc(x.type || 'info') + ' • ' + RW_PurchSupervisorEsc(x.created_at || '—') + (x.reference_table ? ' • ' + RW_PurchSupervisorEsc(x.reference_table) : '') + '</div></div><span class="shrink-0 text-xs font-bold ' + (x.is_read === true ? 'text-slate-400' : 'text-fuchsia-700') + '">' + (x.is_read === true ? 'مقروء' : 'جديد') + '</span></div></article>';
            });
            RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
        } catch(e) {
            RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="p-5 rounded-2xl bg-red-50 text-red-700 font-bold">' + RW_PurchSupervisorEsc(e.message || 'تعذر تحميل الإشعارات') + '</div>');
        }
    },
    renderSuppliers: async function(){
        var self = this;
        RW_UI.showSkeleton('mainContent',3,'card');
        try {
            var supp = await this.readSuppliers();
            var html = '<div class="space-y-4"><div><div class="text-xs text-fuchsia-700 font-bold">دليل الموردين</div><h2 class="text-xl font-black">الموردون المعتمدون</h2><p class="text-xs text-slate-500 mt-1">بيانات الشركة فقط • ' + supp.length.toLocaleString('en-US') + ' مورد</p></div>';
            if (!supp.length) html += '<div class="card text-center text-slate-400 p-8">لا يوجد موردون مسجلون.</div>';
            supp.forEach(function(s){
                html += '<div class="card mb-2 border border-slate-100"><div class="flex flex-col sm:flex-row sm:justify-between gap-2"><div><div class="font-black text-slate-900">' + RW_PurchSupervisorEsc(s.name || '—') + '</div><div class="text-xs text-slate-500 mt-1">' + RW_PurchSupervisorEsc(s.supplier_code || '—') + '</div></div><div class="text-left"><div class="text-[11px] text-slate-400">الرصيد الدفتري الظاهر بدليل المورد</div><div class="font-black text-slate-700">' + RW_PurchSupervisorNum(s.accounts_payable) + ' (العملة غير محددة في هذا العرض)</div></div></div><p class="text-xs text-slate-500 mt-2">' + RW_PurchSupervisorEsc(s.phone || '—') + ' • ' + RW_PurchSupervisorEsc(s.area || '—') + '</p></div>';
            });
            html += '</div>';
            RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
        } catch(e) {
            RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="p-5 rounded-2xl bg-red-50 text-red-700 font-bold">' + RW_PurchSupervisorEsc(e.message || 'تعذر تحميل الموردين') + '</div>');
        }
    }
};
RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded',function(){App.init();});
</script>
<script src="../register-sw.js"></script>
</body>
</html>
