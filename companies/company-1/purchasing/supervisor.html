<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مشرف المشتريات | الروائع ERP</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#a855f7">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <!-- Supabase client is provided by the shared core.js. -->
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f1f5f9}
        .auth-container{background:linear-gradient(135deg,#581c87 0%,#7e22ce 40%,#a855f7 100%)}
        .input-field:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,0.1)}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
        .stat-card{background:#fff;border-radius:16px;padding:1rem;box-shadow:0 4px 6px rgba(0,0,0,0.02)}
        .kpi-up{color:#10b981}.kpi-down{color:#ef4444}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md">
        <div class="text-center mb-6"><div class="w-20 h-20 bg-gradient-to-br from-fuchsia-600 to-fuchsia-800 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4"><i class="fa-solid fa-clipboard-check text-white text-3xl"></i></div><h1 class="font-black text-2xl text-gray-800">الروائع</h1><p class="text-xs text-gray-400">مشرف المشتريات</p></div>
        <h2 class="text-lg font-bold text-gray-700 text-center mb-4">تسجيل الدخول</h2>
        <div class="space-y-3"><div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-fuchsia-600 outline-none font-bold text-sm"></div><div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-fuchsia-600 outline-none font-bold text-sm pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div>
        <button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-fuchsia-600 to-fuchsia-700 text-white py-3.5 rounded-xl font-black text-sm shadow-lg mt-4">تسجيل الدخول</button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<div id="mainApp" class="hidden flex flex-col h-full">
    <header class="bg-fuchsia-700 text-white p-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0">
        <span class="font-black text-sm">مشرف المشتريات</span>
        <div class="flex items-center gap-2"><span class="text-xs font-bold" id="headerUserName"></span><button onclick="App.doLogout()" class="bg-white/10 w-8 h-8 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div>
    </header>
    <div class="flex gap-1 p-2 bg-white border-b overflow-x-auto flex-shrink-0">
        <button onclick="App.switchTab('dashboard')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm bg-fuchsia-600 text-white" id="tab-dashboard">📊 KPI</button>
        <button onclick="App.switchTab('orders')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm text-gray-500" id="tab-orders">📋 الأوامر</button>
        <button onclick="App.switchTab('suppliers')" class="whitespace-nowrap px-4 py-2 rounded-xl font-bold text-sm text-gray-500" id="tab-suppliers">🏭 الموردين</button>
    </div>
    <main id="mainContent" class="flex-1 overflow-y-auto p-4"></main>
</div>

<script>
var db = new Dexie('RW_PurchSupervisor'); db.version(1).stores({ meta: 'key' });

function RW_PurchSupervisorEsc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(ch) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
}
function RW_PurchSupervisorStatus(s) {
    var labels = {
        Draft:'مسودة',
        Approved:'تم الاعتماد',
        Sent:'مرسل للمورد',
        'Partially Received':'استلام جزئي',
        Received:'مكتمل الاستلام',
        Cancelled:'ملغي'
    };
    return labels[s] || s || '—';
}

var App = {
    currentUser: null,
    currentOrders: [],
    currentTab: 'dashboard',
    realtimeKey: null,
    togglePass: function(){var p=RW_UI.byId('loginPass'),i=RW_UI.byId('passIcon');if(p.type==='password'){p.type='text';i.className='fa-solid fa-eye-slash';}else{p.type='password';i.className='fa-solid fa-eye';}},
    doLogin: function(){var e=RW_UI.byId('loginEmail').value.trim(),p=RW_UI.byId('loginPass').value.trim();if(!e||!p){RW_UI.byId('loginMsg').innerText='أدخل البيانات';RW_UI.byId('loginMsg').classList.remove('hidden');return;}RW_UI.byId('loginMsg').classList.add('hidden');var s=this;RW_UI.showLoader('جاري تسجيل الدخول...');RW_Auth.doLogin(e,p,function(user,err){RW_UI.hideLoader();if(err){RW_UI.byId('loginMsg').innerText=err;RW_UI.byId('loginMsg').classList.remove('hidden');}else{s.init();}});},
    init: function(){var s=this;RW_Auth.init(function(user,err){if(err||!user){if(err==='NO_SESSION')return;RW_UI.showError('فشل استعادة الجلسة');return;}var isO=user.isOwner===true,perms=Array.isArray(user.permissions)?user.permissions:[],has=isO||perms.indexOf('*')!==-1||perms.indexOf('purchases_supervisor')!==-1;if(!has){RW_UI.showError('غير مصرح');RW_Auth.doLogout();return;}RW_UI.safeText(RW_UI.byId('headerUserName'),user.name);s.currentUser=user;s.enterApp();});},
    enterApp: function(){RW_UI.byId('loginScreen').classList.add('hidden');RW_UI.byId('mainApp').classList.remove('hidden');this.switchTab('dashboard');this.startRealtime();},
    startRealtime: function(){
        var self = this;
        if (!this.currentUser || !this.currentUser.company_id || typeof RW_Realtime === 'undefined') return;
        if (this.realtimeKey) RW_Realtime.stop(this.realtimeKey);
        this.realtimeKey = RW_Realtime.start({
            appId: 'purchasing-supervisor',
            companyId: this.currentUser.company_id,
            tables: ['purchase_orders'],
            debounceMs: 500,
            reconcileMs: 60000,
            onEvent: function(event){ if (event.table === 'purchase_orders') { if (self.currentTab === 'dashboard') self.renderDashboard();
                else if (self.currentTab === 'orders') self.renderOrders(); } },
            onReconcile: function(){ if (self.currentTab === 'dashboard') self.renderDashboard();
                else if (self.currentTab === 'orders') self.renderOrders(); },
            onStatus: function(status){ console.log('[Purchasing Supervisor] Realtime:', status.status); }
        });
        if (!this.realtimeKey) console.error('[Purchasing Supervisor] Realtime rejected: verified company scope unavailable.');
    },
    stopRealtime: function(){
        if (this.realtimeKey && typeof RW_Realtime !== 'undefined') { RW_Realtime.stop(this.realtimeKey); this.realtimeKey = null; }
    },
    doLogout: function(){this.stopRealtime();var s=this;RW_Auth.doLogout(function(){RW_UI.byId('mainApp').classList.add('hidden');RW_UI.byId('loginScreen').classList.remove('hidden');});},
    switchTab: function(t){this.currentTab=t;['dashboard','orders','suppliers'].forEach(function(x){var b=RW_UI.byId('tab-'+x);if(b){b.classList.remove('bg-fuchsia-600','text-white');b.classList.add('text-gray-500');}});var a=RW_UI.byId('tab-'+t);if(a){a.classList.add('bg-fuchsia-600','text-white');a.classList.remove('text-gray-500');}if(t==='dashboard')this.renderDashboard();else if(t==='orders')this.renderOrders();else if(t==='suppliers')this.renderSuppliers();},

    renderDashboard: function(){
        var s=this; RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin"></i></div>');
        var today=new Date().toISOString().split('T')[0],firstDay=new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().split('T')[0];
        Promise.all([supabase.from('purchase_orders').select('status,total_amount').gte('po_date',firstDay).lte('po_date',today),supabase.from('suppliers').select('supplier_code')]).then(function(r){
            var orders=r[0].data||[],supp=r[1].data||[];var total=0,draft=0,sent=0,received=0;
            for(var i=0;i<orders.length;i++){total+=Number(orders[i].total_amount)||0;if(orders[i].status==='Draft')draft++;else if(orders[i].status==='Sent')sent++;else if(orders[i].status==='Received')received++;}
            var html='<h2 class="text-lg font-black mb-4">📊 مؤشرات المشتريات – الشهر</h2>';
            html+='<div class="grid grid-cols-2 gap-3 mb-4">';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">إجمالي المشتريات</p><p class="text-2xl font-black text-fuchsia-600">'+fmtNum(total)+' ج.م</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">عدد الأوامر</p><p class="text-2xl font-black text-fuchsia-600">'+orders.length+'</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">📋 مسودة</p><p class="text-xl font-black text-amber-600">'+draft+'</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">📤 مُرسلة</p><p class="text-xl font-black text-blue-600">'+sent+'</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">✅ مستلمة</p><p class="text-xl font-black text-green-600">'+received+'</p></div>';
            html+='<div class="stat-card"><p class="text-xs text-gray-400">🏭 الموردين</p><p class="text-xl font-black text-purple-600">'+supp.length+'</p></div>';
            html+='</div>';RW_UI.safeHTML(RW_UI.byId('mainContent'),html);
        });
    },

    renderOrders: async function(){
        var self = this;
        var companyId = this.currentUser && this.currentUser.company_id;
        if (!companyId) {
            RW_UI.showError('سياق الشركة غير متاح');
            return;
        }

        RW_UI.showSkeleton('mainContent', 3, 'card');

        try {
            var all = [];
            var offset = 0;
            var pageSize = 200;

            while (true) {
                var page = await supabase.from('purchase_orders')
                    .select('id,company_id,po_code,po_date,supplier_name,branch_id,created_by,expected_delivery_date,total_amount,currency,status,notes,created_at')
                    .eq('company_id', companyId)
                    .order('po_date', {ascending:false})
                    .order('created_at', {ascending:false})
                    .order('id', {ascending:false})
                    .range(offset, offset + pageSize - 1);

                if (page.error) throw page.error;

                var batch = page.data || [];
                all = all.concat(batch);
                if (batch.length < pageSize) break;
                offset += pageSize;
            }

            var branchResult = await supabase.from('branches')
                .select('id,name')
                .eq('company_id', companyId);

            if (branchResult.error) throw branchResult.error;

            var branchMap = {};
            (branchResult.data || []).forEach(function(b){ branchMap[b.id] = b.name || ''; });

            self.currentOrders = all;

            RW_UI.safeHTML(RW_UI.byId('mainContent'),
                '<div class="flex flex-col gap-3 mb-4">' +
                  '<div><h2 class="text-lg font-black">جميع أوامر الشراء</h2>' +
                  '<p class="text-xs text-gray-500">كل أوامر الشركة لجميع مسؤولي المشتريات — إجمالي ' + all.length + ' أمر</p></div>' +
                  '<div class="grid grid-cols-1 md:grid-cols-2 gap-2">' +
                    '<input id="pws-po-search" class="w-full p-3 border rounded-xl" placeholder="ابحث برقم PO أو المورد أو مسؤول المشتريات">' +
                    '<select id="pws-po-status" class="w-full p-3 border rounded-xl">' +
                      '<option value="">كل الحالات</option>' +
                      '<option value="Draft">مسودة</option>' +
                      '<option value="Approved">تم الاعتماد</option>' +
                      '<option value="Sent">مرسل للمورد</option>' +
                      '<option value="Partially Received">استلام جزئي</option>' +
                      '<option value="Received">مكتمل الاستلام</option>' +
                      '<option value="Cancelled">ملغي</option>' +
                    '</select>' +
                  '</div>' +
                '</div>' +
                '<div class="bg-white rounded-2xl border overflow-auto">' +
                  '<table class="w-full min-w-[1050px] text-sm"><thead class="bg-slate-50"><tr>' +
                    '<th class="p-3">رقم PO</th><th class="p-3">التاريخ</th><th class="p-3">مسؤول المشتريات</th>' +
                    '<th class="p-3">المورد</th><th class="p-3">الفرع</th><th class="p-3">موعد التوريد</th>' +
                    '<th class="p-3">الحالة</th><th class="p-3">القيمة</th><th class="p-3">إجراء</th>' +
                  '</tr></thead><tbody id="pws-po-rows"></tbody></table>' +
                '</div>'
            );

            var body = RW_UI.byId('pws-po-rows');
            var search = RW_UI.byId('pws-po-search');
            var statusSelect = RW_UI.byId('pws-po-status');

            function drawRows() {
                var q = String(search.value || '').trim().toLowerCase();
                var status = statusSelect.value || '';
                var rows = self.currentOrders.filter(function(o) {
                    var haystack = [o.po_code,o.supplier_name,o.created_by,branchMap[o.branch_id]]
                        .join(' ').toLowerCase();
                    return (!q || haystack.indexOf(q) !== -1) &&
                           (!status || o.status === status);
                });

                if (!rows.length) {
                    RW_UI.safeHTML(body, '<tr><td colspan="9" class="text-center p-8 text-slate-400">لا توجد أوامر مطابقة.</td></tr>');
                    return;
                }

                var html = '';
                rows.forEach(function(o) {
                    html += '<tr class="border-t">' +
                      '<td class="p-3 font-black">' + RW_PurchSupervisorEsc(o.po_code) + '</td>' +
                      '<td class="p-3">' + RW_PurchSupervisorEsc(o.po_date || '—') + '</td>' +
                      '<td class="p-3 text-xs">' + RW_PurchSupervisorEsc(o.created_by || '—') + '</td>' +
                      '<td class="p-3">' + RW_PurchSupervisorEsc(o.supplier_name || '—') + '</td>' +
                      '<td class="p-3">' + RW_PurchSupervisorEsc(branchMap[o.branch_id] || '—') + '</td>' +
                      '<td class="p-3">' + RW_PurchSupervisorEsc(o.expected_delivery_date || '—') + '</td>' +
                      '<td class="p-3 font-bold">' + RW_PurchSupervisorEsc(RW_PurchSupervisorStatus(o.status)) + '</td>' +
                      '<td class="p-3 font-black">' + Number(o.total_amount || 0).toLocaleString() + ' ' + RW_PurchSupervisorEsc(o.currency || 'EGP') + '</td>' +
                      '<td class="p-3"><button type="button" data-pws-po-id="' + RW_PurchSupervisorEsc(o.id) + '" class="px-3 py-2 rounded-lg bg-fuchsia-50 text-fuchsia-700 font-black">عرض</button></td>' +
                    '</tr>';
                });

                RW_UI.safeHTML(body, html);

                Array.from(body.querySelectorAll('[data-pws-po-id]')).forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        self.openPO(btn.getAttribute('data-pws-po-id'));
                    });
                });
            }

            search.addEventListener('input', drawRows);
            statusSelect.addEventListener('change', drawRows);
            drawRows();

        } catch(e) {
            RW_UI.safeHTML(RW_UI.byId('mainContent'),
                '<div class="p-5 rounded-2xl bg-red-50 text-red-700 font-bold">' +
                RW_PurchSupervisorEsc(e.message || 'تعذر تحميل جميع أوامر الشراء') +
                '</div>'
            );
        }
    },

    openPO: async function(poId) {
        var self = this;
        var po = this.currentOrders.find(function(x){ return String(x.id) === String(poId); });
        if (!po) {
            RW_UI.showError('أمر الشراء غير موجود في القائمة الحالية');
            return;
        }

        RW_UI.showLoader('جاري تحميل تفاصيل أمر الشراء...');
        try {
            var details = await supabase.from('purchase_order_details')
                .select('item_code,item_name,unit,qty_ordered,qty_received,unit_price,created_at')
                .eq('po_id', po.id)
                .order('created_at', {ascending:true});

            if (details.error) throw details.error;

            var lines = details.data || [];
            var html = '<div class="text-right space-y-3">' +
              '<div class="grid grid-cols-2 gap-2">' +
                '<div class="p-3 bg-slate-50 rounded-xl"><small>المورد</small><div class="font-black">' + RW_PurchSupervisorEsc(po.supplier_name || '—') + '</div></div>' +
                '<div class="p-3 bg-slate-50 rounded-xl"><small>مسؤول المشتريات</small><div class="font-black">' + RW_PurchSupervisorEsc(po.created_by || '—') + '</div></div>' +
                '<div class="p-3 bg-slate-50 rounded-xl"><small>الحالة</small><div class="font-black">' + RW_PurchSupervisorEsc(RW_PurchSupervisorStatus(po.status)) + '</div></div>' +
                '<div class="p-3 bg-slate-50 rounded-xl"><small>موعد التوريد</small><div class="font-black">' + RW_PurchSupervisorEsc(po.expected_delivery_date || '—') + '</div></div>' +
              '</div>' +
              '<div class="overflow-auto border rounded-xl"><table class="w-full text-sm"><thead class="bg-slate-50"><tr>' +
                '<th class="p-2">الصنف</th><th class="p-2">المطلوب</th><th class="p-2">المستلم</th><th class="p-2">المتبقي</th><th class="p-2">السعر</th>' +
              '</tr></thead><tbody>';

            if (!lines.length) {
                html += '<tr><td colspan="5" class="p-4 text-center text-slate-400">لا توجد بنود مسجلة في أمر الشراء.</td></tr>';
            } else {
                lines.forEach(function(x) {
                    var ordered = Number(x.qty_ordered || 0);
                    var received = Number(x.qty_received || 0);
                    html += '<tr class="border-t">' +
                      '<td class="p-2"><b>' + RW_PurchSupervisorEsc(x.item_name || x.item_code) + '</b><div class="text-xs text-slate-400">' + RW_PurchSupervisorEsc(x.item_code) + '</div></td>' +
                      '<td class="p-2 text-center">' + ordered + ' ' + RW_PurchSupervisorEsc(x.unit || '') + '</td>' +
                      '<td class="p-2 text-center">' + received + '</td>' +
                      '<td class="p-2 text-center font-black">' + Math.max(0, ordered - received) + '</td>' +
                      '<td class="p-2 text-center">' + Number(x.unit_price || 0).toLocaleString() + '</td>' +
                    '</tr>';
                });
            }

            html += '</tbody></table></div>' +
              '<div class="font-black text-lg">الإجمالي: ' + Number(po.total_amount || 0).toLocaleString() + ' ' + RW_PurchSupervisorEsc(po.currency || 'EGP') + '</div>' +
              '<p class="text-xs text-slate-500">الاعتماد يصرح بالتوريد والاستلام فقط، ولا يثبت استلامًا أو حركة مخزون أو قيدًا ماليًا.</p>' +
            '</div>';

            RW_UI.hideLoader();

            var canApprove = po.status === 'Draft' && lines.some(function(x){ return Number(x.qty_ordered || 0) > 0; });
            var result = await Swal.fire({
                title: 'أمر الشراء ' + RW_PurchSupervisorEsc(po.po_code),
                html: html,
                width: '1000px',
                showCloseButton: true,
                showCancelButton: canApprove,
                showConfirmButton: canApprove,
                confirmButtonText: 'اعتماد أمر الشراء',
                cancelButtonText: 'إغلاق',
                confirmButtonColor: '#059669'
            });

            if (canApprove && result.isConfirmed) {
                self.approvePO(po.id);
            }
        } catch(e) {
            RW_UI.hideLoader();
            RW_UI.showError(e.message || 'تعذر تحميل تفاصيل أمر الشراء');
        }
    },

    approvePO: function(poId) {
        var self = this;
        if (!poId || !this.currentUser) {
            RW_UI.showError('بيانات الاعتماد غير مكتملة');
            return;
        }

        var perms = Array.isArray(this.currentUser.permissions) ? this.currentUser.permissions : [];
        if (!(this.currentUser.isOwner === true || perms.indexOf('*') !== -1 || perms.indexOf('purchases_supervisor') !== -1)) {
            RW_UI.showError('اعتماد PO يتطلب صلاحية مشرف المشتريات');
            return;
        }

        var operationId = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : 'PO-APPROVE-' + String(poId) + '-' + String(Date.now());

        RW_UI.showLoader('جاري اعتماد أمر الشراء...');
        RW_API.call('save-purchase-order', {
            operation: 'APPROVE_PO',
            payload: { id: poId },
            operation_id: operationId
        }, function(json, err) {
            RW_UI.hideLoader();

            if (err || !json || json.success !== true) {
                RW_UI.showError((json && json.msg) || err || 'فشل اعتماد أمر الشراء');
                return;
            }

            Swal.fire({
                icon: 'success',
                title: 'تم اعتماد أمر الشراء',
                text: 'أصبح الأمر مصرحًا بتوريده والاستلام به في المخزن.'
            }).then(function() {
                self.renderOrders();
            });
        });
    },

    renderSuppliers: function(){
        var s=this; RW_UI.safeHTML(RW_UI.byId('mainContent'),'<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin"></i></div>');
        supabase.from('suppliers').select('supplier_code,name,phone,area,accounts_payable').order('accounts_payable',{ascending:false}).then(function(r){var supp=r.data||[],html='<h2 class="text-lg font-black mb-4">🏭 الموردين</h2>';
        if(!supp.length){html+='<div class="text-center text-gray-400 py-10">لا يوجد موردين</div>';}else{for(var i=0;i<supp.length;i++){html+='<div class="card mb-2"><div class="flex justify-between"><span class="font-bold">'+supp[i].name+'</span><span class="font-black text-red-600">'+fmtNum(supp[i].accounts_payable)+' ج.م</span></div><p class="text-xs text-gray-400">'+supp[i].supplier_code+' | '+supp[i].phone+' | '+supp[i].area+'</p></div>';}}
        RW_UI.safeHTML(RW_UI.byId('mainContent'),html);});
    }
};
RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded',function(){App.init();});
