<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>التلي سيلز | الروائع ERP</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e40af">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="التلي سيلز">
    <meta name="format-detection" content="telephone=no">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden;position:fixed;width:100%}
        body{font-family:'Cairo',sans-serif;background:#f1f5f9;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;touch-action:manipulation;-webkit-touch-callout:none}
        :root{--sat:env(safe-area-inset-top);--sar:env(safe-area-inset-right);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left)}
        .auth-container{background:linear-gradient(135deg,#1e3a8a 0%,#1e40af 40%,#2563eb 100%)}
        .input-field:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
        .no-scrollbar::-webkit-scrollbar{display:none}
        .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .animate-slide-up{animation:slideUp 0.3s ease-out}
        @keyframes pulse-badge{0%{transform:scale(1)}50%{transform:scale(1.3)}100%{transform:scale(1)}}
        .pulse-badge{animation:pulse-badge 0.3s ease-in-out}
        .fab{box-shadow:0 4px 15px rgba(37,99,235,0.4);transition:transform 0.2s ease,box-shadow 0.2s ease}
        .fab:active{transform:scale(0.92);box-shadow:0 2px 8px rgba(37,99,235,0.3)}
        .skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

<!-- شاشة الدخول -->
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md">
        <div class="text-center mb-6">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-blue-800 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
                <i class="fa-solid fa-headset text-white text-3xl"></i>
            </div>
            <h1 class="font-black text-2xl text-gray-800">الروائع</h1>
            <p class="text-xs text-gray-400 font-bold mt-1">التلي سيلز</p>
        </div>
        <h2 class="text-lg font-bold text-gray-700 text-center mb-4">تسجيل الدخول إلى حسابك</h2>
        <div class="space-y-3">
            <div><label class="block text-xs font-bold text-gray-600 mb-1">البريد الإلكتروني <span class="text-red-500">*</span></label><input id="loginEmail" type="email" placeholder="example@domain.com" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-blue-600 focus:bg-white outline-none font-bold text-sm transition-all"></div>
            <div><label class="block text-xs font-bold text-gray-600 mb-1">كلمة السر <span class="text-red-500">*</span></label><div class="relative"><input id="loginPass" type="password" placeholder="••••••••" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-blue-600 focus:bg-white outline-none font-bold text-sm transition-all pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-gray-600"><i id="passIcon" class="fa-solid fa-eye"></i></button></div></div>
            <div class="flex justify-between items-center text-sm"><label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" id="rememberMe" class="accent-blue-600 w-4 h-4"> <span class="text-xs text-gray-600 font-bold">تذكرني</span></label><button onclick="App.forgotPassword()" class="text-blue-600 font-bold text-xs hover:underline">نسيت كلمة المرور؟</button></div>
        </div>
        <button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3.5 rounded-xl font-black text-sm shadow-lg shadow-blue-200 hover:shadow-xl transition-all mt-4">تسجيل الدخول</button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="mainApp" class="hidden flex flex-col h-full bg-gray-100">
    <header class="bg-blue-700 text-white px-4 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0" style="padding-top:max(12px,var(--sat));min-height:56px">
        <div class="flex items-center gap-2"><i class="fa-solid fa-headset"></i><span class="font-black text-sm">التلي سيلز</span></div>
        <div class="flex items-center gap-3"><span id="connDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span><span id="connLabel" class="text-[11px] font-bold">متصل</span><button onclick="App.syncNow()" class="bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-solid fa-rotate text-xs"></i></button><button onclick="App.doLogout()" class="bg-white/10 w-8 h-8 rounded-full flex items-center justify-center"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button></div>
    </header>
    <div id="creditBanner" class="hidden text-center py-2 text-sm font-bold flex-shrink-0"></div>
    <main id="mainContent" class="flex-1 overflow-hidden flex flex-col"></main>
    <div id="floatingCart" class="hidden mx-3 mb-2 bg-gray-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center cursor-pointer active:scale-[0.98] transition-transform z-20 flex-shrink-0" onclick="App.openCartModal()">
        <div class="flex items-center gap-3"><div class="bg-blue-600 w-10 h-10 rounded-full flex items-center justify-center font-black text-sm" id="cartBadgeCount">0</div><div><div class="font-bold text-sm">سلة المشتريات</div><div class="text-xs text-gray-400" id="cartBadgeSummary">لا توجد أصناف</div></div></div>
        <div class="text-left"><div class="text-xs text-gray-400">الإجمالي</div><div class="font-black text-lg" id="cartBadgeTotal">0.00</div></div>
    </div>
    <nav class="bg-white border-t flex items-center flex-shrink-0 z-30 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] relative" style="padding-bottom:max(12px,var(--sab));min-height:60px">
        <button onclick="App.switchTab('today')" class="tab-btn flex-1 flex flex-col items-center justify-center py-1 px-1 text-blue-600" data-tab="today"><i class="fa-solid fa-calendar-check text-xl mb-0.5"></i><span class="text-[10px] font-bold">اليوم</span></button>
        <button onclick="App.switchTab('products')" class="tab-btn flex-1 flex flex-col items-center justify-center py-1 px-1 text-gray-400" data-tab="products"><i class="fa-solid fa-box text-xl mb-0.5"></i><span class="text-[10px] font-bold">المنتجات</span></button>
        <div class="flex-1 flex items-center justify-center relative" style="margin-top:-28px"><button onclick="App.openNewOrder()" class="fab w-14 h-14 bg-blue-600 rounded-full flex items-center justify-center text-white text-2xl"><i class="fa-solid fa-plus"></i></button></div>
        <button onclick="App.switchTab('my-orders')" class="tab-btn flex-1 flex flex-col items-center justify-center py-1 px-1 text-gray-400 relative" data-tab="my-orders"><i class="fa-solid fa-clipboard-list text-xl mb-0.5"></i><span class="text-[10px] font-bold">أوردراتي</span><span id="pendingBadge" class="hidden absolute -top-1 right-0 bg-red-500 text-white text-[9px] w-5 h-5 rounded-full flex items-center justify-center font-black">0</span></button>
        <button onclick="App.switchTab('more')" class="tab-btn flex-1 flex flex-col items-center justify-center py-1 px-1 text-gray-400" data-tab="more"><i class="fa-solid fa-ellipsis text-xl mb-0.5"></i><span class="text-[10px] font-bold">المزيد</span></button>
    </nav>
</div>

<!-- مودال السلة -->
<div id="cartModal" class="fixed inset-0 z-50 hidden flex flex-col justify-end">
    <div class="absolute inset-0 bg-black/50" onclick="App.closeCartModal()"></div>
    <div class="bg-white rounded-t-3xl flex flex-col animate-slide-up" style="max-height:85vh">
        <div class="p-4 border-b flex justify-between items-center flex-shrink-0"><h2 class="font-black text-lg">مراجعة الأوردر</h2><button onclick="App.closeCartModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button></div>
        <div id="cartModalBody" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar"></div>
        <div class="p-4 border-t bg-gray-50 flex-shrink-0">
            <div class="flex justify-between font-bold text-lg mb-3"><span>الإجمالي النهائي:</span><span class="text-emerald-600" id="cartModalTotal">0.00</span></div>
            <button onclick="App.submitOrder()" class="w-full bg-emerald-600 text-white py-3.5 rounded-xl font-black text-sm shadow-lg active:scale-[0.98] transition"><i class="fa-solid fa-check ml-2"></i> حفظ الأوردر</button>
        </div>
    </div>
</div>

<!-- مودال العملاء -->
<div id="customerModal" class="fixed inset-0 z-50 hidden flex flex-col justify-end">
    <div class="absolute inset-0 bg-black/50" onclick="App.closeCustomerModal()"></div>
    <div class="bg-white rounded-t-3xl flex flex-col animate-slide-up" style="max-height:85vh">
        <div class="p-4 border-b flex justify-between items-center flex-shrink-0"><h2 class="font-black text-lg">العملاء</h2><button onclick="App.closeCustomerModal()" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="p-4 flex-shrink-0"><input type="text" id="customerSearchInput" oninput="App.searchCustomersModal(this.value)" placeholder="🔍 ابحث عن عميل..." class="w-full p-3 bg-gray-50 border rounded-xl text-sm font-bold"></div>
        <div id="customerModalBody" class="flex-1 overflow-y-auto p-4 space-y-2 no-scrollbar"><div class="text-center text-gray-400 py-8">اكتب للبحث عن عميل...</div></div>
    </div>
</div>

<script>
// ============================================================
// دوال مساعدة
// ============================================================
function fmtNum(n) { return Number(n || 0).toLocaleString('ar-EG', {minimumFractionDigits: 2}); }

var App = (function() {
    var self = {};
    var db = RW_DB.getDB('Telesales');
    var currentUser = null, pubUserId = null, cart = [], selCust = null, selBranch = null, branchMap = {};
    var delFee = 0, taxRate = 0, minAmt = 0, currentTab = 'today', isListView = true;
    var catalogListView = false, catalogActiveCat = 'الكل';
    var productsCache = [], customersCache = [];
    var _todayInterval = null;

    // ==================== دوال المصادقة ====================
    self.togglePass = function() {
        var p = RW_UI.byId('loginPass'), i = RW_UI.byId('passIcon');
        if (p.type === 'password') { p.type = 'text'; i.className = 'fa-solid fa-eye-slash'; }
        else { p.type = 'password'; i.className = 'fa-solid fa-eye'; }
    };

    self.forgotPassword = function() {
        var email = RW_UI.byId('loginEmail').value.trim();
        if (!email) { RW_UI.toast('أدخل بريدك الإلكتروني أولاً', 'warning'); return; }
        RW_UI.showLoader('جاري إرسال رابط التعيين...');
        supabase.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/reset-password' }).then(function(res) {
            RW_UI.hideLoader();
            if (res.error) RW_UI.toast(res.error.message, 'error');
            else RW_UI.toast('تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك', 'success');
        }).catch(function() { RW_UI.hideLoader(); RW_UI.toast('فشل الاتصال بالخادم', 'error'); });
    };

    self.doLogin = function() {
        var email = RW_UI.byId('loginEmail').value.trim(), pass = RW_UI.byId('loginPass').value.trim();
        if (!email || !pass) { RW_UI.byId('loginMsg').innerText = 'أدخل البريد الإلكتروني وكلمة المرور'; RW_UI.byId('loginMsg').classList.remove('hidden'); return; }
        RW_UI.byId('loginMsg').classList.add('hidden');
        RW_UI.showLoader('جاري تسجيل الدخول...');
        RW_Auth.doLogin(email, pass, function(user, err) {
            RW_UI.hideLoader();
            if (err) { RW_UI.byId('loginMsg').innerText = err; RW_UI.byId('loginMsg').classList.remove('hidden'); }
            else {
                if (RW_UI.byId('rememberMe').checked) localStorage.setItem('telesales_remember_email', email);
                else localStorage.removeItem('telesales_remember_email');
                self.init(user);
            }
        });
    };

    self.init = function(user) {
        var remembered = localStorage.getItem('telesales_remember_email');
        if (remembered) { RW_UI.byId('loginEmail').value = remembered; RW_UI.byId('rememberMe').checked = true; }
        function _setup(u) {
            if (!u) { RW_UI.showError('فشل استعادة الجلسة'); return; }
            var isOwner = u.isOwner, perms = u.permissions || [];
            if (!isOwner && perms.indexOf('orders') === -1 && perms.indexOf('telesales') === -1) { RW_UI.showError('غير مصرح – ليس لديك صلاحية التلي سيلز'); RW_Auth.doLogout(); return; }
            currentUser = u; pubUserId = u.id;
            supabase.from('app_settings').select('*').limit(1).single().then(function(sRes) { if (sRes.data) { delFee = Number(sRes.data.delivery_fee) || 0; taxRate = Number(sRes.data.tax_rate) || 0; minAmt = Number(sRes.data.min_invoice_amount) || 0; } });
            // ✅ إصلاح الصور: تحميل كاش الصور أولاً
            RW_ImageCache.loadAll(function() {
                self.enterApp();
            });
        }
        if (user) _setup(user);
        else RW_Auth.init(function(u, err) { if (err || !u) { if (err === 'NO_SESSION') return; RW_UI.showError('فشل استعادة الجلسة'); return; } _setup(u); });
    };

    self.enterApp = function() {
        RW_UI.byId('loginScreen').classList.add('hidden'); RW_UI.byId('mainApp').classList.remove('hidden');
        self.updateConnectionStatus();
        window.addEventListener('online', function() { self.updateConnectionStatus(); self.syncPendingOrders(); });
        window.addEventListener('offline', function() { self.updateConnectionStatus(); });
        self.syncDown().then(function() { self.loadBranches(); });
        self.switchTab('today');
    };

    self.doLogout = function() {
        if (_todayInterval) clearInterval(_todayInterval);
        RW_Auth.doLogout(function() { cart = []; selCust = null; RW_UI.byId('mainApp').classList.add('hidden'); RW_UI.byId('loginScreen').classList.remove('hidden'); RW_UI.byId('loginEmail').value = ''; RW_UI.byId('loginPass').value = ''; RW_UI.byId('loginMsg').classList.add('hidden'); });
    };

    self.updateConnectionStatus = function() { RW_UI.updateConnectionStatus('connDot', 'connLabel'); };

    self.syncDown = function() {
        return Promise.all([
            supabase.from('customers').select('*').then(function(r) { customersCache = r.data || []; return db.customers.clear().then(function() { return db.customers.bulkPut(r.data || []); }); }),
            supabase.from('items').select('*').then(function(r) { productsCache = r.data || []; return db.items.clear().then(function() { return db.items.bulkPut(r.data || []); }); }),
            supabase.from('stock_branches').select('*').then(function(r) { return db.stock.clear().then(function() { return db.stock.bulkPut(r.data || []); }); }),
            supabase.from('branches').select('*').then(function(r) { return db.branches.clear().then(function() { return db.branches.bulkPut(r.data || []); }); })
        ]);
    };

    self.syncNow = function() {
        if (!navigator.onLine) { RW_UI.toast('لا يوجد اتصال', 'warning'); return; }
        RW_UI.showLoader('جاري المزامنة...');
        self.syncDown().then(function() { RW_UI.hideLoader(); self.loadBranches(); self.syncPendingOrders(); RW_UI.toast('تمت المزامنة', 'success'); }).catch(function() { RW_UI.hideLoader(); RW_UI.toast('فشلت المزامنة', 'error'); });
    };

    self.switchTab = function(tab) {
        currentTab = tab;
        var btns = document.querySelectorAll('.tab-btn');
        for (var i = 0; i < btns.length; i++) { btns[i].classList.remove('text-blue-600'); btns[i].classList.add('text-gray-400'); if (btns[i].getAttribute('data-tab') === tab) { btns[i].classList.remove('text-gray-400'); btns[i].classList.add('text-blue-600'); } }
        var fc = RW_UI.byId('floatingCart');
        if (tab === 'new-order' || tab === 'products') {
            if (fc && cart.length > 0) fc.classList.remove('hidden');
        } else {
            if (fc) fc.classList.add('hidden');
        }
        if (tab === 'today') self.renderTodayView();
        else if (tab === 'products') self.renderProductsView();
        else if (tab === 'my-orders') self.renderOrdersView();
        else if (tab === 'more') self.renderMoreView();
    };

    self.openNewOrder = function() { cart = []; selCust = null; currentTab = 'new-order'; self.renderNewOrderView(); };

    // ==================== تبويب "اليوم" – Call Planner ====================
    self.renderTodayView = function() {
        var c = RW_UI.byId('mainContent'); if (!c) return;
        var h = '<div class="flex-1 overflow-y-auto p-4 no-scrollbar">';
        h += '<div class="mb-4"><p class="text-gray-400 text-sm">صباح الخير، <span class="font-bold text-gray-700">' + (currentUser ? (currentUser.name || currentUser.email) : 'زميل') + '</span> 👋</p></div>';
        h += '<div class="bg-white rounded-2xl shadow-sm border p-4 mb-4"><h3 class="font-bold text-lg mb-2">📊 ملخص الأداء</h3><div id="todaySummary"></div></div>';
        h += '<div class="bg-white rounded-2xl shadow-sm border p-4"><h3 class="font-bold text-lg mb-2">🔥 فرص اليوم</h3><div id="todayOpportunities"></div></div>';
        h += '</div>';
        RW_UI.safeHTML(c, h);
        RW_UI.showSkeleton('todaySummary', 2, 'card');
        RW_UI.showSkeleton('todayOpportunities', 3, 'card');
        self.loadTodaySummary(); self.loadTodayOpportunities();
        clearInterval(_todayInterval);
        _todayInterval = setInterval(function() { self.loadTodaySummary(); self.loadTodayOpportunities(); }, 30000);
    };

    self.loadTodaySummary = function() {
        var today = new Date().toISOString().split('T')[0];
        if (!currentUser) return;
        supabase.from('orders').select('id, total_amount').eq('created_by', currentUser.email).eq('order_date', today).then(function(res) {
            var orders = res.data || [], total = 0;
            for (var i = 0; i < orders.length; i++) total += Number(orders[i].total_amount) || 0;
            RW_UI.safeHTML(RW_UI.byId('todaySummary'), '<div class="grid grid-cols-2 gap-3"><div class="text-center p-3 bg-blue-50 rounded-xl"><p class="text-xs text-gray-500">أوردرات اليوم</p><p class="text-2xl font-black text-blue-600">' + orders.length + '</p></div><div class="text-center p-3 bg-emerald-50 rounded-xl"><p class="text-xs text-gray-500">قيمة اليوم</p><p class="text-2xl font-black text-emerald-600">' + fmtNum(total) + ' ج.م</p></div></div>');
        }).catch(function() { RW_UI.showEmptyState('todaySummary', 'تعذر تحميل الملخص', '📡'); });
    };

    self.loadTodayOpportunities = function() {
        var d = new Date(); d.setDate(d.getDate() - 30); var from = d.toISOString().split('T')[0];
        supabase.from('orders').select('customer_id, customer_name, order_date, total_amount').gte('order_date', from).order('order_date', { ascending: false }).limit(200).then(function(res) {
            var orders = res.data || [], map = {};
            for (var i = 0; i < orders.length; i++) { var o = orders[i], cid = o.customer_id || o.customer_name; if (!map[cid]) map[cid] = { name: o.customer_name || cid, last: o.order_date, cnt: 0, val: 0, days: 0 }; map[cid].cnt++; map[cid].val += Number(o.total_amount) || 0; if (o.order_date > map[cid].last) map[cid].last = o.order_date; }
            var today = new Date();
            for (var k in map) { if (map.hasOwnProperty(k)) { var ld = new Date(map[k].last); map[k].days = Math.floor((today - ld) / (1000 * 60 * 60 * 24)); } }
            var opps = []; for (var k2 in map) { if (map.hasOwnProperty(k2) && map[k2].cnt >= 2) opps.push(map[k2]); }
            opps.sort(function(a, b) { return b.days - a.days; }); opps = opps.slice(0, 8);
            if (!opps.length) { RW_UI.showEmptyState('todayOpportunities', 'لا توجد فرص كافية بعد', '☕'); return; }
            var h = '';
            for (var j = 0; j < opps.length; j++) {
                var op = opps[j], rc = op.days > 15 ? 'border-red-200 bg-red-50' : (op.days > 7 ? 'border-yellow-200 bg-yellow-50' : 'border-green-200 bg-green-50');
                var ri = op.days > 15 ? '🔴' : (op.days > 7 ? '🟡' : '🟢'), avg = Math.round(op.val / op.cnt);
                h += '<div class="p-3 rounded-xl border mb-2 ' + rc + '"><div class="flex justify-between items-center"><div><span class="font-bold">' + op.name + '</span><span class="text-xs text-gray-500 mr-2">آخر طلب: منذ ' + op.days + ' يوم</span></div><span class="text-lg">' + ri + '</span></div><div class="flex justify-between text-xs text-gray-500 mt-1"><span>متوسط الطلب: ' + fmtNum(avg) + ' ج.م</span><span>عدد الطلبات: ' + op.cnt + '</span></div></div>';
            }
            RW_UI.safeHTML(RW_UI.byId('todayOpportunities'), h);
        }).catch(function() { RW_UI.showEmptyState('todayOpportunities', 'تعذر تحميل الفرص', '📡'); });
    };

    // ==================== شاشة أوردر جديد ====================
    self.renderNewOrderView = function() {
        var c = RW_UI.byId('mainContent'); if (!c) return;
        RW_UI.showSkeleton('mainContent', 4, 'card');
        var h = '<div class="flex-1 flex flex-col overflow-hidden">';

    self.toggleViewMode = function() { isListView = !isListView; var i = RW_UI.byId('viewModeIcon'); if (i) i.className = 'fa-solid ' + (isListView ? 'fa-list' : 'fa-grip'); self.renderAllProducts(); };

    self.showRecentCustomers = function() {
        var row = RW_UI.byId('recentCustomersRow'); if (!row) return;
        db.orders.orderBy('created_at').reverse().limit(10).toArray().then(function(orders) {
            var codes = [];
            for (var i = 0; i < orders.length; i++) { if (orders[i].customer_code && codes.indexOf(orders[i].customer_code) === -1) codes.push(orders[i].customer_code); if (codes.length >= 5) break; }

            db.customers.where('customer_code').anyOf(codes).toArray().then(function(custs) {
                var h = '';
                for (var j = 0; j < custs.length; j++) { var c = custs[j]; h += '<button onclick="App.selectCustomer(\'' + c.customer_code + '\')" class="whitespace-nowrap bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full text-xs font-bold active:bg-blue-100 flex-shrink-0"><i class="fa-solid fa-clock-rotate-left ml-1 text-blue-400"></i>' + (c.name || c.customer_code) + '</button>'; }
                RW_UI.safeHTML(row, h);
            });
        });
    };

    self.searchCustomers = function(q) {
        var r = RW_UI.byId('custResults'); if (!r) return;
        if (!q || !q.trim()) { RW_UI.safeHTML(r, ''); return; }
        var s = q.toLowerCase();
        db.customers.toArray().then(function(all) {
            var f = [];
            for (var i = 0; i < all.length; i++) { var c = all[i]; if ((c.name || '').toLowerCase().indexOf(s) !== -1 || (c.customer_code || '').toLowerCase().indexOf(s) !== -1 || (c.phone || '').indexOf(s) !== -1 || (c.area || '').toLowerCase().indexOf(s) !== -1) f.push(c); if (f.length >= 10) break; }
            if (!f.length) { RW_UI.safeHTML(r, '<div class="text-center text-gray-400 p-3 bg-white rounded-xl text-sm">لا توجد نتائج</div>'); return; }
            var h = '';
            for (var j = 0; j < f.length; j++) { var cu = f[j], dc = Number(cu.debt) > 0 ? 'text-red-500' : 'text-green-600'; h += '<div onclick="App.selectCustomer(\'' + cu.customer_code + '\')" class="bg-white p-3 rounded-xl shadow-sm border cursor-pointer hover:bg-blue-50 active:bg-blue-100"><div class="font-bold text-sm">' + (cu.name || '') + '</div><div class="text-xs text-gray-400">' + (cu.customer_code || '') + ' - ' + (cu.area || '') + ' | الرصيد: <span class="' + dc + ' font-bold">' + fmtNum(cu.debt) + '</span></div></div>'; }
            RW_UI.safeHTML(r, h);
        });

    self.selectCustomer = function(code) {
        db.customers.get(code).then(function(c) {
            if (!c) return; selCust = c;
            var limit = Number(c.credit_limit) || 0, debt = Number(c.debt) || 0, pct = limit > 0 ? (debt / limit) * 100 : 0;
            var banner = RW_UI.byId('creditBanner');
            if (pct >= 100) { banner.className = 'text-center py-2 text-sm font-bold flex-shrink-0 bg-red-500 text-white'; banner.innerHTML = '⛔ العميل تجاوز الحد الائتماني (' + fmtNum(debt) + ' / ' + fmtNum(limit) + ')'; }
            else if (pct >= 75) { banner.className = 'text-center py-2 text-sm font-bold flex-shrink-0 bg-yellow-100 text-yellow-800 border-b border-yellow-200'; banner.innerHTML = '⚠️ العميل يقترب من الحد الائتماني (' + Math.round(pct) + '%)'; }
            else { banner.className = 'hidden'; }
            var info = RW_UI.byId('selectedCustInfo'); if (info) { info.classList.remove('hidden'); info.innerHTML = '<div class="flex justify-between items-center"><div><span class="font-black text-blue-800">' + (c.name || '') + '</span><span class="text-xs text-blue-500 mr-2">' + (c.area || '') + '</span></div><button onclick="App.clearCustomer()" class="text-xs text-red-500 font-bold">✕ تغيير</button></div>'; }
            RW_UI.byId('custSearch').value = ''; RW_UI.safeHTML(RW_UI.byId('custResults'), ''); RW_UI.toast('تم اختيار: ' + (c.name || code), 'success');
        });
    };

    self.clearCustomer = function() { selCust = null; var b = RW_UI.byId('creditBanner'); if (b) b.className = 'hidden'; var i = RW_UI.byId('selectedCustInfo'); if (i) i.classList.add('hidden'); };

    self.loadBranches = function() {
        db.branches.toArray().then(function(br) { branchMap = {}; var h = '<option value="">-- اختر الفرع --</option>'; for (var i = 0; i < br.length; i++) { branchMap[br[i].branch_code] = br[i].id; h += '<option value="' + br[i].branch_code + '">' + (br[i].name || br[i].branch_code) + '</option>'; } var sel = RW_UI.byId('branchSel'); if (sel) RW_UI.safeHTML(sel, h); });
    };

    self.onBranchChange = function(v) { selBranch = v || null; self.renderAllProducts(); };

    self.getAvail = function(itemId) {
        var bid = selBranch ? branchMap[selBranch] : null;
        return db.stock.where('item_id').equals(itemId).toArray().then(function(r) {
            if (bid) { for (var i = 0; i < r.length; i++) { if (r[i].branch_id === bid) return Math.max(0, (Number(r[i].qty) || 0) - (Number(r[i].allocated_qty) || 0)); } return 0; }
            var t = 0; for (var j = 0; j < r.length; j++) t += Math.max(0, (Number(r[j].qty) || 0) - (Number(r[j].allocated_qty) || 0)); return t;
        });
    };

    self.renderAllProducts = function() {
        var c = RW_UI.byId('productsContainer'); if (!c) return;
        if (!selBranch) { RW_UI.safeHTML(c, '<div class="text-center text-amber-500 py-10 bg-white rounded-xl">اختر فرعاً أولاً</div>'); return; }
        RW_UI.showSkeleton('productsContainer', 4, 'card');
        db.items.toArray().then(function(items) {
            if (!items.length) { RW_UI.showEmptyState('productsContainer', 'لا توجد منتجات', '📦'); return; }
            var promises = []; for (var i = 0; i < items.length; i++) promises.push(self.getAvail(items[i].id));
            Promise.all(promises).then(function(avails) {
                var h = isListView ? '<div class="space-y-2">' : '<div class="grid grid-cols-2 gap-2">';
                for (var k = 0; k < items.length; k++) h += self._renderProductCard(items[k], avails[k], isListView);
                h += '</div>'; RW_UI.safeHTML(c, h);
            });
        });
    };

// ✅ دالة عرض المنتج – الإصلاح النهائي
// السلوك مربوط بـ currentTab:
//   - في وضع 'products': فتح تفاصيل المنتج
//   - في وضع 'new-order': إضافة المنتج للسلة
self._renderProductCard = function(it, avail, useListView) {
    var ic = it.item_code || '';
    var nm = it.name || '';
    var pr = Number(it.sales_price) || 0;
    var unit = it.unit || 'حبة';
    var desc = it.description || '';
    var imgUrl = it.image_url || '';
    var inCart = 0;
    for (var x = 0; x < cart.length; x++) { if (cart[x].code === ic) { inCart = cart[x].qty; break; } }
    var sc = avail > 10 ? 'bg-green-500' : avail > 0 ? 'bg-yellow-500' : 'bg-red-500';
    var st = avail > 10 ? 'متوفر' : avail > 0 ? 'باقي ' + avail : 'نافد';
    
    // ✅ تحديد السلوك بناءً على التبويب الحالي
    var isCatalog = (currentTab === 'products');
    var cardOnClick = '';
    if (isCatalog) {
        cardOnClick = 'onclick="App.showProductDetail(\'' + ic + '\',\'' + nm.replace(/'/g, "\\'") + '\',\'' + unit + '\',' + pr + ',' + avail + ',\'' + desc.replace(/'/g, "\\'") + '\',\'' + imgUrl + '\')"';
    } else {
        cardOnClick = 'onclick="App.addToCart(\'' + ic + '\')"';
    }
    
    if (useListView) {
        var imgHtml = '';
        if (imgUrl) {
            imgHtml = '<img src="' + imgUrl + '" class="w-12 h-12 rounded-lg object-cover flex-shrink-0" onerror="this.style.display=\'none\'">';
        } else {
            imgHtml = '<div class="w-12 h-12 bg-gradient-to-br from-slate-100 to-slate-200 rounded-lg flex items-center justify-center text-slate-400 flex-shrink-0"><i class="fa-solid fa-box"></i></div>';
        }
        var h = '<div class="bg-white p-3 rounded-xl shadow-sm border flex items-center gap-3" ' + cardOnClick + '>' + imgHtml;
        h += '<div class="flex-1 min-w-0"><div class="font-bold text-sm truncate">' + nm + '</div><div class="text-xs text-gray-400">' + ic + '</div><div class="flex items-center gap-1 mt-1"><span class="w-2 h-2 rounded-full ' + sc + '"></span><span class="text-[10px] text-gray-500">' + st + '</span></div></div>';
        h += '<div class="text-left"><div class="font-black text-blue-700 text-sm">' + fmtNum(pr) + '</div>';
        if (inCart > 0) {
            h += '<div class="flex items-center gap-1 mt-1"><button onclick="event.stopPropagation();App.decCart(\'' + ic + '\')" class="w-6 h-6 bg-gray-100 rounded-full text-xs font-black">-</button><span class="text-xs font-black w-5 text-center">' + inCart + '</span><button onclick="event.stopPropagation();App.addToCart(\'' + ic + '\')" class="w-6 h-6 bg-blue-600 text-white rounded-full text-xs font-black">+</button></div>';
        } else {
            h += '<button onclick="event.stopPropagation();App.addToCart(\'' + ic + '\')" class="mt-1 w-8 h-8 bg-blue-600 text-white rounded-full text-xs flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>';
        }
        h += '</div></div>';
        return h;
    } else {
        // ✅ وضع الشبكة
        var imgG = '';
        if (imgUrl) {
            imgG = '<img src="' + imgUrl + '" alt="' + nm + '" class="absolute inset-0 w-full h-full object-contain p-3 hover:scale-105 transition-transform duration-300" loading="lazy" onerror="this.style.display=\'none\'">';
        } else {
            imgG = '<div class="absolute inset-0 w-full h-full flex items-center justify-center text-slate-400"><i class="fa-solid fa-box text-4xl"></i></div>';
        }
        
        var h2 = '<div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col cursor-pointer active:scale-[0.98] transition" ' + cardOnClick + '>';
        h2 += '<div class="relative pt-[100%] bg-gray-50 overflow-hidden">' + imgG;
        h2 += '<span class="absolute top-2 right-2 w-3 h-3 rounded-full ' + sc + ' border-2 border-white shadow-sm"></span>';
        if (Number(it.discount_percent) > 0) {
            h2 += '<span class="absolute bottom-2 left-2 bg-red-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full">-' + it.discount_percent + '%</span>';
        }
        h2 += '</div><div class="p-2 flex flex-col flex-1"><div class="font-bold text-xs truncate mb-1">' + nm + '</div>';
        h2 += '<div class="mt-auto flex justify-between items-center"><span class="font-black text-blue-700 text-xs">' + fmtNum(pr) + '</span>';
        if (inCart > 0) {
            h2 += '<div class="flex items-center gap-1"><button onclick="event.stopPropagation();App.decCart(\'' + ic + '\')" class="w-5 h-5 bg-gray-100 rounded-full text-[10px] font-black">-</button><span class="text-[10px] font-black">' + inCart + '</span><button onclick="event.stopPropagation();App.addToCart(\'' + ic + '\')" class="w-5 h-5 bg-blue-600 text-white rounded-full text-[10px] font-black">+</button></div>';
        } else {
            h2 += '<button onclick="event.stopPropagation();App.addToCart(\'' + ic + '\')" class="w-6 h-6 bg-blue-600 text-white rounded-full text-[10px] flex items-center justify-center"><i class="fa-solid fa-plus"></i></button>';
        }
        h2 += '</div></div></div>';
        return h2;
    }
};

    // ✅ إصلاح التصنيفات – جلب من جدول categories مع fallback
    self.loadCatalogCategories = function() {
        var cd = RW_UI.byId('productCategories');
        if (!cd) return;
        RW_UI.showSkeleton('productCategories', 1, 'card');
        
        supabase.from('categories').select('category_name').order('category_name').then(function(res) {
            if (res.data && res.data.length > 0) {
                var catNames = [];
                for (var i = 0; i < res.data.length; i++) { catNames.push(res.data[i].category_name); }
                _renderCategoryButtons(catNames);
            } else { _buildCategoriesFromItems(); }
        }).catch(function() { _buildCategoriesFromItems(); });
        
        function _buildCategoriesFromItems() {
            db.items.toArray().then(function(items) {
                if (!items || !items.length) { RW_UI.safeHTML(cd, '<span class="text-xs text-gray-400">لا توجد تصنيفات</span>'); return; }
                var cats = {};
                for (var i = 0; i < items.length; i++) { var cat = items[i].category || 'أخرى'; cats[cat] = true; }
                var keys = ['الكل'];
                for (var k in cats) { if (cats.hasOwnProperty(k)) keys.push(k); }
                _renderCategoryButtons(keys);
            }).catch(function() { RW_UI.safeHTML(cd, '<span class="text-xs text-gray-400">تعذر تحميل التصنيفات</span>'); });
        }
        
        function _renderCategoryButtons(catNames) {
            var h = '';
            for (var j = 0; j < catNames.length; j++) {
                var isA = (catNames[j] === catalogActiveCat);
                h += '<button onclick="App.filterCatalogProducts(\'' + catNames[j].replace(/'/g, "\\'") + '\')" class="whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-bold ' + (isA ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600') + '">' + catNames[j] + '</button>';
            }
            RW_UI.safeHTML(cd, h);
        }
    };
    
// ✅ دالة عرض تفاصيل المنتج – تستخدم في تبويب الكتالوج

        imgHtml = '<img src="' + imgUrl + '" style="width:100%;max-height:300px;object-fit:contain;border-radius:16px;background:#f8fafc;margin-bottom:16px" onerror="this.style.display=\'none\'">';

    h += '</div>';
    
    h += '<div style="display:flex;align-items:center;justify-content:space-between;background:#f8fafc;padding:16px;border-radius:16px">';

            h += '<span style="font-weight:800;font-size:18px;color:#1e293b;min-width:24px;text-align:center">' + inCart + '</span>';
            h += '<button onclick="App.addToCart(\'' + code + '\');App.showProductDetail(\'' + code + '\',\'' + name.replace(/'/g,"\\'") + '\',\'' + unit + '\',' + price + ',' + avail + ',\'' + desc.replace(/'/g,"\\'") + '\',\'' + imgUrl + '\')" style="width:36px;height:36px;border-radius:50%;background:#2563eb;border:none;font-weight:700;font-size:18px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center">+</button>';

};
    
    self.toggleCatalogViewMode = function() { catalogListView = !catalogListView; var i = RW_UI.byId('catalogViewModeIcon'); if (i) i.className = 'fa-solid ' + (catalogListView ? 'fa-list' : 'fa-grip'); self.renderCatalogProducts(); };
    self.onCatalogBranchChange = function(v) { selBranch = v || null; self.renderCatalogProducts(); };

self.renderCatalogProducts = function(searchQuery) {
    var c = RW_UI.byId('catalogProductsContainer'); if (!c) return;
    if (!selBranch) { RW_UI.showEmptyState('catalogProductsContainer', 'اختر فرعاً لتصفح المنتجات', '🏭'); return; }
    RW_UI.showSkeleton('catalogProductsContainer', 4, 'grid');
    db.items.toArray().then(function(items) {
        if (!items.length) { RW_UI.showEmptyState('catalogProductsContainer', 'لا توجد منتجات', '📦'); return; }
        var f = items;
        if (catalogActiveCat && catalogActiveCat !== 'الكل') f = items.filter(function(i) { return (i.category || 'أخرى') === catalogActiveCat; });
        var q = (typeof searchQuery === 'string' && searchQuery.trim()) ? searchQuery.trim().toLowerCase() : '';
        if (q) f = f.filter(function(i) { return (i.name || '').toLowerCase().indexOf(q) !== -1 || (i.item_code || '').toLowerCase().indexOf(q) !== -1 || (i.barcode || '').toLowerCase().indexOf(q) !== -1; });
        if (!f.length) { RW_UI.showEmptyState('catalogProductsContainer', 'لا توجد منتجات مطابقة', '🔍'); return; }
        var promises = []; for (var i = 0; i < f.length; i++) promises.push(self.getAvail(f[i].id));
        Promise.all(promises).then(function(avails) {
            // ✅ تمرير isCatalogMode = true للتمييز عن وضع الأوردر الجديد
            var h = catalogListView ? '<div class="space-y-2">' : '<div class="grid grid-cols-2 gap-2">';
            for (var k = 0; k < f.length; k++) h += self._renderProductCard(f[k], avails[k], catalogListView);
            h += '</div>'; RW_UI.safeHTML(c, h);
        });
    }).catch(function() { RW_UI.showEmptyState('catalogProductsContainer', 'تعذر تحميل المنتجات', '📡'); });
};
    // ==================== إدارة السلة ====================
    self.addToCart = function(code) {
        db.items.get(code).then(function(it) {
            if (!it) return;
            self.getAvail(it.id).then(function(avail) {
                var ex = null; for (var i = 0; i < cart.length; i++) { if (cart[i].code === code) { ex = cart[i]; break; } }
                var cur = ex ? ex.qty : 0, nq = cur + 1;
                var mx = it.max_qty ? Number(it.max_qty) : 0;
                if (mx > 0 && nq > mx) { RW_UI.toast('الحد الأقصى: ' + mx, 'warning'); return; }
                if (nq > avail) { RW_UI.toast('المتاح: ' + avail, 'warning'); return; }
                if (ex) ex.qty = nq; else cart.push({ code: it.item_code, name: it.name, price: Number(it.sales_price) || 0, unit: it.unit || 'حبة', qty: 1 });
                self.updateFloatingCart();
                if (currentTab === 'new-order') self.renderAllProducts();
                else if (currentTab === 'products') self.renderCatalogProducts();
                if (navigator.vibrate) navigator.vibrate(30);
            });
        });
    };

    // ✅ دالة عرض كل المنتجات في وضع الأوردر الجديد – الضغط على البطاقة يضيف للسلة
self.renderAllProducts = function() {
    var c = RW_UI.byId('productsContainer');
    if (!c) return;
    
    if (!selBranch) {
        RW_UI.safeHTML(c, '<div class="text-center text-amber-500 py-10 bg-white rounded-xl">اختر فرعاً أولاً</div>');
        return;
    }
    
    RW_UI.showSkeleton('productsContainer', 4, 'card');
    
    db.items.toArray().then(function(items) {
        if (!items.length) {
            RW_UI.showEmptyState('productsContainer', 'لا توجد منتجات', '📦');
            return;
        }
        
        var promises = [];
        for (var i = 0; i < items.length; i++) {
            promises.push(self.getAvail(items[i].id));
        }
        
        Promise.all(promises).then(function(avails) {
            var h = '';
            if (isListView) {
                h += '<div class="space-y-2">';
            } else {
                h += '<div class="grid grid-cols-2 gap-2">';
            }
            
            for (var k = 0; k < items.length; k++) {
                // ✅ isCatalogMode = false لأن هذا وضع الأوردر الجديد
                // الضغط على البطاقة = إضافة للسلة
                h += self._renderProductCard(items[k], avails[k], isListView);
            }
            
            h += '</div>';
            RW_UI.safeHTML(c, h);
        });
    }).catch(function() {
        RW_UI.showEmptyState('productsContainer', 'تعذر تحميل المنتجات', '📡');
    });
};
    
    self.decCart = function(code) { for (var i = 0; i < cart.length; i++) { if (cart[i].code === code) { cart[i].qty--; if (cart[i].qty <= 0) cart.splice(i, 1); break; } } self.updateFloatingCart(); if (currentTab === 'new-order') self.renderAllProducts(); else if (currentTab === 'products') self.renderCatalogProducts(); };

    self.calcTotals = function() { var s = 0; for (var i = 0; i < cart.length; i++) s += cart[i].price * cart[i].qty; if (s === 0) return { sub: 0, del: 0, tax: 0, total: 0 }; var d = delFee, bt = s + d, tx = Math.round(bt * taxRate) / 100; return { sub: s, del: d, tax: tx, total: bt + tx }; };

    self.updateFloatingCart = function() {
        var bar = RW_UI.byId('floatingCart');
        if (!bar) return;
        var t = self.calcTotals();
        if (cart.length === 0) { bar.classList.add('hidden'); return; }
        bar.classList.remove('hidden');
        RW_UI.byId('cartBadgeCount').innerText = cart.length;
        RW_UI.byId('cartBadgeSummary').innerText = cart.length === 1 ? cart[0].name : (cart.length + ' أصناف');
        RW_UI.byId('cartBadgeTotal').innerText = fmtNum(t.total);
    };

    self.openCartModal = function() { if (cart.length === 0) return; RW_UI.byId('cartModal').classList.remove('hidden'); self.renderCartModalBody(); };
    self.closeCartModal = function() { RW_UI.byId('cartModal').classList.add('hidden'); };

    self.renderCartModalBody = function() {
        var h = '', t = self.calcTotals();
        for (var i = 0; i < cart.length; i++) { var it = cart[i]; h += '<div class="flex items-center justify-between bg-gray-50 p-3 rounded-xl"><div class="flex-1 min-w-0"><div class="font-bold text-sm">' + it.name + '</div><div class="text-xs text-gray-400">' + fmtNum(it.price) + ' × ' + it.qty + '</div></div><div class="flex items-center gap-2 mr-3"><button onclick="App.decCart(\'' + it.code + '\');App.renderCartModalBody()" class="w-7 h-7 bg-red-100 text-red-600 rounded-full text-xs font-black">-</button><span class="text-sm font-black w-6 text-center">' + it.qty + '</span><button onclick="App.addToCart(\'' + it.code + '\');App.renderCartModalBody()" class="w-7 h-7 bg-blue-600 text-white rounded-full text-xs font-black">+</button></div></div>'; }
        RW_UI.safeHTML(RW_UI.byId('cartModalBody'), h || '<div class="text-center text-gray-400 py-10">السلة فارغة</div>');
        RW_UI.byId('cartModalTotal').innerText = fmtNum(t.total);
    };

    // ==================== حفظ الأوردر ====================
    self.submitOrder = function() {
        if (!selCust) { RW_UI.toast('اختر عميلاً أولاً', 'warning'); return; }
        if (!cart.length) { RW_UI.toast('السلة فارغة', 'warning'); return; }
        if (!selBranch) { RW_UI.toast('اختر فرعاً', 'warning'); return; }
        var t = self.calcTotals();
        if (minAmt > 0 && t.total < minAmt) { RW_UI.toast('الحد الأدنى للفاتورة: ' + fmtNum(minAmt), 'warning'); return; }
        var items = []; for (var i = 0; i < cart.length; i++) items.push({ code: cart[i].code, name: cart[i].name, price: cart[i].price, qty: cart[i].qty, unit: cart[i].unit });
        var hdr = { customer_code: selCust.customer_code, custName: selCust.name, area: selCust.area || '', total: t.total, deliveryFees: t.del, status: 'Confirmed', paymentType: selCust.payment_type || 'أجل', taxAmount: t.tax, taxRate: taxRate };
        self.closeCartModal();
        RW_UI.showLoader('جاري حفظ الأوردر...');
        RW_API.call('save-sales-invoice', { orderHeader: hdr, itemsList: items, branchCode: selBranch }, function(json) {
            RW_UI.hideLoader();
            if (json.success) { RW_UI.toast('تم الحفظ: ' + (json.orderID || ''), 'success'); cart = []; selCust = null; self.clearCustomer(); self.updateFloatingCart(); self.switchTab('today'); }
            else RW_UI.toast(json.msg || 'فشل الحفظ', 'error');
        });
    };

    // ==================== أوردراتي ====================
    self.renderOrdersView = function() {
        var c = RW_UI.byId('mainContent'); if (!c) return;
        var h = '<div class="flex-1 overflow-y-auto p-4 no-scrollbar"><h2 class="text-lg font-black mb-4">📋 أوردراتي</h2><div class="bg-white p-3 rounded-2xl shadow-sm border mb-4"><div class="flex gap-2 flex-wrap"><select id="orderStatusFilter" onchange="App.renderOrdersList()" class="p-2 bg-gray-50 border rounded-lg text-sm font-bold"><option value="">كل الحالات</option><option value="Draft">مسودة</option><option value="Confirmed">مؤكد</option><option value="Pending">قيد الانتظار</option><option value="Invoiced">مفوتر</option><option value="Delivered">تم التوصيل</option><option value="Cancelled">ملغي</option></select><input type="date" id="orderDateFilter" onchange="App.renderOrdersList()" class="p-2 bg-gray-50 border rounded-lg text-sm font-bold"><button onclick="RW_UI.byId(\'orderStatusFilter\').value=\'\';RW_UI.byId(\'orderDateFilter\').value=\'\';App.renderOrdersList();" class="p-2 bg-gray-100 border rounded-lg text-sm font-bold">إعادة تعيين</button></div></div><div id="ordersListContainer" class="space-y-3"><div class="text-center text-gray-400 py-8">جاري التحميل...</div></div></div>';
        RW_UI.safeHTML(c, h); self.renderOrdersList();
    };

    self.renderOrdersList = function() {
        var c = RW_UI.byId('ordersListContainer'); if (!c) return;
        RW_UI.showSkeleton('ordersListContainer', 3, 'card');
        var q = supabase.from('orders').select('*').eq('created_by', currentUser.email).order('order_date', { ascending: false }).limit(50);
        var sf = RW_UI.byId('orderStatusFilter') ? RW_UI.byId('orderStatusFilter').value : '';
        var df = RW_UI.byId('orderDateFilter') ? RW_UI.byId('orderDateFilter').value : '';
        if (sf) q = q.eq('order_status', sf); if (df) q = q.eq('order_date', df);
        q.then(function(res) {
            var orders = res.data || [];
            if (!orders.length) { RW_UI.showEmptyState('ordersListContainer', 'لا توجد أوردرات بعد. ابدأ رحلتك!', '📋'); return; }
            var h = '';
            for (var i = 0; i < orders.length; i++) {
                var o = orders[i], sc = '', sl = o.order_status || '';
                if (o.order_status === 'Draft') { sc = 'bg-yellow-100 text-yellow-700'; sl = 'مسودة'; }
                else if (o.order_status === 'Confirmed') { sc = 'bg-blue-100 text-blue-700'; sl = 'مؤكد'; }
                else if (o.order_status === 'Pending') { sc = 'bg-purple-100 text-purple-700'; sl = 'قيد الانتظار'; }
                else if (o.order_status === 'Invoiced') { sc = 'bg-green-100 text-green-700'; sl = 'مفوتر'; }
                else if (o.order_status === 'Delivered') { sc = 'bg-emerald-100 text-emerald-700'; sl = 'تم التوصيل'; }
                else if (o.order_status === 'Cancelled') { sc = 'bg-red-100 text-red-700'; sl = 'ملغي'; }
                else { sc = 'bg-gray-100 text-gray-700'; }
                h += '<div class="bg-white p-4 rounded-2xl shadow-sm border cursor-pointer hover:bg-blue-50" onclick="App.repeatOrder(\'' + o.id + '\')"><div class="flex justify-between items-start mb-2"><div><span class="font-black text-blue-600 text-sm">' + (o.order_code || '') + '</span><span class="text-xs text-gray-400 mr-2">' + (o.order_date ? new Date(o.order_date).toLocaleDateString('ar-EG') : '') + '</span></div><span class="px-2 py-1 rounded-full text-xs font-bold ' + sc + '">' + sl + '</span></div><div class="flex justify-between items-center"><div><span class="font-bold text-sm">' + (o.customer_name || '') + '</span></div><span class="font-black text-emerald-600 text-sm">' + fmtNum(o.total_amount) + ' EGP</span></div><div class="flex gap-1 mt-2"><button onclick="event.stopPropagation();App.repeatOrder(\'' + o.id + '\')" class="text-xs bg-blue-50 text-blue-600 px-3 py-1 rounded-full font-bold">🔄 إعادة الطلب</button></div></div>';
            }
            RW_UI.safeHTML(c, h);
        }).catch(function() { RW_UI.showEmptyState('ordersListContainer', 'فشل تحميل الأوردرات', '📡'); });
    };

    self.repeatOrder = function(orderId) {
        RW_UI.showLoader('جاري نسخ الأوردر...');
        if (currentTab === 'new-order') RW_UI.showSkeleton('productsContainer', 4, 'card');
        supabase.from('orders').select('*').eq('id', orderId).single().then(function(oRes) {
            var order = oRes.data; if (!order) { RW_UI.hideLoader(); RW_UI.toast('الأوردر غير موجود', 'error'); return; }
            supabase.from('order_details').select('*').eq('order_id', order.id).then(function(dRes) {
                RW_UI.hideLoader(); var details = dRes.data || []; cart = [];
                for (var i = 0; i < details.length; i++) cart.push({ code: details[i].item_code, name: details[i].item_name, price: Number(details[i].unit_price) || 0, unit: details[i].unit || 'حبة', qty: Number(details[i].qty) || 1 });
                if (order.customer_id) db.customers.where('customer_code').equals(order.customer_id).first().then(function(c) { if (c) { selCust = c; self.selectCustomer(c.customer_code); } });
                self.updateFloatingCart(); self.renderNewOrderView(); RW_UI.toast('تم نسخ الأوردر للسلة', 'success');
            });
        }).catch(function() { RW_UI.hideLoader(); RW_UI.toast('فشل الاتصال', 'error'); });
    };

    // ==================== مودال العملاء ====================
    self.searchCustomersModal = function(q) {
        var c = RW_UI.byId('customerModalBody'); if (!c) return;
        if (!q || !q.trim()) { RW_UI.safeHTML(c, '<div class="text-center text-gray-400 py-8">اكتب للبحث عن عميل...</div>'); return; }
        RW_UI.safeHTML(c, '<div class="text-center py-4"><i class="fa-solid fa-spinner fa-spin"></i> جاري البحث...</div>');
        var s = q.toLowerCase();
        db.customers.toArray().then(function(all) {
            var f = []; for (var i = 0; i < all.length; i++) { var cu = all[i]; if ((cu.name || '').toLowerCase().indexOf(s) !== -1 || (cu.customer_code || '').toLowerCase().indexOf(s) !== -1 || (cu.phone || '').indexOf(s) !== -1) f.push(cu); if (f.length >= 20) break; }
            if (!f.length) { RW_UI.safeHTML(c, '<div class="text-center text-gray-400 py-8">لا توجد نتائج</div>'); return; }
            var h = ''; for (var j = 0; j < f.length; j++) { var cu2 = f[j], dc = Number(cu2.debt) > 0 ? 'text-red-500' : 'text-green-600'; h += '<div onclick="App.selectCustomerFromModal(\'' + cu2.customer_code + '\')" class="bg-white p-3 rounded-xl shadow-sm border cursor-pointer hover:bg-blue-50 active:bg-blue-100"><div class="font-bold text-sm">' + (cu2.name || '') + '</div><div class="text-xs text-gray-400">' + (cu2.customer_code || '') + ' - ' + (cu2.area || '') + ' | الرصيد: <span class="' + dc + ' font-bold">' + fmtNum(cu2.debt) + '</span></div></div>'; }
            RW_UI.safeHTML(c, h);
        });
    };

    self.selectCustomerFromModal = function(code) { self.closeCustomerModal(); self.selectCustomer(code); };
    self.closeCustomerModal = function() { RW_UI.byId('customerModal').classList.add('hidden'); };

    // ==================== المزيد ====================
    self.renderMoreView = function() {
        var c = RW_UI.byId('mainContent'); if (!c) return;
        var h = '<div class="flex-1 overflow-y-auto p-4 no-scrollbar"><h2 class="text-lg font-black mb-4">⚙️ المزيد</h2><div class="space-y-3">';
        h += '<button onclick="App.openCustomerModal()" class="w-full bg-white p-4 rounded-2xl shadow-sm border flex items-center gap-3"><i class="fa-solid fa-users text-purple-600 text-xl"></i><div class="text-right"><div class="font-bold">العملاء</div><div class="text-xs text-gray-400">بحث واستعراض العملاء والمديونيات</div></div></button>';
        h += '<button onclick="App.syncNow()" class="w-full bg-white p-4 rounded-2xl shadow-sm border flex items-center gap-3"><i class="fa-solid fa-rotate text-blue-600 text-xl"></i><div class="text-right"><div class="font-bold">مزامنة البيانات</div><div class="text-xs text-gray-400">تحديث العملاء والمنتجات والمخزون</div></div></button>';
        h += '<button onclick="App.doLogout()" class="w-full bg-white p-4 rounded-2xl shadow-sm border flex items-center gap-3"><i class="fa-solid fa-right-from-bracket text-red-500 text-xl"></i><div class="text-right"><div class="font-bold text-red-500">تسجيل الخروج</div><div class="text-xs text-gray-400">العودة إلى شاشة الدخول</div></div></button>';
        h += '</div></div>'; RW_UI.safeHTML(c, h);
    };

    self.openCustomerModal = function() { RW_UI.byId('customerModal').classList.remove('hidden'); var inp = RW_UI.byId('customerSearchInput'); if (inp) { inp.value = ''; inp.focus(); } RW_UI.safeHTML(RW_UI.byId('customerModalBody'), '<div class="text-center text-gray-400 py-8">اكتب للبحث عن عميل...</div>'); };
    self.syncPendingOrders = function() { db.pending_updates.where('status').equals('pending').toArray().then(function(ops) { var badge = RW_UI.byId('pendingBadge'); if (badge) { if (ops.length > 0) { badge.classList.remove('hidden'); badge.innerText = ops.length; } else badge.classList.add('hidden'); } }); };

    return self;
})();

RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded', function() { App.init(); });
</script>
