<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>فان سيلز | الروائع ERP</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:#f1f5f9;-webkit-tap-highlight-color:transparent}
        .auth-container{background:linear-gradient(135deg,#7c2d12 0%,#9a3412 40%,#ea580c 100%)}
        .input-field:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,0.1)}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        .animate-fadeIn{animation:fadeIn .3s}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05);transition:all 0.2s ease}
        .card:active{transform:scale(0.985)}
        .btn-orange{background:#ea580c;color:#fff;padding:0.75rem 1.5rem;border-radius:12px;font-weight:700;border:none;cursor:pointer;width:100%}
        .btn-orange:active{background:#c2410c}
        .btn-green{background:#059669;color:#fff;padding:0.75rem 1.5rem;border-radius:12px;font-weight:700;border:none;cursor:pointer;width:100%}
        .btn-green:disabled{background:#94a3b8;cursor:not-allowed}
        .badge-green{background:#dcfce7;color:#166534;border:1px solid #86efac}
        .badge-yellow{background:#fef9c3;color:#854d0e;border:1px solid #fde047}
        .badge-red{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
        .progress-bar{transition:width 0.6s ease}
        .slide-in{animation:slideIn 0.25s ease}
        @keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1rem}
        @media(min-width:768px){.grid-cards{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- شاشة الدخول -->
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md slide-in">
        <div class="text-center mb-6">
            <div class="w-20 h-20 bg-gradient-to-br from-orange-600 to-orange-800 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
                <i class="fa-solid fa-truck-field text-white text-3xl"></i>
            </div>
            <h1 class="font-black text-2xl text-gray-800">الروائع</h1>
            <p class="text-xs text-gray-400 font-bold mt-1">مندوب البيع المباشر</p>
        </div>
        <div class="space-y-3">
            <div><input id="loginEmail" type="email" placeholder="البريد الإلكتروني" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-orange-600 outline-none font-bold text-sm"></div>
            <div class="relative"><input id="loginPass" type="password" placeholder="كلمة السر" class="input-field w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-orange-600 outline-none font-bold text-sm pr-12"><button type="button" onclick="App.togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400"><i id="passIcon" class="fa-solid fa-eye"></i></button></div>
        </div>
        <button onclick="App.doLogin()" class="w-full bg-gradient-to-r from-orange-600 to-orange-700 text-white py-3.5 rounded-xl font-black text-sm shadow-lg shadow-orange-200 mt-4">تسجيل الدخول</button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="mainApp" class="hidden flex flex-col h-full">

    <header class="bg-orange-700 text-white px-3 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0" style="padding-top:max(8px,env(safe-area-inset-top));min-height:52px">
        <span class="font-black text-sm">🚛 فان سيلز</span>
        <div class="flex items-center gap-1.5 overflow-x-auto">
            <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <span id="connLabel" class="text-[11px] font-bold">متصل</span>
            <button onclick="App.showView('vehicle')" class="bg-white/10 px-2.5 py-1.5 rounded-full text-[11px] font-bold"><i class="fa-solid fa-truck text-xs"></i> <span>سيارتي</span></button>
            <button onclick="App.showView('map')" class="bg-white/10 px-2.5 py-1.5 rounded-full text-[11px] font-bold"><i class="fa-solid fa-map-location-dot text-xs"></i> <span>الخريطة</span></button>
            <button onclick="App.showView('account')" class="bg-white/10 px-2.5 py-1.5 rounded-full text-[11px] font-bold"><i class="fa-solid fa-user text-xs"></i> <span>حسابي</span></button>
            <button onclick="App.syncData()" class="bg-white/10 w-8 h-8 rounded-full"><i class="fa-solid fa-rotate text-xs"></i></button>
            <button onclick="App.doLogout()" class="bg-white/10 w-8 h-8 rounded-full"><i class="fa-solid fa-arrow-right-from-bracket text-xs"></i></button>
        </div>
    </header>
    
    <main id="mainContent" class="flex-1 overflow-y-auto pb-20"></main>

    <!-- الشريط السفلي -->
    <nav id="bottomNav" class="bg-white border-t fixed bottom-0 left-0 right-0 z-30 h-16 flex justify-around items-center text-gray-400 text-xs flex-shrink-0"></nav>

    <!-- السلة العائمة -->
    <div id="floatingCart" class="hidden mx-3 mb-16 bg-gray-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center cursor-pointer active:scale-[0.98] transition z-20 flex-shrink-0" onclick="App.openCartModal()">
        <div class="flex items-center gap-3"><div class="bg-orange-600 w-10 h-10 rounded-full flex items-center justify-center font-black text-sm" id="cartBadgeCount">0</div><div><div class="font-bold text-sm">سلة المشتريات</div><div class="text-xs text-gray-400" id="cartBadgeSummary">لا توجد أصناف</div></div></div>
        <div class="text-left"><div class="text-xs text-gray-400">الإجمالي</div><div class="font-black text-lg" id="cartBadgeTotal">0.00</div></div>
    </div>

    <!-- مودال السلة -->
    <div id="cartModal" class="fixed inset-0 z-50 hidden flex flex-col justify-end">
        <div class="absolute inset-0 bg-black/50" onclick="App.closeCartModal()"></div>
        <div class="bg-white rounded-t-3xl flex flex-col animate-slide-up" style="max-height:85vh">
            <div class="p-4 border-b flex justify-between"><h2 class="font-black text-lg">مراجعة الأوردر</h2><button onclick="App.closeCartModal()" class="w-8 h-8 bg-gray-100 rounded-full"><i class="fa-solid fa-xmark"></i></button></div>
            <div id="cartModalBody" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
            <div class="p-4 border-t bg-gray-50 flex-shrink-0">
                <div class="flex justify-between font-bold text-lg mb-3"><span>الإجمالي:</span><span class="text-emerald-600" id="cartModalTotal">0.00</span></div>
                <button onclick="App.submitOrder()" class="w-full bg-orange-600 text-white py-3.5 rounded-xl font-black text-sm"><i class="fa-solid fa-check ml-2"></i> حفظ الأوردر</button>
            </div>
        </div>
    </div>

</div>

<script>
// ============================================================
// المتغيرات العامة – Van Sales Diamond Edition
// ============================================================
var App = {
    currentUser: null,
    vanBranch: null,
    vanBranchId: null,
    cart: [],
    selCust: null,
    delFee: 0,
    taxRate: 0,
    minAmt: 0,
    _mapInstance: null,
    _mapMarkers: [],
    _ghostCartData: [],
    dailyTarget: 5000,
    collectionTarget: 3000,
    eodLocked: false,
    currentView: 'home',

    // ==================== دوال المصادقة ====================
    togglePass: function() {
        var p = RW_UI.byId('loginPass'), i = RW_UI.byId('passIcon');
        if (p.type === 'password') { p.type = 'text'; i.className = 'fa-solid fa-eye-slash'; }
        else { p.type = 'password'; i.className = 'fa-solid fa-eye'; }
    },

    doLogin: function() {
        var email = RW_UI.byId('loginEmail').value.trim(), pass = RW_UI.byId('loginPass').value.trim();
        if (!email || !pass) { RW_UI.byId('loginMsg').innerText = 'أدخل البيانات'; RW_UI.byId('loginMsg').classList.remove('hidden'); return; }
        RW_UI.byId('loginMsg').classList.add('hidden');
        RW_UI.showLoader('جاري تسجيل الدخول...');
        RW_Auth.doLogin(email, pass, function(user, err) {
            RW_UI.hideLoader();
            if (err) { RW_UI.byId('loginMsg').innerText = err; RW_UI.byId('loginMsg').classList.remove('hidden'); }
            else App.init();
        });
    },

    init: function() {
        var self = this;
        RW_Auth.init(function(user, err) {
            if (err || !user) { if (err !== 'NO_SESSION') RW_UI.showError('فشل استعادة الجلسة'); return; }
            var isOwner = user.isOwner, perms = user.permissions;
            if (!isOwner && (!perms || (perms.indexOf('van-sales') === -1 && perms.indexOf('orders') === -1))) { RW_UI.showError('غير مصرح'); RW_Auth.doLogout(); return; }
            self.currentUser = user;
            self.enterApp();
        });
    },

    enterApp: function() {
        RW_UI.byId('loginScreen').classList.add('hidden'); RW_UI.byId('mainApp').classList.remove('hidden');
        this.updateConnectionStatus();
        window.addEventListener('online', function() { App.updateConnectionStatus(); });
        window.addEventListener('offline', function() { App.updateConnectionStatus(); });
        this.renderBottomNav();
        this.syncDown()
    .then(function() {
        App.loadVanBranch();
    })
    .catch(function(err) {
        RW_UI.showError(
            (err && err.message) ||
            'تعذر مزامنة بيانات النظام، تم إيقاف العرض لمنع استخدام بيانات قديمة'
        );
    });
    },

    doLogout: function() {
        var self = this;
        if (this._mapInstance) { this._mapInstance.remove(); this._mapInstance = null; }
        RW_Auth.doLogout(function() { self.cart = []; self.selCust = null; RW_UI.byId('mainApp').classList.add('hidden'); RW_UI.byId('loginScreen').classList.remove('hidden'); });
    },

    updateConnectionStatus: function() { RW_UI.updateConnectionStatus('connDot', 'connLabel'); },

    syncDown: function() {
        var self = this;
        var db = RW_DB.getDB('VanSales');

        return supabase.auth.getSession().then(function(sessionResult) {
            var session = sessionResult && sessionResult.data && sessionResult.data.session;
            var authUser = session && session.user;

            if (!authUser || !authUser.id) {
                throw new Error('جلسة غير صالحة للمزامنة');
            }

            return supabase.from('users')
                .select('company_id')
                .eq('auth_id', authUser.id)
                .maybeSingle();
        }).then(function(userResult) {
            if (userResult.error || !userResult.data || !userResult.data.company_id) {
                throw new Error((userResult.error && userResult.error.message) || 'سياق الشركة غير محدد');
            }

            var companyId = userResult.data.company_id;

            return supabase.from('branches')
                .select('*')
                .eq('company_id', companyId)
                .then(function(branchResult) {
                    if (branchResult.error) throw branchResult.error;

                    var branches = branchResult.data || [];
                    var branchIds = branches.map(function(b) { return b.id; });

                    return Promise.all([
                        supabase.from('customers').select('*').eq('company_id', companyId),
                        supabase.from('items').select('*').eq('company_id', companyId),
                        branchIds.length
                            ? supabase.from('stock_branches').select('*').in('branch_id', branchIds)
                            : Promise.resolve({ data: [], error: null }),
                        Promise.resolve({ data: branches, error: null }),
                        supabase.from('app_settings')
                            .select('*')
                            .eq('company_id', companyId)
                            .order('created_at', { ascending: true })
                            .order('id', { ascending: true })
                            .limit(1)
                            .maybeSingle()
                    ]);
                });
        }).then(function(results) {
            var customersResult = results[0];
            var itemsResult = results[1];
            var stockResult = results[2];
            var branchesResult = results[3];
            var settingsResult = results[4];

            [customersResult, itemsResult, stockResult, branchesResult, settingsResult].forEach(function(result) {
                if (result && result.error) throw result.error;
            });

            return Promise.all([
                db.customers.clear().then(function() {
                    return db.customers.bulkPut(customersResult.data || []);
                }),
                db.items.clear().then(function() {
                    return db.items.bulkPut(itemsResult.data || []);
                }),
                db.stock.clear().then(function() {
                    return db.stock.bulkPut(stockResult.data || []);
                }),
                db.branches.clear().then(function() {
                    return db.branches.bulkPut(branchesResult.data || []);
                })
            ]).then(function() {
                var settings = settingsResult.data || {};
                self.delFee = Number(settings.delivery_fee) || 0;
                self.taxRate = Number(settings.tax_rate) || 0;
                self.minAmt = Number(settings.min_invoice_amount) || 0;
                self.companyId = settings.company_id || (branchesResult.data && branchesResult.data[0] && branchesResult.data[0].company_id) || null;
            });
        });
    },

    syncData: function() {
        if (!navigator.onLine) { RW_UI.toast('لا يوجد اتصال', 'warning'); return; }
        var self = this; RW_UI.showLoader('جاري المزامنة...');
        this.syncDown().then(function() { RW_UI.hideLoader(); self.loadVanBranch(); RW_UI.toast('تمت المزامنة', 'success'); }).catch(function() { RW_UI.hideLoader(); RW_UI.toast('فشلت المزامنة', 'error'); });
    },

    // ==================== الشريط السفلي ====================
renderBottomNav: function() {
    var nav = RW_UI.byId('bottomNav'); if (!nav) return;
    var items = [
        { view: 'home', icon: 'fa-home', label: 'الرئيسية' },
        { view: 'customers', icon: 'fa-users', label: 'عملائي' },
        { view: 'invoices', icon: 'fa-file-invoice', label: 'فواتيري' },
        { view: 'balance', icon: 'fa-scale-balanced', label: 'رصيدي' }
    ];
    var h = '';
    for (var i = 0; i < items.length; i++) {
        var item = items[i], activeClass = this.currentView === item.view ? 'text-orange-600' : 'text-gray-400';
        // ✅ كل تبويب flex-1 ليأخذ حصة متساوية من العرض
        h += '<button onclick="App.showView(\'' + item.view + '\')" class="flex-1 flex flex-col items-center justify-center py-1 px-1 ' + activeClass + '" id="nav-' + item.view + '"><i class="fa-solid ' + item.icon + ' text-xl mb-0.5"></i><span class="text-[10px] font-bold">' + item.label + '</span></button>';
        // ✅ إدراج زر FAB بعد التبويب الثاني – عرض ثابت، بدون flex-1، ليتمركز بدقة
        if (i === 1) {
            h += '<div class="flex items-center justify-center relative" style="width:56px;margin-top:-28px;flex-shrink:0">';
            h += '<button onclick="App.openQuickSale()" class="w-14 h-14 bg-orange-600 rounded-full flex items-center justify-center text-white text-2xl shadow-lg shadow-orange-300 active:scale-95 transition">';
            h += '<i class="fa-solid fa-plus"></i>';
            h += '</button></div>';
        }
    }
    RW_UI.safeHTML(nav, h);
},
    
    // ==================== التنقل بين التبويبات ====================
    showView: function(view) {
        this.currentView = view; this.renderBottomNav();
        var fc = RW_UI.byId('floatingCart');
        if (view === 'home') { if (fc) fc.classList.add('hidden'); this.renderHomeView(); }
        else if (view === 'customers') { if (fc) fc.classList.add('hidden'); this.renderCustomersView(); }
        else if (view === 'invoices') { if (fc) fc.classList.add('hidden'); this.renderInvoicesView(); }
        else if (view === 'vehicle') { if (fc) fc.classList.add('hidden'); this.renderVehicleStockView(); }
        else if (view === 'map') { if (fc) fc.classList.add('hidden'); this.renderMapView(); }
else if (view === 'account') { if (fc) fc.classList.add('hidden'); this.renderAccountView(); }
        else if (view === 'balance') { if (fc) fc.classList.add('hidden'); this.renderBalanceView(); }
    },
    // ==================== فرع المندوب – VAN-{email} ====================
    loadVanBranch: function() {
        var self = this;
        var email = self.currentUser ? String(self.currentUser.email || '').trim().toLowerCase() : '';
        var cacheKey = 'RW_VAN_CANONICAL:' + email;

        if (!email) {
            RW_UI.showError('هوية مندوب البيع غير محددة');
            return;
        }

        if (!navigator.onLine) {
            try {
                var cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
                if (cached && cached.branch_id && cached.branch_code) {
                    self.vanBranch = cached;
                    self.vanBranchId = cached.branch_id;
                    self._afterVanBranchReady();
                    return;
                }
            } catch (e) {}

            RW_UI.showError('لا يوجد اتصال ولا توجد هوية مخزن السيارة محفوظة');
            return;
        }

        RW_UI.showLoader('جاري تحديد مخزن السيارة المعتمد...');

        RW_API.call(
            'setup-van-branch',
            { driver_email: email },
            function (json) {
                if (json && json.success && json.branch_id) {
                    self.vanBranchId = json.branch_id;
                    self.vanBranch = {
                        id: json.branch_id,
                        branch_code: json.branch_code || '',
                        name: json.branch_name || ('سيارة ' + (json.vehicle_code || '')),
                        vehicle_id: json.vehicle_id || null,
                        vehicle_code: json.vehicle_code || '',
                        driver_id: json.driver_id || null
                    };

                    try {
                        localStorage.setItem(cacheKey, JSON.stringify({
                            branch_id: self.vanBranchId,
                            branch_code: self.vanBranch.branch_code,
                            name: self.vanBranch.name,
                            vehicle_id: self.vanBranch.vehicle_id,
                            vehicle_code: self.vanBranch.vehicle_code,
                            driver_id: self.vanBranch.driver_id,
                            updated_at: new Date().toISOString()
                        }));
                    } catch (e) {}

                    var db = RW_DB.getDB('VanSales');
                    db.branches.put(self.vanBranch).then(function () {
                        RW_UI.hideLoader();
                        self._afterVanBranchReady();
                    }).catch(function () {
                        RW_UI.hideLoader();
                        self._afterVanBranchReady();
                    });
                    return;
                }

                RW_UI.hideLoader();
                RW_UI.showError((json && json.msg) || 'تعذر تحديد مخزن السيارة المعتمد');
            }
        );
    },

    _afterVanBranchReady: function() {
        this.loadMyCustomers();
        this.loadCustomerPatterns();
        this.showView('home');
        RW_UI.toast('🚛 فرع المندوب: ' + (this.vanBranch ? this.vanBranch.branch_code : 'غير محدد'), 'info');
    },

    // ==================== تحميل عملائي من Supabase ====================
loadMyCustomers: function() {
    var self = this;
    if (!this.currentUser) return;

    var db = RW_DB.getDB('VanSales');

    RW_UI.showLoader('جاري تحميل عملائي والمديونيات...');

    supabase.rpc('get_van_sales_customer_accounts', {
        p_mode: 'list',
        p_customer_id: null,
        p_search: null
    }).then(function(res) {
        RW_UI.hideLoader();

        if (res.error) {
            throw res.error;
        }

        var payload = res.data || {};
        if (!payload.success) {
            throw new Error(payload.msg || 'تعذر تحميل عملائي');
        }

        var customers = Array.isArray(payload.customers)
            ? payload.customers
            : [];

        var totalDebt = Number(payload.total_customer_debt) || 0;

        var mapped = customers.map(function(c) {
            return {
                customer_id: c.id || c.customer_id || null,
                customer_code: c.customer_code || '',
                name: c.name || c.customer_name || '',
                area: c.area || '',
                phone: c.phone || '',
                payment_type: c.payment_type || '',
                credit_limit: Number(c.credit_limit) || 0,
                totalDebt: Number(c.total_debt) || 0,
                lastOrderDate: c.last_invoice_date || null,
                orderCount: Number(c.invoice_count) || 0
            };
        });

        if (db && db.myCustomers) {
            return db.myCustomers.clear().then(function() {
                return db.myCustomers.bulkPut(mapped);
            }).then(function() {
                self._myCustomersServerTotalDebt = totalDebt;
                self._myCustomersServerCount = mapped.length;

                var totalEl = RW_UI.byId('myCustomersTotalDebt');
                var countEl = RW_UI.byId('myCustomersCount');

                if (totalEl) {
                    RW_UI.safeText(
                        totalEl,
                        RW_UI.formatNumber(totalDebt) + ' ج.م'
                    );
                }

                if (countEl) {
                    RW_UI.safeText(
                        countEl,
                        String(mapped.length)
                    );
                }

                self.renderMyCustomersList(mapped);
            });
        }

        self._myCustomersServerTotalDebt = totalDebt;
        self._myCustomersServerCount = mapped.length;

        var totalEl2 = RW_UI.byId('myCustomersTotalDebt');
        var countEl2 = RW_UI.byId('myCustomersCount');

        if (totalEl2) {
            RW_UI.safeText(
                totalEl2,
                RW_UI.formatNumber(totalDebt) + ' ج.م'
            );
        }

        if (countEl2) {
            RW_UI.safeText(
                countEl2,
                String(mapped.length)
            );
        }

        self.renderMyCustomersList(mapped);
    }).catch(function(err) {
        RW_UI.hideLoader();

        console.error('loadMyCustomers:', err);

    // ==================== تحميل أنماط شراء العملاء ====================
    loadCustomerPatterns: function() {
        var self = this;
        if (!this.currentUser) return;
        var db = RW_DB.getDB('VanSales');

supabase.from('orders')
    .select('id, customer_id, customer_name, order_date')
    .eq('company_id', self.companyId)
    .eq('created_by', self.currentUser.email)
    .eq('source', 'van-sales')
    .not('customer_id', 'is', null)
    .order('order_date', { ascending: false })
    .then(function(oRes) {
        if (oRes.error) throw oRes.error;
        var orders = oRes.data || [];
        if (!orders.length) return [];

        var orderIds = orders.map(function(o) { return o.id; });
        var customerIds = [];
        for (var i = 0; i < orders.length; i++) {
            if (orders[i].customer_id && customerIds.indexOf(orders[i].customer_id) === -1) {
                customerIds.push(orders[i].customer_id);
            }
        }

        return Promise.all([
            supabase.from('customers')
                .select('id,customer_code')
                .eq('company_id', self.companyId)
                .in('id', customerIds),
            supabase.from('order_details')
                .select('order_id,item_code,item_name,qty')
                .in('order_id', orderIds)
        ]).then(function(parts) {
            if (parts[0].error) throw parts[0].error;
            if (parts[1].error) throw parts[1].error;

            var customerMap = {};
            (parts[0].data || []).forEach(function(c) {
                customerMap[String(c.id)] = c.customer_code || String(c.id);
            });

            var orderMap = {};
            orders.forEach(function(o) { orderMap[String(o.id)] = o; });

            var detailMap = {};
            (parts[1].data || []).forEach(function(d) {
                var ord = orderMap[String(d.order_id)];
                if (!ord || !ord.customer_id) return;
                var customerCode = customerMap[String(ord.customer_id)];
                if (!customerCode) return;
                if (!detailMap[customerCode]) detailMap[customerCode] = {};
                if (!detailMap[customerCode][d.item_code]) {
                    detailMap[customerCode][d.item_code] = { count: 0, totalQty: 0, name: d.item_name };
                }
                detailMap[customerCode][d.item_code].count++;
                detailMap[customerCode][d.item_code].totalQty += Number(d.qty) || 0;
            });

            var patterns = [];
            for (var customerCode in detailMap) {
                if (!detailMap.hasOwnProperty(customerCode)) continue;
                for (var itemCode in detailMap[customerCode]) {
                    if (!detailMap[customerCode].hasOwnProperty(itemCode)) continue;
                    var x = detailMap[customerCode][itemCode];
                    patterns.push({
                        customer_code: customerCode,
                        item_code: itemCode,
                        frequency: x.count,
                        avgQty: x.count ? Math.ceil(x.totalQty / x.count) : 0,
                        item_name: x.name || itemCode
                    });
                }
            }
            return patterns;
        });
    })
    .then(function(patterns) {
        if (db && db.customerPatterns) {
            return db.customerPatterns.clear().then(function() {
                return db.customerPatterns.bulkPut(patterns);
            });
        }
    });
        }).catch(function() {});
    },

    // ==================== تحميل مؤشرات الأداء ====================
    loadKPIs: function() {
        var self = this;
        var today = new Date().toISOString().split('T')[0];
        if (!this.currentUser) return;

        supabase.from('orders')
            .select('total_amount, payment_type')
            .eq('company_id', this.companyId)
            .eq('created_by', this.currentUser.email)
            .eq('source', 'van-sales')
            .eq('order_date', today)
            .then(function(res) {
                var orders = res.data || [];
                var totalSales = 0, totalCash = 0;
                for (var i = 0; i < orders.length; i++) {
                    var amt = Number(orders[i].total_amount) || 0;
                    totalSales += amt;
                    if (orders[i].payment_type === 'نقدي') totalCash += amt;
                }
                var salesPct = Math.min(Math.round((totalSales / self.dailyTarget) * 100), 100);
                var collPct = Math.min(Math.round((totalCash / self.collectionTarget) * 100), 100);

                RW_UI.safeText(RW_UI.byId('kpiSales'), RW_UI.formatNumber(totalSales) + ' ج.م');

                var salesBar = RW_UI.byId('kpiSalesBar');

                if (collBar) collBar.style.width = collPct + '%';

    // ==================== تحميل ملخص العهدة ====================
   loadHomeStockSummary:function() {
    var self=this;
    var branchId=this.vanBranchId;
    var companyId=this.companyId;
    var box=RW_UI.byId('homeStockSummary');
    var kpi=RW_UI.byId('kpiStock');

    if(!branchId||!companyId){
        RW_UI.safeHTML(
            box,
            '<p class="text-gray-400">لم يتم تحديد مخزن السيارة المعتمد.</p>'
        );
        RW_UI.safeText(kpi,'0 ج.م');
        return;
    }

    Promise.all([
        supabase
            .from('stock_branches')
            .select('item_id,qty,allocated_qty,updated_at')
            .eq('branch_id',branchId),

        supabase
            .from('items')
            .select('id,item_code,name,sales_price,unit')
            .eq('company_id',companyId)
            .eq('is_active',true)
    ])
    .then(function(result){
        var stockRes=result[0],
            itemsRes=result[1];

        if(stockRes.error) throw stockRes.error;
        if(itemsRes.error) throw itemsRes.error;

        var itemMap={};
        (itemsRes.data||[]).forEach(function(it){
            itemMap[String(it.id)]=it;
        });

        var rows=(stockRes.data||[])
            .map(function(st){
                var it=itemMap[String(st.item_id)];
                var qty=Math.max(0,Number(st.qty)||0);

                return{
                    item_id:st.item_id,
                    item:it,
                    qty:qty,
                    allocated_qty:Math.max(0,Number(st.allocated_qty)||0),
                    sales_price:it?Math.max(0,Number(it.sales_price)||0):0,
                    updated_at:st.updated_at||null
                };
            })
            .filter(function(x){
                return x.qty>0;
            })
            .sort(function(a,b){
                var ac=a.item?(a.item.item_code||''):'',
                    bc=b.item?(b.item.item_code||''):'';

                return String(ac).localeCompare(String(bc),'ar');
            });

        var totalQty=0,
            totalValue=0;

        rows.forEach(function(x){
            totalQty+=x.qty;
            totalValue+=x.qty*x.sales_price;
        });

        var preview=rows.slice(0,5);

        var summary=
            '<div class="text-xs text-slate-500 mb-2">'+
                '<b>'+totalQty+'</b> صنف/وحدة حالية'+
                ' · قيمة البيع التقريبية <b>'+
                RW_UI.formatNumber(totalValue)+
                ' ج.م</b>'+
            '</div>';

        preview.forEach(function(x){
            if(!x.item) return;

            summary+=
                '<span class="inline-block bg-orange-50 text-orange-700 px-2 py-1 rounded-lg text-xs font-bold ml-1 mb-1">'+
                x.item.name+
                ': '+
                x.qty+
                '</span>';
        });

        if(rows.length>5){
            summary+=
                '<span class="text-xs text-gray-400">... و'+
                (rows.length-5)+
                ' صنف آخر</span>';
        }

        if(!rows.length){
            summary=
                '<p class="text-gray-400">لا توجد عهدة فعلية حالياً.</p>';
        }

        RW_UI.safeHTML(
            box,
            summary
        );

        RW_UI.safeText(
            RW_UI.byId('homeStockLastUpdate'),
            '🟢 آخر تحديث: الآن'
        );

        RW_UI.safeText(
            kpi,
            RW_UI.formatNumber(totalValue)+' ج.م'
        );
    })
    .catch(function(err){
        console.error('loadHomeStockSummary:',err);

        RW_UI.safeHTML(
            box,
            '<p class="text-red-400">تعذر تحميل العهدة الحية من النظام.</p>'
        );

        RW_UI.safeText(kpi,'—');
        RW_UI.safeText(
            RW_UI.byId('homeStockLastUpdate'),
            '🔴 فشل تحديث بيانات العهدة'
        );
    });
},

filterMyCustomers: function() {
    var self = this;

    var input = RW_UI.byId('myCustSearch');
    var q = input
        ? String(input.value || '').trim().toLowerCase()
        : '';

    var db = RW_DB.getDB('VanSales');
    if (!db || !db.myCustomers) return;

    db.myCustomers.toArray().then(function(list) {
        list = Array.isArray(list) ? list : [];

        if (!q) {
            self.renderMyCustomersList(list);
            return;
        }

        var filtered = [];

        for (var i = 0; i < list.length; i++) {
            var c = list[i];

            var haystack = [
                c.name || '',
                c.customer_code || '',
                c.phone || '',
                c.area || ''
            ].join(' ').toLowerCase();

            if (haystack.indexOf(q) !== -1) {
                filtered.push(c);
            }
        }

        self.renderMyCustomersList(filtered);
    }).catch(function(err) {
        console.error('filterMyCustomers:', err);
    });
},

    // ==================== إعادة الطلب من فاتورة سابقة ====================
   repeatOrder: function(orderId) {
    var self = this;

    Swal.close();
    RW_UI.showLoader('جاري تحميل الأوردر...');

    if (!this.companyId) {
        RW_UI.hideLoader();
        RW_UI.toast('سياق الشركة غير محدد', 'error');
        return;
    }

    supabase.from('orders')
        .select('*')
        .eq('id', orderId)
        .eq('company_id', this.companyId)
        .eq('source', 'van-sales')
        .maybeSingle()
        .then(function(oRes) {
            if (oRes.error) throw oRes.error;

            var order = oRes.data;

            if (!order) {
                RW_UI.hideLoader();
                RW_UI.toast('الأوردر غير موجود أو لا يتبع مبيعات السيارة الحالية', 'error');
                return;
            }

            return supabase.from('order_details')
                .select('*')
                .eq('order_id', order.id)
                .then(function(dRes) {
                    if (dRes.error) throw dRes.error;

                    var details = dRes.data || [];
                    self.cart = [];

                    for (var i = 0; i < details.length; i++) {
                        self.cart.push({
                            code: details[i].item_code,
                            name: details[i].item_name,
                            price: Number(details[i].unit_price) || 0,
                            unit: details[i].unit || 'حبة',
                            qty: Number(details[i].qty) || 1
                        });
                    }

                    if (order.customer_id) {
                        return supabase.from('customers')
                            .select('id,customer_code,name,area,payment_type')
                            .eq('company_id', self.companyId)
                            .eq('id', order.customer_id)
                            .maybeSingle()
                            .then(function(cRes) {
                                if (cRes.error) throw cRes.error;

                                var customer = cRes.data;

                                RW_UI.hideLoader();

                                if (!customer || !customer.customer_code) {
                                    RW_UI.toast('تعذر تحديد كود العميل لإعادة الطلب', 'error');
                                    return;
                                }

                                self.selCust = {
                                    customer_code: customer.customer_code,
                                    name: customer.name || order.customer_name || '',
                                    area: customer.area || order.area || '',
                                    payment_type: customer.payment_type || order.payment_type || 'نقدي'
                                };

                                self.openQuickSaleForCustomer(self.selCust.customer_code);
                                RW_UI.toast('تم نسخ الأوردر للسلة', 'success');
                            });
                    }

                    RW_UI.hideLoader();
                    self.openQuickSale();
                    RW_UI.toast('تم نسخ الأوردر للسلة', 'success');
                });
        })
        .catch(function(err) {
            RW_UI.hideLoader();
            RW_UI.toast(
                err && err.message ? err.message : 'فشل تحميل الأوردر',
                'error'
            );
        });
},

    // ==================== تحصيل نقدية من عميل ====================
    collectPayment: function(code, name) {
    var self = this;

    Swal.fire({
        title: 'تحصيل نقدية من ' + (name || code),
        html: '<input type="number" id="collectAmount" class="swal2-input" placeholder="المبلغ المحصل" step="0.01" min="0">',
        showCancelButton: true,
        confirmButtonText: 'حفظ التحصيل',
        cancelButtonText: 'إلغاء',
        customClass: {
            popup: '!rounded-3xl',
            confirmButton: '!rounded-xl !bg-green-600',
            cancelButton: '!rounded-xl'
        },
        preConfirm: function() {
            var popup = Swal.getPopup();
            var amountEl = popup ? popup.querySelector('#collectAmount') : null;
            var amount = amountEl ? (parseFloat(amountEl.value) || 0) : 0;

            if (amount <= 0) {
                Swal.showValidationMessage('أدخل مبلغاً صحيحاً');
                return false;
            }

            return amount;
        }
    }).then(function(result) {
        if (!result.isConfirmed) return;

        var amount = Number(result.value) || 0;
        if (amount <= 0) return;

        var email = self.currentUser
            ? String(self.currentUser.email || '').trim().toLowerCase()
            : '';

        var companyId = self.companyId;

        if (!email) {
            RW_UI.toast('هوية مندوب البيع غير محددة', 'error');
            return;
        }

        if (!companyId) {
            RW_UI.toast('سياق الشركة غير محدد', 'error');
            return;
        }

        RW_UI.showLoader('جاري حفظ التحصيل...');

        function resolveCustomer() {
            var value = String(code || '').trim();

            if (!value) {
                throw new Error('هوية العميل غير محددة');
            }

            if (/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value)) {
                return supabase
                    .from('customers')
                    .select('id,customer_code,name')
                    .eq('company_id', companyId)
                    .eq('id', value)
                    .eq('is_active', true)
                    .maybeSingle();
            }

            return supabase
                .from('customers')
                .select('id,customer_code,name')
                .eq('company_id', companyId)
                .eq('customer_code', value)
                .eq('is_active', true)
                .maybeSingle();
        }

        resolveCustomer()
            .then(function(customerRes) {
                if (customerRes.error) throw customerRes.error;

                var customer = customerRes.data;
                if (!customer) {
                    throw new Error('العميل غير موجود أو لا يتبع الشركة الحالية');
                }

                var operationStorageKey =
    'RW_VAN_COLLECTION_PENDING:' +
    companyId +
    ':' +
    customer.id;

var operationFingerprint = JSON.stringify({
    company_id: companyId,
    customer_id: customer.id,
    amount: amount,
    date: new Date().toISOString().slice(0, 10),
    user_email: email
});

var operationId = null;

try {
    var pendingCollection =
        localStorage.getItem(operationStorageKey);

    if (pendingCollection) {
        var pendingData =
            JSON.parse(pendingCollection);

        if (
            pendingData &&
            pendingData.operation_id &&
            pendingData.fingerprint === operationFingerprint
        ) {
            operationId =
                pendingData.operation_id;
        }
    }
} catch (e) {}

if (!operationId) {
    operationId =
        window.crypto &&
        crypto.randomUUID
            ? crypto.randomUUID()
            : (
                'VAN-COL:' +
                companyId +
                ':' +
                customer.id +
                ':' +
                Date.now() +
                ':' +
                Math.random()
                    .toString(36)
                    .slice(2)
            );

    try {
        localStorage.setItem(
            operationStorageKey,
            JSON.stringify({
                operation_id: operationId,
                fingerprint: operationFingerprint,
                created_at: new Date().toISOString()
            })
        );
    } catch (e) {}
}

                var payload = {
                    header: {
                        date: new Date().toISOString().split('T')[0],
                        operationId: operationId,
                        customerId: customer.id,
                        reference: 'VAN-COL-' + operationId,
                        notes: 'تحصيل من عميل بواسطة مندوب البيع المباشر: ' + email,
                        sourceType: 'VAN_SALES'
                    },
                    lines: [{
                        accountName: customer.name || customer.customer_code || name || code,
                        description: 'تحصيل نقدية',
                        amount: amount
                    }]
                };

                return new Promise(function(resolve, reject) {
                    RW_API.call('save-receipt-voucher', payload, function(json, err) {
                        if (err) {
                            reject(new Error(err));
                            return;
                        }

                        if (!json || !json.success) {
                            reject(new Error(
                                (json && (json.error || json.msg)) ||
                                'فشل حفظ التحصيل'
                            ));
                            return;
                        }

                        resolve({
                            customer: customer,
                            operationId: operationId,
                            result: json
                        });
                    });
                });
            })
.then(function(resultData) {
    try {
        localStorage.removeItem(operationStorageKey);
    } catch (e) {}

    RW_UI.hideLoader();

    Swal.fire({
        icon: 'success',
        title: '✅ تم التحصيل',
        html:
            '<div class="text-right">' +
            '<p>تم تحصيل <strong>' +
            RW_UI.formatNumber(amount) +
            ' ج.م</strong> من ' +
            (resultData.customer.name ||
                resultData.customer.customer_code ||
                name ||
                code) +
            '</p></div>',
        confirmButtonText: 'حسناً',
        customClass: {
            popup: '!rounded-3xl',
            confirmButton: '!rounded-xl !bg-green-600'
        }
    }).then(function() {
        self.loadBalanceDetail();
        self.loadHomeBalanceSummary();
    });
})
            .catch(function(error) {
                RW_UI.hideLoader();

   _loadVehicleStock:function() {
    var self=this;
    var branchId=this.vanBranchId;
    var companyId=this.companyId;
    var container=RW_UI.byId('vehicleDetail');

    if(!container) return;

    if(!branchId||!companyId){
        RW_UI.safeHTML(
            container,
            '<div class="text-center py-12 bg-white rounded-2xl">'+
            '<div class="text-6xl mb-4">🚛</div>'+
            '<p class="text-slate-400 font-bold">لم يتم تحديد مخزن السيارة المعتمد</p>'+
            '</div>'
        );
        return;
    }

    Promise.all([
        supabase
            .from('stock_branches')
            .select('item_id,qty,allocated_qty,updated_at')
            .eq('branch_id',branchId),

        supabase
            .from('items')
            .select('id,item_code,name,sales_price,unit')
            .eq('company_id',companyId)
            .eq('is_active',true)
    ])
    .then(function(result){
        var stockRes=result[0],
            itemsRes=result[1];

        if(stockRes.error) throw stockRes.error;
        if(itemsRes.error) throw itemsRes.error;

        var itemMap={};

        (itemsRes.data||[]).forEach(function(it){
            itemMap[String(it.id)]=it;
        });

        var myStock=(stockRes.data||[])
            .map(function(st){
                var it=itemMap[String(st.item_id)];

                return{
                    item_id:st.item_id,
                    item:it,
                    qty:Math.max(0,Number(st.qty)||0),
                    allocated_qty:Math.max(0,Number(st.allocated_qty)||0),
                    updated_at:st.updated_at||null
                };
            })
            .filter(function(x){
                return x.qty>0;
            })
            .sort(function(a,b){
                var ac=a.item?(a.item.item_code||''):'',
                    bc=b.item?(b.item.item_code||''):'';

                return String(ac).localeCompare(String(bc),'ar');
            });

        var orderQuery=supabase
            .from('orders')
            .select('id')
            .eq('company_id',companyId)
            .eq('created_by',self.currentUser.email)
            .eq('source','van-sales')
            .eq('order_date',new Date().toISOString().split('T')[0]);

        return Promise.resolve(orderQuery)
            .then(function(oRes){
                if(oRes.error) throw oRes.error;

                var orderIds=(oRes.data||[]).map(function(o){
                    return o.id;
                });

                if(!orderIds.length){
                    self._renderVehicleStockHTML(
                        container,
                        myStock,
                        myStock.map(function(x){return x.item;}),
                        {}
                    );
                    return;
                }

                return supabase
                    .from('order_details')
                    .select('item_code,qty')
                    .in('order_id',orderIds)
                    .then(function(dRes){
                        if(dRes.error) throw dRes.error;

                        var soldMap={};

                        (dRes.data||[]).forEach(function(d){
                            var code=String(d.item_code||'');
                            soldMap[code]=
                                (soldMap[code]||0)+
                                (Number(d.qty)||0);
                        });

                        self._renderVehicleStockHTML(
                            container,
                            myStock,
                            myStock.map(function(x){return x.item;}),
                            soldMap
                        );
                    });
            });
    })
    .catch(function(err){
        console.error('_loadVehicleStock:',err);

        RW_UI.safeHTML(
            container,
            '<div class="text-center py-12 bg-white rounded-2xl">'+
            '<p class="text-red-400 font-bold">تعذر تحميل العهدة الحية من النظام</p>'+
            '</div>'
        );
    });
},

    _renderVehicleStockHTML: function(container, myStock, items, soldMap) {
        var self = this;
        var totalValue = 0;
        var rows = '';

        for (var m = 0; m < myStock.length; m++) {
            var it = items[m];
            var st = myStock[m];
            var nm = it ? it.name : (st.item_id || '---');
            var ic = it ? it.item_code : (st.item_id || '---');

            var currentQty = Math.max(0, Number(st.qty) || 0);
            var soldQtyToday = soldMap[ic] || 0;
            var price = it ? (Number(it.sales_price) || 0) : 0;

            totalValue += currentQty * price;

            var color = currentQty > 10
                ? 'text-green-600'
                : currentQty > 0
                    ? 'text-amber-600'
                    : 'text-red-600';

            var imgHtml = RW_ImageCache.getImageHTML(ic, 'w-12', 'h-12');

            rows += '<div class="card mb-2 slide-in">';
            rows += '<div class="flex items-center gap-3">';
            rows += '<div class="flex-shrink-0">' + imgHtml + '</div>';
            rows += '<div class="flex-1">';
            rows += '<p class="font-bold text-sm">' + nm + '</p>';
            rows += '<p class="text-xs text-gray-400">' +
                'الرصيد الحالي: <strong class="' + color + '">' + currentQty + '</strong>' +
                ' | المباع اليوم: <strong class="text-red-500">' + soldQtyToday + '</strong>' +
                '</p>';
            rows += '</div>';
            rows += '<div class="text-left"><span class="font-bold text-sm">' +
                RW_UI.formatNumber(currentQty * price) +
                ' ج.م</span></div>';
            rows += '</div></div>';
        }

        var html = '<div class="bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-2xl p-5 mb-4 text-center">';
        html += '<p class="text-sm opacity-80">قيمة البضاعة الحالية</p>';
        html += '<p class="text-3xl font-black">' + RW_UI.formatNumber(totalValue) + ' ج.م</p>';
        html += '</div>';
        html += '<button onclick="App.openQuickInventory()" class="w-full bg-amber-600 text-white py-3 rounded-xl font-black text-sm mb-4 shadow-lg shadow-amber-200 active:scale-95 transition">🔍 جرد سريع للسيارة</button>';
        html += rows;

        RW_UI.safeHTML(container, html);
    },

    // ==================== إقفال الوردية ====================
initiateEndOfDay: function() {
    var self = this;

    if (!this.companyId) {
        RW_UI.toast('سياق الشركة غير محدد', 'error');
        return;
    }

    var driverId = this.currentUser && this.currentUser.id
        ? this.currentUser.id
        : (RW_Auth.getUser() && RW_Auth.getUser().id
            ? RW_Auth.getUser().id
            : null);

    if (!driverId) {
        RW_UI.toast('هوية مندوب البيع غير محددة', 'error');
        return;
    }

    RW_UI.showLoader('جاري البحث عن الرانشيتات الجاهزة للتسوية...');

    supabase.from('runsheets')
        .select('runsheet_code,status,run_date,vehicle_id')
        .eq('company_id', this.companyId)
        .eq('driver_id', driverId)
        .in('status', ['Delivered', 'Returned'])
        .order('run_date', { ascending: false })
        .order('updated_at', { ascending: false })
        .limit(20)
        .then(function(res) {
            RW_UI.hideLoader();

            if (res.error) throw res.error;

            var runsheets = res.data || [];

            if (!runsheets.length) {
                self.eodLocked = true;
                self.renderBalanceView();
                RW_UI.toast('لا توجد رانشيتات وصلت إلى مرحلة التسوية.', 'info');
                return;
            }

            var options = {};
            for (var i = 0; i < runsheets.length; i++) {
                var rs = runsheets[i];
                options[rs.runsheet_code] =
                    rs.runsheet_code + ' — ' + rs.status + ' — ' + (rs.run_date || '');
            }

            return Swal.fire({
                title: 'إقفال الوردية',
                text: 'اختر الرانشيت التي تريد تسويتها وإغلاقها:',
                input: 'select',
                inputOptions: options,
                inputPlaceholder: 'اختر رانشيت',
                showCancelButton: true,
                confirmButtonText: 'متابعة التسوية',
                cancelButtonText: 'إلغاء',
                customClass: {
                    popup: '!rounded-3xl',
                    confirmButton: '!rounded-xl !bg-green-600',
                    cancelButton: '!rounded-xl'
                },
                inputValidator: function(value) {
                    return value ? undefined : 'اختر رانشيت أولاً';
                }
            }).then(function(choice) {
                if (!choice.isConfirmed || !choice.value) return;

                var runsheetCode = choice.value;
                var opKey = 'RW_VAN_SETTLEMENT_OP:' + self.companyId + ':' + runsheetCode;
                var operationId = null;

                try {
                    var saved = JSON.parse(localStorage.getItem(opKey) || 'null');
                    if (saved && saved.operation_id) operationId = saved.operation_id;
                } catch (e) {}

                if (!operationId) {
                    operationId = window.crypto && crypto.randomUUID
                        ? crypto.randomUUID()
                        : ('VAN-SETTLE-' + Date.now() + '-' + Math.random().toString(36).slice(2));
                    try {
                        localStorage.setItem(opKey, JSON.stringify({
                            operation_id: operationId,
                            created_at: new Date().toISOString()
                        }));
                    } catch (e) {}
                }

                RW_UI.showLoader('جاري التحقق من الرصيد...');

                return supabase.from('driver_ledger')
                    .select('debit,credit')
                    .eq('driver_email', self.currentUser.email)
                    .then(function(balanceRes) {
                        if (balanceRes.error) throw balanceRes.error;

                        var rows = balanceRes.data || [];
                        var totalDebit = 0;
                        var totalCredit = 0;

                        for (var j = 0; j < rows.length; j++) {
                            totalDebit += Number(rows[j].debit) || 0;
                            totalCredit += Number(rows[j].credit) || 0;
                        }

                        var balance = totalDebit - totalCredit;

                        if (balance !== 0) {
                            RW_UI.hideLoader();
                            RW_UI.toast(
                                'يجب تصفير الرصيد أولاً. المتبقي: ' +
                                RW_UI.formatNumber(Math.abs(balance)) +
                                ' ج.م',
                                'warning'
                            );
                            return;
                        }

                        RW_UI.showLoader('جاري حفظ التسوية المحاسبية...');

                        RW_API.call(
                            'save-daily-settlement',
                            {
                                runsheet_code: runsheetCode,
                                operation_id: operationId,
                                notes: 'تسوية يومية للرانشيت ' + runsheetCode
                            },
                            function(json) {
                                RW_UI.hideLoader();

                                if (!json || !json.success) {
                                    RW_UI.showError(
                                        (json && (json.msg || json.error)) ||
                                        'فشل حفظ التسوية'
                                    );
                                    return;
                                }

                                try {
                                    localStorage.removeItem(opKey);
                                } catch (e) {}

                                supabase.from('runsheets')
                                    .select('runsheet_code')
                                    .eq('company_id', self.companyId)
                                    .eq('driver_id', driverId)
                                    .in('status', ['Delivered', 'Returned'])
                                    .limit(1)
                                    .then(function(leftRes) {
                                        self.eodLocked =
                                            !leftRes.data || leftRes.data.length === 0;
                                        self.renderBalanceView();

                                        RW_UI.toast(
                                            json.duplicate
                                                ? 'تم استرجاع نتيجة التسوية السابقة'
                                                : 'تم حفظ وإغلاق التسوية بنجاح',
                                            'success'
                                        );
                                    })
                                    .catch(function() {
                                        self.eodLocked = false;
                                        self.renderBalanceView();
                                    });
                            }
                        );
                    })
                    .catch(function(err) {
                        RW_UI.hideLoader();
                        RW_UI.showError(
                            err && err.message
                                ? err.message
                                : 'فشل التحقق من الرصيد'
                        );
                    });
            });
        })
        .catch(function(err) {
            RW_UI.hideLoader();
            RW_UI.showError(
                err && err.message
                    ? err.message
                    : 'فشل تحميل رانشيتات التسوية'
            );
        });
},

    // ==================== البحث الحي عن العملاء ====================
    searchCustomers: function(q) {
        var r = RW_UI.byId('custResults'); if (!r) return;
        if (!q || !q.trim()) { RW_UI.safeHTML(r, ''); return; }
        var s = q.toLowerCase();
        var db = RW_DB.getDB('VanSales');
        db.customers.toArray().then(function(all) {
            var f = [];
            for (var i = 0; i < all.length; i++) { var c = all[i]; if ((c.name || '').toLowerCase().indexOf(s) !== -1 || (c.customer_code || '').toLowerCase().indexOf(s) !== -1 || (c.phone || '').indexOf(s) !== -1 || (c.area || '').toLowerCase().indexOf(s) !== -1) f.push(c); if (f.length >= 10) break; }
            if (!f.length) { RW_UI.safeHTML(r, '<div class="text-center text-gray-400 p-3 bg-white rounded-xl text-sm">لا توجد نتائج</div>'); return; }
            var h = '';
            for (var j = 0; j < f.length; j++) { var cu = f[j], dc = Number(cu.debt) > 0 ? 'text-red-500' : 'text-green-600'; h += '<div onclick="App.selectCustomer(\'' + cu.customer_code + '\')" class="bg-white p-3 rounded-xl shadow-sm border cursor-pointer hover:bg-orange-50 active:bg-orange-100"><div class="font-bold text-sm">' + (cu.name || '') + '</div><div class="text-xs text-gray-400">' + (cu.customer_code || '') + ' - ' + (cu.area || '') + ' | الرصيد: <span class="' + dc + ' font-bold">' + RW_UI.formatNumber(cu.debt) + '</span></div></div>'; }
            RW_UI.safeHTML(r, h);
        });
    },

    // ==================== اختيار العميل ====================
    selectCustomer: function(code) {
        var self = this;
        var db = RW_DB.getDB('VanSales');
        db.customers.get(code).then(function(c) {
            if (!c) return;
            self.selCust = c;
            var limit = Number(c.credit_limit) || 0, debt = Number(c.debt) || 0, pct = limit > 0 ? (debt / limit) * 100 : 0;
            // تنبيه الحد الائتماني
            var banner = RW_UI.byId('creditBanner');
            if (banner) {
                if (pct >= 100) { banner.className = 'text-center py-2 text-sm font-bold flex-shrink-0 bg-red-500 text-white'; banner.innerHTML = '⛔ العميل تجاوز الحد الائتماني (' + RW_UI.formatNumber(debt) + ' / ' + RW_UI.formatNumber(limit) + ')'; }
                else if (pct >= 75) { banner.className = 'text-center py-2 text-sm font-bold flex-shrink-0 bg-yellow-100 text-yellow-800 border-b border-yellow-200'; banner.innerHTML = '⚠️ العميل يقترب من الحد الائتماني (' + Math.round(pct) + '%)'; }
                else { banner.className = 'hidden'; }
            }
            // عرض معلومات العميل
            var info = RW_UI.byId('selectedCustInfo');
            if (info) { info.classList.remove('hidden'); info.innerHTML = '<div class="flex justify-between items-center"><div><span class="font-black text-orange-800">' + (c.name || '') + '</span><span class="text-xs text-orange-500 mr-2">' + (c.area || '') + '</span></div><button onclick="App.clearCustomer()" class="text-xs text-red-500 font-bold">✕ تغيير</button></div>'; }
            RW_UI.byId('custSearch').value = ''; RW_UI.safeHTML(RW_UI.byId('custResults'), '');
            self.loadGhostCart(c.customer_code);
            self.checkForgottenItems(c.customer_code);
            self._renderQuickCart();
        });
    },

    clearCustomer: function() {
        this.selCust = null;
        var b = RW_UI.byId('creditBanner'); if (b) b.className = 'hidden';
        var i = RW_UI.byId('selectedCustInfo'); if (i) i.classList.add('hidden');
        var gc = RW_UI.byId('ghostCartContainer'); if (gc) gc.classList.add('hidden');
        var fc = RW_UI.byId('forgottenItemsContainer'); if (fc) fc.classList.add('hidden');

showRecentCustomers: function() {
    var self = this;
    var row = RW_UI.byId('recentCustomersRow');

    if (!row || !this.currentUser || !this.currentUser.id) {
        return;
    }

    var companyId = null;

    supabase.from('users')
        .select('company_id')
        .eq('id', this.currentUser.id)
        .maybeSingle()
        .then(function(userRes) {
            if (userRes.error) throw userRes.error;

            if (!userRes.data || !userRes.data.company_id) {
                RW_UI.safeHTML(
                    row,
                    '<span class="text-xs text-gray-400 py-1">لا يوجد سياق شركة</span>'
                );
                return null;
            }

            companyId = userRes.data.company_id;

            return supabase.from('orders')
                .select('customer_id')
                .eq('company_id', companyId)
                .eq('created_by', self.currentUser.email)
                .eq('source', 'van-sales')
                .not('customer_id', 'is', null)
                .order('order_date', { ascending: false })
                .limit(20);
        })
        .then(function(orderRes) {
            if (!orderRes) return null;
            if (orderRes.error) throw orderRes.error;

            var orders = orderRes.data || [];
            var customerIds = [];

            for (var i = 0; i < orders.length; i++) {
                var id = orders[i].customer_id;
                if (id && customerIds.indexOf(id) === -1) {
                    customerIds.push(id);
                }
                if (customerIds.length >= 5) break;
            }

            if (!customerIds.length) {
                RW_UI.safeHTML(
                    row,
                    '<span class="text-xs text-gray-400 py-1">لا يوجد عملاء سابقون</span>'
                );
                return null;
            }

            return supabase.from('customers')
                .select('id,customer_code,name')
                .eq('company_id', companyId)
                .in('id', customerIds);
        })
        .then(function(customerRes) {
            if (!customerRes) return;
            if (customerRes.error) throw customerRes.error;

            var customers = customerRes.data || [];
            var html = '';

            for (var j = 0; j < customers.length; j++) {
                var customer = customers[j];
                var code = customer.customer_code || customer.id;
                var safeCode = String(code).replace(/'/g, "\\'");
                var safeName = String(customer.name || code)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');

                html +=
                    '<button onclick="App.selectCustomer(\'' + safeCode + '\')" ' +
                    'class="whitespace-nowrap bg-orange-50 text-orange-700 px-3 py-1.5 rounded-full text-xs font-bold active:bg-orange-100 flex-shrink-0">' +
                    '<i class="fa-solid fa-clock-rotate-left ml-1 text-orange-400"></i>' +
                    safeName +
                    '</button>';
            }

            RW_UI.safeHTML(
                row,
                html || '<span class="text-xs text-gray-400 py-1">لا يوجد عملاء سابقون</span>'
            );
        })
        .catch(function(error) {
            console.error('showRecentCustomers:', error);
            RW_UI.safeHTML(
                row,
                '<span class="text-xs text-red-400 py-1">تعذر تحميل العملاء السابقين</span>'
            );
        });
},
    // ==================== عرض تفاصيل المنتج ====================
    showProductDetail: function(code, name, unit, price, avail, desc, imgUrl) {

        var stockColor = avail > 10 ? '#10b981' : avail > 0 ? '#f59e0b' : '#ef4444';
        var stockText = avail > 10 ? 'متوفر بكمية كبيرة' : avail > 0 ? 'الكمية محدودة (' + avail + ')' : 'نفد المخزون';
        var h = '<div style="text-align:right;font-family:Cairo,sans-serif;direction:rtl" id="productDetailContainer">' + imgHtml;
        h += '<h3 style="font-size:20px;font-weight:800;color:#1e293b;margin-bottom:4px">' + name + '</h3>';
        h += '<p style="font-size:13px;color:#64748b;margin-bottom:12px">الكود: ' + code + ' | الوحدة: ' + unit + '</p>';
        if (desc) h += '<div style="background:#f8fafc;padding:12px;border-radius:12px;margin-bottom:16px;font-size:13px;color:#475569">📝 ' + desc + '</div>';
        h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + stockColor + '"></span><span style="font-size:13px;color:#64748b">' + stockText + '</span></div>';
        h += '<div style="display:flex;align-items:center;justify-content:space-between;background:#f8fafc;padding:16px;border-radius:16px"><span style="font-size:28px;font-weight:800;color:#ea580c">' + RW_UI.formatNumber(price) + ' ج.م</span>';
        if (avail > 0) {
            if (inCart > 0) {
                h += '<div style="display:flex;align-items:center;gap:12px" id="detailQtyControls"><button onclick="App._updateDetailQty(\'' + code + '\', -1)" style="width:36px;height:36px;border-radius:50%;background:#f1f5f9;border:2px solid #e2e8f0;font-weight:700;font-size:18px;cursor:pointer;color:#1e293b;display:flex;align-items:center;justify-content:center">-</button><span style="font-weight:800;font-size:18px;color:#1e293b;min-width:24px;text-align:center" id="detailQtySpan">' + inCart + '</span><button onclick="App._updateDetailQty(\'' + code + '\', 1)" style="width:36px;height:36px;border-radius:50%;background:#ea580c;border:none;font-weight:700;font-size:18px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center">+</button></div>';
            } else {
                h += '<button onclick="App._addToCartFromDetail(\'' + code + '\')" style="background:#ea580c;color:#fff;padding:10px 24px;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer"><i class="fa-solid fa-cart-plus" style="margin-left:6px"></i> أضف للسلة</button>';
            }
        } else { h += '<span style="color:#ef4444;font-weight:700">غير متوفر حالياً</span>'; }
        h += '</div></div>';
        Swal.fire({ html: h, width: '450px', showCloseButton: true, showConfirmButton: false, customClass: { popup: '!rounded-3xl !p-5', closeButton: '!text-slate-400 !text-lg' } });
    },

    _updateDetailQty: function(code, delta) {
        var newQty = 0;
        for (var i = 0; i < this.cart.length; i++) {
            if (this.cart[i].code === code) {
                if (delta > 0) { this.cart[i].qty++; newQty = this.cart[i].qty; }
                else { this.cart[i].qty--; if (this.cart[i].qty <= 0) { this.cart.splice(i, 1); newQty = 0; } else { newQty = this.cart[i].qty; } }
                break;
            }
        }
        this._updateFloatingCart(); this._renderQuickCart();
        var popup = Swal.getPopup();
        if (popup && newQty > 0) { var span = popup.querySelector('#detailQtySpan'); if (span) span.innerText = newQty; }
        else if (popup && newQty === 0) { var controls = popup.querySelector('#detailQtyControls'); if (controls) { controls.innerHTML = '<button onclick="App._addToCartFromDetail(\'' + code + '\')" style="background:#ea580c;color:#fff;padding:10px 24px;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer"><i class="fa-solid fa-cart-plus" style="margin-left:6px"></i> أضف للسلة</button>'; } }
    },

    _addToCartFromDetail: function(code) {
        this.addToQuickCart(code);
        var popup = Swal.getPopup();
        if (popup) {
            var inCart = 0; for (var x = 0; x < this.cart.length; x++) { if (this.cart[x].code === code) { inCart = this.cart[x].qty; break; } }
            if (inCart > 0) {
                var allButtons = popup.querySelectorAll('button');
                for (var i = 0; i < allButtons.length; i++) {
                    if (allButtons[i].innerText.indexOf('أضف للسلة') !== -1) {
                        allButtons[i].outerHTML = '<div style="display:flex;align-items:center;gap:12px" id="detailQtyControls"><button onclick="App._updateDetailQty(\'' + code + '\', -1)" style="width:36px;height:36px;border-radius:50%;background:#f1f5f9;border:2px solid #e2e8f0;font-weight:700;font-size:18px;cursor:pointer;color:#1e293b;display:flex;align-items:center;justify-content:center">-</button><span style="font-weight:800;font-size:18px;color:#1e293b;min-width:24px;text-align:center" id="detailQtySpan">' + inCart + '</span><button onclick="App._updateDetailQty(\'' + code + '\', 1)" style="width:36px;height:36px;border-radius:50%;background:#ea580c;border:none;font-weight:700;font-size:18px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center">+</button></div>';
                        break;
                    }
                }
            }
        }
    },

    // ==================== تحميل قائمة العملاء للبيع السريع ====================
    _loadQuickSaleCustomers: function(customerCode) {
        var self = this;
        var db = RW_DB.getDB('VanSales');
        var sel = RW_UI.byId('quickCustSelect');
        
        // ✅ إذا كان عنصر select غير موجود (تم استبداله بالبحث الحي)، نتعامل مباشرة مع customerCode
        if (!sel) {
            if (customerCode) {
                db.customers.get(customerCode).then(function(c) {
                    if (c) {
                        self.selCust = { customer_code: c.customer_code, name: c.name, area: c.area || '', payment_type: c.payment_type || 'نقدي' };
                        var info = RW_UI.byId('selectedCustInfo');
                        if (info) { info.classList.remove('hidden'); info.innerHTML = '<div class="flex justify-between items-center"><div><span class="font-black text-orange-800">' + (c.name || '') + '</span><span class="text-xs text-orange-500 mr-2">' + (c.area || '') + '</span></div><button onclick="App.clearCustomer()" class="text-xs text-red-500 font-bold">✕ تغيير</button></div>'; }
                        self.loadGhostCart(c.customer_code);
                        self.checkForgottenItems(c.customer_code);
                    }
                });
            }
            self.showRecentCustomers();
            return;
        }

        // ✅ المنطق الأصلي للقائمة المنسدلة – لم يُمس
        db.myCustomers.toArray().then(function(list) {
            var opts = '<option value="">-- اختر عميلاً --</option>';
            for (var i = 0; i < list.length; i++) {
                var selAttr = (list[i].customer_code === customerCode) ? ' selected' : '';
                opts += '<option value="' + list[i].customer_code + '"' + selAttr + '>' + list[i].name + '</option>';
            }
            RW_UI.safeHTML(sel, opts);

            sel.onchange = function() {
                var cc = this.value;
                if (cc) {
                    db.myCustomers.get(cc).then(function(c) {
                        if (c) {
                            self.selCust = { customer_code: c.customer_code, name: c.name, area: c.area || '', payment_type: c.payment_type || 'نقدي' };
                            self.loadGhostCart(cc);
                            self.checkForgottenItems(cc);
                        }
                    });
                } else {
                    self.selCust = null;
                    var gc = RW_UI.byId('ghostCartContainer'); if (gc) gc.classList.add('hidden');
                    var fc = RW_UI.byId('forgottenItemsContainer'); if (fc) fc.classList.add('hidden');
                }
            };

            if (customerCode && sel.value === customerCode) {
                db.myCustomers.get(customerCode).then(function(c) {
                    if (c) {
                        self.selCust = { customer_code: c.customer_code, name: c.name, area: c.area || '', payment_type: c.payment_type || 'نقدي' };
                        self.loadGhostCart(customerCode);
                        self.checkForgottenItems(customerCode);
                    }
                });
            }
        });
    },

    // ==================== البحث عن منتج ====================
    searchQuickItems: function(q) {
        var self = this;
        var container = RW_UI.byId('quickItemResults');
        if (!container) return;
        if (!q || !q.trim()) { RW_UI.safeHTML(container, ''); return; }

        var db = RW_DB.getDB('VanSales');
        db.items.toArray().then(function(all) {
            var s = q.toLowerCase();
            var filtered = [];
            for (var i = 0; i < all.length; i++) {
                var it = all[i];
                if ((it.name || '').toLowerCase().indexOf(s) !== -1 || (it.item_code || '').toLowerCase().indexOf(s) !== -1 || (it.barcode || '').indexOf(s) !== -1) {
                    filtered.push(it);
                }
            }
            filtered = filtered.slice(0, 12);
            if (!filtered.length) {
                RW_UI.safeHTML(container, '<div class="col-span-2 text-center text-gray-400 p-4 bg-white rounded-xl">🔍 لا توجد نتائج</div>');
                return;
            }
            var html = '';
            for (var j = 0; j < filtered.length; j++) {
                var it = filtered[j];
                var imgHtml = RW_ImageCache.getImageHTML(it.item_code, 'w-16', 'h-16');
                html += '<div onclick="App.addToQuickCart(\'' + it.item_code + '\')" class="bg-white p-3 rounded-xl border-2 border-slate-100 cursor-pointer hover:border-orange-300 hover:bg-orange-50 active:scale-95 transition slide-in">';
                html += '<div class="flex flex-col items-center text-center">';
                html += imgHtml;
                html += '<p class="font-bold text-xs text-slate-700 mt-2 line-clamp-2">' + (it.name || '') + '</p>';
                html += '<p class="text-orange-600 font-black text-sm mt-1">' + RW_UI.formatNumber(it.sales_price) + ' ج.م</p>';
                html += '</div></div>';
            }
            RW_UI.safeHTML(container, html);
        });
    },

    // ==================== إضافة للسلة ====================
    addToQuickCart: function(code) {
        var self = this;
        var db = RW_DB.getDB('VanSales');
        db.items.get(code).then(function(it) {
            if (!it) return;
            var existing = null;
            for (var i = 0; i < self.cart.length; i++) { if (self.cart[i].code === code) { existing = self.cart[i]; break; } }
            var cur = existing ? existing.qty : 0, nq = cur + 1;
            var mx = it.max_qty ? Number(it.max_qty) : 0;
            if (mx > 0 && nq > mx) { RW_UI.toast('الحد الأقصى للطلب: ' + mx, 'warning'); return; }
            if (existing) { existing.qty = nq; }
            else {
                self.cart.push({ code: it.item_code, name: it.name, price: Number(it.sales_price) || 0, unit: it.unit || 'حبة', qty: 1 });
            }
            self._renderQuickCart();
            self._updateFloatingCart();
            // تحديث كشف المنسيات
            if (self.selCust) self.checkForgottenItems(self.selCust.customer_code);
            if (navigator.vibrate) navigator.vibrate(15);
            // مسح حقل البحث
            var searchInput = RW_UI.byId('quickSearch');
            if (searchInput) searchInput.value = '';
            RW_UI.safeHTML(RW_UI.byId('quickItemResults'), '');
        });
    },

    decQuickCart: function(code) {
        for (var i = 0; i < this.cart.length; i++) {
            if (this.cart[i].code === code) { this.cart[i].qty--; if (this.cart[i].qty <= 0) this.cart.splice(i, 1); break; }
        }
        this._renderQuickCart();
        this._updateFloatingCart();
    },

    // ==================== عرض السلة في شاشة البيع السريع ====================
    _renderQuickCart: function() {
        var container = RW_UI.byId('quickCartItems');
        var badge = RW_UI.byId('quickCartBadge');
        if (!container) return;

        if (!this.cart.length) {
            RW_UI.safeHTML(container, '<p class="text-slate-400 text-center py-4">السلة فارغة – أضف منتجات</p>');
            if (badge) RW_UI.safeText(badge, '(0)');
            return;
        }

        var html = '';
        var total = 0;
        for (var i = 0; i < this.cart.length; i++) {
            var item = this.cart[i];
            var lt = item.price * item.qty;
            total += lt;
            html += '<div class="flex justify-between items-center py-2 border-b border-slate-100">';
            html += '<div><span class="font-bold text-sm text-slate-700">' + item.name + '</span><span class="text-xs text-gray-400 mr-2">' + RW_UI.formatNumber(item.price) + ' × ' + item.qty + '</span></div>';
            html += '<div class="flex items-center gap-1">';
            html += '<button onclick="App.decQuickCart(\'' + item.code + '\')" class="w-6 h-6 bg-gray-100 rounded-full text-xs font-black text-slate-600 active:scale-90 transition">-</button>';
            html += '<span class="w-5 text-center font-black text-sm">' + item.qty + '</span>';
            html += '<button onclick="App.addToQuickCart(\'' + item.code + '\')" class="w-6 h-6 bg-orange-600 text-white rounded-full text-xs font-black active:scale-90 transition">+</button>';
            html += '</div></div>';
        }
