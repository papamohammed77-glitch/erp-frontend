<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>فان سيلز | الروائع ERP</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
    <script src="../core.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Cairo',sans-serif;background:#f1f5f9;-webkit-tap-highlight-color:transparent}
        .auth-container{background:linear-gradient(135deg,#7c2d12 0%,#9a3412 40%,#ea580c 100%)}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05);transition:all 0.15s ease}
        .card:active{transform:scale(0.98)}
        .btn-primary{background:linear-gradient(135deg,#ea580c,#f97316);color:#fff;padding:1rem 1.5rem;border-radius:14px;font-weight:700;border:none;cursor:pointer;width:100%;box-shadow:0 4px 12px rgba(234,88,12,0.25)}
        .btn-primary:active{transform:scale(0.97)}
        .tab-btn{transition:all 0.2s ease}
        .slide-in{animation:slideIn 0.25s ease}
        @keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        .badge-green{background:#dcfce7;color:#166534}
        .badge-yellow{background:#fef9c3;color:#854d0e}
        .badge-red{background:#fee2e2;color:#991b1b}
        .map-wrapper{border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- شاشة الدخول -->
<div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center auth-container p-4">
    <div class="bg-white rounded-[32px] shadow-2xl p-6 w-[92%] max-w-md slide-in">
        <div class="text-center mb-6">
            <div class="w-20 h-20 bg-gradient-to-br from-orange-600 to-orange-800 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4">
                <i class="fa-solid fa-truck-field text-white text-3xl"></i>
            </div>
            <h1 class="font-black text-2xl text-gray-800">الروائع</h1>
            <p class="text-xs text-gray-400 font-bold mt-1">مندوب البيع المباشر</p>
        </div>
        <h2 class="text-lg font-bold text-gray-700 text-center mb-4">تسجيل الدخول إلى حسابك</h2>
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">البريد الإلكتروني <span class="text-red-500">*</span></label>
                <input id="loginEmail" type="email" placeholder="example@domain.com" class="w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-orange-600 focus:bg-white outline-none font-bold text-sm transition-all">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 mb-1">كلمة السر <span class="text-red-500">*</span></label>
                <div class="relative">
                    <input id="loginPass" type="password" placeholder="••••••••" class="w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-orange-600 focus:bg-white outline-none font-bold text-sm transition-all pr-12">
                    <button type="button" onclick="togglePass()" class="absolute left-2 top-1/2 -translate-y-1/2 p-2 text-gray-400 hover:text-gray-600">
                        <i id="passIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>
        </div>
        <button onclick="doLogin()" class="w-full bg-gradient-to-r from-orange-600 to-orange-700 text-white py-3.5 rounded-xl font-black text-sm shadow-lg shadow-orange-200 hover:shadow-xl transition-all mt-4">
            تسجيل الدخول
        </button>
        <p id="loginMsg" class="text-center text-xs text-red-500 font-bold mt-3 hidden"></p>
    </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="mainApp" class="hidden flex flex-col h-full">

    <header class="bg-orange-700 text-white px-3 flex items-center justify-between sticky top-0 z-30 shadow-md flex-shrink-0" style="padding-top:max(8px,env(safe-area-inset-top));min-height:52px">
        <div class="flex items-center gap-2">
            <span class="font-black text-sm">🚛 فان سيلز</span>
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto">
            <span id="connDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
            <span id="connLabel" class="text-[11px] font-bold">متصل</span>
            <button onclick="App.showView('customers')" class="bg-white/10 px-2.5 py-1.5 rounded-full flex items-center gap-1 text-[11px] font-bold flex-shrink-0"><i class="fa-solid fa-users text-xs"></i><span>عملائي</span></button>
            <button onclick="App.showView('map')" class="bg-white/10 px-2.5 py-1.5 rounded-full flex items-center gap-1 text-[11px] font-bold flex-shrink-0"><i class="fa-solid fa-map-location-dot text-xs"></i><span>الخريطة</span></button>
            <button onclick="App.syncData()" class="bg-white/10 px-2.5 py-1.5 rounded-full flex items-center gap-1 text-[11px] font-bold flex-shrink-0"><i class="fa-solid fa-rotate text-xs"></i></button>
            <button onclick="doLogout()" class="bg-white/10 px-2.5 py-1.5 rounded-full flex items-center gap-1 text-[11px] font-bold flex-shrink-0 text-red-200"><i class="fa-solid fa-right-from-bracket text-xs"></i></button>
        </div>
    </header>

    <main id="mainContent" class="flex-1 overflow-y-auto pb-20"></main>

    <!-- السلة العائمة -->
    <div id="floatingCart" class="hidden mx-3 mb-2 bg-gray-900 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center cursor-pointer active:scale-[0.98] transition z-20 flex-shrink-0" onclick="App.showView('new-order')">
        <div class="flex items-center gap-3">
            <div class="bg-orange-600 w-10 h-10 rounded-full flex items-center justify-center font-black text-sm" id="cartBadgeCount">0</div>
            <div>
                <div class="font-bold text-sm">سلة المشتريات</div>
                <div class="text-xs text-gray-400" id="cartBadgeSummary">لا توجد أصناف</div>
            </div>
        </div>
        <div class="text-left">
            <div class="text-xs text-gray-400">الإجمالي</div>
            <div class="font-black text-lg" id="cartBadgeTotal">0.00</div>
        </div>
    </div>

    <nav id="bottomNav" class="bg-white border-t fixed bottom-0 left-0 right-0 z-30 h-16 flex justify-around items-center text-gray-400 text-xs flex-shrink-0" style="padding-bottom:max(12px,env(safe-area-inset-bottom))">
        <button onclick="App.showView('home')" class="flex flex-col items-center p-2 text-orange-600" id="nav-home"><i class="fa-solid fa-calendar-day text-lg mb-1"></i><span>اليوم</span></button>
        <button onclick="App.showView('invoices')" class="flex flex-col items-center p-2 text-gray-400" id="nav-invoices"><i class="fa-solid fa-file-invoice text-lg mb-1"></i><span>فواتيري</span></button>
        <button onclick="App.startNewOrder()" class="flex flex-col items-center p-2 text-gray-400 relative" id="nav-new-order" style="margin-top:-20px">
            <div class="w-14 h-14 bg-orange-600 rounded-full flex items-center justify-center text-white text-2xl shadow-lg shadow-orange-300 active:scale-90 transition"><i class="fa-solid fa-plus"></i></div>
            <span>أوردر جديد</span>
        </button>
        <button onclick="App.showView('vehicle')" class="flex flex-col items-center p-2 text-gray-400" id="nav-vehicle"><i class="fa-solid fa-truck text-lg mb-1"></i><span>سيارتي</span></button>
        <button onclick="App.showView('balance')" class="flex flex-col items-center p-2 text-gray-400" id="nav-balance"><i class="fa-solid fa-scale-balanced text-lg mb-1"></i><span>رصيدي</span></button>
    </nav>
</div>
<script>
// ============================================================
// قاعدة البيانات المحلية (Dexie) – خاصة بالتطبيق
// ============================================================
var db = new Dexie('RW_VanSales');
db.version(2).stores({
    customers: 'customer_code, name, area, phone, visit_day',
    items: 'item_code, name, sales_price, unit, max_qty, barcode, category, image_url',
    stock: '[item_id+branch_id], qty, allocated_qty',
    branches: 'branch_code, name',
    meta: 'key',
    orders: '++id, status, created_at',
    pending_updates: '++id, type, status',
    myCustomers: 'customer_code, name, area, phone, debt, last_order_date',
    myLedger: '++id, entry_date, description, debit, credit, balance'
});

// ============================================================
// التطبيق
// ============================================================
var App = {
    currentUser: null,
    vanBranch: null,
    cart: [],
    selCust: null,
    delFee: 0,
    taxRate: 0,
    minAmt: 0,
    companyName: 'الروائع',
    _mapInstance: null,
    _mapMarkers: [],
    currentView: 'home',

    // ==================== دوال الدخول ====================
    togglePass: function() {
        var passInput = RW_UI.byId('loginPass');
        var icon = RW_UI.byId('passIcon');
        if (passInput.type === 'password') {
            passInput.type = 'text';
            icon.className = 'fa-solid fa-eye-slash';
        } else {
            passInput.type = 'password';
            icon.className = 'fa-solid fa-eye';
        }
    },

    doLogin: function() {
        var email = RW_UI.byId('loginEmail').value.trim();
        var pass = RW_UI.byId('loginPass').value.trim();
        if (!email || !pass) {
            RW_UI.byId('loginMsg').innerText = 'أدخل البريد الإلكتروني وكلمة المرور';
            RW_UI.byId('loginMsg').classList.remove('hidden');
            return;
        }
        RW_UI.byId('loginMsg').classList.add('hidden');
        var self = this;
        RW_UI.showLoader('جاري تسجيل الدخول...');
        RW_Auth.doLogin(email, pass, function(user, err) {
            RW_UI.hideLoader();
            if (err) {
                RW_UI.byId('loginMsg').innerText = err;
                RW_UI.byId('loginMsg').classList.remove('hidden');
            } else {
                self.init();
            }
        });
    },

    init: function() {
        var self = this;
        RW_Auth.init(function(user, err) {
            if (err || !user) {
                if (err === 'NO_SESSION') return;
                RW_UI.showError('فشل استعادة الجلسة');
                return;
            }
            var isOwner = user.isOwner;
            var perms = user.permissions;
            // ✅ إصلاح مشكلة الصلاحية: van-sales أولاً، ثم orders (للتوافق)
            var hasAccess = isOwner || (Array.isArray(perms) && (perms.indexOf('van-sales') !== -1 || perms.indexOf('orders') !== -1));
            if (!hasAccess) {
                RW_UI.showError('غير مصرح');
                RW_Auth.doLogout();
                return;
            }
            self.currentUser = user;
            self.enterApp();
        });
    },

    enterApp: function() {
        RW_UI.byId('loginScreen').classList.add('hidden');
        RW_UI.byId('mainApp').classList.remove('hidden');
        this.loadSettings();
        this.updateConnectionStatus();
        window.addEventListener('online', function() { App.updateConnectionStatus(); });
        window.addEventListener('offline', function() { App.updateConnectionStatus(); });
        this.syncDown().then(function() {
            App.loadVanBranch();
        });
    },

    doLogout: function() {
        var self = this;
        if (this._mapInstance) { this._mapInstance.remove(); this._mapInstance = null; }
        RW_Auth.doLogout(function() {
            self.cart = [];
            self.selCust = null;
            RW_UI.byId('mainApp').classList.add('hidden');
            RW_UI.byId('loginScreen').classList.remove('hidden');
            RW_UI.byId('loginEmail').value = '';
            RW_UI.byId('loginPass').value = '';
            RW_UI.byId('loginMsg').classList.add('hidden');
        });
    },

    updateConnectionStatus: function() {
        RW_UI.updateConnectionStatus('connDot', 'connLabel');
    },

    syncDown: function() {
        return Promise.all([
            supabase.from('customers').select('*').then(function(r) { return db.customers.clear().then(function() { return db.customers.bulkPut(r.data || []); }); }),
            supabase.from('items').select('*').then(function(r) { return db.items.clear().then(function() { return db.items.bulkPut(r.data || []); }); }),
            supabase.from('stock_branches').select('*').then(function(r) { return db.stock.clear().then(function() { return db.stock.bulkPut(r.data || []); }); }),
            supabase.from('branches').select('*').then(function(r) { return db.branches.clear().then(function() { return db.branches.bulkPut(r.data || []); }); }),
            supabase.from('app_settings').select('*').limit(1).single().then(function(r) {
                if (r.data) {
                    db.meta.put({
                        key: 'settings',
                        del: Number(r.data.delivery_fee) || 0,
                        tax: Number(r.data.tax_rate) || 0,
                        min: Number(r.data.min_invoice_amount) || 0,
                        name: r.data.company_name || 'الروائع'
                    });
                }
            })
        ]);
    },

    syncData: function() {
        if (!navigator.onLine) { RW_UI.toast('لا يوجد اتصال', 'warning'); return; }
        var self = this;
        Swal.showLoading();
        this.syncDown().then(function() {
            Swal.close();
            self.loadVanBranch();
            self.loadSettings();
            RW_UI.toast('تمت المزامنة', 'success');
        }).catch(function() {
            Swal.close();
            RW_UI.toast('فشلت المزامنة', 'error');
        });
    },

    loadSettings: function() {
        var self = this;
        db.meta.get('settings').then(function(s) {
            if (s) {
                self.delFee = s.del || 0;
                self.taxRate = s.tax || 0;
                self.minAmt = s.min || 0;
                self.companyName = s.name || 'الروائع';
            }
        });
    },

    // ==================== فرع المندوب ====================
    loadVanBranch: function() {
        var self = this;
        var vanCode = 'VAN-' + (this.currentUser ? this.currentUser.email : '');
        db.branches.toArray().then(function(branches) {
            var found = null;
            for (var i = 0; i < branches.length; i++) {
                if (branches[i].branch_code === vanCode) { found = branches[i]; break; }
            }
            if (found) {
                self.vanBranch = found;
            } else {
                self.vanBranch = { branch_code: 'MAIN', name: 'المخزن الرئيسي', id: null };
                for (var j = 0; j < branches.length; j++) {
                    if (branches[j].branch_code === 'MAIN') { self.vanBranch = branches[j]; break; }
                }
            }
            self.loadMyCustomers();
            self.showView('home');
        });
    },

    // ==================== التوجيه بين التبويبات ====================
    showView: function(view) {
        this.currentView = view;
        // تحديث ألوان الشريط السفلي
        var navButtons = document.querySelectorAll('#bottomNav button');
        for (var i = 0; i < navButtons.length; i++) {
            navButtons[i].classList.remove('text-orange-600');
            navButtons[i].classList.add('text-gray-400');
        }
        if (view === 'new-order') {
            var newOrderBtn = RW_UI.byId('nav-new-order');
            if (newOrderBtn) { newOrderBtn.classList.remove('text-gray-400'); newOrderBtn.classList.add('text-orange-600'); }
        } else {
            var activeBtn = RW_UI.byId('nav-' + view);
            if (activeBtn) { activeBtn.classList.remove('text-gray-400'); activeBtn.classList.add('text-orange-600'); }
        }

        if (view === 'home') this.renderHomeView();
        else if (view === 'customers') this.renderCustomersView();
        else if (view === 'invoices') this.renderInvoicesView();
        else if (view === 'vehicle') this.renderVehicleStockView();
        else if (view === 'map') this.renderMapView();
        else if (view === 'balance') this.renderBalanceView();
        else if (view === 'new-order') this.renderNewOrderView();
    },

    startNewOrder: function() {
        this.cart = [];
        this.selCust = null;
        this.showView('new-order');
    },

    // ==================== تحميل عملائي ====================
    loadMyCustomers: function() {
        var self = this;
        if (!this.currentUser) return;
        supabase.from('orders').select('customer_id, customer_name, total_amount, order_date, payment_type').eq('created_by', this.currentUser.email).order('order_date', { ascending: false }).then(function(res) {
            var orders = res.data || [];
            var custMap = {};
            for (var i = 0; i < orders.length; i++) {
                var o = orders[i];
                var cid = o.customer_id || o.customer_name;
                if (!custMap[cid]) {
                    custMap[cid] = {
                        customer_code: cid,
                        name: o.customer_name || cid,
                        totalDebt: 0,
                        lastOrderDate: o.order_date,
                        orderCount: 0
                    };
                }
                if (o.payment_type === 'أجل') {
                    custMap[cid].totalDebt += Number(o.total_amount) || 0;
                }
                custMap[cid].orderCount++;
                if (o.order_date > custMap[cid].lastOrderDate) {
                    custMap[cid].lastOrderDate = o.order_date;
                }
            }
            var myCustomers = [];
            for (var key in custMap) {
                if (custMap.hasOwnProperty(key)) {
                    myCustomers.push(custMap[key]);
                }
            }
            db.myCustomers.clear().then(function() {
                db.myCustomers.bulkPut(myCustomers);
            });
        }).catch(function() {
            console.warn('Failed to load my customers from Supabase');
        });
    },

    // ==================== الشاشة الرئيسية ====================
    renderHomeView: function() {
        var self = this;
        RW_UI.showSkeleton('mainContent', 3, 'card');
        var html = '<div class="p-4">';
        html += '<div class="mb-4"><p class="text-slate-400 text-sm">صباح الخير، <span class="font-bold text-slate-700">' + (this.currentUser.name || 'زميل') + '</span> 👋</p></div>';

        // بطاقة العهدة
        html += '<div class="card mb-4 cursor-pointer" onclick="App.showView(\'vehicle\')">';
        html += '<div class="flex items-center gap-3 mb-3"><span class="text-2xl">📦</span><span class="font-black text-lg">عهدتي الآن</span></div>';
        html += '<div id="homeStockSummary" class="text-center text-gray-400 text-sm">جاري تحميل العهدة...</div>';
        html += '</div>';

        // بطاقة مبيعات اليوم
        html += '<div class="card mb-4 cursor-pointer" onclick="App.showView(\'invoices\')">';
        html += '<div class="flex items-center gap-3 mb-3"><span class="text-2xl">💰</span><span class="font-black text-lg">مبيعات اليوم</span></div>';
        html += '<div id="homeSalesSummary" class="text-center text-gray-400 text-sm">جاري تحميل المبيعات...</div>';
        html += '</div>';

        // بطاقة رصيدي
        html += '<div class="card mb-4 cursor-pointer" onclick="App.showView(\'balance\')">';
        html += '<div class="flex items-center gap-3 mb-3"><span class="text-2xl">⚖️</span><span class="font-black text-lg">رصيدي</span></div>';
        html += '<div id="homeBalanceSummary" class="text-center text-gray-400 text-sm">جاري تحميل الرصيد...</div>';
        html += '</div>';

        // أزرار سريعة
        html += '<div class="grid grid-cols-2 gap-3 mt-6">';
        html += '<button onclick="App.startNewOrder()" class="btn-primary text-lg py-6"><i class="fa-solid fa-cart-plus ml-2"></i>بيع سريع</button>';
        html += '<button onclick="App.openQuickInventory()" class="bg-amber-600 text-white text-lg py-6 rounded-2xl shadow-lg font-bold"><i class="fa-solid fa-clipboard-check ml-2"></i>جرد سريع</button>';
        html += '</div>';
        html += '</div>';
        RW_UI.safeHTML(RW_UI.byId('mainContent'), html);

        this.loadHomeStockSummary();
        this.loadHomeSalesSummary();
        this.loadHomeBalanceSummary();
    },

    loadHomeStockSummary: function() {
        var self = this;
        var branchId = this.vanBranch ? this.vanBranch.id : null;
        if (!branchId) { RW_UI.showEmptyState('homeStockSummary', 'لا توجد عهدة', '📦'); return; }
        db.stock.toArray().then(function(stockItems) {
            var myStock = [];
            for (var i = 0; i < stockItems.length; i++) {
                if (stockItems[i].branch_id === branchId) myStock.push(stockItems[i]);
            }
            if (myStock.length === 0) { RW_UI.showEmptyState('homeStockSummary', 'لا توجد عهدة حالياً', '📦'); return; }
            var proms = [];
            for (var j = 0; j < Math.min(myStock.length, 5); j++) proms.push(db.items.get(myStock[j].item_id));
            Promise.all(proms).then(function(items) {
                var summary = '';
                for (var k = 0; k < items.length; k++) {
                    if (items[k]) summary += '<span class="inline-block bg-orange-50 text-orange-700 px-2 py-1 rounded-lg text-xs font-bold ml-1 mb-1">' + items[k].name + ': ' + myStock[k].qty + '</span>';
                }
                if (myStock.length > 5) summary += '<span class="text-xs text-gray-400">... وأكثر</span>';
                RW_UI.safeHTML(RW_UI.byId('homeStockSummary'), summary || '<p class="text-gray-400">اضغط للتفاصيل</p>');
            });
        });
    },

    loadHomeSalesSummary: function() {
        var self = this;
        var today = new Date().toISOString().split('T')[0];
        if (!this.currentUser) return;
        supabase.from('orders').select('total_amount, payment_type').eq('created_by', this.currentUser.email).eq('order_date', today).then(function(res) {
            var orders = res.data || [];
            var total = 0, totalCash = 0, totalCredit = 0;
            for (var i = 0; i < orders.length; i++) {
                var amt = Number(orders[i].total_amount) || 0;
                total += amt;
                if (orders[i].payment_type === 'نقدي') totalCash += amt;
                else totalCredit += amt;
            }

    collectPayment: function(code, name) {
        var self = this;
        Swal.fire({
            title: 'تحصيل نقدية من ' + (name || code),
            html: '<input type="number" id="collectAmount" class="swal2-input" placeholder="المبلغ المحصل" step="0.01" min="0">',
            showCancelButton: true,
            confirmButtonText: 'حفظ التحصيل',
            preConfirm: function() {
                var popup = Swal.getPopup();
                var amtEl = popup ? popup.querySelector('#collectAmount') : null;
                var amt = amtEl ? (parseFloat(amtEl.value) || 0) : 0;
                if (amt <= 0) { Swal.showValidationMessage('أدخل مبلغاً صحيحاً'); return false; }
                return amt;
            }
        }).then(function(result) {
            if (!result.isConfirmed) return;
            Swal.showLoading();
            var payload = {
                date: new Date().toISOString().split('T')[0],
                cashBoxId: 'MAIN',
                mainAccountName: name || code,
                notes: 'تحصيل من مندوب: ' + (App.currentUser ? App.currentUser.email : ''),
                lines: [{ accountName: name || code, description: 'تحصيل نقدية', amount: result.value }]
            };
            RW_API.call('save-receipt-voucher', payload, function(json) {
                Swal.close();
                if (json.success) {
                    RW_UI.toast('تم تسجيل التحصيل', 'success');
                    App.loadMyCustomers();
                } else {
                    RW_UI.toast(json.error || 'فشل', 'error');
                }
            });
        });
    },

    searchQuickItems: function(q) {

        var container = RW_UI.byId('quickItemResults');

        if (!q || !q.trim()) { RW_UI.safeHTML(container, ''); return; }
        db.items.toArray().then(function(all) {

    addToQuickCart: function(code) {
        var self = this;
        db.items.get(code).then(function(it) {
            if (!it) return;
            var existing = null;
            for (var i = 0; i < self.cart.length; i++) {
                if (self.cart[i].code === code) { existing = self.cart[i]; break; }
            }
            if (existing) { existing.qty++; }
            else { self.cart.push({ code: it.item_code, name: it.name, price: Number(it.sales_price) || 0, unit: it.unit || 'حبة', qty: 1 }); }
            self.renderQuickCart();
            self.updateFloatingCart();
        });
    },

    decQuickCart: function(code) {
        for (var i = 0; i < this.cart.length; i++) {
            if (this.cart[i].code === code) { this.cart[i].qty--; if (this.cart[i].qty <= 0) this.cart.splice(i, 1); break; }
        }
        this.renderQuickCart();
        this.updateFloatingCart();
    },

    renderQuickCart: function() {
        var container = RW_UI.byId('quickCartItems');
        if (!container) return;
        if (!this.cart.length) {
            RW_UI.safeHTML(container, '<p class="text-gray-400 text-center">السلة فارغة</p>');
            RW_UI.safeText(RW_UI.byId('quickCartCount'), '(0)');
            return;
        }
        var html = '';
        var total = 0;
        for (var i = 0; i < this.cart.length; i++) {
            var item = this.cart[i];
            var lt = item.price * item.qty;
            total += lt;
            html += '<div class="flex justify-between items-center py-2 border-b"><span class="font-bold text-sm">' + item.name + ' × ' + item.qty + '</span><div class="flex items-center gap-1"><button onclick="App.decQuickCart(\'' + item.code + '\')" class="w-6 h-6 bg-gray-100 rounded-full text-xs font-black">-</button><span class="w-5 text-center font-black text-sm">' + item.qty + '</span><button onclick="App.addToQuickCart(\'' + item.code + '\')" class="w-6 h-6 bg-orange-600 text-white rounded-full text-xs font-black">+</button></div></div>';
        }
        html += '<div class="flex justify-between font-black text-lg pt-2 border-t mt-2"><span>الإجمالي:</span><span class="text-orange-600">' + RW_UI.formatNumber(total) + '</span></div>';
        RW_UI.safeHTML(container, html);
        RW_UI.safeText(RW_UI.byId('quickCartCount'), '(' + this.cart.length + ')');
    },

    updateFloatingCart: function() {
        var bar = RW_UI.byId('floatingCart');
        if (!bar) return;
        if (this.cart.length === 0) { bar.classList.add('hidden'); return; }
        bar.classList.remove('hidden');
        var total = 0;
        for (var i = 0; i < this.cart.length; i++) { total += this.cart[i].price * this.cart[i].qty; }
        RW_UI.safeText(RW_UI.byId('cartBadgeCount'), this.cart.length);
        RW_UI.safeText(RW_UI.byId('cartBadgeSummary'), this.cart.length === 1 ? this.cart[0].name : (this.cart.length + ' أصناف'));
        RW_UI.safeText(RW_UI.byId('cartBadgeTotal'), RW_UI.formatNumber(total));
    },
        // ==================== جرد سريع ====================

    // ==================== حفظ الفاتورة ====================
    submitQuickSale: function() {
        var custCode = RW_UI.byId('quickCustSelect') ? RW_UI.byId('quickCustSelect').value : '';
        if (!custCode) { RW_UI.toast('اختر عميلاً', 'warning'); return; }
        if (!this.cart.length) { RW_UI.toast('السلة فارغة', 'warning'); return; }

        db.customers.get(custCode).then(function(c) {
            if (!c) { RW_UI.toast('العميل غير موجود', 'error'); return; }
            var items = [];
            var sub = 0;
            for (var i = 0; i < self.cart.length; i++) {
                items.push({ code: self.cart[i].code, name: self.cart[i].name, price: self.cart[i].price, qty: self.cart[i].qty, unit: self.cart[i].unit });
                sub += self.cart[i].price * self.cart[i].qty;
            }
            var hdr = {
                customer_code: c.customer_code,
                custName: c.name,
                area: c.area || '',
                total: sub + self.delFee,
                deliveryFees: self.delFee,
                status: 'Invoiced',
                paymentType: c.payment_type || 'نقدي',
                taxAmount: 0,
                taxRate: self.taxRate,
                source: 'van-sales'

            RW_API.call('save-sales-invoice', { orderHeader: hdr, itemsList: items, branchCode: self.vanBranch ? self.vanBranch.branch_code : 'MAIN' }, function(json) {
                RW_UI.hideLoader();

                    Swal.fire({ icon: 'success', title: '✅ تم الحفظ', html: '<div class="text-right"><p>الفاتورة: <strong>' + json.orderID + '</strong></p><p>العميل: <strong>' + c.name + '</strong></p><p>المبلغ: <strong>' + RW_UI.formatNumber(hdr.total) + ' ج.م</strong></p></div>', confirmButtonText: 'حسناً', customClass: { popup: '!rounded-3xl', confirmButton: '!rounded-xl !bg-orange-600' } });
                    self.cart = [];
                    self.selCust = null;
                    self.updateFloatingCart();
                    self.loadMyCustomers();
                    self.showView('home');
                } else {
                    RW_UI.showError(json.msg || 'فشل');
                }
            });
        });
    },

    // ==================== شاشة سيارتي ====================
    renderVehicleStockView: function() {
        var self = this;
        RW_UI.showSkeleton('mainContent', 4, 'card');
        var branchId = this.vanBranch ? this.vanBranch.id : null;
        if (!branchId) { setTimeout(function() { RW_UI.showEmptyState('mainContent', 'لا يوجد فرع للسيارة', '🚛'); }, 300); return; }
        var today = new Date().toISOString().split('T')[0];
        db.stock.where('branch_id').equals(branchId).toArray().then(function(myStock) {
            if (!myStock.length) { RW_UI.showEmptyState('mainContent', 'السيارة فارغة – لا توجد عهدة', '🚛'); return; }
            supabase.from('orders').select('id').eq('created_by', self.currentUser.email).eq('order_date', today).then(function(oRes) {
                var orderIds = (oRes.data || []).map(function(o) { return o.id; });
                if (!orderIds.length) { self._renderVehicleStock(myStock, {}); return; }
                supabase.from('order_details').select('item_code, qty').in('order_id', orderIds).then(function(dRes) {
                    var soldMap = {};
                    var details = dRes.data || [];
                    for (var d = 0; d < details.length; d++) {
                        var it = details[d];
                        soldMap[it.item_code] = (soldMap[it.item_code] || 0) + (Number(it.qty) || 0);
                    }
                    self._renderVehicleStock(myStock, soldMap);
                });
            });
        });
    },

    _renderVehicleStock: function(myStock, soldMap) {
        var self = this;
        var proms = [];
        for (var k = 0; k < myStock.length; k++) proms.push(db.items.get(myStock[k].item_id));
        Promise.all(proms).then(function(items) {
            var totalValue = 0;
            var html = '<div class="p-4"><h2 class="text-xl font-black mb-2">🚛 رصيد سيارتي</h2><div class="bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-2xl p-5 mb-4 text-center"><p class="text-sm opacity-80">قيمة البضاعة المتبقية</p><p class="text-3xl font-black" id="vehicleTotalValue">---</p></div><h3 class="font-bold text-lg mb-3">📦 تفاصيل الأصناف</h3><div id="vehicleItemsList"></div></div>';
            RW_UI.safeHTML(RW_UI.byId('mainContent'), html);
            var rows = '';
            for (var m = 0; m < myStock.length; m++) {
                var it = items[m];
                var st = myStock[m];
                var nm = it ? it.name : (st.item_id || '---');
                var ic = it ? it.item_code : (st.item_id || '---');
                var stockQty = Number(st.qty) || 0;
                var soldQty = soldMap[ic] || 0;
                var remaining = Math.max(0, stockQty - soldQty);
                var price = it ? (Number(it.sales_price) || 0) : 0;
                totalValue += remaining * price;
                var color = remaining > 10 ? 'text-green-600' : remaining > 0 ? 'text-amber-600' : 'text-red-600';
                rows += '<div class="card mb-2"><div class="flex items-center gap-3">' + RW_ImageCache.getImageHTML(ic, 'w-12', 'h-12') + '<div><p class="font-bold text-sm">' + nm + '</p><p class="text-xs text-gray-400">الرصيد: <strong>' + stockQty + '</strong> | المباع: <strong class="text-red-500">' + soldQty + '</strong> | المتبقي: <strong class="' + color + '">' + remaining + '</strong></p></div></div></div>';
            }
            RW_UI.safeHTML(RW_UI.byId('vehicleItemsList'), rows);
            RW_UI.safeText(RW_UI.byId('vehicleTotalValue'), RW_UI.formatNumber(totalValue) + ' ج.م');
        });
    },

    // ==================== شاشة الفواتير ====================
    renderInvoicesView: function() {
        var today = new Date().toISOString().split('T')[0];
        var html = '<div class="p-4"><h2 class="text-xl font-bold mb-4">📄 فواتيري</h2>';
        html += '<div class="bg-white p-3 rounded-2xl border mb-4"><div class="flex gap-2"><input type="date" id="invDateFilter" value="' + today + '" onchange="App.loadMyInvoices()" class="p-2 bg-gray-50 border rounded-lg text-sm font-bold"><button onclick="RW_UI.byId(\'invDateFilter\').value=\'' + today + '\';App.loadMyInvoices();" class="p-2 bg-gray-100 border rounded-lg text-sm font-bold">اليوم</button></div></div>';
        html += '<div id="myInvoicesList" class="space-y-3"></div></div>';
        RW_UI.safeHTML(RW_UI.byId('mainContent'), html);
        RW_UI.showSkeleton('myInvoicesList', 3, 'card');
        this.loadMyInvoices();
    },

    loadMyInvoices: function() {
        var self = this;
        var container = RW_UI.byId('myInvoicesList');
        if (!container || !this.currentUser) return;
        var dateFilter = RW_UI.byId('invDateFilter') ? RW_UI.byId('invDateFilter').value : new Date().toISOString().split('T')[0];
        supabase.from('orders').select('*').eq('created_by', this.currentUser.email).eq('order_date', dateFilter).order('order_date', { ascending: false }).then(function(res) {
            var invoices = res.data || [];
            if (!invoices.length) { RW_UI.showEmptyState('myInvoicesList', 'لا توجد فواتير لهذا اليوم', '📄'); return; }
            var html = '';
            for (var i = 0; i < invoices.length; i++) {
                var inv = invoices[i];
                var paymentClass = inv.payment_type === 'نقدي' ? 'badge-green' : 'badge-yellow';
                html += '<div class="card slide-in"><div class="flex justify-between items-start"><div><span class="font-black text-orange-600 text-sm">' + (inv.order_code || '') + '</span><span class="text-xs text-gray-400 mr-2">' + (inv.order_date || '') + '</span></div><span class="font-black text-orange-600">' + RW_UI.formatNumber(inv.total_amount) + ' ج.م</span></div><div class="flex justify-between items-center mt-1"><span class="text-sm font-bold">' + (inv.customer_name || '') + '</span><span class="px-2 py-0.5 rounded-full text-xs font-bold ' + paymentClass + '">' + (inv.payment_type || '') + '</span></div></div>';
            }
            RW_UI.safeHTML(container, html);
        }).catch(function() {
            RW_UI.showEmptyState('myInvoicesList', 'فشل تحميل الفواتير', '📡');
        });
    },

    // ==================== شاشة رصيدي ====================
    renderBalanceView: function() {
        var self = this;
        RW_UI.showSkeleton('mainContent', 1, 'card');
        var html = '<div class="p-4"><h2 class="text-xl font-bold mb-4">⚖️ رصيدي</h2><div id="balanceDetail"></div></div>';
        RW_UI.safeHTML(RW_UI.byId('mainContent'), html);
        this.loadBalanceDetail();
    },

    loadBalanceDetail: function() {
        var self = this;
        var container = RW_UI.byId('balanceDetail');
        if (!container || !this.currentUser) return;
        supabase.from('driver_ledger').select('*').eq('driver_email', this.currentUser.email).order('entry_date', { ascending: false }).then(function(res) {
            var rows = res.data || [];
            var totalDebit = 0, totalCredit = 0;
            for (var i = 0; i < rows.length; i++) {
                totalDebit += Number(rows[i].debit) || 0;
                totalCredit += Number(rows[i].credit) || 0;
            }
            var balance = totalDebit - totalCredit;
            var badgeClass = balance <= 0 ? 'badge-green' : (balance < 5000 ? 'badge-yellow' : 'badge-red');
            var badgeText = balance <= 0 ? '🟢 أنا ملتزم بالسداد' : (balance < 5000 ? '🟡 عليّ بعض المستحقات' : '🔴 عليّ مستحقات');
            var html = '<div class="card mb-4 text-center slide-in"><p class="text-gray-500 text-sm mb-1">المطلوب مني للشركة</p><div class="text-4xl font-black ' + (balance <= 0 ? 'text-green-600' : 'text-red-600') + '">' + RW_UI.formatNumber(Math.abs(balance)) + ' ج.م</div><div class="mt-2"><span class="px-3 py-1 rounded-full text-sm font-bold ' + badgeClass + '">' + badgeText + '</span></div></div>';
            html += '<div class="card slide-in"><h3 class="font-bold mb-3">📊 تفاصيل رصيدي</h3>';
            if (rows.length === 0) {
                html += '<p class="text-gray-400 text-center py-4">لا توجد حركات</p>';
            } else {
                html += '<div class="space-y-2 max-h-80 overflow-y-auto">';
                for (var j = rows.length - 1; j >= 0; j--) {
                    var row = rows[j];
                    var sign = row.debit > 0 ? '+' : '-';
                    var color = row.debit > 0 ? 'text-red-600' : 'text-green-600';
                    html += '<div class="flex justify-between items-center p-2 bg-gray-50 rounded-lg"><div><span class="text-xs text-gray-400 ml-2">' + (row.entry_date || '') + '</span><span class="font-bold text-sm">' + (row.description || '') + '</span></div><span class="font-bold ' + color + '">' + sign + RW_UI.formatNumber(row.debit || row.credit) + '</span></div>';
                }
                html += '</div>';
                html += '<div class="flex justify-between font-black text-lg pt-3 border-t mt-3"><span>📋 صافي المستحق:</span><span class="' + (balance <= 0 ? 'text-green-600' : 'text-red-600') + '">' + RW_UI.formatNumber(Math.abs(balance)) + ' ج.م</span></div>';
            }
            html += '</div>';
            RW_UI.safeHTML(container, html);
        }).catch(function() {
            RW_UI.showEmptyState('balanceDetail', 'فشل تحميل الرصيد', '📡');
        });
    },

    // ==================== الخريطة ====================
    renderMapView: function() {
        var self = this;
        var html = '<div class="flex-1 flex flex-col overflow-hidden p-2"><div class="map-wrapper flex-1"><div id="mapContainer" style="width:100%;height:100%;border-radius:16px;"></div></div></div>';
        RW_UI.safeHTML(RW_UI.byId('mainContent'), html);
        setTimeout(function() { self._initMap(); }, 300);
    },

    _initMap: function() {
        var self = this;
        if (self._mapInstance) { self._mapInstance.remove(); self._mapInstance = null; }
        var mapEl = RW_UI.byId('mapContainer');
        if (!mapEl) return;
        self._mapInstance = L.map('mapContainer').setView([30.0444, 31.2357], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(self._mapInstance);
        db.myCustomers.toArray().then(function(myCustomers) {
            for (var i = 0; i < self._mapMarkers.length; i++) { self._mapInstance.removeLayer(self._mapMarkers[i]); }
            self._mapMarkers = [];
            db.customers.toArray().then(function(allCustomers) {
                var custMap = {};
                for (var j = 0; j < allCustomers.length; j++) { custMap[allCustomers[j].customer_code] = allCustomers[j]; }
                var bounds = [];
                for (var k = 0; k < myCustomers.length; k++) {
                    var mc = myCustomers[k];
                    var cust = custMap[mc.customer_code];
                    if (cust && cust.location_lat && cust.location_lng) {
                        var marker = L.marker([cust.location_lat, cust.location_lng]).addTo(self._mapInstance).bindPopup('<b>' + (cust.name || '') + '</b><br>' + (cust.area || '') + '<br>المديونية: ' + RW_UI.formatNumber(mc.totalDebt) + ' ج.م<br><a href="javascript:void(0)" onclick="App.openQuickSaleForCustomer(\'' + mc.customer_code + '\')">📝 بيع سريع</a>');
                        self._mapMarkers.push(marker);
                        bounds.push([cust.location_lat, cust.location_lng]);
                    }
                }
                if (bounds.length > 0) { self._mapInstance.fitBounds(bounds, { padding: [30, 30] }); }
            });
        });
        setTimeout(function() { if (self._mapInstance) self._mapInstance.invalidateSize(); }, 200);
    }
};

function togglePass() { var p = RW_UI.byId('loginPass'), i = RW_UI.byId('passIcon'); if (p.type === 'password') { p.type = 'text'; i.className = 'fa-solid fa-eye-slash'; } else { p.type = 'password'; i.className = 'fa-solid fa-eye'; } }
function doLogin() { var email = RW_UI.byId('loginEmail').value.trim(), pass = RW_UI.byId('loginPass').value.trim(); if (!email || !pass) { RW_UI.byId('loginMsg').innerText = 'أدخل البيانات'; RW_UI.byId('loginMsg').classList.remove('hidden'); return; } RW_UI.byId('loginMsg').classList.add('hidden'); RW_UI.showLoader(); RW_Auth.doLogin(email, pass, function(user, err) { RW_UI.hideLoader(); if (err) { RW_UI.byId('loginMsg').innerText = err; RW_UI.byId('loginMsg').classList.remove('hidden'); } else { App.init(); } }); }
function doLogout() { if (App._mapInstance) { App._mapInstance.remove(); App._mapInstance = null; } RW_Auth.doLogout(function() { RW_UI.byId('mainApp').classList.add('hidden'); RW_UI.byId('loginScreen').classList.remove('hidden'); }); }

RW_SW.register('../sw.js');
document.addEventListener('DOMContentLoaded', function() { App.init(); });
</script>
