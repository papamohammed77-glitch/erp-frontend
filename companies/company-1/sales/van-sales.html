    submitOrder: function() { this.submitQuickSale(); },

    // ==================== حفظ الفاتورة ====================
    submitQuickSale: function() {
        if (this.eodLocked) {
            RW_UI.toast('تم إقفال الوردية. لا يمكن إنشاء فواتير جديدة.', 'warning');
            return;
        }

        var custCode = this.selCust && this.selCust.customer_code
            ? this.selCust.customer_code
            : '';

        if (!custCode) {
            RW_UI.toast('اختر عميلاً', 'warning');
            return;
        }

        if (!this.vanBranchId || !this.vanBranch || !this.vanBranch.branch_code) {
            RW_UI.toast('مخزن السيارة غير مهيأ أو غير معتمد', 'error');
            return;
        }

        if (!this.cart.length) {
            RW_UI.toast('السلة فارغة', 'warning');
            return;
        }

        var self = this;
        this.closeCartModal();

        var db = RW_DB.getDB('VanSales');

        db.customers.get(custCode).then(function(c) {
            if (!c) {
                RW_UI.toast('العميل غير موجود', 'error');
                return;
            }

            var items = [], sub = 0;

            for (var i = 0; i < self.cart.length; i++) {
                var line = self.cart[i];

                items.push({
                    code: line.code,
                    name: line.name,
                    price: line.price,
                    qty: line.qty,
                    unit: line.unit
                });

                sub += line.price * line.qty;
            }

            var email = self.currentUser ? String(self.currentUser.email || '').trim().toLowerCase() : '';
            if (!email) {
                RW_UI.toast('هوية مندوب البيع غير محددة', 'error');
                return;
            }

            var fingerprint = JSON.stringify({
                driver_email: email,
                customer_code: custCode,
                branch_code: self.vanBranch.branch_code,
                items: items.map(function(x) {
                    return [x.code, Number(x.qty) || 0, Number(x.price) || 0];
                }).sort(function(a,b) {
                    return String(a[0]).localeCompare(String(b[0]));
                })
            });

            var opStore = 'RW_VAN_SALE_OP:' + email + ':' + custCode;
            var operationId = null;

            try {
                var saved = JSON.parse(localStorage.getItem(opStore) || 'null');
                if (saved && saved.fingerprint === fingerprint && saved.operation_id) {
                    operationId = saved.operation_id;
                }
            } catch (e) {}

            if (!operationId) {
                operationId = (window.crypto && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : ('VAN-SALE-' + Date.now() + '-' + Math.random().toString(36).slice(2));

                try {
                    localStorage.setItem(opStore, JSON.stringify({
                        fingerprint: fingerprint,
                        operation_id: operationId,
                        created_at: new Date().toISOString()
                    }));
                } catch (e) {}
            }

            var hdr = {
                operation_id: operationId,
                customer_code: c.customer_code,
                custName: c.name,
                area: c.area || '',
                total: sub,
                deliveryFees: 0,
                status: 'Invoiced',
                paymentType: c.payment_type || 'نقدي',
                taxAmount: 0,
                taxRate: 0,
                source: 'van-sales'
            };

            RW_UI.showLoader('جاري حفظ الفاتورة...');

            RW_API.call('save-sales-invoice', {
                orderHeader: hdr,
                itemsList: items,
                branchCode: self.vanBranch.branch_code
            }, function(json) {
                RW_UI.hideLoader();

                if (json && json.success) {
                    try {
                        localStorage.removeItem(opStore);
                    } catch (e) {}

                    Swal.fire({
                        icon: 'success',
                        title: '✅ تم الحفظ',
                        html:
                            '<div class="text-right">' +
                            '<p>الفاتورة: <strong>' + (json.orderID || '') + '</strong></p>' +
                            '<p>العميل: <strong>' + (c.name || '') + '</strong></p>' +
                            '<p>المبلغ: <strong>' + RW_UI.formatNumber(sub) + ' ج.م</strong></p>' +
                            '</div>',
                        confirmButtonText: 'حسناً',
                        customClass: {
                            popup: '!rounded-3xl',
                            confirmButton: '!rounded-xl !bg-orange-600'
                        }
                    });

                    self.cart = [];
                    self.selCust = null;
                    self._updateFloatingCart();
                    self.loadMyCustomers();

                    self.syncDown().then(function() {
                        self.showView('home');
                    }).catch(function() {
                        self.showView('home');
                    });

                } else {
                    RW_UI.showError(
                        (json && json.msg) ||
                        'فشل الحفظ — تم الاحتفاظ بهوية العملية لإعادة المحاولة بأمان'
                    );
                }
            });
        }).catch(function(e) {
            RW_UI.hideLoader();
            RW_UI.showError(e.message || 'فشل تجهيز الفاتورة');
        });
    },

    // ==================== السلة الشبحية – منتجات مقترحة من أنماط الشراء ====================
    loadGhostCart: function(customerCode) {
        var self = this;
        var ghostDiv = RW_UI.byId('ghostCartContainer');
        var ghostItems = RW_UI.byId('ghostCartItems');
        if (!ghostDiv || !ghostItems) return;

        var db = RW_DB.getDB('VanSales');
        db.customerPatterns.where('customer_code').equals(customerCode).toArray().then(function(patterns) {
            if (!patterns || patterns.length === 0) {
                ghostDiv.classList.add('hidden');
                return;
            }

            // ترتيب تنازلي حسب التكرار
            patterns.sort(function(a, b) { return b.frequency - a.frequency; });
            var topItems = patterns.slice(0, 8);

            var html = '';
            self._ghostCartData = [];
            for (var i = 0; i < topItems.length; i++) {
                var it = topItems[i];
                self._ghostCartData.push({ code: it.item_code, name: it.item_name, avgQty: it.avgQty || 1 });
                html += '<label class="flex items-center p-2 bg-white rounded-lg mb-1 cursor-pointer hover:bg-blue-50 transition">';
                html += '<input type="checkbox" class="ghost-check ml-2" data-code="' + it.item_code + '" data-qty="' + (it.avgQty || 1) + '" checked>';
                html += '<span class="text-sm font-medium text-slate-700">' + (it.item_name || it.item_code) + '</span>';
                html += '<span class="mr-auto text-xs text-gray-500 ml-2">× ' + (it.avgQty || 1) + '</span>';
                html += '</label>';
            }
            RW_UI.safeHTML(ghostItems, html);
            ghostDiv.classList.remove('hidden');
        }).catch(function() {
            ghostDiv.classList.add('hidden');
        });
    },

    // ==================== تطبيق السلة الشبحية ====================
    applyGhostCart: function() {
        var self = this;
        var checks = document.querySelectorAll('.ghost-check:checked');
        var addedCount = 0;

        for (var i = 0; i < checks.length; i++) {
            var code = checks[i].getAttribute('data-code');
            var qty = parseInt(checks[i].getAttribute('data-qty')) || 1;

            var existing = null;
            for (var j = 0; j < self.cart.length; j++) {
                if (self.cart[j].code === code) { existing = self.cart[j]; break; }
            }

            if (existing) {
                existing.qty += qty;
                addedCount++;
            } else {
                var gi = null;
                if (self._ghostCartData) {
                    for (var g = 0; g < self._ghostCartData.length; g++) {
                        if (self._ghostCartData[g].code === code) { gi = self._ghostCartData[g]; break; }
                    }
                }
                if (gi) {
                    var db = RW_DB.getDB('VanSales');
                    db.items.get(code).then(function(it) {
                        var price = it ? (Number(it.sales_price) || 0) : 0;
                        self.cart.push({ code: code, name: gi.name, price: price, unit: 'حبة', qty: qty });
                        addedCount++;
                        self._renderQuickCart();
                        self._updateFloatingCart();
                    });
                }
            }
        }

        // تحديث السلة بعد كل الإضافات
        self._renderQuickCart();
        self._updateFloatingCart();

        var gc = RW_UI.byId('ghostCartContainer');
        if (gc) gc.classList.add('hidden');

        if (addedCount > 0) {
            RW_UI.toast('✅ تمت إضافة ' + addedCount + ' منتج للسلة', 'success');
            if (navigator.vibrate) navigator.vibrate(30);
        }
    },

    // ==================== كشف المنسيات – تنبيه للمنتجات المعتادة غير الموجودة في السلة ====================
    checkForgottenItems: function(customerCode) {
        var self = this;
        var fc = RW_UI.byId('forgottenItemsContainer');
        var fi = RW_UI.byId('forgottenItems');
        if (!fc || !fi) return;

        var db = RW_DB.getDB('VanSales');
        db.customerPatterns.where('customer_code').equals(customerCode).toArray().then(function(patterns) {
            if (!patterns || patterns.length === 0) { fc.classList.add('hidden'); return; }

            // المنتجات ذات التردد العالي (>= 3 مرات)
            var highFreq = [];
            for (var i = 0; i < patterns.length; i++) {
                if (patterns[i].frequency >= 3) highFreq.push(patterns[i]);
            }
            if (highFreq.length === 0) { fc.classList.add('hidden'); return; }

            // البحث عن المنسيات
            var forgotten = [];
            for (var j = 0; j < highFreq.length; j++) {
                var found = false;
                for (var k = 0; k < self.cart.length; k++) {
                    if (self.cart[k].code === highFreq[j].item_code) { found = true; break; }
                }
                if (!found) forgotten.push(highFreq[j]);
            }

            if (forgotten.length === 0) { fc.classList.add('hidden'); return; }

            var html = '';
            for (var f = 0; f < Math.min(forgotten.length, 5); f++) {
                var it = forgotten[f];
                html += '<button onclick="App.quickAddForgotten(\'' + it.item_code + '\', ' + (it.avgQty || 1) + ')" class="inline-block bg-white text-amber-700 px-3 py-1 rounded-lg text-xs font-bold ml-1 mb-1 border border-amber-200 hover:bg-amber-100 active:scale-95 transition">';
                html += '+ ' + (it.item_name || it.item_code) + ' (' + (it.avgQty || 1) + ')';
                html += '</button>';
            }
            RW_UI.safeHTML(fi, html);
            fc.classList.remove('hidden');
        }).catch(function() {
            fc.classList.add('hidden');
        });
    },

    // ==================== إضافة سريعة لمنتج منسي ====================
    quickAddForgotten: function(code, qty) {
        var self = this;
        var existing = null;
        for (var i = 0; i < this.cart.length; i++) {
            if (this.cart[i].code === code) { existing = this.cart[i]; break; }
        }
        if (existing) {
            existing.qty += qty;
        } else {
            var db = RW_DB.getDB('VanSales');
            db.items.get(code).then(function(it) {
                if (it) {
                    self.cart.push({ code: it.item_code, name: it.name, price: Number(it.sales_price) || 0, unit: it.unit || 'حبة', qty: qty });
                    self._renderQuickCart();
                    self._updateFloatingCart();
                }
            });
        }
        this._renderQuickCart();
        this._updateFloatingCart();
        // إعادة فحص المنسيات
        if (this.selCust) this.checkForgottenItems(this.selCust.customer_code);
        if (navigator.vibrate) navigator.vibrate(15);
    },

    _loadInventoryItems: function(branchId) {
        var self = this;
        var db = RW_DB.getDB('VanSales');

        db.stock.where('branch_id').equals(branchId).toArray().then(function(myStock) {
            if (!myStock || myStock.length === 0) {
                RW_UI.safeHTML(RW_UI.byId('invItems'), '<div class="text-center py-12"><div class="text-6xl mb-4">📦</div><p class="text-slate-400 font-bold">لا توجد عهدة في السيارة</p><p class="text-slate-300 text-sm mt-1">تواصل مع المشرف لاستلام عهدة</p></div>');
                return;
            }

            var promises = [];
            for (var j = 0; j < myStock.length; j++) {
                promises.push(db.items.get(myStock[j].item_id));
            }

            Promise.all(promises).then(function(items) {
                var html = '';
                for (var k = 0; k < myStock.length; k++) {
                    var it = items[k];
                    var st = myStock[k];
                    var itemName = it ? it.name : (st.item_id || '---');
                    var itemCode = it ? it.item_code : (st.item_id || '---');
                    var imgHtml = it ? RW_ImageCache.getImageHTML(itemCode, 'w-12', 'h-12') : '<div class="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400"><i class="fa-solid fa-box"></i></div>';

                    html += '<div class="flex items-center justify-between p-3 bg-white rounded-xl border-2 border-slate-100 mb-2 inv-count-row" data-item-code="' + itemCode + '">';
                    html += '<div class="flex items-center gap-3">';
                    html += '<div class="flex-shrink-0">' + imgHtml + '</div>';
                    html += '<div><span class="font-bold text-sm text-slate-700">' + itemName + '</span><p class="text-xs text-gray-400">الرصيد الدفتري: <strong>' + st.qty + '</strong></p></div>';
                    html += '</div>';
                    html += '<input type="number" id="inv_qty_' + k + '" value="' + st.qty + '" class="w-20 p-2 border-2 border-slate-200 rounded-xl text-center font-bold text-slate-700 focus:border-amber-400 outline-none" min="0">';
                    html += '</div>';
                }
                RW_UI.safeHTML(RW_UI.byId('invItems'), html);
            });
        }).catch(function() {
            RW_UI.safeHTML(RW_UI.byId('invItems'), '<div class="text-center py-12"><p class="text-red-400">فشل تحميل العهدة</p></div>');
        });
    },

    submitQuickInventory: function() {
        var self = this;
        var items = [];
        var rows = document.querySelectorAll('.inv-count-row');
        var allZero = true;

        for (var i = 0; i < rows.length; i++) {
            var input = rows[i].querySelector('input[type="number"]');
            var qty = input ? (parseInt(input.value) || 0) : 0;
            if (qty > 0) allZero = false;
            var itemCode = rows[i].getAttribute('data-item-code') || '';
            items.push({ itemCode: itemCode, itemName: '', qty: qty, unit: 'حبة', unitPrice: 0, notes: '' });
        }

        if (allZero) { RW_UI.toast('أدخل كميات الجرد', 'warning'); return; }

        RW_UI.showLoader('جاري حفظ الجرد...');

        RW_API.call('save-inventory-count', {
            type: 'vehicle',
            entityId: self.currentUser ? self.currentUser.email : '',
            reference: 'جرد سريع - ' + new Date().toLocaleDateString('ar-EG'),
            items: items
        }, function(json) {
            RW_UI.hideLoader();
            if (json.success) {
                var totalQty = 0;
                for (var k = 0; k < items.length; k++) { totalQty += items[k].qty; }

                Swal.fire({
                    icon: 'success',
                    title: '✅ تم حفظ الجرد',
                    html: '<div class="text-right"><p>تم جرد <strong>' + items.length + ' صنف</strong> بنجاح.</p><p>إجمالي الكميات: <strong>' + totalQty + ' قطعة</strong>.</p></div>',
                    confirmButtonText: 'حسناً',
                    customClass: { popup: '!rounded-3xl', confirmButton: '!rounded-xl !bg-amber-600' }
                });

                // إعادة تحميل الحالة من Production بعد نجاح الجرد.
                // لا نعتمد على تحديث محلي بالمقارنة بين item_id وitem_code.
                self.syncDown()
                    .catch(function() { return null; })
                    .then(function() {
                        self.showView('home');
                    });
            } else {
                RW_UI.showError(json.msg || 'فشل الحفظ');
            }
        });
    },
        // ==================== تبويب الخريطة ====================
    renderMapView: function() {
        var self = this;
        RW_UI.showSkeleton('mainContent', 1, 'card');

        var html = '<div class="flex-1 flex flex-col overflow-hidden p-2">';
        html += '<div class="bg-white rounded-2xl shadow-sm border overflow-hidden flex-1">';
        html += '<div id="mapContainer" style="width:100%;height:100%;min-height:300px;border-radius:16px;"></div>';
        html += '</div>';
        html += '</div>';

        setTimeout(function() {
            RW_UI.safeHTML(RW_UI.byId('mainContent'), html);
            setTimeout(function() { self._initMap(); }, 200);

    _initMap: function() {
        var self = this;
        if (self._mapInstance) { self._mapInstance.remove(); self._mapInstance = null; }

        var mapEl = RW_UI.byId('mapContainer');
        if (!mapEl) return;

        // افتراضي: وسط القاهرة
        self._mapInstance = L.map('mapContainer').setView([30.0444, 31.2357], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(self._mapInstance);

        var db = RW_DB.getDB('VanSales');

        // جلب عملاء المندوب
        db.myCustomers.toArray().then(function(myCustomers) {
            // تنظيف العلامات القديمة
            for (var i = 0; i < self._mapMarkers.length; i++) {
                if (self._mapInstance && self._mapMarkers[i]) {
                    self._mapInstance.removeLayer(self._mapMarkers[i]);
                }
            }
            self._mapMarkers = [];

            if (!myCustomers || !myCustomers.length) {
                // لا يوجد عملاء – تبقى الخريطة فارغة
                return;
            }

            // جلب بيانات العملاء الكاملة (للإحداثيات)
            db.customers.toArray().then(function(allCustomers) {
                var custMap = {};
                for (var j = 0; j < allCustomers.length; j++) {
                    custMap[allCustomers[j].customer_code] = allCustomers[j];
                }

                var bounds = [];
                for (var k = 0; k < myCustomers.length; k++) {
                    var mc = myCustomers[k];
                    var cust = custMap[mc.customer_code];
                    if (cust && cust.location_lat && cust.location_lng) {
                        var markerColor = mc.totalDebt > 0 ? 'red' : 'green';
                        var markerIcon = L.icon({
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-' + markerColor + '.png',
                            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                            iconSize: [25, 41],
                            iconAnchor: [12, 41],
                            popupAnchor: [1, -34],
                            shadowSize: [41, 41]
                        });

                        var popupContent = '<div style="text-align:right;font-family:Cairo,sans-serif;font-size:13px">';
                        popupContent += '<b>' + (cust.name || '') + '</b><br>';
                        popupContent += (cust.area || '') + '<br>';
                        popupContent += 'المديونية: ' + RW_UI.formatNumber(mc.totalDebt) + ' ج.م<br>';
                        popupContent += '<a href="javascript:void(0)" onclick="App.openQuickSaleForCustomer(\'' + mc.customer_code + '\')" style="color:#ea580c;font-weight:bold">📝 بيع سريع</a>';
                        popupContent += '</div>';

                        var marker = L.marker([cust.location_lat, cust.location_lng], { icon: markerIcon })
                            .addTo(self._mapInstance)
                            .bindPopup(popupContent);

                        self._mapMarkers.push(marker);
                        bounds.push([cust.location_lat, cust.location_lng]);
                    }
                }

                if (bounds.length > 0) {
                    self._mapInstance.fitBounds(bounds, { padding: [30, 30] });
                }
            });
        }).catch(function() {
            // فشل تحميل العملاء – الخريطة تبقى فارغة
        });

        // إعادة تحجيم الخريطة بعد الظهور
        setTimeout(function() {
            if (self._mapInstance) self._mapInstance.invalidateSize();
        }, 400);
    },

    // ==================== تبويب حسابي ====================
    renderAccountView: function() {
        var self = this;
        RW_UI.showSkeleton('mainContent', 1, 'card');
        var html = '<div class="p-4 animate-fadeIn">';
        html += '<div class="text-center mb-6 mt-4">';
        html += '<div class="w-20 h-20 bg-gradient-to-br from-orange-400 to-orange-600 rounded-3xl mx-auto flex items-center justify-center text-white text-3xl font-black shadow-lg shadow-orange-200 mb-4">';
        html += (self.currentUser ? (self.currentUser.name || '?').charAt(0) : '?');
        html += '</div>';
        html += '<h2 class="font-black text-xl text-slate-800">' + (self.currentUser ? (self.currentUser.name || self.currentUser.email) : '') + '</h2>';
        html += '<p class="text-sm text-slate-400">مندوب بيع مباشر</p>';
        html += '</div>';
        html += '<div class="card mb-3"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-slate-100 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-envelope"></i></div><div><p class="text-xs text-slate-400">البريد الإلكتروني</p><p class="font-bold text-sm">' + (self.currentUser ? self.currentUser.email : '') + '</p></div></div></div>';
        if (self.vanBranch) {
            html += '<div class="card mb-3"><div class="flex items-center gap-3"><div class="w-10 h-10 bg-slate-100 rounded-2xl flex items-center justify-center"><i class="fa-solid fa-truck"></i></div><div><p class="text-xs text-slate-400">فرع السيارة</p><p class="font-bold text-sm">' + (self.vanBranch.branch_code || '') + '</p></div></div></div>';
        }
        html += '<button onclick="App.doLogout()" class="w-full bg-white border-2 border-red-100 text-red-500 py-4 rounded-2xl font-bold mt-6"><i class="fa-solid fa-arrow-right-from-bracket ml-2"></i> تسجيل الخروج</button>';
        html += '</div>';
        setTimeout(function() { RW_UI.safeHTML(RW_UI.byId('mainContent'), html); }, 300);
    },

        // ==================== دالة مساعدة: تحديث السلة من المودال ====================
    _forceRenderQuickCart: function() {
        this._renderQuickCart();
        this._updateFloatingCart();
    }
};

    RW_Auth.init(function(user, err) {

});
