<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تتبع الطلب | الروائع</title>
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#2563eb">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../core.js"></script>
    <script>var supabase = window.supabase;</script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Tahoma,sans-serif;background:#f1f5f9;-webkit-tap-highlight-color:transparent}
        .card{background:#fff;border-radius:20px;padding:1.25rem;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
    </style>
</head>
<body class="min-h-screen flex flex-col">

<div class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-6">
    <div class="max-w-2xl mx-auto text-center">
        <div class="w-16 h-16 bg-white/20 rounded-2xl mx-auto flex items-center justify-center mb-4">
            <i class="fa-solid fa-magnifying-glass-location text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-black mb-2">تتبع طلبك</h1>
        <p class="text-blue-100 text-sm">أدخل رقم الطلب أو رقم الهاتف لمعرفة حالة طلبك</p>
    </div>
</div>

<main class="flex-1 max-w-2xl mx-auto w-full p-4">
    <div class="card mb-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
                <label for="orderCodeInput" class="block text-xs font-bold text-gray-600 mb-2">رقم الطلب</label>
                <input type="text" id="orderCodeInput" autocomplete="off" placeholder="مثلاً: ORD-12345" class="w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-blue-600 outline-none font-bold text-sm">
            </div>
            <div>
                <label for="customerPhoneInput" class="block text-xs font-bold text-gray-600 mb-2">رقم الهاتف المستخدم في الطلب</label>
                <input type="tel" id="customerPhoneInput" inputmode="tel" autocomplete="tel" placeholder="رقم الهاتف عند الشراء" class="w-full p-3 bg-gray-50 rounded-xl border-2 border-gray-200 focus:border-blue-600 outline-none font-bold text-sm">
            </div>
        </div>
        <button type="button" onclick="Tracker.lookup()" class="mt-3 w-full bg-blue-600 text-white px-6 py-3 rounded-xl font-black text-sm hover:bg-blue-700 transition">
            <i class="fa-solid fa-search ml-1"></i> استعلام آمن عن الطلب
        </button>
        <p class="text-xs text-gray-400 mt-2">يمكنك البحث برقم الطلب أو الهاتف فقط. أدخل الرقمين معًا لعرض تفاصيل الطلب والأصناف.</p>
    </div>

    <div id="resultContainer"></div>

    <div class="text-center mt-8">
        <a href="index.html" class="text-blue-600 font-bold text-sm hover:underline">
            <i class="fa-solid fa-arrow-right ml-1"></i> العودة للمتجر
        </a>
    </div>
</main>

<footer class="text-center py-4 text-xs text-gray-400">
    جميع الحقوق محفوظة © الروائع ERP 2026
</footer>

<script>
    function escapeHtml(value) {
    var entities = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    };
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (character) {
        return entities[character];
    });
}

var Tracker = {
    lookup: function() {
        var orderCode = (document.getElementById('orderCodeInput').value || '').trim();
        var customerPhone = (document.getElementById('customerPhoneInput').value || '').trim();

        if (!orderCode && !customerPhone) {
            Swal.fire({ icon: 'warning', title: 'أدخل رقم الطلب أو رقم الهاتف' });
            return;
        }

        if (customerPhone && customerPhone.replace(/[^0-9]/g, '').length < 7) {
            Swal.fire({ icon: 'warning', title: 'راجع رقم الهاتف وأدخل 7 أرقام على الأقل' });
            return;
        }

        var container = document.getElementById('resultContainer');
        container.innerHTML = '<div class="card text-center py-8"><i class="fa-solid fa-spinner fa-spin text-2xl text-blue-600"></i><p class="mt-2 text-gray-500">جاري البحث...</p></div>';

        var self = this;
        supabase.rpc('get_public_store_order_tracking', {
            p_storefront_key: 'company-1',
            p_order_code: orderCode || null,
            p_customer_phone: customerPhone || null
        }).then(function(result) {
            if (result.error) throw result.error;

            var payload = result.data;
            if (!payload || payload.success !== true) {
                container.innerHTML = '<div class="card text-center py-8"><i class="fa-solid fa-circle-xmark text-4xl text-red-400 mb-3"></i><p class="font-bold text-gray-700">تعذر العثور على الطلب بهذه البيانات</p><p class="text-sm text-gray-400 mt-1">راجع البيانات ثم حاول مرة أخرى.</p></div>';
                return;
            }

            if (payload.lookup_mode === 'phone' && Array.isArray(payload.orders)) {
                self.showOrderList(container, payload.orders);
                return;
            }

            if (!payload.order) {
                container.innerHTML = '<div class="card text-center py-8"><p class="font-bold text-gray-700">تعذر العثور على الطلب بهذه البيانات</p></div>';
                return;
            }

            self.showStatus(
                container,
                payload.order,
                Array.isArray(payload.items) ? payload.items : [],
                payload.lookup_mode || 'full'
            );
        }).catch(function(error) {
            console.error('Order tracking RPC failed:', error);
            container.innerHTML = '<div class="card text-center py-8"><i class="fa-solid fa-triangle-exclamation text-4xl text-red-400 mb-3"></i><p class="font-bold text-gray-700">تعذر الاستعلام عن الطلب الآن</p><p class="text-sm text-gray-400 mt-1">تحقق من الاتصال وحاول مرة أخرى.</p></div>';
        });
    },

    showOrderList: function(container, orders) {
        if (!Array.isArray(orders) || orders.length === 0) {
            container.innerHTML = '<div class="card text-center py-8"><p class="font-bold text-gray-700">لا توجد طلبات مرتبطة بهذا الهاتف</p></div>';
            return;
        }

        var statusLabels = {
            'Draft': 'قيد المراجعة',
            'Confirmed': 'تم التأكيد',
            'Pending': 'قيد الانتظار',
            'Picking': 'جاري التجهيز',
            'Picked': 'تم التجهيز',
            'Loading': 'جاري التحميل',
            'Loaded': 'تم التحميل',
            'Delivering': 'خارج للتوصيل',
            'Delivered': 'تم التسليم',
            'Partially Delivered': 'تم التسليم جزئيًا',
            'Partially Returned': 'تم إرجاع جزء من الطلب',
            'Cancelled': 'ملغي',
            'Canceled': 'ملغي'
        };

        var html = '<div class="space-y-3">';
        html += '<div class="card"><p class="font-bold text-gray-800">طلبات مرتبطة برقم الهاتف</p><p class="text-xs text-gray-500 mt-1">تظهر هنا الحالة فقط. أدخل رقم الطلب مع الهاتف لعرض التفاصيل الكاملة.</p></div>';

        for (var i = 0; i < orders.length; i++) {
            var order = orders[i] || {};
            var status = order.order_status || '';
            var statusLabel = statusLabels[status] || status || 'غير محدد';
            var statusColor = status === 'Delivered' ? 'bg-green-100 text-green-700' :
                (status === 'Cancelled' || status === 'Canceled') ? 'bg-red-100 text-red-700' :
                'bg-blue-100 text-blue-700';
            var orderDate = order.order_date ? new Date(order.order_date).toLocaleDateString('ar-EG') : '';

            html += '<div class="card">';
            html += '<div class="flex items-center justify-between gap-3">';
            html += '<div><p class="text-xs text-gray-500">رقم الطلب</p><p class="font-black text-lg">' + escapeHtml(order.order_code || '') + '</p></div>';
            html += '<span class="px-3 py-1 rounded-full text-xs font-bold ' + statusColor + '">' + escapeHtml(statusLabel) + '</span>';
            html += '</div>';
            html += '<p class="text-xs text-gray-500 mt-2">التاريخ: ' + escapeHtml(orderDate) + '</p>';
            html += '</div>';
        }

        html += '</div>';
        container.innerHTML = html;
    },
   
    showStatus: function(container, order, details, lookupMode) {
                var statusLabels = {
            'Draft': 'قيد المراجعة',
            'Confirmed': 'تم التأكيد',
            'Pending': 'قيد الانتظار',
            'Picking': 'جاري التجهيز',
            'Picked': 'تم التجهيز',
            'Loading': 'جاري التحميل',
            'Loaded': 'تم التحميل',
            'Delivering': 'خارج للتوصيل',
            'Delivered': 'تم التسليم',
            'Partially Delivered': 'تم التسليم جزئيًا',
            'Partially Returned': 'تم إرجاع جزء من الطلب',
            'Cancelled': 'ملغي',
            'Canceled': 'ملغي'
        };
        var statusLabel = statusLabels[order.order_status] || (order.order_status || 'غير محدد');

        var steps = [
            { key: 'Pending', label: 'قيد الانتظار', icon: 'fa-clock' },
            { key: 'Confirmed', label: 'تم التأكيد', icon: 'fa-check-circle' },
            { key: 'Picked', label: 'تم التجهيز', icon: 'fa-box' },
            { key: 'Loaded', label: 'تم التحميل', icon: 'fa-truck-loading' },
            { key: 'Delivering', label: 'خارج للتوصيل', icon: 'fa-truck-fast' },
            { key: 'Delivered', label: 'تم التسليم', icon: 'fa-home' }
        ];

        var currentStep = 0;
        if (order.order_status === 'Delivered' || order.order_status === 'Partially Delivered' || order.order_status === 'Partially Returned') currentStep = 5;
        else if (order.order_status === 'Delivering') currentStep = 4;
        else if (order.order_status === 'Loaded' || order.order_status === 'Loading') currentStep = 3;
        else if (order.order_status === 'Picked' || order.order_status === 'Picking') currentStep = 2;
        else if (order.order_status === 'Confirmed') currentStep = 1;
        
        var progressHtml = '<div class="relative mb-6 px-2">';
        progressHtml += '<div class="absolute top-5 right-4 left-4 h-1.5 bg-gray-200 rounded-full z-0"></div>';
        progressHtml += '<div class="absolute top-5 right-4 h-1.5 bg-green-500 rounded-full z-10 transition-all duration-700" style="width:' + (currentStep / 5 * 100) + '%"></div>';
        progressHtml += '<div class="flex items-start justify-between relative z-20">';
        
        for (var s = 0; s < steps.length; s++) {
            var isDone = s < currentStep;
            var isCur = s === currentStep;
            var isPending = s > currentStep;
            var circleClass = '';
            var textClass = '';
            
            if (isDone) {
                circleClass = 'bg-green-500 text-white';
                textClass = 'text-green-600';
            } else if (isCur) {
                circleClass = 'bg-blue-500 text-white ring-4 ring-blue-100';
                textClass = 'text-blue-600 font-black';
            } else {
                circleClass = 'bg-gray-200 text-gray-400';
                textClass = 'text-gray-400';
            }
            
            progressHtml += '<div class="flex flex-col items-center" style="width:20%">';
            progressHtml += '<div class="w-10 h-10 rounded-full flex items-center justify-center font-black text-xs shadow ' + circleClass + '">';
            if (isDone) {
                progressHtml += '<i class="fa-solid fa-check"></i>';
            } else {
                progressHtml += (s + 1);
            }
            progressHtml += '</div>';
            progressHtml += '<span class="text-[10px] font-bold mt-2 text-center leading-tight ' + textClass + '">' + steps[s].label + '</span>';
            progressHtml += '</div>';
        }
        
        progressHtml += '</div></div>';
        
        var statusColor = order.order_status === 'Delivered' ? 'bg-green-100 text-green-700' :
                         order.order_status === 'Cancelled' ? 'bg-red-100 text-red-700' :
                         'bg-blue-100 text-blue-700';
        
        var itemsHtml = '';
        if (details.length > 0) {
            itemsHtml = '<div class="mt-4"><h4 class="font-bold text-sm text-gray-700 mb-2"><i class="fa-solid fa-list-check ml-1"></i> الأصناف</h4>';
            itemsHtml += '<table class="w-full text-sm"><thead><tr class="bg-gray-100"><th class="p-2 text-right">الصنف</th><th class="p-2 text-center">الكمية</th><th class="p-2 text-center">السعر</th><th class="p-2 text-center">الإجمالي</th></tr></thead><tbody>';
            
            var itemsTotal = 0;
            for (var d = 0; d < details.length; d++) {
                var lt = (Number(details[d].qty) || 0) * (Number(details[d].unit_price) || 0);
                itemsTotal += lt;
                itemsHtml += '<tr class="border-t"><td class="p-2 font-semibold">' + escapeHtml(details[d].item_name || '') + '</td><td class="p-2 text-center">' + details[d].qty + '</td><td class="p-2 text-center">' + Number(details[d].unit_price || 0).toFixed(2) + '</td><td class="p-2 text-center font-bold">' + lt.toFixed(2) + '</td></tr>';
            }
            itemsHtml += '</tbody></table></div>';
        }
        
        var html = '<div class="card">';
        html += '<div class="bg-blue-50 p-4 rounded-xl mb-4">';
        html += '<div class="flex justify-between items-start mb-2">';
        html += '<div><p class="text-xs text-gray-500">رقم الطلب</p><p class="font-black text-lg text-gray-800">' + escapeHtml(order.order_code || '') + '</p></div>';
        html += '<span class="px-3 py-1 rounded-full text-xs font-bold ' + statusColor + '">' + escapeHtml(statusLabel) + '</span>';
        html += '</div>';
        html += '<div class="grid grid-cols-2 gap-2 text-sm">';
        html += '<div><p class="text-xs text-gray-500">التاريخ</p><p class="font-bold">' + (order.order_date ? new Date(order.order_date).toLocaleDateString('ar-EG') : '') + '</p></div>';
        if (lookupMode === 'full') {
            html += '<div><p class="text-xs text-gray-500">العميل</p><p class="font-bold">' + escapeHtml(order.customer_name || '') + '</p></div>';
            html += '<div><p class="text-xs text-gray-500">المنطقة</p><p class="font-bold">' + escapeHtml(order.area || '') + '</p></div>';
            html += '<div><p class="text-xs text-gray-500">الإجمالي</p><p class="font-black text-blue-600 text-lg">' + Number(order.total_amount || 0).toLocaleString() + '</p></div>';
        }
        html += '</div></div>';
        html += progressHtml;
        html += itemsHtml;
        html += '</div>';
        
        container.innerHTML = html;
    }
};

document.addEventListener('DOMContentLoaded', function() {
        var input = document.getElementById('orderCodeInput');
    var phoneInput = document.getElementById('customerPhoneInput');
    function submitOnEnter(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            Tracker.lookup();
        }
    }
    if (input) input.addEventListener('keydown', submitOnEnter);
    if (phoneInput) phoneInput.addEventListener('keydown', submitOnEnter);
    
    var params = new URLSearchParams(window.location.search);
    var orderFromUrl = params.get('order');
    if (orderFromUrl && input) {
        input.value = orderFromUrl;
        if (phoneInput) phoneInput.focus();
    }
});

RW_SW.register('../sw.js');
</script>
<script src="../register-sw.js"></script>
</body>
</html>
