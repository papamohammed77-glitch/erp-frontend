name: forensic-read-main
on:
  push:
    branches: [forensic-read-20260915]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract current mother purchase source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('companies/company-1/main.html')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          targets=['RW_PurchaseGold','requests:','createRequest','createRFQ','createQuotation','createInvoice','createReturn','createPayment','approveRequest','sendRFQ','acceptQuotation','convertQuotation','postInvoice','postReturn','purchase_get_reports','purchase_set_settings_atomic','save-purchase-order','showPurchase','openPurchase','SweetAlert','Swal.fire']
          out=[]
          for i,line in enumerate(lines,1):
              if any(t in line for t in targets): out.append(f'{i}: {line}')
          Path('forensic_purchase_matches.txt').write_text('\n'.join(out),encoding='utf-8')
          ranges=[]
          for i,line in enumerate(lines,1):
              if any(t in line for t in targets): ranges.append((max(1,i-20),min(len(lines),i+140)))
          merged=[]
          for a,b in sorted(ranges):
              if not merged or a>merged[-1][1]+1: merged.append([a,b])
              else: merged[-1][1]=max(merged[-1][1],b)
          with Path('forensic_purchase_windows.txt').open('w',encoding='utf-8') as f:
              for a,b in merged:
                  f.write(f'===== LINES {a}-{b} =====\n')
                  for j in range(a,b+1): f.write(f'{j}: {lines[j-1]}\n')
          PY
      - name: Commit forensic extracts
        shell: bash
        run: |
          git config user.name 'forensic-reader'
          git config user.email 'forensic-reader@users.noreply.github.com'
          git add forensic_purchase_matches.txt forensic_purchase_windows.txt
          git commit -m 'forensic: extract current mother purchase source' || exit 0
          git push origin HEAD:forensic-read-20260915
