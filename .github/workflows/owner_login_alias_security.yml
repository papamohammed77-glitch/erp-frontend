name: RAWAEA — Owner Credential Security Contract

on:
  push:
    branches: [main]
    paths:
      - 'companies/company-1/main.html'
      - 'supabase/functions/save-settings/index.ts'
      - 'supabase/migrations/*owner_login_alias_sync_atomic*'
      - 'scripts/owner-login-alias-security.test.mjs'
      - '.github/workflows/owner_login_alias_security.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  owner-credential-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout operational source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run owner credential security contract tests
        run: node --test scripts/owner-login-alias-security.test.mjs
