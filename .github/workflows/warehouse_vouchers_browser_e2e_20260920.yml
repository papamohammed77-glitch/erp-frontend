name: RAWAEA — Warehouse Vouchers Browser E2E

on:
  push:
    branches: [main]
    paths:
      - 'companies/company-1/warehouse/vouchers.html'
      - 'companies/company-1/core.js'
      - 'companies/company-1/sw.js'
      - '.github/workflows/warehouse_vouchers_browser_e2e_20260920.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout current source of truth
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate vouchers source syntax and canonical asset paths
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('companies/company-1/warehouse/vouchers.html','utf8');
          if(!s.includes('<script src="../core.js"></script>')) throw new Error('CANONICAL_CORE_PATH_MISSING');
          if(s.includes('<script src="core.js"></script>')) throw new Error('WRONG_CORE_PATH_PRESENT');
          if(!s.includes("RW_SW.register('../sw.js')")) throw new Error('CANONICAL_SW_PATH_MISSING');
          if(s.includes("RW_SW.register('sw.js')")) throw new Error('WRONG_SW_PATH_PRESENT');
          if(s.includes('register-sw.js')) throw new Error('DUPLICATE_REGISTER_SW_PRESENT');
          const scriptTags=[...s.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)];
          const inlineScripts=scriptTags.filter(m=>!/\bsrc\s*=\s*/i.test(m[1]||''));
          if(!inlineScripts.length) throw new Error('INLINE_SCRIPT_NOT_FOUND');
          inlineScripts.forEach((m,i)=>{
            try { new Function(m[2]); }
            catch(e) { throw new Error('INLINE_JS_SYNTAX_'+(i+1)+':'+e.message); }
          });
          console.log('VOUCHERS_SOURCE_GATES=PASS inline='+inlineScripts.length);
          NODE

      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Start local source server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rawaea-vouchers-http.log 2>&1 &
          echo $! >/tmp/rawaea-vouchers-http.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/companies/company-1/warehouse/vouchers.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rawaea-vouchers-http.log
          exit 1

      - name: Execute browser smoke E2E for standalone vouchers
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({serviceWorkers:'block'});
            const page = await context.newPage();
            const consoleErrors = [], pageErrors = [], requests = [], responses = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(String(e.message || e)));
            page.on('request', r => requests.push(r.url()));
            page.on('response', r => responses.push({url:r.url(),status:r.status()}));
            await page.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', r => r.fulfill({status:200,contentType:'application/javascript',body:'window.supabase = {};'}));
            await page.route('**/core.js', r => r.fulfill({status:200,contentType:'application/javascript',body:
              "window.supabase={auth:{getSession:function(){return Promise.resolve({data:{session:null},error:null});}},rpc:function(){return Promise.resolve({data:null,error:null});}};"+
              "window.RW_Auth={init:function(cb){cb(null,'NO_SESSION');},doLogin:function(){},doLogout:function(cb){cb();},getUser:function(){return null;}};"+
              "window.RW_SW={register:function(path){return fetch(path).then(function(r){if(!r.ok)throw new Error('SW_FETCH_FAILED');return r;});}};"
            }));
            await page.route('**/register-sw.js', r => r.fulfill({status:200,contentType:'application/javascript',body:''}));
            await page.route(/https:\/\/(fonts\.googleapis\.com|cdnjs\.cloudflare\.com)/, r => r.fulfill({status:200,contentType:'text/css',body:''}));
            const target='http://127.0.0.1:4173/companies/company-1/warehouse/vouchers.html';
            const response=await page.goto(target,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(500);
            const source=await page.content(), asset=url=>responses.find(x=>x.url===url);
            const core=asset('http://127.0.0.1:4173/companies/company-1/core.js');
            const sw=asset('http://127.0.0.1:4173/companies/company-1/sw.js');
            const wrongSw=responses.filter(x=>x.url.includes('/companies/company-1/warehouse/sw.js'));
            const email=await page.locator('#loginEmail').count(), password=await page.locator('#loginPass').count(), button=await page.locator('button[onclick*="doLogin"]').count();
            console.log('HTTP='+(response?response.status():'NO_RESPONSE'),'CORE='+(core?core.status:'MISSING'),'SW='+(sw?sw.status:'MISSING'));
            console.log('LOGIN_EMAIL='+email,'LOGIN_PASSWORD='+password,'LOGIN_BUTTON='+button,'WRONG_SW='+wrongSw.length);
            console.log('CONSOLE_ERRORS='+JSON.stringify(consoleErrors),'PAGE_ERRORS='+JSON.stringify(pageErrors),'REQUESTS='+requests.length);
            if(!response||!response.ok())throw new Error('VOUCHERS_HTTP_LOAD_FAILED');
            if(!core||core.status!==200)throw new Error('CORE_HTTP_LOAD_FAILED');
            if(!sw||sw.status!==200)throw new Error('SW_HTTP_LOAD_FAILED');
            if(wrongSw.length)throw new Error('WRONG_WAREHOUSE_SW_REQUEST_DETECTED');
            if(email<1||password<1||button<1)throw new Error('LOGIN_UI_MISSING');
            if(consoleErrors.length||pageErrors.length)throw new Error('VOUCHERS_BROWSER_ERRORS');
            if(!source.includes("RW_SW.register('../sw.js')"))throw new Error('SW_REGISTRATION_SOURCE_MISSING');
            console.log('VOUCHERS_BROWSER_BOOT_E2E=PASS');
            await browser.close();
          })().catch(e=>{console.error('VOUCHERS_BROWSER_E2E_FAILURE='+e.message);process.exit(1)});
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawaea-vouchers-browser-e2e
          path: /tmp/rawaea-vouchers-http.log
          if-no-files-found: ignore
