name: RAWAEA CTO — published main.html full forensic gate

on:
  push:
    branches: [main]
    paths:
      - 'companies/company-1/main.html'
      - '.github/workflows/cto_main_html_forensic_20260912.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-main-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout published Source of Truth
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Full-file structural audit and JavaScript syntax gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re, hashlib

          p=Path('companies/company-1/main.html')
          raw=p.read_text(encoding='utf-8')
          lines=raw.splitlines()
          print('FILE=companies/company-1/main.html')
          print('BYTES='+str(len(raw.encode('utf-8'))))
          print('LINES='+str(len(lines)))
          print('SHA256='+hashlib.sha256(raw.encode('utf-8')).hexdigest())
          print('EOF_LAST_3='+repr(lines[-3:] if len(lines)>=3 else lines))
          if len(lines) < 17000: raise SystemExit('MAIN_HTML_LINE_COUNT_BELOW_EXPECTED')
          if lines[-3:] != ['</script>','</body>','</html>']: raise SystemExit('MAIN_HTML_EOF_ORDER_INVALID')

          class P(HTMLParser):
            def __init__(self):
              super().__init__(convert_charrefs=False)
              self.starts=[]; self.ends=[]
            def handle_starttag(self, tag, attrs): self.starts.append(tag.lower())
            def handle_startendtag(self, tag, attrs): self.starts.append(tag.lower())
            def handle_endtag(self, tag): self.ends.append(tag.lower())

          parser=P(); parser.feed(raw); parser.close()
          from collections import Counter
          sc=Counter(parser.starts); ec=Counter(parser.ends)
          for tag in ['html','head','body','style','script']:
            print(tag.upper()+'_OPEN/CLOSE='+str(sc[tag])+'/'+str(ec[tag]))
          for tag in ['html','head','body','script']:
            if sc[tag] != ec[tag]: raise SystemExit(tag.upper()+'_TAG_BALANCE_INVALID')

          bad=[]
          for phrase in ['(قيد التطوير)','قيد التطوير','TODO','FIXME','Coming Soon']:
            if phrase in raw: bad.append(phrase)
          print('INCOMPLETE_MARKERS='+repr(bad))
          if bad: raise SystemExit('INCOMPLETE_MARKERS_FOUND')

          scripts=list(re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',raw,re.I))
          print('SCRIPT_BLOCKS='+str(len(scripts)))
          js_blocks=[]
          for n,m in enumerate(scripts,1):
            attrs=m.group('a') or ''
            if not re.search(r'\bsrc\s*=',attrs,re.I):
              mt=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              typ=(mt.group(1) if mt else '').lower()
              if typ in ('','text/javascript','application/javascript','application/ecmascript','text/ecmascript'):
                start=raw[:m.start()].count(chr(10))+1
                js_blocks.append((n,start,m.start(),m.end(),m.group('b')))
          print('INLINE_JS_BLOCKS='+str(len(js_blocks)))
          if not js_blocks: raise SystemExit('NO_INLINE_JS_FOUND')

          # Preserve original main.html line numbers: blank all non-JS bytes but keep line breaks.
          positioned=list(raw)
          for i,ch in enumerate(positioned):
            if ch != chr(10): positioned[i]=' '
          for _,_,a,b,body in js_blocks:
            # Locate exact script-body start/end without changing line count.
            prefix=raw[:a]; open_end=raw.find('>',a)+1
            body_start=open_end; body_end=b-len('</script>')
            positioned[body_start:body_end]=list(raw[body_start:body_end])
          Path('/tmp/main-positioned.js').write_text(''.join(positioned),encoding='utf-8')

          print('SERVICE_WORKER_REGISTER_COUNT='+str(raw.count('navigator.serviceWorker.register')))
          rwhr=len(re.findall(r'(?m)^\s*(?:(?:var|let|const)\s+RW_HR\s*=|(?:async\s+)?function\s+RW_HR\s*\()',raw))
          rwcrm=len(re.findall(r'(?m)^\s*(?:(?:var|let|const)\s+RW_CRM\s*=|(?:async\s+)?function\s+RW_CRM\s*\()',raw))
          print('RW_HR_DECLARATIONS='+str(rwhr))
          print('RW_CRM_DECLARATIONS='+str(rwcrm))

          # Direct physical-stock writer discovery.
          direct=[]
          for pattern,window_size,label in [(r"\.from\(\s*['\"]stock_branches['\"]",1800,'stock'),(r"\.from\(\s*['\"]inventory_log['\"]",1500,'inventory_log')]:
            for m in re.finditer(pattern,raw):
              window=raw[m.start():m.start()+window_size]
              if re.search(r'\.(?:insert|update|upsert|delete)\s*\(',window):
                direct.append((label,raw[:m.start()].count(chr(10))+1))
          print('DIRECT_PHYSICAL_WRITERS='+repr(direct))
          if direct: raise SystemExit('DIRECT_PHYSICAL_STOCK_WRITER_FOUND')
          PY

          node --check /tmp/main-positioned.js
          echo 'NODE_CHECK=PASS'
          echo 'FULL_FILE_READ=PASS'

      - name: Exact incomplete marker gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'قيد التطوير|TODO|FIXME|Coming Soon' companies/company-1/main.html; then exit 1; else echo INCOMPLETE_MARKERS_FOUND=false; fi

      - name: Machine-verifiable summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('companies/company-1/main.html'); raw=p.read_text(encoding='utf-8')
          print('source_of_truth=erp-frontend/companies/company-1/main.html')
          print('sha256='+hashlib.sha256(raw.encode('utf-8')).hexdigest())
          print('lines='+str(len(raw.splitlines())))
          print('bytes='+str(len(raw.encode('utf-8'))))
          PY
          git diff --check