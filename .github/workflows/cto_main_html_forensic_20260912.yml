name: RAWAEA CTO — published main.html full forensic gate

on:
  push:
    branches: [main]
    paths:
      - 'companies/company-1/main.html'
      - '.github/workflows/cto_main_html_forensic_20260912.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-main-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout published Source of Truth
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Full-file structural and runtime syntax audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('companies/company-1/main.html')
          raw=p.read_text(encoding='utf-8')
          lines=raw.splitlines()
          print('FILE=companies/company-1/main.html')
          print('BYTES='+str(len(raw.encode('utf-8'))))
          print('LINES='+str(len(lines)))
          print('SHA256='+hashlib.sha256(raw.encode('utf-8')).hexdigest())
          print('EOF_LAST_LINE='+repr(lines[-1] if lines else ''))
          exact_counts={
            'HTML_OPEN':len(re.findall(r'<html(?:\\s|>)',raw,re.I)),
            'HTML_CLOSE':raw.lower().count('</html>'),
            'HEAD_OPEN':len(re.findall(r'<head(?:\\s|>)',raw,re.I)),
            'HEAD_CLOSE':raw.lower().count('</head>'),
            'BODY_OPEN':len(re.findall(r'<body(?:\\s|>)',raw,re.I)),
            'BODY_CLOSE':raw.lower().count('</body>'),
            'STYLE_OPEN':len(re.findall(r'<style(?:\\s|>)',raw,re.I)),
            'STYLE_CLOSE':raw.lower().count('</style>'),
          }
          print('TAG_COUNTS='+str(exact_counts))
          if exact_counts['HTML_OPEN']!=1 or exact_counts['HTML_CLOSE']!=1: raise SystemExit('HTML_TAG_BALANCE_INVALID')
          if exact_counts['HEAD_OPEN']!=1 or exact_counts['HEAD_CLOSE']!=1: raise SystemExit('HEAD_TAG_BALANCE_INVALID')
          if exact_counts['BODY_OPEN']!=1 or exact_counts['BODY_CLOSE']!=1: raise SystemExit('BODY_TAG_BALANCE_INVALID')
          if exact_counts['STYLE_OPEN']!=exact_counts['STYLE_CLOSE']: raise SystemExit('STYLE_TAG_BALANCE_INVALID')
          scripts=list(re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\\s\\S]*?)</script>',raw,re.I))
          print('SCRIPT_BLOCKS='+str(len(scripts)))
          inline=[]
          for n,m in enumerate(scripts,1):
            if not re.search(r'\\bsrc\\s*=',m.group('a') or '',re.I):
              start=raw[:m.start()].count(chr(10))+1
              inline.append((n,start,m.group('b')))
          print('INLINE_SCRIPT_BLOCKS='+str(len(inline)))
          if len(lines) < 17000: raise SystemExit('MAIN_HTML_LINE_COUNT_BELOW_EXPECTED')
          if lines[-3:] != ['</script>','</body>','</html>']:
            raise SystemExit('MAIN_HTML_EOF_ORDER_INVALID: '+repr(lines[-5:]))
          bad=[]
          for phrase in ['(قيد التطوير)','قيد التطوير','TODO','FIXME','Coming Soon']:
            if phrase in raw: bad.append(phrase)
          print('INCOMPLETE_MARKERS='+repr(bad))
          if bad: raise SystemExit('INCOMPLETE_MARKERS_FOUND')
          print('SERVICE_WORKER_REGISTER_COUNT='+str(raw.count('navigator.serviceWorker.register')))
          print('RW_HR_DECLARATIONS='+str(len(re.findall(r'(?m)^\\s*(?:(?:var|let|const)\\s+RW_HR\\s*=|(?:async\\s+)?function\\s+RW_HR\\s*\\()',raw))))
          print('RW_CRM_DECLARATIONS='+str(len(re.findall(r'(?m)^\\s*(?:(?:var|let|const)\\s+RW_CRM\\s*=|(?:async\\s+)?function\\s+RW_CRM\\s*\\()',raw))))
          if not inline: raise SystemExit('NO_INLINE_SCRIPT_FOUND')
          Path('/tmp/main-inline-all.js').write_text('\\n\\n'.join(x[2] for x in inline),encoding='utf-8')
          stock=[m.start() for m in re.finditer(r"\\.from\\(\\s*['\"]stock_branches['\"]",raw)]
          inv=[m.start() for m in re.finditer(r"\\.from\\(\\s*['\"]inventory_log['\"]",raw)]
          direct_stock=[]
          for pos in stock:
            window=raw[pos:pos+1800]
            if re.search(r'\\.(?:insert|update|upsert|delete)\\s*\\(',window): direct_stock.append(raw[:pos].count(chr(10))+1)
          direct_inv=[]
          for pos in inv:
            window=raw[pos:pos+1500]
            if re.search(r'\\.(?:insert|update|upsert|delete)\\s*\\(',window): direct_inv.append(raw[:pos].count(chr(10))+1)
          print('DIRECT_STOCK_WRITER_LINES='+repr(direct_stock))
          print('DIRECT_INVENTORY_LOG_WRITER_LINES='+repr(direct_inv))
          if direct_stock or direct_inv: raise SystemExit('DIRECT_PHYSICAL_STOCK_WRITER_FOUND')
          PY
          node --check /tmp/main-inline-all.js
          echo 'NODE_CHECK=PASS'
          echo 'FULL_FILE_READ=PASS'

      - name: Emit exact incomplete-marker locations if any
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'قيد التطوير|TODO|FIXME|Coming Soon' companies/company-1/main.html; then
            echo 'INCOMPLETE_MARKERS_FOUND=true'
            exit 1
          else
            echo 'INCOMPLETE_MARKERS_FOUND=false'
          fi

      - name: Publish machine-verifiable forensic summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('companies/company-1/main.html')
          raw=p.read_text(encoding='utf-8')
          print('sha256='+hashlib.sha256(raw.encode('utf-8')).hexdigest())
          print('lines='+str(len(raw.splitlines())))
          print('bytes='+str(len(raw.encode('utf-8'))))
          print('source_of_truth=erp-frontend/companies/company-1/main.html')
          PY
          git diff --check