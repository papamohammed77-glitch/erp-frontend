name: RAWAEA CTO — published main.html forensic scan
on:
  push:
    branches: [main]
    paths: ['companies/company-1/main.html','.github/workflows/cto_main_html_forensic_20260912.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  forensic-main-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate likely unterminated template fragments
        shell: bash
        run: |
          set -euo pipefail
          echo '--- currency followed by HTML outside JS string ---'
          grep -nE "currency</(td|div|span|p|th)" companies/company-1/main.html || true
          echo '--- common expression followed by HTML outside JS string ---'
          grep -nE "toLocaleString\(\) \+ '[^']*' \+ (currency|line|it\.)</" companies/company-1/main.html || true
          echo '--- doubled JS quote escapes in inline HTML constructors ---'
          grep -nE "onclick=.*\\\\'" companies/company-1/main.html || true
          echo '--- exact file identity ---'
          sha256sum companies/company-1/main.html
          wc -l -c companies/company-1/main.html
