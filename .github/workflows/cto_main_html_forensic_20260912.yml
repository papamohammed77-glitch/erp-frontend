name: RAWAEA CTO — published main.html full forensic gate
on:
  push:
    branches: [main]
    paths: ['companies/company-1/main.html','.github/workflows/cto_main_html_forensic_20260912.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  forensic-main-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulated exact owner repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path('companies/company-1/main.html').read_text(encoding='utf-8')
          scripts=list(re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',raw,re.I))
          positioned=[' ' if ch!='\n' else ch for ch in raw]
          for m in scripts:
            if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I):
              a=m.start(); b=m.end()-len('</script>'); oe=raw.find('>',a)+1; positioned[oe:b]=list(raw[oe:b])
          ls=''.join(positioned).splitlines(True)
          fixes={
            1971: ("\\\\'", "\\'"), 2278:("\\\\'","\\'"), 2283:("\\\\'","\\'"), 2311:("\\\\'","\\'"), 2316:("\\\\'","\\'"),
            9010:("\\\\'","\\'"),11142:("\\\\'","\\'"),14457:("\\\\'","\\'"),14572:("\\\\'","\\'"),14574:("\\\\'","\\'"),
            16221:("\\\\'","\\'"),16223:("\\\\'","\\'"),16569:("\\\\'","\\'"),16574:("\\\\'","\\'")
          }
          for i,(old,new) in fixes.items():
            if old not in ls[i-1]: raise SystemExit(f'EXPECTED_REPAIR_NOT_FOUND@{i}')
            ls[i-1]=ls[i-1].replace(old,new)
          expected="                '<div class=\"font-bold text-blue-600\">' + Number(it.sales_price || 0).toLocaleString() + ' ' + currency</div>' +\n"
          replacement="                '<div class=\"font-bold text-blue-600\">' + Number(it.sales_price || 0).toLocaleString() + ' ' + currency + '</div>' +\n"
          if expected not in ls[4805]:
            raise SystemExit('POS_CURRENCY_DEFECT_PATTERN_NOT_FOUND@4806')
          ls[4805]=ls[4805].replace(expected,replacement,1)
          Path('/tmp/main-repaired.js').write_text(''.join(ls),encoding='utf-8')
          print('SIMULATED_REPAIRS=PASS')
          PY
          node --check /tmp/main-repaired.js
          echo 'SIMULATED_NODE_CHECK=PASS'
