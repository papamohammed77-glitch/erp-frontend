name: RAWAEA CTO — published main.html full forensic gate

on:
  push:
    branches: [main]
    paths:
      - 'companies/company-1/main.html'
      - '.github/workflows/cto_main_html_forensic_20260912.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-main-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Structural gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          import re,hashlib
          raw=Path('companies/company-1/main.html').read_text(encoding='utf-8'); lines=raw.splitlines()
          print('LINES',len(lines),'BYTES',len(raw.encode()),'SHA256',hashlib.sha256(raw.encode()).hexdigest())
          print('EOF',repr(lines[-3:]))
          if lines[-3:]!=['</script>','</body>','</html>']: raise SystemExit('EOF_INVALID')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.s=[]; self.e=[]
            def handle_starttag(self,t,a): self.s.append(t.lower())
            def handle_startendtag(self,t,a): self.s.append(t.lower())
            def handle_endtag(self,t): self.e.append(t.lower())
          p=P(); p.feed(raw); p.close(); sc=Counter(p.s); ec=Counter(p.e)
          for t in ('html','head','body','script'):
            print(t,sc[t],ec[t])
            if sc[t]!=ec[t]: raise SystemExit('TAG_BALANCE_'+t)
          bad=[x for x in ('(قيد التطوير)','قيد التطوير','TODO','FIXME','Coming Soon') if x in raw]
          print('BAD_MARKERS',bad)
          if bad: raise SystemExit('INCOMPLETE_MARKERS')
          PY
      - name: Simulate exact owner syntax repairs only in temporary copy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path('companies/company-1/main.html').read_text(encoding='utf-8')
          scripts=list(re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',raw,re.I))
          positioned=[' ' if ch!=chr(10) else ch for ch in raw]
          for m in scripts:
            if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I):
              a=m.start(); b=m.end()-len('</script>'); oe=raw.find('>',a)+1; positioned[oe:b]=list(raw[oe:b])
          test=''.join(positioned)
          target={1971,2278,2283,2311,2316,4804,9010,11142,14457,14572,14574,16221,16223,16569,16574}
          ls=test.splitlines(True); changed=[]
          for i in sorted(target):
            line=ls[i-1]; new=line.replace("\\\\'", "\\'")
            if new==line: raise SystemExit(f'EXPECTED_REPAIR_PATTERN_NOT_FOUND@{i}')
            ls[i-1]=new; changed.append(i)
          Path('/tmp/main-repaired.js').write_text(''.join(ls),encoding='utf-8')
          print('REPAIRED_LINES',changed)
          PY
          node --check /tmp/main-repaired.js
          echo 'SIMULATED_NODE_CHECK=PASS'
      - name: Marker gate
        shell: bash
        run: |
          grep -nE 'قيد التطوير|TODO|FIXME|Coming Soon' companies/company-1/main.html && exit 1 || true
