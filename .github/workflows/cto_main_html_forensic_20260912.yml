name: RAWAEA CTO — published main.html full forensic gate

on:
  push:
    branches: [main]
    paths:
      - 'companies/company-1/main.html'
      - '.github/workflows/cto_main_html_forensic_20260912.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic-main-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout published Source of Truth
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Full-file structural audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter
          import re, hashlib
          p=Path('companies/company-1/main.html'); raw=p.read_text(encoding='utf-8'); lines=raw.splitlines()
          print('FILE=companies/company-1/main.html'); print('BYTES='+str(len(raw.encode('utf-8')))); print('LINES='+str(len(lines)))
          print('SHA256='+hashlib.sha256(raw.encode('utf-8')).hexdigest()); print('EOF_LAST_3='+repr(lines[-3:]))
          if len(lines)<17000: raise SystemExit('MAIN_HTML_LINE_COUNT_BELOW_EXPECTED')
          if lines[-3:]!=['</script>','</body>','</html>']: raise SystemExit('MAIN_HTML_EOF_ORDER_INVALID')
          class P(HTMLParser):
            def __init__(self): super().__init__(convert_charrefs=False); self.starts=[]; self.ends=[]
            def handle_starttag(self,tag,attrs): self.starts.append(tag.lower())
            def handle_startendtag(self,tag,attrs): self.starts.append(tag.lower())
            def handle_endtag(self,tag): self.ends.append(tag.lower())
          parser=P(); parser.feed(raw); parser.close(); sc=Counter(parser.starts); ec=Counter(parser.ends)
          for tag in ['html','head','body','style','script']: print(tag.upper()+'_OPEN/CLOSE='+str(sc[tag])+'/'+str(ec[tag]))
          for tag in ['html','head','body','script']:
            if sc[tag]!=ec[tag]: raise SystemExit(tag.upper()+'_TAG_BALANCE_INVALID')
          bad=[x for x in ['(قيد التطوير)','قيد التطوير','TODO','FIXME','Coming Soon'] if x in raw]
          print('INCOMPLETE_MARKERS='+repr(bad));
          if bad: raise SystemExit('INCOMPLETE_MARKERS_FOUND')
          direct=[]
          for pattern,window_size,label in [(r"\.from\(\s*['\"]stock_branches['\"]",1800,'stock'),(r"\.from\(\s*['\"]inventory_log['\"]",1500,'inventory_log')]:
            for m in re.finditer(pattern,raw):
              if re.search(r'\.(?:insert|update|upsert|delete)\s*\(',raw[m.start():m.start()+window_size]): direct.append((label,raw[:m.start()].count(chr(10))+1))
          print('DIRECT_PHYSICAL_WRITERS='+repr(direct));
          if direct: raise SystemExit('DIRECT_PHYSICAL_STOCK_WRITER_FOUND')
          PY

      - name: Validate exact owner surgical repair set in temporary copy only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path('companies/company-1/main.html').read_text(encoding='utf-8')
          scripts=list(re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',raw,re.I))
          positioned=[' ' if ch!=chr(10) else ch for ch in raw]
          for m in scripts:
            if not re.search(r'\bsrc\s*=',m.group('a') or '',re.I):
              a=m.start(); b=m.end()-len('</script>'); oe=raw.find('>',a)+1; positioned[oe:b]=list(raw[oe:b])
          test=''.join(positioned)
          target_lines={1971,2278,2283,2311,2316,4804,9010,11142,14457,14572,14574,16221,16223,16569,16574}
          lines=test.splitlines(True); changed=[]
          for i,line in enumerate(lines,1):
            if i in target_lines:
              new=line.replace("\\\\'", "\\'")
              if new==line: raise SystemExit(f'EXPECTED_OWNER_FIX_NOT_PRESENT@{i}')
              lines[i-1]=new; changed.append(i)
          if set(changed)!=target_lines: raise SystemExit('OWNER_FIX_TARGET_MISMATCH '+repr(changed))
          Path('/tmp/main-owner-repaired.js').write_text(''.join(lines),encoding='utf-8')
          print('OWNER_FIX_LINES='+repr(changed))
          PY
          node --check /tmp/main-owner-repaired.js
          echo NODE_CHECK_SIMULATED_OWNER_REPAIR=PASS

      - name: Exact incomplete marker gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'قيد التطوير|TODO|FIXME|Coming Soon' companies/company-1/main.html; then exit 1; else echo INCOMPLETE_MARKERS_FOUND=false; fi

      - name: Machine-verifiable summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('companies/company-1/main.html'); raw=p.read_text(encoding='utf-8')
          print('source_of_truth=erp-frontend/companies/company-1/main.html')
          print('sha256='+hashlib.sha256(raw.encode('utf-8')).hexdigest())
          print('lines='+str(len(raw.splitlines())))
          print('bytes='+str(len(raw.encode('utf-8'))))
          PY
          git diff --check