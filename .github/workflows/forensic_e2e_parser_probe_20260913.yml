name: RAWAEA forensic temporary parser probe

on:
  push:
    branches: [forensic/e2e-login-20260913]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract inline JavaScript preserving line numbers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path('companies/company-1/main.html').read_text(encoding='utf-8')
          scripts=list(re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',raw,re.I))
          positioned=[' ' if ch!='\n' else ch for ch in raw]
          blocks=0
          for m in scripts:
            attrs=m.group('a') or ''
            if not re.search(r'\bsrc\s*=',attrs,re.I):
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              typ=(tm.group(1) if tm else '').lower()
              if typ in ('','text/javascript','application/javascript','application/ecmascript','text/ecmascript'):
                blocks+=1
                b=m.end()-len('</script>'); oe=raw.find('>',m.start())+1
                positioned[oe:b]=list(raw[oe:b])
          print('INLINE_JS_BLOCKS='+str(blocks))
          Path('/tmp/main-positioned.js').write_text(''.join(positioned),encoding='utf-8')
          PY
          node --check /tmp/main-positioned.js 2>&1 | tee /tmp/node-check.txt

      - name: Apply known repairs to a diagnostic copy and re-parse
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/main-positioned.js')
          s=p.read_text(encoding='utf-8')
          reps={
            "_fmtNum(c.debt) + ' ' + currency</div>';":"_fmtNum(c.debt) + ' ' + currency + '</div>';",
            "_fmtNum(selectedCustomer.debt) + currency</strong></div>';":"_fmtNum(selectedCustomer.debt) + currency + '</strong></div>';",
            "_fmtNum(it.sales_price)+ ' ' + currency</div>';":"_fmtNum(it.sales_price)+ ' ' + currency + '</div>';",
            "_fmtNum(it.price)+ ' ' + currency</td>';":"_fmtNum(it.price)+ ' ' + currency + '</td>';",
            "_fmtNum(line)+ ' ' + currency</td>';":"_fmtNum(line)+ ' ' + currency + '</td>';",
            "_fmtNum(orders[o].total_amount) + ' ' + currency + ')'</span>';":"_fmtNum(orders[o].total_amount) + ' ' + currency + ')</span>';",
            ".join(''))}</select></div>":".join('')}</select></div>"
          }
          for a,b in reps.items():
            n=s.count(a)
            print('REPAIR_TARGET',a,'COUNT',n)
            s=s.replace(a,b)
          Path('/tmp/main-repaired.js').write_text(s,encoding='utf-8')
          PY
          node --check /tmp/main-repaired.js 2>&1 | tee /tmp/repaired-check.txt
