name: RAWAEA forensic temporary parser probe

on:
  push:
    branches: [forensic/e2e-login-20260913]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract inline JavaScript preserving line numbers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path('companies/company-1/main.html').read_text(encoding='utf-8')
          scripts=list(re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',raw,re.I))
          positioned=[' ' if ch!='\n' else ch for ch in raw]
          blocks=0
          for m in scripts:
            attrs=m.group('a') or ''
            if not re.search(r'\bsrc\s*=',attrs,re.I):
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              typ=(tm.group(1) if tm else '').lower()
              if typ in ('','text/javascript','application/javascript','application/ecmascript','text/ecmascript'):
                blocks+=1
                b=m.end()-len('</script>'); oe=raw.find('>',m.start())+1
                positioned[oe:b]=list(raw[oe:b])
          print('INLINE_JS_BLOCKS='+str(blocks))
          Path('/tmp/main-positioned.js').write_text(''.join(positioned),encoding='utf-8')
          PY
          node --check /tmp/main-positioned.js 2>&1 | tee /tmp/node-check.txt

      - name: Isolate exact malformed slash token
        if: failure()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'), vm=require('vm');
          const s=fs.readFileSync('/tmp/main-positioned.js','utf8');
          const lines=s.split('\n');
          function test(src){ try { new vm.Script(src,{filename:'probe.js'}); return null; } catch(e){ return String(e); } }
          console.log('BASE',test(s));
          const candidates=[];
          for(let i=0,ln=1;i<s.length;i++){ if(s[i]=='\n') ln++; if(s[i]=='/') candidates.push({i,ln}); }
          console.log('SLASH_COUNT',candidates.length);
          // High-value candidates: slash before reported line, plus same lexical neighborhood.
          const targets=candidates.filter(x=>x.ln>=5000 && x.ln<=5593);
          console.log('TARGET_COUNT',targets.length);
          for(const x of targets){
            const a=s.slice(0,x.i)+' '+s.slice(x.i+1);
            if(test(a)===null){
              const lo=Math.max(1,x.ln-6), hi=Math.min(lines.length,x.ln+6);
              console.log('ROOT_SLASH_CANDIDATE',JSON.stringify(x));
              for(let n=lo;n<=hi;n++) console.log(String(n)+': '+lines[n-1]);
              break;
            }
          }
          NODE
