name: RAWAEA forensic temporary parser probe

on:
  push:
    branches: [forensic/e2e-login-20260913]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract inline JavaScript preserving line numbers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path('companies/company-1/main.html').read_text(encoding='utf-8')
          scripts=list(re.finditer(r'<script(?P<a>[^>]*)>(?P<b>[\s\S]*?)</script>',raw,re.I))
          positioned=[' ' if ch!='\n' else ch for ch in raw]
          blocks=0
          for m in scripts:
            attrs=m.group('a') or ''
            if not re.search(r'\bsrc\s*=',attrs,re.I):
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              typ=(tm.group(1) if tm else '').lower()
              if typ in ('','text/javascript','application/javascript','application/ecmascript','text/ecmascript'):
                blocks+=1
                b=m.end()-len('</script>'); oe=raw.find('>',m.start())+1
                positioned[oe:b]=list(raw[oe:b])
          print('INLINE_JS_BLOCKS='+str(blocks))
          Path('/tmp/main-positioned.js').write_text(''.join(positioned),encoding='utf-8')
          PY
          node --check /tmp/main-positioned.js 2>&1 | tee /tmp/node-check.txt

      - name: Parser diagnostics with TypeScript
        if: failure()
        shell: bash
        run: |
          npx --yes typescript@5.9.2 --version
          npm install --no-save --silent typescript@5.9.2
          node <<'NODE'
          const fs=require('fs'), ts=require('typescript');
          const s=fs.readFileSync('/tmp/main-positioned.js','utf8');
          const sf=ts.createSourceFile('main.js',s,ts.ScriptTarget.ES2022,true,ts.ScriptKind.JS);
          for(const d of sf.parseDiagnostics){
            const pos=d.start??0, lc=sf.getLineAndCharacterOfPosition(pos);
            const msg=ts.flattenDiagnosticMessageText(d.messageText,' ');
            console.log('TS_DIAGNOSTIC',JSON.stringify({code:d.code,line:lc.line+1,column:lc.character+1,start:pos,length:d.length,message:msg}));
            const lo=Math.max(0,lc.line-8), hi=Math.min(s.length,sf.getPositionOfLineAndCharacter(Math.min(sf.getLineStarts().length-1,lc.line+8),0));
            console.log(s.slice(sf.getPositionOfLineAndCharacter(lo,0),hi));
          }
          NODE
