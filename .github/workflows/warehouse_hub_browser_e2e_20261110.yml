name: RAWAEA — Native Unified Warehouse Application E2E

on:
  push:
    branches: [main]
    paths:
      - 'companies/company-1/warehouse/warehouse.html'
      - 'companies/company-1/warehouse/receiver.html'
      - 'companies/company-1/core.js'
      - 'supabase/migrations/*warehouse*'
      - '.github/workflows/warehouse_hub_browser_e2e_20261110.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  native-warehouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate native warehouse source and central-service contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('companies/company-1/warehouse/warehouse.html','utf8');
          const scripts=[...html.matchAll(/<script\\b([^>]*)>([\\s\\S]*?)<\\/script\\s*>/gi)]
            .filter(m=>! /\\bsrc\\s*=/.test(m[1]||''));
          if(scripts.length!==1) throw new Error('NATIVE_WAREHOUSE_INLINE_SCRIPT_COUNT:'+scripts.length);
          scripts.forEach((m,i)=>{try{new Function(m[2])}catch(e){throw new Error('NATIVE_WAREHOUSE_JS_SYNTAX_'+(i+1)+':'+e.message)}});
          if(/<iframe\\b|workspaceFrames|warehouse-operation-frame|receiver\\.html|picker\\.html|loader\\.html|returns\\.html|unloader\\.html|counter\\.html|vouchers\\.html/.test(html))
            throw new Error('NATIVE_WAREHOUSE_STILL_EMBEDS_OR_LINKS_CHILD_APPS');
          for(const marker of [
            'var RW_Warehouse = (function()',
            'window.RW_Warehouse = RW_Warehouse;',
            'var RW_Table = (function()',
            'var RW_Receiver = {',
            'get_quick_market_receiving_queue_atomic',
            'Idempotency-Key',
            'receiptFingerprint',
            'storePendingOperation',
            'sentQty',
            'receivedQty',
            'var RW_Runsheets =',
            'RW_API.call',
            'inventory_control',
            "get_warehouse_hub_snapshot",
            'script src="../core.js"',
            'RW_Auth.init'
          ]) if(!html.includes(marker)) throw new Error('NATIVE_WAREHOUSE_REQUIRED_MARKER_MISSING:'+marker);
          const nav=html.match(/<nav id="warehouseTabs"[^>]*>([\\s\\S]*?)<\\/nav>/);
          if(!nav) throw new Error('NATIVE_WAREHOUSE_NAV_MISSING');
          const tabs=[...nav[1].matchAll(/data-tab="([^"]+)"/g)].map(m=>m[1]);
          const expected=['today','receiving','picking','loading','delivery','returns','unloading','settlement','vouchers','inventory','account'];
          if(tabs.join('|')!==expected.join('|')) throw new Error('NATIVE_WAREHOUSE_TAB_CONTRACT:'+tabs.join('|'));
          for(const fn of ['loadReceiving','loadPicking','loadLoading','loadDelivery','loadReturn','loadUnloading','loadSettlement','loadVouchers','loadInventoryControl'])
            if(!html.includes(fn+': '+fn) && !html.includes(fn+':'+fn) && !html.includes(fn+': '+fn+'(') && !html.includes(fn+':'+fn+'('))
              throw new Error('PARENT_WAREHOUSE_MODULE_METHOD_NOT_COPIED:'+fn);
          for(const role of ['استلام','تحضير','تحميل','مرتجعات','تفريغ','أذونات','جرد','مخزن شامل'])
            if(!html.includes("'"+role+"'")) throw new Error('WAREHOUSE_ROLE_SCOPE_MISSING:'+role);
          const migration='supabase/migrations/20261110193000_unified_warehouse_workbench_rpc_role_alignment.sql';
          const sql=fs.readFileSync(migration,'utf8');
          for(const marker of [
            'public.inventory_control(text,jsonb)',
            'public.get_quick_market_receiving_queue_atomic(uuid)',
            "current_user_has_effective_permission('warehouse')",
            "v_actor.active_warehouse_role='مخزن شامل'",
            'reviewed production contract'
          ]) if(!sql.includes(marker)) throw new Error('WAREHOUSE_RPC_ROLE_MIGRATION_MARKER_MISSING:'+marker);
          const receiver=fs.readFileSync('companies/company-1/warehouse/receiver.html','utf8');
          if(!receiver.includes('receiptFingerprint')||!receiver.includes('Idempotency-Key')) throw new Error('REFERENCE_RECEIVER_CONTRACT_CHANGED');
          console.log('NATIVE_WAREHOUSE_NO_IFRAME_CONTRACT=PASS');
          console.log('NATIVE_WAREHOUSE_PARENT_MODULE_TRANSFER=PASS');
          console.log('NATIVE_WAREHOUSE_MODERN_RECEIVING_TRANSFER=PASS');
          console.log('NATIVE_WAREHOUSE_ELEVEN_TAB_CONTRACT=PASS');
          console.log('NATIVE_WAREHOUSE_CORE_AUTH_AND_SERVICE_CONTRACT=PASS');
          console.log('NATIVE_WAREHOUSE_RPC_ROLE_ALIGNMENT_MIGRATION=PASS');
          NODE

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Start local source server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rawaea-native-warehouse.log 2>&1 &
          echo $! >/tmp/rawaea-native-warehouse.pid
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/companies/company-1/warehouse/warehouse.html >/dev/null &&
            curl -fsS http://127.0.0.1:4173/companies/company-1/core.js >/dev/null &&
            curl -fsS http://127.0.0.1:4173/companies/company-1/register-sw.js >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rawaea-native-warehouse.log
          exit 1

      - name: Execute browser smoke tests for standalone native workbench
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {chromium}=require('playwright');
          const target='http://127.0.0.1:4173/companies/company-1/warehouse/warehouse.html';
          const qaUser={id:'qa-user',auth_id:'qa-auth',company_id:'qa-company',email:'qa@rawaea.invalid',name:'QA Warehouse',role:'أمين مخزن',isOwner:false,permissions:['warehouse'],activeWarehouseRole:'مخزن شامل',defaultBranchId:'qa-branch',allowedBranchIds:['qa-branch']};
          const snapshot=(role='مخزن شامل',mainAccess=true)=>({
            success:true,generated_at:new Date().toISOString(),
            user:{id:'qa-user',company_id:'qa-company',role:'أمين مخزن',active_warehouse_role:role,is_owner:false},
            branch_scope:[{id:'qa-branch',code:'QA-01',name:'فرع الاختبار'}],
            main_branch_access:mainAccess,
            metrics:{pending_purchase_orders:2,active_runsheets:3,loading_runsheets:1,loaded_runsheets:1,returning_runsheets:1,pending_vouchers:2,open_counts:1}
          });
          const mockCore=(role,mainAccess,deny=false)=>`
            var SUPABASE_URL='https://qa.invalid';
            var qaUser=${JSON.stringify({...qaUser,activeWarehouseRole:role})};
            function query(){var q={select:function(){return this;},eq:function(){return this;},in:function(){return this;},order:function(){return this;},limit:function(){return this;},range:function(){return Promise.resolve({data:[],error:null});},maybeSingle:function(){return Promise.resolve({data:null,error:null});},then:function(ok,bad){return Promise.resolve({data:[],error:null}).then(ok,bad);}};return q;}
            var supabase={
              from:function(){return query();},
              rpc:function(name){if(name==='get_warehouse_hub_snapshot')return Promise.resolve(${deny?'{data:null,error:{message:"WAREHOUSE_PERMISSION_REQUIRED"}}':'{data:'+JSON.stringify(snapshot(role,mainAccess))+',error:null}'});return Promise.resolve({data:{success:true,rows:[],invoices:[]},error:null});},
              removeChannel:function(){return Promise.resolve();}
            };
            var RW_Auth={
              init:function(cb){cb(${deny?'null':'qaUser'},${deny?'"WAREHOUSE_PERMISSION_REQUIRED"':'null'});},
              getUser:function(){return qaUser;},
              doLogin:function(e,p,cb){cb(qaUser,null);},
              doLogout:function(cb){cb(true);}
            };
            var RW_UI={
              safeHTML:function(el,h){if(el)el.innerHTML=h;},
              safeText:function(el,t){if(el)el.textContent=t;},
              byId:function(id){return document.getElementById(id);},
              toast:function(){},showLoader:function(){},hideLoader:function(){},
              formatCurrency:function(v){return String(v||0);},formatNumber:function(v){return String(v||0);},
              updateConnectionStatus:function(){},showSkeleton:function(){},showEmptyState:function(){},
              showConfirm:function(m,yes){if(yes)yes();},showError:function(){},
            };
            var RW_API={call:function(n,b,cb){if(cb)cb({success:true},null);}};
            var RW_Realtime={start:function(){return 'qa-realtime';},stop:function(){}};
          `;
          async function prepare(page,role='مخزن شامل',mainAccess=true,deny=false){
            await page.route(/https:\\/\\/(fonts\\.googleapis\\.com|cdnjs\\.cloudflare\\.com|cdn\\.tailwindcss\\.com|cdn\\.jsdelivr\\.net)/,r=>r.fulfill({status:200,contentType:'text/javascript',body:''}));
            await page.route('**/core.js',r=>r.fulfill({status:200,contentType:'application/javascript',body:mockCore(role,mainAccess,deny)}));
            await page.route('**/register-sw.js',r=>r.fulfill({status:200,contentType:'application/javascript',body:''}));
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({serviceWorkers:'block'});
            const page=await context.newPage(),pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            await prepare(page,'مخزن شامل',true,false);
            await page.goto(target,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse');
            if(await page.locator('#loginScreen').isVisible())throw new Error('LOGIN_SCREEN_NOT_HIDDEN_AFTER_AUTH');
            if(await page.locator('#mainApp').isHidden())throw new Error('NATIVE_HUB_NOT_VISIBLE');
            if(await page.locator('iframe').count()!==0)throw new Error('IFRAME_PRESENT_IN_NATIVE_HUB');
            if(await page.locator('#warehouseDashboard .metric').count()!==7)throw new Error('DASHBOARD_METRICS_MISSING');
            if(await page.locator('#warehouseTabs [data-tab]:visible').count()!==11)throw new Error('FULL_ROLE_TAB_VISIBILITY_FAILED');
            await page.evaluate(()=>{
              ['loadPicking','loadLoading','loadDelivery','loadReturn','loadUnloading','loadSettlement','loadVouchers','loadInventoryControl','loadReceiving'].forEach(function(name){
                RW_Warehouse[name]=function(){var c=document.getElementById('rw-page-container');if(c)c.textContent='NATIVE_MODULE:'+name;};
              });
              RW_Receiver.enterApp=function(){var c=document.getElementById('mainContent');if(c)c.textContent='NATIVE_RECEIVER_WORKSPACE';};
              RW_Receiver.switchTab=function(tab){var c=document.getElementById('mainContent');if(c)c.textContent='NATIVE_RECEIVER_TAB:'+tab;this.currentTab=tab;};
              RW_Receiver.startRealtime=function(){this.realtimeKey='qa-realtime';};
              RW_Receiver.stopRealtime=function(){this.realtimeKey=null;};
            });
            for(const pair of [['picking','loadPicking'],['loading','loadLoading'],['delivery','loadDelivery'],['returns','loadReturn'],['unloading','loadUnloading'],['settlement','loadSettlement'],['vouchers','loadVouchers'],['inventory','loadInventoryControl']]){
              await page.locator('#warehouseTabs [data-tab="'+pair[0]+'"]').click();
              await page.waitForFunction(n=>document.querySelector('#rw-page-container')?.textContent==='NATIVE_MODULE:'+n,pair[1]);
            }
            await page.locator('#warehouseTabs [data-tab="receiving"]').click();
            await page.waitForFunction(()=>document.querySelector('#mainContent')?.textContent==='NATIVE_RECEIVER_WORKSPACE');
            await page.locator('#rw-module-subnav [data-receiver-tab="completed"]').click();
            await page.waitForFunction(()=>document.querySelector('#mainContent')?.textContent==='NATIVE_RECEIVER_TAB:completed');
            await page.locator('#rw-module-subnav [data-receiver-tab="legacy"]').click();
            await page.waitForFunction(()=>document.querySelector('#rw-page-container')?.textContent==='NATIVE_MODULE:loadReceiving');
            await page.locator('#rw-module-subnav [data-receiver-tab="completed"]').click();
            await page.waitForFunction(()=>document.querySelector('#mainContent')?.textContent==='NATIVE_RECEIVER_WORKSPACE');
            await page.locator('#warehouseTabs [data-tab="account"]').click();
            if(!(await page.locator('body').innerText()).includes('QA Warehouse'))throw new Error('ACCOUNT_IDENTITY_NOT_RENDERED');
            await page.locator('button[title="تسجيل الخروج"]').click();
            if(await page.locator('#loginScreen').isHidden()||!await page.locator('#mainApp').isHidden())throw new Error('LOGOUT_CLEANUP_FAILED');
            if(pageErrors.length)throw new Error('BROWSER_PAGE_ERRORS:'+JSON.stringify(pageErrors));
            console.log('NATIVE_WAREHOUSE_AUTH_DASHBOARD_E2E=PASS');
            console.log('NATIVE_WAREHOUSE_ALL_MODULE_ROUTES_E2E=PASS');
            console.log('NATIVE_WAREHOUSE_RECEIVER_HISTORY_RETURN_E2E=PASS');
            console.log('NATIVE_WAREHOUSE_ACCOUNT_AND_LOGOUT_E2E=PASS');

            const restricted=await context.newPage();
            await prepare(restricted,'تحميل',true,false);
            await restricted.goto(target,{waitUntil:'domcontentloaded'});
            await restricted.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse');
            if(await restricted.locator('#warehouseTabs [data-tab="loading"]').isHidden())throw new Error('ACTIVE_ROLE_TAB_HIDDEN');
            if(await restricted.locator('#warehouseTabs [data-tab="picking"]').isVisible())throw new Error('UNAUTHORIZED_PICKING_TAB_VISIBLE');
            console.log('NATIVE_WAREHOUSE_ACTIVE_ROLE_GATING_E2E=PASS');

            const branchRestricted=await context.newPage();
            await prepare(branchRestricted,'مخزن شامل',false,false);
            await branchRestricted.goto(target,{waitUntil:'domcontentloaded'});
            await branchRestricted.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse');
            if(await branchRestricted.locator('#warehouseTabs [data-tab="loading"]').isVisible())throw new Error('MAIN_BRANCH_GUARD_BYPASSED');
            if(await branchRestricted.locator('#warehouseTabs [data-tab="receiving"]').isHidden())throw new Error('SCOPED_RECEIVING_UNEXPECTEDLY_HIDDEN');
            console.log('NATIVE_WAREHOUSE_MAIN_BRANCH_VS_SCOPED_BRANCH_GATING_E2E=PASS');

            const denied=await context.newPage();
            await prepare(denied,'تحميل',true,true);
            await denied.goto(target,{waitUntil:'domcontentloaded'});
            await denied.waitForFunction(()=>document.querySelector('#loginMsg')?.textContent.includes('WAREHOUSE_PERMISSION_REQUIRED'));
            if(await denied.locator('iframe').count()!==0)throw new Error('UNAUTHORIZED_HUB_CREATED_FRAME');
            console.log('NATIVE_WAREHOUSE_UNAUTHORIZED_SNAPSHOT_FAIL_CLOSED_E2E=PASS');
            await browser.close();
          })().catch(e=>{console.error('NATIVE_WAREHOUSE_E2E_FAILURE='+e.message);process.exit(1);});
          NODE

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawaea-native-warehouse-smoke
          path: /tmp/rawaea-native-warehouse.log
          if-no-files-found: ignore
