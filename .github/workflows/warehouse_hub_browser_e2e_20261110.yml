            await page.waitForFunction(()=>document.querySelector('#rw-native-root-vouchers #wsToSearch')&&document.querySelector('#rw-native-root-vouchers #wsFromSearch'));
            const fixedDestination=await page.locator('#rw-native-root-vouchers #wsToSearch').inputValue();
            if(!fixedDestination.includes('BR-01'))throw new Error('BRANCH_RECEIPT_DESTINATION_NOT_FIXED:'+fixedDestination);
            await page.locator('#rw-native-root-vouchers #wsFromSearch').fill('BR-02');
            await page.waitForFunction(()=>document.querySelector('#rw-native-root-vouchers #wsFromMenu')?.innerText.includes('BR-02'));
            const sourceOptions=await page.locator('#rw-native-root-vouchers #wsFromMenu').innerText();
            if(!sourceOptions.includes('فرع اختبار ثانٍ'))throw new Error('BRANCH_RECEIPT_SOURCE_BRANCH_SEARCH_MISSING:'+sourceOptions);
            await page.locator('#rw-native-root-vouchers #wsFromMenu .smart-row').filter({hasText:'فرع اختبار ثانٍ'}).click();
            const sourceId=await page.locator('#rw-native-root-vouchers #wsFrom').inputValue();
            if(sourceId!=='00000000-0000-4000-8000-000000000002')throw new Error('BRANCH_RECEIPT_ALL_BRANCH_SOURCE_SELECTION_FAILED:'+sourceId);
            const selectedDestination=await page.locator('#rw-native-root-vouchers #wsTo').inputValue();
            if(selectedDestination!=='00000000-0000-4000-8000-000000000001')throw new Error('BRANCH_RECEIPT_DESTINATION_ID_CHANGED:'+selectedDestination);
            await page.locator('#rw-native-root-vouchers #wsRef').fill('QA-BR-RECEIPT-REQUEST-01');
            await page.evaluate(()=>{
              const app=window.RW_NATIVE_APPS.vouchers;
              app.cart=[{id:'qa-item',code:'QA-001',name:'صنف اختبار',unit:'حبة',qty:3}];
              app.renderCart();
            });
            await page.locator('#rw-native-root-vouchers button[onclick*="vouchers.submit()"]').first().click();
            await page.waitForFunction(()=>window.__qaVoucherCalls?.some(x=>x.payload?.action==='request-branch-receipt'));
            const requestPayload=await page.evaluate(()=>window.__qaVoucherCalls.find(x=>x.payload?.action==='request-branch-receipt')?.payload||null);
            if(!requestPayload||requestPayload.fromId!=='00000000-0000-4000-8000-000000000002'||requestPayload.reference!=='QA-BR-RECEIPT-REQUEST-01'||!requestPayload.operation_id||requestPayload.items?.length!==1||requestPayload.items[0].itemCode!=='QA-001'||requestPayload.items[0].qty!==3)throw new Error('BRANCH_RECEIPT_REQUEST_API_CONTRACT_INVALID:'+JSON.stringify(requestPayload));
            console.log('WAREHOUSE_BRANCH_RECEIPT_FIXED_DESTINATION_ALL_SOURCES_REQUEST_API=PASS');

            await page.evaluate(()=>{
              const app=window.RW_NATIVE_APPS.vouchers;
              app.vouchers=[
                {voucher_code:'QA-RECEIPT-01',type:'Transfer',request_origin:'WarehouseBranchReceipt',status:'Draft',reference:'طلب فرع اختبار',from_type:'Branch',from_id:'00000000-0000-4000-8000-000000000002',to_type:'Branch',to_id:'00000000-0000-4000-8000-000000000001',receiver_user_id:'qa-user',created_by:'qa@rawaea.invalid',voucher_date:'2026-11-10',created_at:'2026-11-10T10:00:00Z',notes:'طلب استلام اختبار'},
                {voucher_code:'QA-TRANSFER-01',type:'Transfer',request_origin:null,status:'Draft',reference:'تحويل فرع اختبار',from_type:'Branch',from_id:'00000000-0000-4000-8000-000000000001',to_type:'Branch',to_id:'00000000-0000-4000-8000-000000000002',created_by:'qa@rawaea.invalid',voucher_date:'2026-11-10',created_at:'2026-11-10T09:00:00Z',notes:'تحويل عادي'}
              ];
              app.tabName='pending';
              app.renderList('pending');
            });
            const receiptActions=await page.evaluate(()=>{
              const app=window.RW_NATIVE_APPS.vouchers;
              const row=app.vouchers.find(v=>v.voucher_code==='QA-RECEIPT-01');
              const requesterAction=app.actionFor(row);
              const originalUser=app.user;
              app.user={...originalUser,id:'qa-source-user',email:'source@rawaea.invalid',default_branch_id:null,allowed_branch_ids:['BR-02'],permissions:['warehouse'],role:'أمين مخزن',activeWarehouseRole:'مخزن شامل',active_warehouse_role:'مخزن شامل'};
              const sourceAction=app.actionFor(row);
              app.user={...originalUser,role:'أمين مخزن',activeWarehouseRole:'مخزن شامل',active_warehouse_role:'مخزن شامل'};
              const standardTransferReceiveAction=app.actionFor({
                voucher_code:'QA-TRANSFER-SENT-FULL-ROLE',type:'Transfer',request_origin:null,status:'Sent',
                receiver_user_id:originalUser.id,from_type:'Branch',from_id:'00000000-0000-4000-8000-000000000002',
                to_type:'Branch',to_id:'00000000-0000-4000-8000-000000000001',created_by:'source@rawaea.invalid'
              });
              app.user=originalUser;
              return {requesterAction,sourceAction,standardTransferReceiveAction};
            });
            if(receiptActions.requesterAction!=='request'||receiptActions.sourceAction!=='send-request')throw new Error('BRANCH_RECEIPT_REQUESTER_SOURCE_ACTION_SPLIT_INVALID:'+JSON.stringify(receiptActions));
            if(receiptActions.standardTransferReceiveAction!=='receive')throw new Error('UNIFIED_WAREHOUSE_STANDARD_TRANSFER_RECEIVE_ACTION_MISSING:'+JSON.stringify(receiptActions));
            console.log('WAREHOUSE_BRANCH_RECEIPT_REQUESTER_AND_SOURCE_BRANCH_ACTIONS=PASS');
            console.log('WAREHOUSE_FULL_ROLE_STANDARD_TRANSFER_RECEIVE_ACTION=PASS');
            await page.locator('#rw-native-root-vouchers #listSearch').fill('استلام من مخزن فرع');
            await page.waitForFunction(()=>document.querySelector('#rw-native-root-vouchers #listCount')?.textContent==='1');
            await page.locator('#rw-native-root-vouchers #listSearch').fill('');
            await page.locator('#rw-native-root-vouchers #listType').selectOption('BranchReceipt');
            await page.waitForFunction(()=>document.querySelector('#rw-native-root-vouchers #listCount')?.textContent==='1');
            await page.locator('#rw-native-root-vouchers #listType').selectOption('Transfer');
            await page.waitForFunction(()=>document.querySelector('#rw-native-root-vouchers #listCount')?.textContent==='1');
            console.log('WAREHOUSE_BRANCH_RECEIPT_SEARCH_AND_TYPE_FILTER_SEPARATION=PASS');

            await page.locator('#warehouseTabs [data-tab="account"]').click();
            if(!(await page.locator('#warehouseDashboard').innerText()).includes('QA Warehouse'))throw new Error('ACCOUNT_IDENTITY_MISSING');
            await page.locator('button[title="تسجيل الخروج"]').click();
            await page.waitForFunction(()=>document.querySelector('#loginScreen')&&!document.querySelector('#loginScreen').classList.contains('hidden'));
            if(await page.locator('#mainApp').isVisible()||await page.locator('#loginScreen').isHidden())throw new Error('LOGOUT_DID_NOT_CLEAR_HOST_SESSION');
            if(await page.locator('#rw-native-root-picker').count()!==0)throw new Error('LOGOUT_LEFT_NATIVE_MODULE_MOUNTED');
            if(errors.length)throw new Error('BROWSER_PAGE_ERRORS:'+JSON.stringify(errors));
            console.log('WAREHOUSE_ACCOUNT_AND_MODULE_LOGOUT_CLEANUP=PASS');
            await page.evaluate(()=>sessionStorage.removeItem('qa-signed-out'));
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse');
            await page.locator('#warehouseTabs [data-tab="operations"]').click();
            await page.locator('#warehouseDashboard [data-operation="receiving"]').click();
            await page.waitForFunction(()=>document.getElementById('rw-native-root-receiver')?.dataset.rwReady==='true',null,{timeout:12000});
            console.log('WAREHOUSE_LOGOUT_RELOGIN_MODULE_REINITIALIZATION=PASS');

            e2eStage='standalone receiver PO queue, legacy branch scope and completed history';
            const standaloneReceiver=await context.newPage();
            const standaloneReceiverErrors=[];
            standaloneReceiver.on('pageerror',e=>standaloneReceiverErrors.push(String(e.message||e)));
            await prepare(standaloneReceiver,'استلام',true,false);
            await standaloneReceiver.goto('http://127.0.0.1:4173/companies/company-1/warehouse/receiver.html',{waitUntil:'domcontentloaded'});
            await standaloneReceiver.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse',null,{timeout:12000});
            await standaloneReceiver.waitForFunction(()=>document.querySelector('#receiverDocumentCards')?.querySelectorAll('.doc-card').length===2,null,{timeout:12000});
            const standalonePendingText=await standaloneReceiver.locator('#receiverDocumentCards').innerText();
            if(!standalonePendingText.includes('QA-PO-001')||!standalonePendingText.includes('QA-QMP-001')||standalonePendingText.includes('QA-PO-RECEIVED-001'))
              throw new Error('STANDALONE_RECEIVER_PENDING_PO_CLASSIFICATION_FAILED:'+standalonePendingText.slice(0,700));
            const scalarBranchScope=await standaloneReceiver.evaluate(async()=>{
              const app=window.App;
              app.currentUser.defaultBranchId=null;
              app.currentUser.allowedBranchIds='BR-01';
              await app.resolveBranchScope();
              return {allowed:app.allowedBranchIds,unrestricted:app.unrestrictedBranchScope};
            });
            if(scalarBranchScope.unrestricted||scalarBranchScope.allowed?.join('|')!=='00000000-0000-4000-8000-000000000001')
              throw new Error('STANDALONE_RECEIVER_LEGACY_SCALAR_BRANCH_SCOPE_FAILED:'+JSON.stringify(scalarBranchScope));
            await standaloneReceiver.evaluate(()=>window.App.switchTab('completed'));
            await standaloneReceiver.waitForFunction(()=>document.querySelector('#receiverHistoryCards')?.querySelectorAll('.card').length===3,null,{timeout:12000});
            const standaloneHistoryText=await standaloneReceiver.locator('#receiverHistoryCards').innerText();
            if(!standaloneHistoryText.includes('QA-PO-001')||!standaloneHistoryText.includes('QA-QMP-001')||!standaloneHistoryText.includes('QA-PO-RECEIVED-001')||!standaloneHistoryText.includes('مورد سوق سريع اختباري'))
              throw new Error('STANDALONE_RECEIVER_COMPLETED_HISTORY_MISSING:'+standaloneHistoryText.slice(0,900));
            await standaloneReceiver.locator('#receiverHistoryCards .card').filter({hasText:'QA-PO-RECEIVED-001'}).locator('[data-action="open-history"]').click();
            await standaloneReceiver.waitForFunction(()=>document.querySelector('#mainContent')?.innerText.includes('رقم العملية: QA-HISTORY-PO-RECEIVED'),null,{timeout:12000});
            const standaloneDetail=await standaloneReceiver.locator('#mainContent').innerText();
            if(!standaloneDetail.includes('مكتمل')||!standaloneDetail.includes('صنف أمر الشراء'))
              throw new Error('STANDALONE_RECEIVER_COMPLETED_DETAIL_INCOMPLETE:'+standaloneDetail.slice(0,700));
            if(standaloneReceiverErrors.length)
              throw new Error('STANDALONE_RECEIVER_BROWSER_ERRORS:'+JSON.stringify(standaloneReceiverErrors));
            await standaloneReceiver.close();
            console.log('WAREHOUSE_STANDALONE_RECEIVER_PO_QUEUE_LEGACY_BRANCH_AND_COMPLETED_HISTORY=PASS');

            const restricted=await context.newPage();
            await prepare(restricted,'تحميل',true,false);
            await restricted.goto(target,{waitUntil:'domcontentloaded'});
            await restricted.waitForFunction(()=>document.querySelector('#loginMsg')?.textContent.includes('الدور المخزني النشط'));
            if(await restricted.locator('#mainApp').isVisible())throw new Error('NON_UNIFIED_ROLE_WAS_ALLOWED');
            console.log('WAREHOUSE_ACTIVE_ROLE_GATE=PASS');

            for(const jobRole of ['أمين مخزن','امين مخزن','مخزني']){
              const aliasPage=await context.newPage();
              await prepare(aliasPage,'مخزن شامل',true,false,jobRole);
              await aliasPage.goto(target,{waitUntil:'domcontentloaded'});
              await aliasPage.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse');
              const accepted=await aliasPage.evaluate(()=>({jobRole:window.App?.user?.role,normalized:window.App?.user?.warehouseJobRole,visible:!document.querySelector('#mainApp')?.classList.contains('hidden')}));
              if(!accepted.normalized||!accepted.visible||accepted.jobRole!==jobRole)throw new Error('WAREHOUSE_EMPLOYEE_ROLE_ALIAS_REJECTED:'+JSON.stringify(accepted));
              await aliasPage.close();
            }
            console.log('WAREHOUSE_EMPLOYEE_ROLE_ALIASES=PASS');

            const branchLimited=await context.newPage();
            await prepare(branchLimited,'مخزن شامل',false,false);
            await branchLimited.goto(target,{waitUntil:'domcontentloaded'});
            await branchLimited.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse');
            await branchLimited.locator('#warehouseTabs [data-tab="operations"]').click();
            for(const key of ['picking','loading','returns','unloading']){
              if(await branchLimited.locator('[data-operation="'+key+'"]').isEnabled())throw new Error('MAIN_BRANCH_GUARD_BYPASSED:'+key);
            }
            if(await branchLimited.locator('[data-operation="receiving"]').isDisabled()||await branchLimited.locator('[data-operation="counting"]').isDisabled())throw new Error('SCOPED_BRANCH_OPERATIONS_HIDDEN');
            console.log('WAREHOUSE_MAIN_VS_SCOPED_BRANCH_GATING=PASS');
            await browser.close();
          })().catch(e=>{console.error('WAREHOUSE_E2E_FAILURE_STAGE='+e2eStage);console.error('WAREHOUSE_E2E_FAILURE='+e.message);console.error('WAREHOUSE_E2E_STACK='+e.stack);process.exit(1);});
          NODE

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawaea-standalone-warehouse-e2e
          path: /tmp/rawaea-warehouse.log
          if-no-files-found: ignore
