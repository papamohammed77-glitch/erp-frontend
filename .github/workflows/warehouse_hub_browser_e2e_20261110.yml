            await page.locator('#warehouseTabs [data-tab="operations"]').click();
            if(await page.locator('#warehouseDashboard [data-operation]').count()!==6)throw new Error('SIX_OPERATION_CARDS_MISSING');
            const operations=['receiving','picking','loading','returns','unloading','counting'];
            const nativeKeys={receiving:'receiver',picking:'picker',loading:'loader',returns:'returns',unloading:'unloader',counting:'counter'};
            for(const key of operations){
              const nativeKey=nativeKeys[key]||key;
              await page.locator('#warehouseDashboard [data-operation="'+key+'"]').click();
              try{await page.waitForFunction(k=>{const map={receiving:'receiver',picking:'picker',loading:'loader',returns:'returns',unloading:'unloader',counting:'counter'};const native=map[k]||k;return document.getElementById('rw-native-root-'+native)?.dataset.rwReady==='true';},key,{timeout:12000});}catch(waitError){const diag=await page.evaluate(k=>{const map={receiving:'receiver',picking:'picker',loading:'loader',returns:'returns',unloading:'unloader',counting:'counter'};const native=map[k]||k,root=document.getElementById('rw-native-root-'+native),app=window.RW_NATIVE_APPS&&window.RW_NATIVE_APPS[native];return{native,root:!!root,rootId:root&&root.id,moduleAttr:root&&root.dataset.rwModule,ready:root&&root.dataset.rwReady,mainHidden:root&&root.querySelector('#mainApp')?.classList.contains('hidden'),loginText:root&&root.querySelector('#loginMsg')?.textContent,app:!!app,appKeys:Object.keys(window.RW_NATIVE_APPS||{}),status:document.querySelector('#rw-module-status')?.textContent,html:root&&root.innerText.slice(0,500)};},key);throw new Error('NATIVE_MODULE_BOOT_FAILED:'+key+':'+JSON.stringify({diag,errors,consoleMessages:consoleMessages.slice(-30),wait:waitError.message}));}
              const state=await page.evaluate(k=>{
                const map={receiving:'receiver',picking:'picker',loading:'loader',returns:'returns',unloading:'unloader',counting:'counter'};
                const native=map[k]||k,root=document.getElementById('rw-native-root-'+native);
                return {exists:!!root,ready:root&&root.dataset.rwReady,childVisible:!!(root&&root.querySelector('#mainApp')&&!root.querySelector('#mainApp').classList.contains('hidden')),accountTab:!!(root&&root.querySelector('#tab-account')),moduleKey:root&&root.dataset.rwModule};
              },key);
              if(!state.exists||state.ready!=='true'||!state.childVisible||state.accountTab||state.moduleKey!==key)throw new Error('NATIVE_WORKSPACE_NOT_READY:'+key+':'+JSON.stringify(state));
              if(key==='picking'){
                const pending=page.locator('#rw-native-root-picker #mainContent');
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-picker #mainContent')?.innerText.includes('مهام متاحة للتحضير'));
                const pendingText=await pending.innerText();
                if(pendingText.includes('فشل تحميل البيانات')||!pendingText.includes('QA Warehouse'))throw new Error('PICKER_PENDING_DATA_RENDER_FAILED:'+pendingText.slice(0,500));
                await page.evaluate(()=>window.RW_NATIVE_APPS.picker.renderAccount());
                const accountText=await pending.innerText();
                if(!accountText.includes('QA Warehouse')||accountText.includes('undefined'))throw new Error('PICKER_SHARED_PROFILE_ACCOUNT_RENDER_FAILED:'+accountText.slice(0,400));
                await page.evaluate(()=>window.RW_NATIVE_APPS.picker.switchTab('pending'));
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-picker #mainContent')?.innerText.includes('مهام متاحة للتحضير'));
                console.log('WAREHOUSE_PICKER_DATA_AND_NORMALIZED_PROFILE_RENDER=PASS');
              }
              if(key==='loading'){
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-loader #mainContent')?.innerText.includes('مهام متاحة للتحميل'));
                const loadingText=await page.locator('#rw-native-root-loader #mainContent').innerText();
                if(loadingText.includes('فشل تحميل البيانات'))throw new Error('LOADER_PENDING_DATA_RENDER_FAILED:'+loadingText.slice(0,400));
                console.log('WAREHOUSE_LOADER_PENDING_DATA_RENDER=PASS');
              }
              if(key==='unloading'){
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-unloader #mainContent')?.innerText.includes('رانشيتات جاهزة للتفريغ'));
                const unloadingText=await page.locator('#rw-native-root-unloader #mainContent').innerText();
                if(unloadingText.includes('فشل تحميل البيانات'))throw new Error('UNLOADER_PENDING_DATA_RENDER_FAILED:'+unloadingText.slice(0,400));
                console.log('WAREHOUSE_UNLOADER_PENDING_DATA_RENDER=PASS');
              }
              if(key==='returns'){
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-returns #mainContent')?.innerText.includes('لا توجد رانشيتات مسلّمة'));
                const returnText=await page.locator('#rw-native-root-returns #mainContent').innerText();
                if(returnText.includes('فشل تحميل البيانات'))throw new Error('RETURNS_PENDING_DATA_RENDER_FAILED:'+returnText.slice(0,400));
                console.log('WAREHOUSE_RETURNS_PENDING_DATA_RENDER=PASS');
              }
              if(key==='counting'){
                const root='#rw-native-root-counter';
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-counter #tab-branch-count'));
                for(const tab of ['branch-count','vehicle-count','general-count']){
                  if(await page.locator(root+' #tab-'+tab).count()!==1)throw new Error('COUNTER_PARENT_TAB_MISSING:'+tab);
                }
                await page.locator(root+' #tab-vehicle-count').click();
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-counter #mainContent')?.innerText.includes('السيارة محل الجرد'));
                await page.locator(root+' #tab-general-count').click();
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-counter #mainContent')?.innerText.includes('الجرد العام غير متاح'));
                await page.locator(root+' #tab-branch-count').click();
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-counter #mainContent')?.innerText.includes('بدء الجرد وتحميل أصناف المخزون'));
                await page.locator(root+' #mainContent button').filter({hasText:'بدء الجرد وتحميل أصناف المخزون'}).click();
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-counter #counted-0'));
                await page.locator(root+' #counted-0').fill('7');
                await page.locator(root+' #mainContent button').filter({hasText:'حفظ الكميات الفعلية'}).click();
                await page.waitForFunction(()=>document.querySelector('#rw-native-root-counter #counted-0')?.value==='7');
                const countOps=await page.evaluate(()=>window.__qaCountCalls||[]);
                for(const op of ['COUNT_CREATE','COUNT_POPULATE','COUNT_GET','COUNT_UPSERT_LINE'])
                  if(!countOps.includes(op))throw new Error('COUNTER_ENGINE_OPERATION_NOT_CALLED:'+op+':'+countOps.join(','));
                console.log('WAREHOUSE_THREE_COUNT_MODES_AND_SESSION_SAVE=PASS');
