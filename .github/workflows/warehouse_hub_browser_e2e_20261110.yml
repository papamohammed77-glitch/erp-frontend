            console.log('WAREHOUSE_SIX_FULL_NATIVE_OPERATION_WORKSPACES=PASS');

            await page.locator('#warehouseTabs [data-tab="vouchers"]').click();
            if(await page.locator('#warehouseDashboard [data-voucher-action]').count()!==5)throw new Error('FIVE_MANUAL_VOUCHER_ACTION_CARDS_MISSING');
            await page.locator('#warehouseDashboard [data-voucher-action="Transfer"]').click();
            await page.waitForFunction(()=>window.RW_NATIVE_APPS?.vouchers?.type==='Transfer');
            const voucherChecks=[
              ['DirectSale','DirectSale'],
              ['TransferReceive','TransferReceive'],
              ['DirectReturn','DirectReturn'],
              ['SupplierReturn','SupplierReturn']
            ];
            for(const [action,expected] of voucherChecks){
              await page.locator('[data-workspace-back]').click();
              await page.locator('#warehouseDashboard [data-voucher-action="'+action+'"]').click();
              if(action==='TransferReceive'){
                await page.waitForFunction(()=>window.RW_NATIVE_APPS?.vouchers?.tabName==='pending');
              }else{
                await page.waitForFunction(v=>window.RW_NATIVE_APPS?.vouchers?.type===v,expected);
              }
            }
            const supplierContract=await page.locator('#rw-native-root-vouchers').innerText();
            if(!supplierContract.includes('عقد')&&!supplierContract.includes('المورد'))throw new Error('SUPPLIER_RETURN_CONTRACT_UI_NOT_PRESENT');
            console.log('WAREHOUSE_FIVE_MANUAL_VOUCHER_ACTIONS=PASS');
            console.log('WAREHOUSE_SUPPLIER_RETURN_SPECIALIZED_CONTRACT=PASS');
            await page.locator('#rw-native-root-vouchers #typeBtn').click();
            await page.locator('#rw-native-root-vouchers #typeMenu button').filter({hasText:'استلام من مخزن فرع'}).click();
            await page.waitForFunction(()=>window.RW_NATIVE_APPS?.vouchers?.type==='BranchReceipt');
            const fixedDestination=await page.locator('#rw-native-root-vouchers #wsToSearch').inputValue();
            if(!fixedDestination.includes('BR-01'))throw new Error('BRANCH_RECEIPT_DESTINATION_NOT_FIXED:'+fixedDestination);
            await page.locator('#rw-native-root-vouchers #wsFromSearch').fill('BR-02');
            await page.waitForFunction(()=>document.querySelector('#rw-native-root-vouchers #wsFromMenu')?.innerText.includes('BR-02'));
            const sourceOptions=await page.locator('#rw-native-root-vouchers #wsFromMenu').innerText();
            if(!sourceOptions.includes('فرع اختبار ثانٍ'))throw new Error('BRANCH_RECEIPT_SOURCE_BRANCH_SEARCH_MISSING:'+sourceOptions);
            console.log('WAREHOUSE_BRANCH_RECEIPT_FIXED_DESTINATION_ALL_SOURCE_BRANCHES=PASS');

            await page.evaluate(()=>{
              const app=window.RW_NATIVE_APPS.vouchers;
              app.vouchers=[
                {voucher_code:'QA-RECEIPT-01',type:'Transfer',request_origin:'WarehouseBranchReceipt',status:'Draft',reference:'طلب فرع اختبار',from_type:'Branch',from_id:'00000000-0000-4000-8000-000000000002',to_type:'Branch',to_id:'00000000-0000-4000-8000-000000000001',receiver_user_id:'qa-user',created_by:'qa@rawaea.invalid',voucher_date:'2026-11-10',created_at:'2026-11-10T10:00:00Z',notes:'طلب استلام اختبار'},
                {voucher_code:'QA-TRANSFER-01',type:'Transfer',request_origin:null,status:'Draft',reference:'تحويل فرع اختبار',from_type:'Branch',from_id:'00000000-0000-4000-8000-000000000001',to_type:'Branch',to_id:'00000000-0000-4000-8000-000000000002',created_by:'qa@rawaea.invalid',voucher_date:'2026-11-10',created_at:'2026-11-10T09:00:00Z',notes:'تحويل عادي'}
              ];
              app.tabName='pending';
              app.renderList('pending');
            });
            await page.locator('#rw-native-root-vouchers #listSearch').fill('استلام من مخزن فرع');
            await page.waitForFunction(()=>document.querySelector('#rw-native-root-vouchers #listCount')?.textContent==='1');
            await page.locator('#rw-native-root-vouchers #listSearch').fill('');
            await page.locator('#rw-native-root-vouchers #listType').selectOption('BranchReceipt');
            await page.waitForFunction(()=>document.querySelector('#rw-native-root-vouchers #listCount')?.textContent==='1');
            await page.locator('#rw-native-root-vouchers #listType').selectOption('Transfer');
            await page.waitForFunction(()=>document.querySelector('#rw-native-root-vouchers #listCount')?.textContent==='1');
            console.log('WAREHOUSE_BRANCH_RECEIPT_SEARCH_AND_TYPE_FILTER_SEPARATION=PASS');

            await page.locator('#warehouseTabs [data-tab="account"]').click();
            if(!(await page.locator('#warehouseDashboard').innerText()).includes('QA Warehouse'))throw new Error('ACCOUNT_IDENTITY_MISSING');
            await page.locator('button[title="تسجيل الخروج"]').click();
            await page.waitForFunction(()=>document.querySelector('#loginScreen')&&!document.querySelector('#loginScreen').classList.contains('hidden'));
            if(await page.locator('#mainApp').isVisible()||await page.locator('#loginScreen').isHidden())throw new Error('LOGOUT_DID_NOT_CLEAR_HOST_SESSION');
            if(await page.locator('#rw-native-root-picker').count()!==0)throw new Error('LOGOUT_LEFT_NATIVE_MODULE_MOUNTED');
            if(errors.length)throw new Error('BROWSER_PAGE_ERRORS:'+JSON.stringify(errors));
            console.log('WAREHOUSE_ACCOUNT_AND_MODULE_LOGOUT_CLEANUP=PASS');
            await page.evaluate(()=>sessionStorage.removeItem('qa-signed-out'));
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse');
            await page.locator('#warehouseTabs [data-tab="operations"]').click();
            await page.locator('#warehouseDashboard [data-operation="receiving"]').click();
            await page.waitForFunction(()=>document.getElementById('rw-native-root-receiver')?.dataset.rwReady==='true',null,{timeout:12000});
            console.log('WAREHOUSE_LOGOUT_RELOGIN_MODULE_REINITIALIZATION=PASS');

            const restricted=await context.newPage();
            await prepare(restricted,'تحميل',true,false);
            await restricted.goto(target,{waitUntil:'domcontentloaded'});
            await restricted.waitForFunction(()=>document.querySelector('#loginMsg')?.textContent.includes('الدور المخزني النشط'));
            if(await restricted.locator('#mainApp').isVisible())throw new Error('NON_UNIFIED_ROLE_WAS_ALLOWED');
            console.log('WAREHOUSE_ACTIVE_ROLE_GATE=PASS');

            for(const jobRole of ['أمين مخزن','امين مخزن','مخزني']){
              const aliasPage=await context.newPage();
              await prepare(aliasPage,'مخزن شامل',true,false,jobRole);
              await aliasPage.goto(target,{waitUntil:'domcontentloaded'});
              await aliasPage.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse');
              const accepted=await aliasPage.evaluate(()=>({jobRole:window.App?.user?.role,normalized:window.App?.user?.warehouseJobRole,visible:!document.querySelector('#mainApp')?.classList.contains('hidden')}));
              if(!accepted.normalized||!accepted.visible||accepted.jobRole!==jobRole)throw new Error('WAREHOUSE_EMPLOYEE_ROLE_ALIAS_REJECTED:'+JSON.stringify(accepted));
              await aliasPage.close();
            }
            console.log('WAREHOUSE_EMPLOYEE_ROLE_ALIASES=PASS');

            const branchLimited=await context.newPage();
            await prepare(branchLimited,'مخزن شامل',false,false);
            await branchLimited.goto(target,{waitUntil:'domcontentloaded'});
            await branchLimited.waitForFunction(()=>document.querySelector('#headerUserName')?.textContent==='QA Warehouse');
            await branchLimited.locator('#warehouseTabs [data-tab="operations"]').click();
            for(const key of ['picking','loading','returns','unloading']){
              if(await branchLimited.locator('[data-operation="'+key+'"]').isEnabled())throw new Error('MAIN_BRANCH_GUARD_BYPASSED:'+key);
            }
            if(await branchLimited.locator('[data-operation="receiving"]').isDisabled()||await branchLimited.locator('[data-operation="counting"]').isDisabled())throw new Error('SCOPED_BRANCH_OPERATIONS_HIDDEN');
            console.log('WAREHOUSE_MAIN_VS_SCOPED_BRANCH_GATING=PASS');
            await browser.close();
          })().catch(e=>{console.error('WAREHOUSE_E2E_FAILURE='+e.message);process.exit(1);});
