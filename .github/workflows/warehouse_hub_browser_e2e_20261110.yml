name: RAWAEA — Standalone Unified Warehouse E2E

on:
  push:
    branches: [main]
    paths:
      - 'companies/company-1/warehouse/warehouse.html'
      - 'companies/company-1/warehouse/receiver.html'
      - 'companies/company-1/warehouse/picker.html'
      - 'companies/company-1/warehouse/loader.html'
      - 'companies/company-1/warehouse/returns.html'
      - 'companies/company-1/warehouse/unloader.html'
      - 'companies/company-1/warehouse/counter.html'
      - 'companies/company-1/warehouse/vouchers.html'
      - 'companies/company-1/core.js'
      - 'supabase/functions/create-stock-voucher/index.ts'
      - 'supabase/migrations/*warehouse_branch_receipt*'
      - 'supabase/migrations/*inventory_count_role_and_company_isolation*'
      - '.github/workflows/warehouse_hub_browser_e2e_20261110.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  standalone-warehouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Static source and module contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('companies/company-1/warehouse/warehouse.html','utf8');
          const countMigration=fs.readFileSync('supabase/migrations/20261110212000_inventory_count_role_and_company_isolation.sql','utf8');
          const inline=[...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)].filter(x=>!/\bsrc\s*=/.test(x[1]||''));
          if(inline.length!==1) throw new Error('HOST_INLINE_SCRIPT_COUNT:'+inline.length);
          new Function(inline[0][2]);
          const nav=html.match(/<nav id="warehouseTabs"[^>]*>([\s\S]*?)<\/nav>/);
          if(!nav) throw new Error('FOUR_TAB_NAV_MISSING');
          const tabs=[...nav[1].matchAll(/data-tab="([^"]+)"/g)].map(x=>x[1]);
          const expected=['today','operations','vouchers','account'];
          if(tabs.join('|')!==expected.join('|')) throw new Error('TOP_LEVEL_TAB_CONTRACT:'+tabs.join('|'));
          if(/<iframe\b/i.test(html)) throw new Error('IFRAME_IS_FORBIDDEN');
          if(/(?:href|src)=["'][^"']*(?:receiver|picker|loader|returns|unloader|counter|vouchers)\.html/i.test(html)) throw new Error('CHILD_APP_LINK_IS_FORBIDDEN');
          if((html.match(/src="\.\.\/core\.js"/g)||[]).length!==1) throw new Error('CORE_MUST_LOAD_ONCE');
          for(const marker of ['RW_SHARED_SUPABASE','get_warehouse_hub_snapshot','active_warehouse_role','مخزن شامل','data-operation','data-voucher-action','TransferReceive','openSupplierReturnContract','saveSupplierReturnContract'])
            if(!html.includes(marker)) throw new Error('HOST_CONTRACT_MARKER_MISSING:'+marker);
          for(const pair of ['receiving:\'receiver\'','picking:\'picker\'','loading:\'loader\'','returns:\'returns\'','unloading:\'unloader\'','counting:\'counter\'','vouchers:\'vouchers\''])
            if(!html.includes(pair)) throw new Error('OPERATION_NATIVE_MODULE_ALIAS_MISSING:'+pair);
          const cssScopeAliases={receiver:'receiving',picker:'picking',loader:'loading',returns:'returns',unloader:'unloading',counter:'counting',vouchers:'vouchers'};
          for(const [nativeKey,operationKey] of Object.entries(cssScopeAliases)){
            const selectorPrefix='.rw-native-module[data-rw-module=\'';
            const scopedSelector=selectorPrefix+operationKey+'\']';
            if(!html.includes(scopedSelector)) throw new Error('NATIVE_MODULE_CSS_SCOPE_MISSING:'+operationKey);
            if(nativeKey!==operationKey){
              const staleSelector=selectorPrefix+nativeKey+'\']';
              if(html.includes(staleSelector)) throw new Error('NATIVE_MODULE_CSS_SCOPE_KEY_MISMATCH:'+nativeKey+'->'+operationKey);
            }
          }
          if(!html.includes('window.RW_SHARED_SUPABASE=supabase')) throw new Error('SHARED_SUPABASE_CLIENT_EXPORT_MISSING');
          if(!html.includes('src="../core.js"')) throw new Error('SHARED_CORE_SCRIPT_MISSING');
          if(!html.includes('RW_NATIVE_APPS&&window.RW_NATIVE_APPS[self.moduleKey(key)]')) throw new Error('NATIVE_MODULE_LOGOUT_CLEANUP_ALIAS_MISSING');
          const bundleMatch=html.match(/var RW_NATIVE_BUNDLES=(\{[\s\S]*?\});\nvar App=/);
          if(!bundleMatch) throw new Error('NATIVE_MODULE_BUNDLE_OBJECT_MISSING');
          const bundles=JSON.parse(bundleMatch[1]);
          const keys=['receiver','picker','loader','returns','unloader','counter','vouchers'];
          if(Object.keys(bundles).sort().join('|')!==keys.slice().sort().join('|')) throw new Error('SEVEN_NATIVE_MODULES_REQUIRED');
          for(const key of keys){
            const b=bundles[key];
            const authInitCount=b.script.split('RW_Auth.init').length-1;
            if(authInitCount!==1) throw new Error('MODULE_SHARED_AUTH_INIT_COUNT:'+key+':'+authInitCount);
            if(b.script.includes('createClient(')) throw new Error('MODULE_CREATED_DUPLICATE_SUPABASE_CLIENT:'+key);
            if(!b.script.includes('مخزن شامل')) throw new Error('MODULE_UNIFIED_WAREHOUSE_ROLE_MISSING:'+key);
            if(!b.html.includes('id="mainApp"')) throw new Error('MODULE_MARKUP_MISSING:'+key);
            if(!b.script.includes('window.RW_NATIVE_APP_'+key+'.init()')) throw new Error('MODULE_BOOT_MISSING:'+key);if(b.script.includes('moduleApp.')) throw new Error('UNSCOPED_DYNAMIC_MODULE_ACTION:'+key);
            if(!b.script.startsWith('(function(){')||!b.script.includes('var moduleRoot=window.document.getElementById(')) throw new Error('NATIVE_ROOT_BOOTSTRAP_ORDER_INVALID:'+key);
            new Function(b.script);
            if(/<iframe\b/i.test(b.html)) throw new Error('MODULE_IFRAME_FOUND:'+key);
            if(/(?:onclick|oninput|onchange)="[^"]*\bApp\./.test(b.html)) throw new Error('UNSCOPED_INLINE_APP_HANDLER:'+key);
          }
          if(!bundles.picker.script.includes("RW_Auth.init")) throw new Error('PICKER_MUST_USE_SHARED_AUTH');
          if(!bundles.picker.script.includes('RW_SHARED_SUPABASE')) throw new Error('PICKER_MUST_USE_SHARED_CLIENT');
          for(const marker of ['start-picking','complete-picking','reopen-picking','cancel-picking'])
            if(!bundles.picker.script.includes(marker)) throw new Error('PICKER_WORKFLOW_MISSING:'+marker);
          if(bundles.picker.script.includes('this.currentUser.user_metadata.name')) throw new Error('PICKER_USES_NONEXISTENT_SHARED_USER_METADATA');
          if(!bundles.picker.script.includes('var userName = this.currentUser.name')) throw new Error('PICKER_SHARED_PROFILE_NAME_MISSING');
          if(!bundles.loader.script.includes('r[0].error') || !bundles.loader.script.includes('r[1].error')) throw new Error('LOADER_PENDING_RESULTS_MUST_CHECK_SUPABASE_ERRORS');
          if(!bundles.unloader.script.includes('Unloader runsheets query failed:') || !bundles.unloader.script.includes('Unloader completed vouchers query failed:')) throw new Error('UNLOADER_RESULT_ERRORS_NOT_HANDLED');
          if(!bundles.counter.script.includes('[RAWAEA Counter] completed history failed')) throw new Error('COUNTER_HISTORY_RESULT_ERRORS_NOT_HANDLED');
          for(const marker of ['request-branch-receipt','warehouseHomeBranch','send-request','exactReceiver)return \'request\''])
            if(!bundles.vouchers.script.includes(marker)) throw new Error('BRANCH_RECEIPT_REQUEST_FLOW_MISSING:'+marker);
          if(!bundles.vouchers.html.includes('استلام من مخزن فرع')) throw new Error('BRANCH_RECEIPT_MENU_MISSING');
          for(const tab of ['branch-count','vehicle-count','general-count'])
            if(!bundles.counter.html.includes('tab-'+tab)) throw new Error('PARENT_COUNT_TAB_MISSING:'+tab);
          for(const marker of ['COUNT_CREATE','COUNT_POPULATE','COUNT_GET','COUNT_UPSERT_LINE','COUNT_REFRESH','COUNT_FINALIZE','COUNT_CANCEL','allBranchesAllowed()'])
            if(!bundles.counter.script.includes(marker)) throw new Error('COUNT_ENGINE_WORKFLOW_MISSING:'+marker);
          if(bundles.counter.script.includes('LEGACY-COUNT:')) throw new Error('LEGACY_NONATOMIC_COUNT_CONTRACT_REMAINS');
          if(!bundles.counter.script.includes('countPageSize:100')) throw new Error('COUNT_SESSION_PAGINATION_MISSING');
          if(!bundles.returns.script.includes('[RW_Returns] completed runsheets query failed:')) throw new Error('RETURNS_COMPLETED_RESULT_ERRORS_NOT_HANDLED');
          if(!bundles.vouchers.script.includes('if(parts[1]&&parts[1].error)throw parts[1].error;') || !bundles.vouchers.script.includes('if(parts[2]&&parts[2].error)throw parts[2].error;')) throw new Error('SUPPLIER_RETURN_PURCHASE_REFERENCES_ERRORS_NOT_HANDLED');
          if(!bundles.vouchers.script.includes('existing supplier return contract load failed:')) throw new Error('SUPPLIER_RETURN_EXISTING_CONTRACT_READ_NOT_FAIL_CLOSED');
          for(const marker of ['start-loading','complete-loading','reopen-loading','loaderVehicleSelect'])
            if(!bundles.loader.script.includes(marker)) throw new Error('LOADER_WORKFLOW_MISSING:'+marker);
          for(const marker of ['start-return','complete-return','report-discrepancy','reopen-return','returnReasons'])
            if(!bundles.returns.script.includes(marker)) throw new Error('RETURNS_WORKFLOW_MISSING:'+marker);
          for(const marker of ['get_quick_market_receiving_queue_atomic','receive-purchase','receiptFingerprint','operation_id'])
            if(!bundles.receiver.script.includes(marker)) throw new Error('RECEIVING_WORKFLOW_MISSING:'+marker);
          if(!bundles.unloader.script.includes('unload-runsheet')) throw new Error('UNLOADING_WORKFLOW_MISSING');
          if(!bundles.counter.script.includes('save-inventory-count')) throw new Error('COUNTING_WORKFLOW_MISSING');
          if((countMigration.match(/COALESCE\(v_actor\.active_warehouse_role,''\) IN \('مخزن شامل','جرد'\)/g)||[]).length!==4) throw new Error('COUNT_ROLE_ENGINE_GUARDS_MISSING');
          for(const marker of ['AND i.company_id=p_company_id','WHERE i.company_id=p_company_id AND i.item_code=v_item_code',"COALESCE(v.status,'Active')='Active'"])
            if(!countMigration.includes(marker)) throw new Error('COUNT_TENANT_OR_VEHICLE_FENCE_MISSING:'+marker);
          if(!bundles.vouchers.script.includes("labels[v.type==='Transfer'&&v.request_origin==='WarehouseBranchReceipt'?'BranchReceipt':v.type]")) throw new Error('BRANCH_RECEIPT_SEARCH_LABEL_MISSING');
          for(const marker of ['create-stock-voucher','receive-stock-voucher','inventory_voucher_report','supplierReturnFingerprint','openSupplierReturnContract','saveSupplierReturnContract','save_supplier_return_contract'])
            if(!bundles.vouchers.script.includes(marker)) throw new Error('VOUCHER_WORKFLOW_MISSING:'+marker);
          console.log('WAREHOUSE_FOUR_TAB_CONTRACT=PASS');
          console.log('WAREHOUSE_NO_IFRAME_OR_CHILD_NAVIGATION=PASS');
          console.log('WAREHOUSE_SEVEN_NATIVE_OPERATION_BUNDLES=PASS');
          console.log('WAREHOUSE_NATIVE_MODULE_CSS_SCOPE=PASS');
          console.log('WAREHOUSE_ALL_SEVEN_MODULES_SHARED_AUTH_NO_DUPLICATE_CLIENT=PASS');
          console.log('WAREHOUSE_SHARED_CORE_SESSION=PASS');
          console.log('WAREHOUSE_PICKER_AUTH_ALIGNMENT=PASS');
          console.log('WAREHOUSE_FULL_NATIVE_WORKFLOWS_PRESERVED=PASS');
          console.log('WAREHOUSE_SUPPLIER_RETURN_CONTRACT_PRESERVED=PASS');
          NODE

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Start local source server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rawaea-warehouse.log 2>&1 &
          echo $! >/tmp/rawaea-warehouse.pid
          for n in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/companies/company-1/warehouse/warehouse.html >/dev/null &&
            curl -fsS http://127.0.0.1:4173/companies/company-1/core.js >/dev/null &&
            curl -fsS http://127.0.0.1:4173/companies/company-1/register-sw.js >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rawaea-warehouse.log
          exit 1

      - name: Browser E2E — shared identity, seven workspaces and five voucher actions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import {chromium} from 'playwright';
          const target='http://127.0.0.1:4173/companies/company-1/warehouse/warehouse.html';
          const profile={
            id:'qa-user',auth_id:'qa-auth',company_id:'qa-company',
            email:'qa@rawaea.invalid',name:'QA Warehouse',role:'أمين مخزن',
            status:'Active',isOwner:false,permissions:['warehouse'],
            activeWarehouseRole:'مخزن شامل',active_warehouse_role:'مخزن شامل',
            default_branch_id:'00000000-0000-4000-8000-000000000001',defaultBranchId:'00000000-0000-4000-8000-000000000001',
            allowed_branch_ids:['00000000-0000-4000-8000-000000000001'],allowedBranchIds:['00000000-0000-4000-8000-000000000001']
          };
          function mockCore(role='مخزن شامل',mainAccess=true,deny=false,jobRole='أمين مخزن'){
            const user={...profile,role:jobRole,activeWarehouseRole:role,active_warehouse_role:role};
            const snapshot={
              success:true,generated_at:'2026-11-10T00:00:00Z',
              user:{id:user.id,company_id:user.company_id,role:user.role,active_warehouse_role:role,is_owner:false},
              branch_scope:[{id:'00000000-0000-4000-8000-000000000001',code:'BR-01',name:'فرع الاختبار'}],
              main_branch_access:mainAccess,
              metrics:{pending_purchase_orders:2,active_runsheets:3,loading_runsheets:1,loaded_runsheets:1,returning_runsheets:1,pending_vouchers:2,open_counts:1}
            };
            return [
              "var SUPABASE_URL='https://qa.invalid';var SUPABASE_KEY='qa-anon-key';",
              "var __qaProfile="+JSON.stringify(user)+";",
              "var __qaUser=sessionStorage.getItem('qa-signed-out')==='1'?null:__qaProfile;",
              "var __qaSnapshot="+JSON.stringify(snapshot)+";",
              "var __qaDeny="+JSON.stringify(deny)+";",
              "function __qaRows(table){if(table==='users')return [__qaUser];if(table==='app_settings')return [{main_branch_id:'00000000-0000-4000-8000-000000000001',currency:'EGP'}];if(table==='branches')return [{id:'00000000-0000-4000-8000-000000000001',company_id:'qa-company',branch_code:'BR-01',name:'فرع الاختبار',is_active:true},{id:'00000000-0000-4000-8000-000000000002',company_id:'qa-company',branch_code:'BR-02',name:'فرع اختبار ثانٍ',is_active:true}];if(table==='vehicles')return [{id:'qa-vehicle',company_id:'qa-company',vehicle_code:'VAN-QA',license_plate:'QA-001',model:'QA',mobile_branch_id:'00000000-0000-4000-8000-000000000001',mobile_stock_enabled:true,status:'Active'}];if(table==='suppliers')return [{id:'qa-supplier',company_id:'qa-company',name:'مورد اختبار',address:'عنوان اختبار',is_active:true}];return [];}",
              "function __qaQuery(table){var q={};['select','eq','neq','not','in','order','limit','range','gte','lte','gt','lt','or','is','filter','match','insert','update','upsert','delete'].forEach(function(k){q[k]=function(){return q;};});q.then=function(a,b){return Promise.resolve({data:__qaRows(table),error:null}).then(a,b);};q.maybeSingle=function(){var rows=__qaRows(table);return Promise.resolve({data:rows[0]||null,error:null});};q.single=q.maybeSingle;return q;}",
              "var supabase={auth:{getSession:function(){return Promise.resolve({data:{session:{user:__qaUser,access_token:'qa-token'}}});},getUser:function(){return Promise.resolve({data:{user:{id:'qa-auth',email:__qaUser.email,user_metadata:{}}}});},signOut:function(){return Promise.resolve({error:null});},signInWithPassword:function(){return Promise.resolve({data:{user:__qaUser},error:null});},onAuthStateChange:function(){return {data:{subscription:{unsubscribe:function(){}}}};}},from:function(t){return __qaQuery(t);},rpc:function(name,args){if(name==='get_warehouse_hub_snapshot')return Promise.resolve(__qaDeny?{data:null,error:{message:'WAREHOUSE_PERMISSION_REQUIRED'}}:{data:__qaSnapshot,error:null});if(name==='inventory_voucher_report')return Promise.resolve({data:args&&args.p_operation==='SUMMARY'?{summary:{statuses:[]}}:{rows:[],total:0},error:null});if(name==='inventory_control')return Promise.resolve({data:{success:true,rows:[],counts:[],vouchers:[]},error:null});return Promise.resolve({data:{success:true,rows:[],invoices:[],summary:{statuses:[]}},error:null});},channel:function(){var c={on:function(){return c;},subscribe:function(cb){if(cb)cb('SUBSCRIBED');return c;}};return c;},removeChannel:function(){return Promise.resolve();},storage:{from:function(){return {createSignedUrl:function(){return Promise.resolve({data:{signedUrl:'https://qa.invalid/file'},error:null});},upload:function(){return Promise.resolve({data:{path:'qa'},error:null});}};}}};",
              "var RW_Auth={init:function(cb){cb(__qaUser,__qaUser?null:'NO_SESSION');},getUser:function(){return __qaUser;},getToken:function(){return 'qa-token';},doLogin:function(e,p,cb){sessionStorage.removeItem('qa-signed-out');__qaUser=__qaProfile;if(cb)cb(__qaUser,null);},doLogout:function(cb){sessionStorage.setItem('qa-signed-out','1');__qaUser=null;supabase.auth.signOut().then(function(){if(cb)cb(true);});}};",
              "var __ui={byId:function(id){return document.getElementById(id);},safeHTML:function(el,h){if(el)el.innerHTML=h;},safeText:function(el,t){if(el)el.textContent=String(t==null?'':t);},toast:function(){},showLoader:function(){},hideLoader:function(){},showError:function(){},showSkeleton:function(id,n){var e=document.getElementById(id);if(e)e.innerHTML='جارٍ التحميل...';},showEmptyState:function(){},formatCurrency:function(v){return String(v||0);},formatNumber:function(v){return String(v||0);},updateConnectionStatus:function(){},showConfirm:function(m,cb){if(cb)cb();}};",
              "var RW_UI=new Proxy(__ui,{get:function(t,p){if(p in t)return t[p];return function(){};}});",
              "var __qaCountDetails=[{id:'qa-line',branch_id:'00000000-0000-4000-8000-000000000001',branch_code:'BR-01',branch_name:'فرع الاختبار',item_id:'qa-item',item_code:'QA-001',item_name:'صنف اختبار',unit:'حبة',system_qty:4,counted_qty:null,variance_qty:0,adjusted:false}];var __qaCountCalls=[];var RW_API={call:function(name,payload,cb){if(name==='save-inventory-count'){var op=payload.operation;__qaCountCalls.push(op);if(op==='COUNT_CREATE'){if(cb)cb({success:true,count_id:'qa-count',status:'InProgress'});return;}if(op==='COUNT_POPULATE'){if(cb)cb({success:true,added_lines:1});return;}if(op==='COUNT_GET'){if(cb)cb({success:true,count:{id:'qa-count',type:'branch',branch_id:'00000000-0000-4000-8000-000000000001',reference:'جرد اختبار',count_date:'2026-11-10',status:'InProgress'},details:__qaCountDetails},null);return;}if(op==='COUNT_UPSERT_LINE'){__qaCountDetails[0].counted_qty=payload.payload.counted_qty;__qaCountDetails[0].variance_qty=payload.payload.counted_qty-4;if(cb)cb({success:true},null);return;}if(cb)cb({success:true},null);return;}if(cb)cb({success:true,rows:[]},null);}};",
              "var RW_Realtime={start:function(){return 'qa-channel';},stop:function(){},subscribe:function(){return 'qa-channel';}};",
              "var RW_ImageCache={loadAll:function(){return Promise.resolve();},clear:function(){},get:function(){return null;},set:function(){}};",
              "var RW_SW={register:function(){return Promise.resolve();}};"
            ].join('\n');
          }
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({serviceWorkers:'block'});
          async function prepare(page,role='مخزن شامل',mainAccess=true,deny=false,jobRole='أمين مخزن'){
            const core=mockCore(role,mainAccess,deny,jobRole);
            new Function(core);
            await page.route(/https:\/\/(fonts\.googleapis\.com|cdnjs\.cloudflare\.com|cdn\.tailwindcss\.com|cdn\.jsdelivr\.net|unpkg\.com)/,async route=>{
              const url=route.request().url();
              let body='';
              if(url.includes('sweetalert2'))body="window.Swal={fire:function(){return Promise.resolve({isConfirmed:false});},showLoading:function(){},close:function(){},showValidationMessage:function(){},isVisible:function(){return false;}};";
              else if(url.includes('dexie.min.js'))body="window.Dexie=function(){var db=this;var tab={get:function(){return Promise.resolve(null);},put:function(){return Promise.resolve(1);},add:function(){return Promise.resolve(1);},delete:function(){return Promise.resolve();},clear:function(){return Promise.resolve();},toArray:function(){return Promise.resolve([]);},where:function(){return tab;},equals:function(){return tab;},first:function(){return Promise.resolve(null);},count:function(){return Promise.resolve(0);},orderBy:function(){return tab;},reverse:function(){return tab;},limit:function(){return tab;},offset:function(){return tab;},each:function(){return Promise.resolve();},modify:function(){return Promise.resolve();}};db.version=function(){return {stores:function(){return db;}};};db.open=function(){return Promise.resolve(db);};db.table=function(){return tab;};db.transaction=function(){return Promise.resolve();};return new Proxy(db,{get:function(t,p){if(p in t)return t[p];return tab;}});};";
              else if(url.includes('html5-qrcode'))body="window.Html5Qrcode=function(){this.start=function(){return Promise.resolve();};this.stop=function(){return Promise.resolve();};this.clear=function(){return Promise.resolve();};};";
              return route.fulfill({status:200,contentType:'application/javascript',body});
            });
            await page.route('**/core.js',route=>route.fulfill({status:200,contentType:'application/javascript',body:core}));
            await page.route('**/register-sw.js',route=>route.fulfill({status:200,contentType:'application/javascript',body:''}));
          }
          (async()=>{
            const page=await context.newPage(),errors=[],consoleMessages=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            page.on('console',m=>consoleMessages.push(m.type()+':'+m.text()));
            await prepare(page);
            await page.goto(target,{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1200);
            const bootState=await page.evaluate(()=>({header:document.querySelector('#headerUserName')?.textContent||'',loginMsg:document.querySelector('#loginMsg')?.textContent||'',mainAppHidden:document.querySelector('#mainApp')?.classList.contains('hidden'),loginHidden:document.querySelector('#loginScreen')?.classList.contains('hidden'),authLoaded:!!window.RW_Auth,supabaseLoaded:!!window.supabase,appLoaded:!!window.App,sharedSupabase:!!window.RW_SHARED_SUPABASE}));
            if(bootState.header!=='QA Warehouse')throw new Error('HOST_BOOT_FAILED:'+JSON.stringify({bootState,errors,consoleMessages:consoleMessages.slice(-30)}));
            if(!(await page.evaluate(()=>window.App?.user?.warehouseJobRole===true)))throw new Error('WAREHOUSE_EMPLOYEE_ROLE_NOT_NORMALIZED');
            for(let cycle=0;cycle<2;cycle++){
              for(const [tab,marker] of [['today','ملخص التشغيل اليومي'],['operations','العمليات المخزنية'],['vouchers','الأذونات المخزنية اليدوية'],['account','حسابي']]){
                await page.locator('#warehouseTabs [data-tab="'+tab+'"]').click();
                await page.waitForFunction(t=>document.querySelector('#warehouseTabs [data-tab="'+t+'"]').classList.contains('active')&&!document.querySelector('#warehouseDashboard').classList.contains('hidden')&&document.querySelector('#warehouseWorkspace').classList.contains('hidden'),tab);
                const visible=await page.locator('#warehouseDashboard').innerText();
                if(!visible.includes(marker))throw new Error('TOP_LEVEL_TAB_NOT_RESPONSIVE:'+tab+':'+visible.slice(0,240));
              }
            }
            console.log('WAREHOUSE_FOUR_TABS_RESPONSIVE_REPEATED=PASS');
            if(await page.locator('#mainApp').isHidden())throw new Error('HOST_APP_NOT_AUTHENTICATED');
            if(await page.locator('#loginScreen').isVisible())throw new Error('HOST_LOGIN_STILL_VISIBLE');
            if(await page.locator('#warehouseTabs [data-tab]:visible').count()!==4)throw new Error('FOUR_TOP_LEVEL_TABS_NOT_RENDERED');
