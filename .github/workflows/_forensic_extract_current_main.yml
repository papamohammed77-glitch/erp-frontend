name: RAWAEA forensic current Mother extract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact current Mother anchors
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          src = Path('companies/company-1/main.html')
          text = src.read_text(encoding='utf-8')
          lines = text.splitlines()
          out = []
          out.append('# FORENSIC CURRENT MOTHER EXTRACT')
          out.append('')
          out.append(f'FILE_LINES={len(lines)}')
          out.append(f'FILE_BYTES={src.stat().st_size}')
          out.append(f'SHA256={hashlib.sha256(text.encode("utf-8")).hexdigest()}')

          pats = [
            'var RW_Warehouse',
            'var RW_HR',
            'RW_HR',
            'hr_list_employees',
            'hr_command_atomic',
            'hr_query',
            'hr_payroll_calculate_impl',
            'hr_payroll_post_impl',
            'employee_documents',
            'hr_departments',
            'hr_contracts',
            'hr_work_schedules',
            'hr_attendance_events',
            'hr_leave_types',
            'hr_requests',
            'hr_salary_advances',
            'hr_payroll_periods',
            'hr_payslips',
            'hr_command',
            'employee-document',
            'document-upload',
            'الموارد البشرية',
            'قيد التطوير',
            'جاري التطوير',
            'TODO',
            'FIXME',
          ]
          for pat in pats:
            hits = [i for i, line in enumerate(lines, 1) if pat in line]
            out.append(f'PATTERN {pat}: {hits[:300]}')

          def window(center, before=30, after=160):
            s = max(1, center - before)
            e = min(len(lines), center + after)
            out.append(f'--- WINDOW {s}-{e} around {center} ---')
            for i in range(s, e + 1):
              out.append(f'{i}: {lines[i-1]}')

          for pat in [
            'var RW_HR',
            'hr_command_atomic',
            'hr_query',
            'hr_list_employees',
            'employee_documents',
          ]:
            hits = [i for i, line in enumerate(lines, 1) if pat in line]
            for h in hits[:5]:
              window(h, 30, 180)

          def extract_between(start_marker, end_marker, label):
            starts = [i for i, line in enumerate(lines, 1) if start_marker in line]
            ends = [i for i, line in enumerate(lines, 1) if end_marker in line]
            if not starts or not ends:
              return
            st = starts[0]
            en = next((x for x in ends if x >= st), None)
            if en is None:
              return
            out.append(f'--- {label}_FULL {st}-{en} ---')
            for i in range(st, en + 1):
              out.append(f'{i}: {lines[i-1]}')

          extract_between(
            'var RW_HR = (function() {',
            'window.RW_HR = RW_HR;',
            'RW_HR'
          )

          Path('_forensic_current_main_extract.md').write_text(
            '\n'.join(out) + '\n', encoding='utf-8'
          )

      - name: Persist extract
        shell: bash
        run: |
          git config user.name 'rawaea-forensic-bot'
          git config user.email 'actions@github.com'
          git add _forensic_current_main_extract.md
          git commit -m 'forensic: persist current Mother HR extract' || exit 0
          git push
