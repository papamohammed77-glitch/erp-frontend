name: RAWAEA — Mother System Browser E2E

on:
  workflow_dispatch:
    inputs:
      published_url:
        description: 'Optional deployed URL of companies/company-1/main.html; leave blank to test exact current Git source locally'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'companies/company-1/main.html'
      - 'companies/company-1/sw.js'
      - '_routes.json'
      - 'functions/**'
      - '.github/workflows/browser_e2e_mother_20260915.yml'

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current Source of Truth
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Mother shell infrastructure syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check companies/company-1/sw.js
          node --check functions/_middleware.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('_routes.json').read_text(encoding='utf-8'))
          print('ROUTES_JSON_SYNTAX=PASS')
          PY

      - name: Assert canonical payroll syntax in Mother source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('companies/company-1/main.html').read_text(encoding='utf-8')
          good="esc(x.status||'-')])})));"
          bad="esc(x.status||'-')]))));"
          assert good in s, 'Canonical RW_HR payroll syntax not present'
          assert bad not in s, 'Known malformed RW_HR payroll syntax is still present'
          print('RW_HR_PAYROLL_SOURCE_SYNTAX=PASS')
          PY

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Start local source server when no published URL is supplied
        if: ${{ inputs.published_url == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rawaea-http.log 2>&1 &
          echo $! >/tmp/rawaea-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/companies/company-1/main.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/rawaea-http.log
          exit 1

      - name: Execute browser E2E against the selected URL
        env:
          PUBLISHED_URL: ${{ inputs.published_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PUBLISHED_URL:-}" ]; then
            export TEST_URL="$PUBLISHED_URL"
            echo "TARGET_MODE=published"
          else
            export TEST_URL='http://127.0.0.1:4173/companies/company-1/main.html'
            echo "TARGET_MODE=current_git_source"
          fi
          node <<'NODE'
          const { chromium } = require('playwright');
          const target = process.env.TEST_URL;
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const consoleErrors=[];
            const pageErrors=[];
            page.on('console', m => { if (m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(String(e.message||e)));
            await page.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0/dist/umd/supabase.min.js', route => route.fulfill({
              status:200,
              contentType:'application/javascript',
              body:`
                window.__qaSupabaseCreateCount=0;
                window.__qaSupabaseChannels=[];
                window.__qaSession=null;
                window.supabase={createClient:function(url,key,options){
                  window.__qaSupabaseCreateCount++;
                  var client={
                    auth:{
                      getSession:function(){return Promise.resolve({data:{session:window.__qaSession},error:null});},
                      onAuthStateChange:function(callback){window.__qaAuthListener=callback;return {data:{subscription:{unsubscribe:function(){}}}};},
                      signInWithPassword:function(){return Promise.resolve({data:{session:window.__qaSession},error:null});},
                      signOut:function(){window.__qaSession=null;if(window.__qaAuthListener)window.__qaAuthListener('SIGNED_OUT',null);return Promise.resolve({error:null});},
                      resetPasswordForEmail:function(){return Promise.resolve({error:null});}
                    },
                    from:function(table){var q={};['select','eq','neq','in','order','limit','range','gte','lte','gt','lt','or','is','not','filter','match','insert','update','upsert','delete'].forEach(function(k){q[k]=function(){return q;};});q.then=function(resolve,reject){return Promise.resolve({data:[],error:null}).then(resolve,reject);};q.maybeSingle=function(){return Promise.resolve({data:null,error:null});};q.single=q.maybeSingle;return q;},
                    rpc:function(name){if(name==='get_my_effective_profile')return Promise.resolve({data:{id:'qa-parent-user',auth_id:'qa-parent-auth',company_id:'qa-parent-company',email:'qa-parent@example.invalid',name:'QA Parent',role:'أمين مخزن',status:'Active',permissions:['warehouse'],active_warehouse_role:'مخزن شامل'},error:null});return Promise.resolve({data:null,error:null});},
                    channel:function(name){var c={name:name,filters:[],on:function(event,filter,callback){c.filters.push(filter);return c;},subscribe:function(callback){if(callback)callback('SUBSCRIBED');return c;}};window.__qaSupabaseChannels.push(c);return c;},
                    removeChannel:function(channel){window.__qaSupabaseChannels=window.__qaSupabaseChannels.filter(function(x){return x!==channel;});return Promise.resolve('ok');},
                    realtime:{setAuth:function(){}}
                  };
                  window.__qaSupabaseClient=client;
                  return client;
                }};
              `
            }));
            const response = await page.goto(target,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForLoadState('networkidle',{timeout:30000}).catch(()=>{});
            const title = await page.title();
            const html = await page.locator('html').innerText().catch(()=> '');
            const source = await page.content();
            const formCount = await page.locator('form').count();
            const passwordInputs = await page.locator('input[type="password"]').count();
            const buttons = await page.locator('button:visible').count();
            const shellHeader = await page.evaluate(() => {
              return {
                canonicalShell: document.documentElement.outerHTML.includes("esc(x.status||'-')])})));"),
                repairedHeaderPresent: performance.getEntriesByType('resource').length >= 0
              };
            }).catch(()=>({canonicalShell:false,repairedHeaderPresent:false}));
            const coreBridge = await page.evaluate(async () => {
              const sameClient = window.RW_SUPABASE_CLIENT === window.RW_SHARED_SUPABASE &&
                window.RW_SHARED_SUPABASE === window.__qaSupabaseClient && window.supabase === window.RW_SHARED_SUPABASE;
              const clientCount = window.__qaSupabaseCreateCount;
              window.__qaSession = { access_token:'qa-token', user:{ id:'qa-parent-auth', email:'qa-parent@example.invalid', user_metadata:{} } };
              const verified = await new Promise(resolve => window.RW_Auth.init((user,error) => resolve({user:user||null,error:error||null})));
              const channelKey = window.RW_Realtime.start({
                appId:'parent-core-bridge-e2e', companyId:'qa-parent-company', tables:['erp_operation_registry'],
                onEvent:function(){}, onReconcile:function(){}
              });
              return {
                clientCount:clientCount,
                sameClient:sameClient,
                coreAuth:typeof window.RW_Auth.init==='function',
                coreRealtime:typeof window.RW_Realtime.start==='function',
                verifiedCompany:verified.user&&verified.user.company_id,
                authError:verified.error,
                channelKey:channelKey,
                channelNames:window.__qaSupabaseChannels.map(x=>x.name),
                coreChannels:window.__qaSupabaseChannels.filter(x=>String(x.name||'').includes('parent-core-bridge-e2e')),
                companyFilter:window.__qaSupabaseChannels.filter(x=>String(x.name||'').includes('parent-core-bridge-e2e')).map(x=>x.filters[0]&&x.filters[0].filter)
              };
            });
            console.log('PARENT_CORE_BRIDGE='+JSON.stringify(coreBridge));
            if(coreBridge.clientCount!==1||!coreBridge.sameClient||!coreBridge.coreAuth||!coreBridge.coreRealtime||
              coreBridge.verifiedCompany!=='qa-parent-company'||coreBridge.authError||!coreBridge.channelKey||
              coreBridge.coreChannels.length!==1||coreBridge.companyFilter[0]!=='company_id=eq.qa-parent-company')
              throw new Error('PARENT_CORE_SINGLE_CLIENT_AUTH_REALTIME_BRIDGE_FAILED');
            console.log('TARGET_URL='+target);
            console.log('HTTP_STATUS='+(response ? response.status() : 'NO_RESPONSE'));
            console.log('TITLE='+title);
            console.log('FORMS='+formCount);
            console.log('PASSWORD_INPUTS='+passwordInputs);
            console.log('VISIBLE_BUTTONS='+buttons);
            console.log('SHELL_PROBE='+JSON.stringify(shellHeader));
            console.log('PLACEHOLDER_MARKERS='+JSON.stringify(['قيد التطوير','جاري التطوير','TODO','FIXME'].filter(x=>source.includes(x))));
            console.log('CONSOLE_ERRORS='+JSON.stringify(consoleErrors));
            console.log('PAGE_ERRORS='+JSON.stringify(pageErrors));
            if (!response || !response.ok()) throw new Error('MAIN_HTML_HTTP_LOAD_FAILED');
            if (!source.includes('</html>')) throw new Error('MAIN_HTML_DOM_END_MISSING');
            if (['قيد التطوير','جاري التطوير','TODO','FIXME'].some(x=>source.includes(x))) throw new Error('INCOMPLETE_MARKER_FOUND');
            if (consoleErrors.length) throw new Error('BROWSER_CONSOLE_ERRORS_PRESENT');
            if (pageErrors.length) throw new Error('BROWSER_PAGEERROR_PRESENT');
            if (passwordInputs < 1) throw new Error('LOGIN_PASSWORD_INPUT_MISSING');
            if (buttons < 1) throw new Error('VISIBLE_BUTTON_MISSING');
            console.log('BROWSER_E2E_ANONYMOUS_SMOKE=PASS');
            await browser.close();
          })().catch(async e=>{ console.error('BROWSER_E2E_FAILURE='+e.message); process.exit(1); });
          NODE

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawaea-browser-e2e-diagnostics
          path: |
            /tmp/rawaea-http.log
          if-no-files-found: ignore