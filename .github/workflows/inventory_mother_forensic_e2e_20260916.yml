name: RAWAEA — Mother Inventory Forensic E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inventory-forensic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current mother source
        uses: actions/checkout@v4

      - name: Static inventory contract audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('companies/company-1/main.html')
          text = p.read_text(encoding='utf-8')
          checks = [
              ('inventory-menu', 'إدارة المخازن والمخزون'),
              ('items-view', "view: 'items'"),
              ('branches-view', "view: 'branches'"),
              ('receiving-view', "view: 'receiving'"),
              ('picking-view', "view: 'picking'"),
              ('loading-view', "view: 'loading'"),
              ('delivery-view', "view: 'delivery'"),
              ('return-view', "view: 'return'"),
              ('unloading-view', "view: 'unloading'"),
              ('transfer-view', "view: 'transfer'"),
              ('direct-sale-view', "view: 'direct-sale'"),
              ('direct-return-view', "view: 'direct-return'"),
              ('supplier-return-view', "view: 'supplier-return'"),
              ('vouchers-view', "view: 'vouchers'"),
              ('vehicle-count-view', "view: 'vehicle-count'"),
              ('branch-count-view', "view: 'branch-count'"),
              ('general-count-view', "view: 'general-count'"),
          ]
          missing = [(name, token) for name, token in checks if token not in text]
          assert not missing, f'Missing inventory contract tokens: {missing}'
          placeholders = re.findall(r'قيد التطوير|جاري التطوير|TODO|FIXME', text, flags=re.I)
          assert not placeholders, f'Placeholder/debt markers found: {placeholders[:10]}'
          lines = text.splitlines()
          menu_lines = [i for i,l in enumerate(lines,1) if 'إدارة المخازن والمخزون' in l]
          print('INVENTORY_MENU_LINES=' + ','.join(map(str,menu_lines)))
          print(f'FILE_BYTES={p.stat().st_size}')
          print('INVENTORY_CONTRACT_STATIC=PASS')
          PY

      - name: Source map for surgical patching
        shell: bash
        run: |
          echo '--- VIEW DISPATCH / RENDER ANCHORS ---'
          grep -nE "function (show|switch|render)|view[[:space:]]*===|view[[:space:]]*==|switch[[:space:]]*\([^\)]*view|case ['\"](items|branches|receiving|picking|loading|delivery|return|unloading|transfer|direct-sale|direct-return|supplier-return|vouchers|vehicle-count|branch-count|general-count)['\"]|RW_Inventory|Inventory" companies/company-1/main.html | head -n 250 || true
          echo '--- VIEW OBJECT DECLARATIONS ---'
          grep -nE "view[[:space:]]*:[[:space:]]*['\"](items|branches|receiving|picking|loading|delivery|return|unloading|transfer|direct-sale|direct-return|supplier-return|vouchers|vehicle-count|branch-count|general-count)['\"]" companies/company-1/main.html | head -n 250 || true

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Mother system browser smoke
        env:
          PW_FILE: ${{ github.workspace }}/companies/company-1/main.html
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(String(e)));
            await page.goto('file://' + process.env.PW_FILE, { waitUntil:'domcontentloaded' });
            await page.waitForTimeout(1000);
            if (!/الروائع ERP/.test(await page.title())) throw new Error('Mother title missing');
            if (consoleErrors.length) throw new Error('Console errors: ' + JSON.stringify(consoleErrors));
            if (pageErrors.length) throw new Error('Page errors: ' + JSON.stringify(pageErrors));
            const body = await page.locator('body').innerText();
            if (!body || body.length < 20) throw new Error('Mother body did not render');
            console.log('MOTHER_BROWSER_SMOKE=PASS');
            console.log('BODY_TEXT_LENGTH=' + body.length);
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE